<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camino Matemático</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

<!-- ======================
     HOME
====================== -->
<section id="screen-home" class="screen is-active" aria-label="Pantalla inicial">
  <img
    class="screen-bg"
    src="./assets/ui/screens/screen-home.png.PNG"
    alt="Pantalla inicial"
  />

  <button id="home-next" class="img-btn" aria-label="Empezar">
    <img src="./assets/ui/buttons/btn-next.PNG" alt="Empezar" />
  </button>
</section>

<!-- ======================
     GAME
====================== -->
<section id="screen-game" class="screen" aria-label="Pantalla de juego">

  <!-- Fondo -->
  <img
    class="screen-bg"
    src="./assets/backgrounds/bg-dojo.png.PNG"
    alt="Dojo"
  />

  <!-- HUD ENERGÍA (solo barra funcional) -->
  <div class="hud">
    <div class="energy-wrap">

      <div class="energy-fill">
        <img
          id="energy-fill"
          src="./assets/ui/energy/energy-fill.PNG"
          alt=""
        />
      </div>

      <img
        class="energy-layer"
        src="./assets/ui/energy/energy-glow.PNG"
        alt=""
      />

      <div id="energy-text">0</div>
    </div>
  </div>

  <!-- PERSONAJE (centrado, zona combate) -->
  <img
    id="warrior"
    class="warrior"
    src="./assets/warrior/warrior-idle.png.PNG"
    alt="Guerrero"
  />

  <!-- PREGUNTA -->
  <div id="question" class="question">
    3 + 2 = ?
  </div>

  <!-- RESPUESTAS (izquierda / derecha del guerrero) -->
  <div class="answers">

    <button class="answer-btn img-btn" data-index="0">
      <img src="./assets/ui/buttons/btn-next.PNG" alt="" />
      <span class="answer-text" id="answer-a-text">0</span>
    </button>

    <button class="answer-btn img-btn" data-index="1">
      <img src="./assets/ui/buttons/btn-next.PNG" alt="" />
      <span class="answer-text" id="answer-b-text">0</span>
    </button>

  </div>

  <!-- BOTÓN COMPROBAR -->
  <button id="btn-check" class="img-btn">
    <img src="./assets/ui/buttons/btn-check.PNG" alt="Comprobar" />
  </button>

  <!-- FEEDBACK -->
  <img
    id="icon-correct"
    src="./assets/ui/icons/icon-correct.PNG"
    alt="Correcto"
    style="display:none"
  />

  <img
    id="icon-wrong"
    src="./assets/ui/icons/icon-wrong.PNG"
    alt="Incorrecto"
    style="display:none"
  />

</section>

<!-- ======================
     FINAL
====================== -->
<section id="screen-final" class="screen" aria-label="Pantalla final">
  <img
    class="screen-bg"
    src="./assets/ui/screens/screen-final.PNG"
    alt="Pantalla final"
  />

  <img
    class="final-warrior"
    src="./assets/warrior/warrior-power.png.PNG"
    alt="Guerrero victorioso"
  />

  <button id="btn-retry" class="img-btn">
    <img src="./assets/ui/buttons/btn-retry.PNG" alt="Reintentar" />
  </button>
</section>

<script src="./script.js"></script>
</body>
</html>
