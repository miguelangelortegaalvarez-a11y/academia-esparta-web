<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camino Matemático</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- =========================
       HOME
  ========================== -->
  <section id="screen-home" class="screen is-active">
    <img
      class="screen-bg"
      src="./assets/ui/screens/screen-home.png.PNG"
      alt="Pantalla inicial"
    />

    <button id="home-next" class="img-btn">
      <img src="./assets/ui/buttons/btn-next.PNG" alt="Empezar" />
    </button>
  </section>

  <!-- =========================
       GAME
  ========================== -->
  <section id="screen-game" class="screen">

    <!-- FONDO DOJO -->
    <img
      class="screen-bg"
      src="./assets/backgrounds/bg-dojo.PNG"
      alt="Dojo"
    />

    <!-- =========================
         HUD ENERGÍA (SOLO BARRA)
    ========================== -->
    <div class="hud">
      <div class="energy-wrap">
        <img
          class="energy-layer"
          src="./assets/ui/energy/energy-frame.PNG"
          alt=""
        />

        <div class="energy-fill">
          <img
            id="energy-fill"
            src="./assets/ui/energy/energy-fill.PNG"
            alt=""
          />
        </div>

        <div id="energy-text">0</div>
      </div>
    </div>

    <!-- =========================
         PREGUNTA
    ========================== -->
    <div id="question" class="question">
      3 + 2 = ?
    </div>

    <!-- =========================
         PERSONAJE (CENTRO ZONA COMBATE)
    ========================== -->
    <img
      id="warrior"
      class="warrior"
      src="./assets/warrior/warrior-idle.png.PNG"
      alt="Guerrero"
    />

    <!-- =========================
         RESPUESTAS (IZQ / DER)
    ========================== -->
    <div class="answers">
      <button class="answer-btn img-btn">
        <span id="answer-a-text" class="answer-text">5</span>
      </button>

      <button class="answer-btn img-btn">
        <span id="answer-b-text" class="answer-text">6</span>
      </button>
    </div>

    <!-- =========================
         BOTÓN COMPROBAR
    ========================== -->
    <button id="btn-check" class="img-btn">
      <img src="./assets/ui/buttons/btn-check.PNG" alt="Comprobar" />
    </button>

    <!-- =========================
         FEEDBACK
    ========================== -->
    <img
      id="icon-correct"
      src="./assets/ui/icons/icon-correct.PNG"
      alt="Correcto"
      style="display:none"
    />

    <img
      id="icon-wrong"
      src="./assets/ui/icons/icon-wrong.PNG"
      alt="Incorrecto"
      style="display:none"
    />

    <!-- BOTÓN SIGUIENTE (OCULTO HASTA ACIERTO) -->
    <button id="btn-next" class="img-btn" style="display:none">
      <img src="./assets/ui/buttons/btn-next.PNG" alt="Siguiente" />
    </button>
  </section>

  <!-- =========================
       FINAL
  ========================== -->
  <section id="screen-final" class="screen">
    <img
      class="screen-bg"
      src="./assets/ui/screens/screen-final.PNG"
      alt="Final"
    />

    <img
      class="final-warrior"
      src="./assets/warrior/warrior-power.png.PNG"
      alt="Guerrero"
    />

    <button id="final-retry" class="img-btn">
      <img src="./assets/ui/buttons/btn-retry.PNG" alt="Reintentar" />
    </button>
  </section>

  <script src="./script.js"></script>
</body>
</html>
