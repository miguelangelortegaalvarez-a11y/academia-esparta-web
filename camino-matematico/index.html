<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camino Matemático</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- HOME -->
  <section id="screen-home" class="screen is-active" aria-label="Pantalla inicial">
    <img class="screen-bg" src="./assets/ui/screens/screen-home.png" alt="Pantalla inicial" />
    <button id="home-next" class="img-btn" aria-label="Siguiente">
      <img src="./assets/ui/buttons/btn-next.png" alt="Siguiente" />
    </button>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen" aria-label="Pantalla de ejercicio">
    <img class="screen-bg" src="./assets/backgrounds/bg-dojo.png" alt="Dojo" />

    <!-- HUD Energía -->
    <div class="hud">
      <div class="energy">
        <img class="energy-layer" src="./assets/ui/energy/energy-frame.png" alt="" />
        <div class="energy-fill-wrap" aria-label="Energía">
          <img id="energy-fill" class="energy-layer energy-fill" src="./assets/ui/energy/energy-fill.png" alt="" />
          <img id="energy-glow" class="energy-layer energy-glow" src="./assets/ui/energy/energy-glow.png" alt="" />
        </div>
        <div id="energy-text" class="energy-text">0</div>
      </div>
    </div>

    <!-- Personaje -->
    <img id="warrior" class="warrior" src="./assets/warrior/warrior-idle.png" alt="Guerrero" />

    <!-- Panel mensaje -->
    <div class="panel">
      <img class="panel-bg" src="./assets/ui/overlay/message-panel.png" alt="" />
      <div class="panel-content">
        <div id="question" class="question">3 + 4 = ?</div>

        <div class="answers" role="group" aria-label="Respuestas">
  <button class="answer-btn img-btn" data-index="0" aria-label="Respuesta A">
    <img src="./assets/ui/buttons/btn-next.png" alt="" />
    <span class="answer-text" id="answer-a-text">0</span>
  </button>

  <button class="answer-btn img-btn" data-index="1" aria-label="Respuesta B">
    <img src="./assets/ui/buttons/btn-next.png" alt="" />
    <span class="answer-text" id="answer-b-text">0</span>
  </button>
</div>

        <div class="actions">
          <button id="btn-check" class="img-btn" aria-label="Comprobar">
            <img src="./assets/ui/buttons/btn-check.png" alt="Comprobar" />
          </button>
        </div>

        <div class="feedback">
          <img id="icon-correct" class="icon" src="./assets/ui/icons/icon-correct.png" alt="Correcto" />
          <img id="icon-wrong" class="icon" src="./assets/ui/icons/icon-wrong.png" alt="Incorrecto" />
        </div>
      </div>
    </div>

    <!-- Botón siguiente (solo tras comprobar) -->
    <button id="btn-next" class="img-btn next-float" aria-label="Siguiente">
      <img src="./assets/ui/buttons/btn-next.png" alt="Siguiente" />
    </button>
  </section>

  <!-- FINAL -->
  <section id="screen-final" class="screen" aria-label="Pantalla final">
    <img class="screen-bg" src="./assets/ui/screens/screen-final.png" alt="Pantalla final" />
    <img class="final-warrior" src="./assets/warrior/warrior-power.png" alt="Guerrero power" />

    <button id="final-retry" class="img-btn" aria-label="Reintentar">
      <img src="./assets/ui/buttons/btn-retry.png" alt="Reintentar" />
    </button>
  </section>

  <script src="./script.js"></script>
</body>
</html>
