<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas 1º Primaria - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root { --primary: #0e9343; --light: #f5fdf7; --dark: #063c24; }
        body { font-family: 'Poppins', sans-serif; background-color: #ffffff; color: var(--dark); margin: 0; padding: 40px 20px; text-align: center; }
        h1 { color: var(--primary); text-transform: uppercase; font-weight: 700; margin-bottom: 30px; }
        
        .grid-lecturas { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1000px; margin: 40px auto; }

        .card {
            background: var(--light); width: 220px; border-radius: 15px; padding: 30px;
            text-align: center; border: 1px solid rgba(14, 147, 67, 0.2);
            transition: all 0.3s ease; text-decoration: none; color: var(--dark);
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: var(--primary); background: white; }
        .card .icono { font-size: 3rem; margin-bottom: 10px; }
        .card h4 { margin: 0; color: var(--primary); text-transform: uppercase; }

        .btn-volver { margin-top: 50px; display: inline-block; text-decoration: none; color: #666; font-weight: bold; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>

    <h1>Lecturas 1º Primaria</h1>
    <p>Selecciona una lectura para comenzar:</p>

    <div class="grid-lecturas">
        
        <a href="tito.html" class="card">
            <div class="icono">📖</div>
            <h4>Lectura 1</h4>
            <p>Tito el pato</p>
        </a>

        <a href="mama.html" class="card">
            <div class="icono">📖</div>
            <h4>Lectura 2</h4>
            <p>Mi mamá</p>
        </a>

        <a href="pepe.html" class="card">
            <div class="icono">📖</div>
            <h4>Lectura 3</h4>
            <p>Pepe y papá</p>
        </a>

        <a href="dado.html" class="card">
            <div class="icono">📖</div>
            <h4>Lectura 4</h4>
            <p>El nene y el dado</p>
        </a>

    </div>

    <a href="../lectura-comprensiva.html" class="btn-volver">← Volver a los niveles</a>

</body>
</html>
