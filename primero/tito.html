<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura: Tito el pato - Academia Esparta</title>
    <style>
        /* Estilo para impresión limpia */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #ffffff; 
            color: #000; 
            padding: 40px; 
            line-height: 1.6; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
        }
        
        /* Botón PDF que no se imprime */
        .btn-print { 
            float: right;
            background-color: #0e9343; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
        }

        @media print { 
            .btn-print { display: none; } 
            body { padding: 0; }
        }

        /* Cabecera */
        .header { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px solid #000; 
            padding-bottom: 10px; 
            margin-bottom: 50px; 
        }
        .header span { font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }

        /* Texto de la lectura */
        .lectura-box h3 { 
            font-size: 2.8rem; 
            margin-bottom: 25px; 
        }
        .lectura-box p { 
            font-size: 2rem; 
            line-height: 2.5;
            margin-bottom: 60px;
        }

        /* Preguntas y líneas de respuesta */
        .pregunta-item { 
            margin-bottom: 50px; 
            font-size: 1.5rem; 
        }
        .linea-respuesta {
            margin-top: 15px;
            border-bottom: 1px solid #000; /* Línea sólida para escribir encima */
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-print" onclick="window.print()">📄 GENERAR PDF</button>

    <div class="header">
        <span>LECTURA COMPRENSIVA</span>
        <span>ACADEMIA ESPARTA</span>
    </div>

    <div class="lectura-box">
        <h3>Tito</h3>
        <p>
            Tito es mi pato. <br>
            Tito toma su sopa. <br>
            Mi pato Tito es muy mono.
        </p>
    </div>

    <div class="preguntas-container">
        <div class="pregunta-item">
            1. ¿Quién es Tito?
            <div class="linea-respuesta"></div>
        </div>

        <div class="pregunta-item">
            2. ¿Qué toma Tito?
            <div class="linea-respuesta"></div>
        </div>

        <div class="pregunta-item">
            3. ¿Cómo es el pato Tito?
            <div class="linea-respuesta"></div>
        </div>
    </div>
</div>

</body>
</html>
