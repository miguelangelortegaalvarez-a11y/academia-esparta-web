<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura: Tito el pato - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kalam', cursive; 
            background-color: #ffffff; 
            color: #000; 
            padding: 40px; 
            line-height: 1.4; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
        }
        
        .btn-print { 
            float: right;
            background-color: #0e9343; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            font-family: sans-serif;
        }

        @media print { 
            .btn-print { display: none; } 
            body { padding: 0; }
            .container { max-width: 100%; }
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px solid #000; 
            padding-bottom: 10px; 
            margin-bottom: 50px; 
            font-family: sans-serif;
        }
        .header span { font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }

        .lectura-box h3 { 
            font-size: 3.5rem; 
            margin-bottom: 25px; 
            text-align: center;
            font-weight: 700;
        }
        .lectura-box p { 
            font-size: 2.4rem; 
            line-height: 2.2;
            margin-bottom: 60px;
            letter-spacing: -0.5px;
        }

        .pregunta-item { 
            margin-bottom: 50px; 
            font-size: 1.8rem; 
        }
        
        /* Pauta de dos líneas con más separación */
        .pauta-doble-linea {
            margin-top: 15px;
            width: 100%;
            height: 22px; /* Aumentado de 14px a 22px para más comodidad */
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-print" onclick="window.print()">📄 GENERAR PDF</button>

    <div class="header">
        <span>LECTURA COMPRENSIVA</span>
        <span>ACADEMIA ESPARTA</span>
    </div>

    <div class="lectura-box">
        <h3>Tito</h3>
        <p>
            Tito es mi pato. <br>
            Tito toma su sopa. <br>
            Mi pato Tito es muy mono.
        </p>
    </div>

    <div class="preguntas-container">
        <div class="pregunta-item">
            1. ¿Quién es Tito?
            <div class="pauta-doble-linea"></div>
        </div>

        <div class="pregunta-item">
            2. ¿Qué toma Tito?
            <div class="pauta-doble-linea"></div>
        </div>

        <div class="pregunta-item">
            3. ¿Cómo es el pato Tito?
            <div class="pauta-doble-linea"></div>
        </div>
    </div>
</div>

</body>
</html>
