<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura: Tito el pato - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kalam', cursive; 
            background-color: #ffffff; 
            color: #000; 
            padding: 20px 40px; /* Reducido para ganar espacio vertical */
            line-height: 1.3; 
            overflow-x: hidden;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            position: relative;
            z-index: 2;
        }
        
        .btn-print { 
            float: right;
            background-color: #0e9343; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.8rem;
        }

        @media print { 
            .btn-print { display: none; } 
            body { padding: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .container { max-width: 100%; }
            .frase-motivacional { page-break-before: avoid; } /* Evita saltos de página */
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px solid #000; 
            padding-bottom: 5px; 
            margin-bottom: 15px; 
            font-family: sans-serif;
        }
        .header span { font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }

        .datos-alumno {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .campo { border-bottom: 1px dashed #000; padding-bottom: 2px; }

        .lectura-box h3 { font-size: 2.8rem; margin: 10px 0; text-align: center; font-weight: 700; }
        .lectura-box p { font-size: 2rem; line-height: 1.8; margin-bottom: 35px; text-align: center; }

        .pregunta-item { margin-bottom: 30px; font-size: 1.6rem; }
        .pauta-doble-linea {
            margin-top: 8px;
            width: 100%;
            height: 20px; /* Un pelín más pequeña pero cómoda */
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
        }

        .frase-motivacional {
            margin-top: 30px;
            text-align: center;
            font-size: 1.4rem;
            font-style: italic;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .watermark-text {
            position: fixed;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 10rem;
            color: rgba(0, 0, 0, 0.02); /* Aún más sutil para impresión */
            font-family: sans-serif;
            font-weight: 900;
            white-space: nowrap;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="watermark-text">ESPARTA</div>

    <div class="container">
        <button class="btn-print" onclick="window.print()">📄 GENERAR PDF</button>

        <div class="header">
            <span>LECTURA COMPRENSIVA</span>
            <span>ACADEMIA ESPARTA</span>
        </div>

        <div class="datos-alumno">
            <div style="width: 50%;">Nombre: <span class="campo" style="display:inline-block; width:80%;"></span></div>
            <div style="width: 25%;">Fecha: <span class="campo" style="display:inline-block; width:70%;"></span></div>
            <div style="width: 20%;">Curso: <span class="campo" style="display:inline-block; width:60%;"></span></div>
        </div>

        <div class="lectura-box">
            <h3>Tito</h3>
            <p>
                Tito es mi pato. <br>
                Tito toma su sopa. <br>
                Mi pato Tito es muy mono.
            </p>
        </div>

        <div class="preguntas-container">
            <div class="pregunta-item">
                1. ¿Quién es Tito?
                <div class="pauta-doble-linea"></div>
            </div>

            <div class="pregunta-item">
                2. ¿Qué toma Tito?
                <div class="pauta-doble-linea"></div>
            </div>

            <div class="pregunta-item">
                3. ¿Cómo es el pato Tito?
                <div class="pauta-doble-linea"></div>
            </div>
        </div>

        <div class="frase-motivacional">
            ¡Eres un artista de la lectura, sigue así! 🌟
        </div>
    </div>

</body>
</html>
