<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camino de las Letras - Academia Esparta</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <section id="screen-home" class="screen is-active">
      <button id="start-btn" class="main-btn">¡EMPEZAR!</button>
  </section>

  <section id="screen-game" class="screen">
    <div class="progress-container">
      <div id="progress-fill" class="progress-bar"></div>
      <span id="progress-text">1/5</span>
    </div>

    <div class="game-content">
      <div class="image-box">
        <img id="question-img" src="" alt="Cargando objeto..." />
      </div>
      
      <p class="instruction">¿Por qué letra empieza?</p>

      <div class="answers-container">
        <button class="answer-btn" id="btn-0">
          <span class="answer-text" id="text-0">?</span>
        </button>
        <button class="answer-btn" id="btn-1">
          <span class="answer-text" id="text-1">?</span>
        </button>
      </div>
    </div>

    <div id="feedback" class="feedback-icon"></div>
  </section>

  <section id="screen-final" class="screen">
    <div class="final-card">
      <h2>¡Lo lograste!</h2>
      <p>Has completado todos los niveles.</p>
      <div class="stats">
         <span>Aciertos: <strong id="final-correct">0</strong></span>
      </div>
      <button id="retry-btn" class="main-btn">JUGAR OTRA VEZ</button>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
