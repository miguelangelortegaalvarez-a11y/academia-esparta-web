name: Regenerar sitemap.xml

on:
  # Antes corría en cada push de .html → generaba un 2º commit que disparaba
  # un 2º "pages build and deployment", duplicando las publicaciones de Pages
  # y topando el límite de deploys de la cuenta (fallos "Deployment failed,
  # try again later"). Ahora corre 1 vez al día (o a mano) → 1 deploy/día en
  # vez de 1 por cada push. Las URLs nuevas entran al sitemap en la siguiente
  # ejecución; a los buscadores no les afecta ese desfase.
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC (07:00 España en verano)
  workflow_dispatch: {}   # botón "Run workflow" para forzarlo cuando haga falta

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Historia completa: hace falta para saber CUÁNDO se tocó por última
          # vez cada página (el <lastmod> real). filter=blob:none trae commits
          # y árbol sin los blobs históricos → clone ligero pese a los 2.300+
          # commits del repo.
          fetch-depth: 0
          filter: blob:none

      - name: Generar sitemap.xml
        run: |
          set -euo pipefail

          # ── Fecha real de última modificación de cada fichero ──────────────
          # Antes el <lastmod> era "hoy" para las 1.290 URLs → el sitemap
          # cambiaba entero cada día y el bot generaba un commit diario de
          # 1.290 líneas sin que hubiera cambiado ninguna página. Además le
          # decía a Google que todo el sitio se actualiza a diario, lo cual es
          # falso y le resta valor a la señal.
          #
          # git log recorre la historia de más reciente a más antigua, así que
          # la PRIMERA vez que aparece una ruta es su último cambio.
          git -c core.quotePath=false log --pretty=format:'@%ad' --date=short --name-only \
            | awk -v OFS='\t' '
                /^@/ { d = substr($0, 2); next }
                NF   { if (!($0 in seen)) { seen[$0] = 1; print $0, d } }
              ' > /tmp/lastmod.tsv

          # Fallback para un fichero sin rastro en la historia (p. ej. tras un
          # rename raro): la fecha del último commit del repo, NO la de hoy —
          # así no se reintroduce el cambio diario.
          FALLBACK=$(git log -1 --format=%ad --date=short)

          # ── Lista de páginas a incluir ────────────────────────────────────
          # Columnas: FICHERO <TAB> URL <TAB> PRIORIDAD <TAB> CHANGEFREQ
          # (la raíz "" se sirve desde index.html, de ahí las dos columnas)
          {
            printf 'index.html\t\t1.0\tmonthly\n'

            # Resto de páginas de la raíz. Antes esto era una lista fija de 4
            # ficheros, así que TODO lo creado después quedaba fuera del
            # sitemap: el blog entero (hub + 7 artículos), nuestro-proyecto y
            # tablas-de-multiplicar-para-imprimir. Nunca llegaron a declararse.
            # Ahora se descubren solas y solo se excluye a mano lo que NO debe
            # indexarse: las 3 páginas con <meta robots="noindex">, la de error
            # y el fichero de verificación de Search Console.
            find . -maxdepth 1 -name '*.html' -type f 2>/dev/null \
              | sed 's|^\./||' | sort \
              | grep -vxE 'index\.html|404\.html|inscripcion\.html|juegos\.html|google[0-9a-f]+\.html' \
              | awk -v OFS='\t' '{ print $0, $0, "0.8", "monthly" }'

            # Legales: se sirven como carpeta, sin el index.html final.
            for d in privacidad terminos; do
              [ -f "$d/index.html" ] && printf '%s/index.html\t%s/\t0.3\tyearly\n' "$d" "$d"
            done

            # Recursos. Los index.html son los hubs por curso+asignatura y se
            # declaran como .../curso/asignatura/ (sin el index.html) para que
            # la URL del sitemap coincida con el <link rel="canonical"> de la
            # propia página: antes el sitemap decía /4/matematicas/index.html
            # mientras la página se declaraba canónica en /4/matematicas/, así
            # que ningún hub estaba realmente declarado.
            find recursos -name '*.html' 2>/dev/null | grep -v 'ortografia-carla' | sort \
              | awk -v OFS='\t' '{
                  if ($0 ~ /\/index\.html$/) {
                    u = $0; sub(/index\.html$/, "", u); print $0, u, "0.6", "monthly"
                  } else {
                    print $0, $0, "0.5", "yearly"
                  }
                }'
          } > /tmp/paginas.tsv

          # ── Montaje del XML ───────────────────────────────────────────────
          # Una sola pasada de awk: primero carga el mapa de fechas, luego
          # emite una <url> por página. Sin arrays de bash (no todas las
          # versiones los tienen) y sin un subproceso por fichero.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            awk -F'\t' -v fallback="$FALLBACK" '
              NR == FNR { lm[$1] = $2; next }
              {
                fecha = ($1 in lm) ? lm[$1] : fallback
                printf "  <url>\n"
                printf "    <loc>https://academiaesparta.es/%s</loc>\n", $2
                printf "    <lastmod>%s</lastmod>\n", fecha
                printf "    <changefreq>%s</changefreq>\n", $4
                printf "    <priority>%s</priority>\n", $3
                printf "  </url>\n"
              }
            ' /tmp/lastmod.tsv /tmp/paginas.tsv
            echo '</urlset>'
          } > sitemap.xml

          echo "URLs en el sitemap: $(grep -c '<url>' sitemap.xml)"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
            git add sitemap.xml
            git commit -m "Regenerar sitemap.xml [skip ci]"
            git push
          else
            echo "Sitemap sin cambios."
          fi
