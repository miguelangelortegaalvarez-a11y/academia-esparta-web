<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno Letra M - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --dark: #063c24; --light-green: #e8f5e9; --bg: #f0f2f5; }
        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; z-index: 10; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--primary); font-weight: bold; }

        .book-slider { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .page { 
            display: none; width: 90%; max-width: 800px; height: 75vh; 
            background: white; border-radius: 30px; padding: 2rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid #eee;
            flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.4s ease;
        }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { color: var(--primary); font-size: 1.8rem; margin-bottom: 1rem; text-align: center; }

        /* Estilos Elementos */
        .tap-item { 
            font-size: 3rem; cursor: pointer; padding: 15px 25px; border-radius: 20px; 
            margin: 10px; border: 4px solid transparent; transition: 0.2s; background: #f9f9f9;
            display: inline-block; color: #333;
        }
        .tap-item.selected-correct { border-color: var(--primary); background: var(--light-green); color: var(--primary); pointer-events: none; }

        /* Estilo Unir (Match) */
        .match-container { display: flex; justify-content: space-around; width: 100%; gap: 15px; }
        .match-col { display: flex; flex-direction: column; gap: 10px; }
        .match-box { 
            padding: 12px; background: #f9f9f9; border: 3px solid #eee; 
            border-radius: 15px; font-size: 1.8rem; cursor: pointer; text-align: center; min-width: 140px;
        }
        .match-box.selected { border-color: #fb8c00; background: #fff3e0; }
        .match-box.correct { border-color: var(--primary); background: var(--light-green); color: var(--primary); pointer-events: none; }

        .nav-btn { 
            position: absolute; bottom: 30px; background: var(--primary); color: white; 
            border: none; padding: 12px 35px; border-radius: 50px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 var(--dark); z-index: 20;
            text-transform: uppercase; transition: 0.3s;
        }
        .nav-btn:active { transform: translateY(4px); box-shadow: none; }
        .next { right: 40px; display: none; }
        .prev { left: 40px; background: #999; box-shadow: 0 5px 0 #666; }

        /* Animaciones */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← VOLVER</a>
        <div style="font-weight:700; font-size:1.6rem; color:var(--primary);">Cuaderno Letra M Ⓜ️</div>
    </header>

    <div class="book-slider">
        
        <div class="page active" id="p1" data-total="3">
            <h2>1. Busca la sílaba "MA"</h2>
            <div>
                <span class="tap-item" onclick="checkSimple(this, true, 1)">MA</span>
                <span class="tap-item" onclick="checkSimple(this, false, 1)">ME</span>
                <span class="tap-item" onclick="checkSimple(this, true, 1)">MA</span>
                <span class="tap-item" onclick="checkSimple(this, false, 1)">MO</span>
                <span class="tap-item" onclick="checkSimple(this, true, 1)">MA</span>
            </div>
        </div>

        <div class="page" id="p2" data-total="3">
            <h2>2. Busca la sílaba "ME"</h2>
            <div>
                <span class="tap-item" onclick="checkSimple(this, true, 2)">ME</span>
                <span class="tap-item" onclick="checkSimple(this, false, 2)">MI</span>
                <span class="tap-item" onclick="checkSimple(this, true, 2)">ME</span>
                <span class="tap-item" onclick="checkSimple(this, true, 2)">ME</span>
            </div>
        </div>
        
        <div class="page" id="p3" data-total="5">
            <h2>3. Completa la palabra</h2>
            <div id="word-game-area" style="text-align: center;">
                <div id="word-emoji" style="font-size: 7rem; margin-bottom: 10px;">🍯</div>
                <div id="word-display" style="font-size: 4.5rem; letter-spacing: 5px; color: var(--dark); font-weight: bold; margin-bottom: 20px;">
                    <span id="word-part-1">__</span><span id="word-part-2">EL</span>
                </div>
                <div id="options-area">
                    </div>
            </div>
        </div>

        <div class="page" id="p4" data-total="3">
            <h2>4. Une la palabra con su dibujo</h2>
            <div class="match-container">
                <div class="match-col">
                    <div class="match-box" id="w1" onclick="match('w1', 'mimo')">MIMO</div>
                    <div class="match-box" id="w2" onclick="match('w2', 'mesa')">MESA</div>
                    <div class="match-box" id="w3" onclick="match('w3', 'mono')">MONO</div>
                </div>
                <div class="match-col">
                    <div class="match-box" id="i1" onclick="match('i1', 'mesa')">🧱</div> <div class="match-box" id="i2" onclick="match('i2', 'mimo')">🤡</div>
                    <div class="match-box" id="i3" onclick="match('i3', 'mono')">🐒</div>
                </div>
            </div>
        </div>

        <button class="nav-btn prev" id="btnPrev" onclick="navegar(-1)" style="display: none;">ATRÁS</button>
        <button class="nav-btn next" id="btnNext" onclick="navegar(1)">SIGUIENTE</button>
    </div>

    <script>
        let paginaActual = 1, totalPaginas = 4;
        let aciertos = {1:0, 2:0, 3:0, 4:0};
        let selId = null, selVal = null;

        // Base de datos para el juego de completar palabras
        const wordGameData = [
            { emoji: '🍯', p1: '__', p2: 'EL', options: ['MA', 'MI', 'MU'], correct: 'MI', final: 'MIEL' }, // MI
            { emoji: '🤚', p1: '__', p2: 'NO', options: ['ME', 'MA', 'MO'], correct: 'MA', final: 'MANO' }, // MA
            { emoji: '🧱', p1: '__', p2: 'SA', options: ['MI', 'ME', 'MU'], correct: 'ME', final: 'MESA' }, // ME
            { emoji: '🐒', p1: '__', p2: 'NO', options: ['MO', 'MA', 'ME'], correct: 'MO', final: 'MONO' }, // MO
            { emoji: '🦷', p1: '__', p2: 'LA', options: ['MI', 'MU', 'MA'], correct: 'MU', final: 'MUELA' }  // MU
        ];
        let currentWordIndex = 0;

        function navegar(dir) {
            document.getElementById(`p${paginaActual}`).classList.remove('active');
            paginaActual += dir;
            if(paginaActual > totalPaginas) { finalizar(); return; }
            document.getElementById(`p${paginaActual}`).classList.add('active');
            
            // Si entramos en la página del juego de palabras, cargamos la primera
            if (paginaActual === 3) { currentWordIndex = 0; loadWordChallenge(); }
            
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            document.getElementById('btnPrev').style.display = paginaActual === 1 ? 'none' : 'block';
            const btnN = document.getElementById('btnNext');
            const obj = parseInt(document.getElementById(`p${paginaActual}`).dataset.total);
            btnN.style.display = aciertos[paginaActual] >= obj ? 'block' : 'none';
            btnN.innerText = paginaActual === totalPaginas ? 'FINALIZAR' : 'SIGUIENTE';
        }

        function checkSimple(el, ok, pag) {
            if(ok) {
                if(!el.classList.contains('selected-correct')) {
                    el.classList.add('selected-correct'); aciertos[pag]++;
                    confetti({ particleCount: 20, colors:['#0e9343'] }); actualizarInterfaz();
                }
            } else { el.style.animation = 'shake 0.3s'; setTimeout(()=>el.style.animation='', 300); }
        }

        /* --- LÓGICA DEL JUEGO DE COMPLETAR PALABRAS --- */
        function loadWordChallenge() {
            const data = wordGameData[currentWordIndex];
            document.getElementById('word-emoji').innerText = data.emoji;
            
            // Reset visual de la palabra (vuelve a mostrar las rayitas)
            const p1 = document.getElementById('word-part-1');
            const p2 = document.getElementById('word-part-2');
            p1.innerText = data.p1;
            p1.style.color = '--dark';
            p2.innerText = data.p2;
            p2.style.color = '--dark';

            // Cargar opciones
            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = ''; // Limpiar opciones anteriores
            data.options.forEach(opt => {
                const span = document.createElement('span');
                span.className = 'tap-item';
                span.innerText = opt;
                span.onclick = () => checkWordOption(span, opt);
                optionsArea.appendChild(span);
            });
        }

        function checkWordOption(el, selectedOpt) {
            const data = wordGameData[currentWordIndex];
            if (selectedOpt === data.correct) {
                // Acierto
                el.classList.add('selected-correct');
                confetti({ particleCount: 50, spread: 70 });
                
                // --- CORRECCIÓN AQUÍ: Mostrar palabra entera y verde ---
                const wordDisplay = document.getElementById('word-display');
                wordDisplay.innerHTML = `<span style="color: var(--primary); animation: popIn 0.5s ease;">${data.final}</span>`;

                aciertos[3]++; // Sumamos acierto de la palabra actual
                
                // Esperar un poco y cargar la siguiente palabra o habilitar el botón siguiente
                setTimeout(() => {
                    currentWordIndex++;
                    if (currentWordIndex < wordGameData.length) {
                        // Re-renderizar la estructura base de la palabra para el siguiente reto
                        wordDisplay.innerHTML = '<span id="word-part-1">__</span><span id="word-part-2">EL</span>';
                        loadWordChallenge();
                    } else {
                        // Hemos terminado las 5 palabras
                        actualizarInterfaz(); // Habilitar botón SIGUIENTE
                        document.getElementById('options-area').innerHTML = '<p style="color:var(--primary); font-weight:bold;">¡EXCELENTE TRABAJO!</p>';
                    }
                }, 1500);

            } else {
                // Error (vibración)
                el.style.animation = 'shake 0.3s';
                setTimeout(() => el.style.animation = '', 300);
            }
        }

        /* --- LÓGICA DE UNIR (MATCH) --- */
        function match(id, val) {
            const el = document.getElementById(id);
            if(el.classList.contains('correct')) return;
            if(!selId) {
                selId = id; selVal = val; el.classList.add('selected');
            } else {
                const prev = document.getElementById(selId);
                // Si son de columnas distintas y coinciden
                if(selId[0] !== id[0] && selVal === val) {
                    el.classList.add('correct'); prev.classList.add('correct');
                    aciertos[paginaActual]++;
                    confetti({ particleCount: 40 });
                } else {
                    // Error
                    el.style.animation = 'shake 0.3s'; prev.style.animation = 'shake 0.3s';
                    setTimeout(()=> { el.style.animation=''; prev.style.animation=''; }, 300);
                }
                prev.classList.remove('selected'); selId = null; selVal = null;
                actualizarInterfaz();
            }
        }

        function finalizar() {
            confetti({ particleCount: 200, spread: 100 });
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        }

        actualizarInterfaz();
    </script>
</body>
</html>
