<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeras Sílabas - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0e9343; /* Verde Academia Esparta */
            --bg-page: #f0f2f5;
            --text-dark: #333;
            --gray-locked: #b0b0b0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background: white;
            width: 100%;
            padding: 1rem;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            margin-bottom: 2rem;
        }

        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #666; margin-bottom: 3rem; }

        .container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }

        /* Estilo de las Tarjetas */
        .card {
            background: white;
            width: 280px;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-10px); }

        .letter { font-size: 5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .syllables { font-size: 1.1rem; color: #555; margin-bottom: 1.5rem; }

        /* Botones */
        .btn {
            text-decoration: none;
            padding: 10px 35px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
            transition: 0.3s;
            display: inline-block;
        }

        /* Estado ACTIVO (M y P) */
        .active .letter { color: var(--primary); }
        .active .btn { background: var(--primary); color: white; border: none; }
        .active .btn:hover { background: #0a7a37; }

        /* Estado BLOQUEADO (L) */
        .locked .letter { color: var(--gray-locked); }
        .locked .btn { background: #e0e0e0; color: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:700; font-size:1.8rem; color:var(--primary);">Academia Esparta</div>
    </header>

    <h1>Primeras Sílabas</h1>
    <p class="subtitle">Selecciona la letra que vamos a trabajar hoy:</p>

    <div class="container">
        
        <div class="card active">
            <div class="letter">Mm</div>
            <div class="syllables">Ma, Me, Mi, Mo, Mu</div>
            <a href="silabas-m.html" class="btn">JUGAR</a>
        </div>

        <div class="card active">
            <div class="letter">Pp</div>
            <div class="syllables">Pa, Pe, Pi, Po, Pu</div>
            <a href="silabas-p.html" class="btn">JUGAR</a>
        </div>

        <div class="card locked">
            <div class="letter">Ls</div>
            <div class="syllables">La, Le, Li, Lo, Lu</div>
            <span class="btn">PRÓXIMAMENTE</span>
        </div>

    </div>

</body>
</html>
