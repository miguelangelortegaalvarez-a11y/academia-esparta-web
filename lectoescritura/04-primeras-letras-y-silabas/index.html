<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeras Sílabas - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0e9343; --dark: #063c24; --bg: #f0f2f5; }
        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { background: white; width: 100%; padding: 1.5rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; }
        .back-btn { position: absolute; left: 20px; top: 30px; text-decoration: none; color: var(--primary); font-weight: bold; }
        
        .container { max-width: 900px; width: 90%; margin: 3rem auto; text-align: center; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 2rem; }

        .grid-letras { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        .card-letra { 
            background: white; border-radius: 25px; padding: 2rem; border: 2px solid #eee;
            transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit;
            display: flex; flex-direction: column; align-items: center;
        }
        .card-letra:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        .letra-icon { font-size: 4rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .card-letra p { margin: 0; color: #666; font-weight: bold; }
        .status { font-size: 0.8rem; background: var(--primary); color: white; padding: 5px 15px; border-radius: 50px; margin-top: 15px; }
        .locked { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" class="back-btn">← VOLVER</a>
        <div style="font-weight: 700; font-size: 1.8rem; color: var(--primary);">Academia Esparta</div>
    </header>

    <div class="container">
        <h1>Primeras Sílabas</h1>
        <p style="color: #666; margin-bottom: 3rem;">Selecciona la letra que vamos a trabajar hoy:</p>

        <div class="grid-letras">
            <a href="silabas-m.html" class="card-letra">
                <span class="letra-icon">Mm</span>
                <p>Ma, Me, Mi, Mo, Mu</p>
                <span class="status">JUGAR</span>
            </a>

            <div class="card-letra locked">
                <span class="letra-icon">Pp</span>
                <p>Pa, Pe, Pi, Po, Pu</p>
                <span class="status" style="background: #999;">PRÓXIMAMENTE</span>
            </div>

            <div class="card-letra locked">
                <span class="letra-icon">Ls</span>
                <p>La, Le, Li, Lo, Lu</p>
                <span class="status" style="background: #999;">PRÓXIMAMENTE</span>
            </div>
        </div>
    </div>

</body>
</html>
