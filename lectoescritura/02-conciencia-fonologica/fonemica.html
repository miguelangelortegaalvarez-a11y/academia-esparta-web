<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Fonémica - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --light: #f5fdf7; --dark: #063c24; --accent: #fbc02d; --red: #ef5350; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
        
        .game-header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; z-index: 10; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--primary); font-weight: bold; }
        
        .stats-bar { display: flex; justify-content: space-around; width: 100%; max-width: 800px; margin-top: 15px; font-weight: bold; color: var(--dark); z-index: 10; }
        
        .game-container { max-width: 850px; width: 95%; background: white; margin-top: 1rem; padding: 2rem; border-radius: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        
        .instruccion-box { margin-bottom: 1rem; }
        .mision-tag { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); font-weight: bold; background: var(--light); padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 10px; border: 1px solid var(--primary); }
        .instruccion-texto { font-size: 1.5rem; font-weight: 700; color: var(--dark); margin: 0; }

        .sonido-display { font-size: 5.5rem; color: var(--primary); background: white; width: 130px; height: 130px; line-height: 130px; border-radius: 50%; border: 5px dashed var(--primary); margin: 0 auto 1.5rem; box-shadow: 0 10px 20px rgba(14, 147, 67, 0.1); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .opciones-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .card-fonema { 
            width: 170px; height: 210px; background: white; border: 4px solid #eee; border-radius: 30px; 
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 6px 0 #eee;
        }
        .card-fonema:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-fonema .emoji { font-size: 5rem; }
        .card-fonema .label { margin-top: 10px; font-weight: bold; color: #555; text-transform: uppercase; font-size: 0.9rem; }

        .card-fonema.tached { background: #ffebee; border-color: var(--red); opacity: 0.3; pointer-events: none; transform: scale(0.85); box-shadow: none; }
        .card-fonema.tached::after { content: '❌'; position: absolute; font-size: 4.5rem; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--red); font-weight: bold; }

        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); border-radius: 40px; flex-direction: column; align-items: center; justify-content: center; z-index: 30; }
        .btn-next { padding: 1.2rem 3rem; border: none; border-radius: 20px; font-weight: 700; background: var(--primary); color: white; font-size: 1.3rem; cursor: pointer; box-shadow: 0 6px 0 var(--dark); text-transform: uppercase; }

        #trophy-rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        .trophy { position: absolute; font-size: 3rem; animation: rain linear infinite; }
        @keyframes rain { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="trophy-rain"></div>

    <div class="game-header">
        <a href="index.html" class="back-link">← SALIR</a>
        <h2 style="color: var(--primary); margin: 0;">Laboratorio de Sonidos</h2>
    </div>

    <div class="stats-bar">
        <span>Nivel: <span id="mision-num">1</span>/4</span>
        <span>Reto: <span id="reto-num">1</span>/5</span>
    </div>

    <div class="game-container">
        <div id="overlay">
            <h2 id="overlay-msg" style="color: var(--primary); font-size: 3.5rem; margin: 0;">¡BIEN HECHO!</h2>
            <p id="overlay-sub" style="margin: 1rem 0 2rem 0; font-size: 1.3rem; color: #444;">¡Tu oído es increíble!</p>
            <button class="btn-next" onclick="cerrarOverlay()">CONTINUAR</button>
        </div>

        <div class="instruccion-box">
            <div id="mision-tag" class="mision-tag">Nivel 1</div>
            <p id="instruccion-texto" class="instruccion-texto">Cargando reto...</p>
        </div>
        
        <div id="sonido-val" class="sonido-display">-</div>

        <div id="grid-opciones" class="opciones-grid"></div>

        <div id="feedback" style="margin-top: 1.5rem; font-weight: bold; font-size: 1.4rem; min-height: 35px;"></div>
    </div>

    <script>
        const bancoFonemas = [
            // N1: EL BUSCADOR (Empieza por...)
            { tipo: 1, sonido: 'M', pool: [{e:'🍎', n:'Manzana', ok:true}, {e:'🎈', n:'Globo', ok:false}, {e:'🏠', n:'Casa', ok:false}] },
            { tipo: 1, sonido: 'A', pool: [{e:'✈️', n:'Avión', ok:true}, {e:'🐱', n:'Gato', ok:false}, {e:'🚗', n:'Coche', ok:false}] },
            
            // N2: CAZA-INTRUSOS (Tacha lo que NO empieza por...)
            { tipo: 2, sonido: 'S', pool: [{e:'☀️', n:'Sol', ok:true}, {e:'🦁', n:'León', ok:false}, {e:'🚲', n:'Bici', ok:false}] },
            { tipo: 2, sonido: 'P', pool: [{e:'🦆', n:'Pato', ok:true}, {e:'👟', n:'Zapato', ok:false}, {e:'☁️', n:'Nube', ok:false}] },
            
            // N3: EL DETECTIVE (Contiene el sonido...)
            { tipo: 3, sonido: 'R', pool: [{e:'🐭', n:'Ratón', ok:true}, {e:'🐶', n:'Perro', ok:true}, {e:'🍦', n:'Helado', ok:false}] },
            { tipo: 3, sonido: 'T', pool: [{e:'🚆', n:'Tren', ok:true}, {e:'🦆', n:'Pato', ok:true}, {e:'🐟', n:'Pez', ok:false}] },

            // N4: FILTRO TOTAL (Tacha lo que NO contiene...)
            { tipo: 4, sonido: 'O', pool: [{e:'🐻', n:'Oso', ok:true}, {e:'🐱', n:'Gato', ok:true}, {e:'✈️', n:'Avión', ok:false}] },
            { tipo: 4, sonido: 'L', pool: [{e:'🌙', n:'Luna', ok:true}, {e:'☀️', n:'Sol', ok:true}, {e:'🍎', n:'Manzana', ok:false}] }
        ];

        let indiceReto = 0;
        let bloqueado = false;
        let eliminadosCount = 0;

        function sonidoAplausos() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const dur = 1.2;
            const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.4));
            const s = ctx.createBufferSource(); s.buffer = buf;
            const f = ctx.createBiquadFilter(); f.frequency.value = 1000;
            s.connect(f); f.connect(ctx.destination); s.start();
        }

        function iniciar() {
            mostrarReto();
        }

        function mostrarReto() {
            bloqueado = false;
            eliminadosCount = 0;
            const reto = bancoFonemas[indiceReto];
            
            document.getElementById('mision-num').innerText = reto.tipo;
            document.getElementById('reto-num').innerText = (indiceReto + 1);
            document.getElementById('sonido-val').innerText = reto.sonido;
            document.getElementById('feedback').innerText = '';

            const guion = {
                1: ["NIVEL 1: EL BUSCADOR", "¿Qué dibujo empieza por el sonido..."],
                2: ["NIVEL 2: CAZA-INTRUSOS", "Tacha los que NO empiezan por..."],
                3: ["NIVEL 3: EL DETECTIVE", "¿Qué dibujo contiene el sonido..."],
                4: ["NIVEL 4: FILTRO TOTAL", "Tacha los que NO contienen el sonido..."]
            };

            document.getElementById('mision-tag').innerText = guion[reto.tipo][0];
            document.getElementById('instruccion-texto').innerText = guion[reto.tipo][1];

            const grid = document.getElementById('grid-opciones');
            grid.innerHTML = '';
            
            [...reto.pool].sort(() => Math.random() - 0.5).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-fonema';
                card.innerHTML = `<span class="emoji">${item.e}</span><span class="label">${item.n}</span>`;
                card.onclick = () => manejarClick(item, card, reto.tipo);
                grid.appendChild(card);
            });
        }

        function manejarClick(item, card, tipo) {
            if(bloqueado) return;
            const fb = document.getElementById('feedback');

            // MODOS POSITIVOS (1 y 3): Buscar el que SÍ cumple
            if(tipo === 1 || tipo === 3) {
                if(item.ok) {
                    ganarReto();
                } else {
                    fb.innerHTML = '<span style="color: var(--red)">¡Casi! Prueba con otro dibujo. 🧐</span>';
                    card.style.borderColor = 'var(--red)';
                    setTimeout(()=>card.style.borderColor='#eee', 500);
                }
            } 
            // MODOS NEGATIVOS (2 y 4): Tachar los que NO cumplen
            else {
                if(!item.ok) {
                    card.classList.add('tached');
                    eliminadosCount++;
                    // Si ya tachó los que no eran (asumiendo que hay 1 correcto en el pool de 3)
                    if(eliminadosCount === 2) { 
                        setTimeout(ganarReto, 600); 
                    }
                } else {
                    fb.innerHTML = '<span style="color: var(--red)">¡Cuidado! Ese dibujo SÍ lo tiene. ✋</span>';
                }
            }
        }

        function ganarReto() {
            bloqueado = true;
            sonidoAplausos();
            confetti({ particleCount: 60, spread: 60, origin: { y: 0.8 } });
            document.getElementById('overlay').style.display = 'flex';
        }

        function cerrarOverlay() {
            document.getElementById('overlay').style.display = 'none';
            indiceReto++;
            if(indiceReto < bancoFonemas.length) {
                mostrarReto();
            } else {
                finalizar();
            }
        }

        function finalizar() {
            document.getElementById('overlay-msg').innerText = "¡MAESTRO DE SONIDOS!";
            document.getElementById('overlay-sub').innerText = "¡Has completado el entrenamiento fonémico!";
            const btn = document.querySelector('.btn-next');
            btn.innerText = "VOLVER AL MENÚ";
            btn.onclick = () => window.location.href = 'index.html';
            document.getElementById('overlay').style.display = 'flex';
            iniciarTrofeos();
        }

        function iniciarTrofeos() {
            const container = document.getElementById('trophy-rain');
            container.innerHTML = '';
            container.style.display = 'block';
            for (let i = 0; i < 20; i++) {
                const t = document.createElement('div');
                t.className = 'trophy'; t.innerText = '🏆';
                t.style.left = Math.random() * 100 + 'vw';
                t.style.animation = `rain ${Math.random()*2 + 2}s linear infinite`;
                container.appendChild(t);
            }
        }

        iniciar();
    </script>
</body>
</html>
