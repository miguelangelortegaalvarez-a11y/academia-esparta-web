<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonología - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root { --primary: #0e9343; --secondary: #09834c; --light: #f5fdf7; --dark: #063c24; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #fff; color: var(--dark); }
        header { background: var(--light); padding: 1.5rem; text-align: center; border-bottom: 2px solid var(--primary); }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-top: 10px; display: inline-block; }
        .container { max-width: 1000px; margin: 4rem auto; padding: 0 2rem; }
        h1 { color: var(--primary); text-align: center; font-size: 2.5rem; margin-bottom: 3rem; }
        
        .opciones-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .card-opcion { 
            border-radius: 25px; padding: 3rem; text-align: center; transition: 0.3s; 
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
        }
        .card-print { background: var(--light); border: 3px dashed var(--primary); color: var(--dark); }
        .card-game { background: var(--primary); color: white; border: 3px solid var(--secondary); }
        
        .card-opcion:hover { transform: scale(1.03); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon { font-size: 5rem; margin-bottom: 1.5rem; }
        h2 { margin-bottom: 1rem; }
        p { font-size: 1rem; opacity: 0.9; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 700; font-size: 1.8rem; color: var(--primary);">Academia Esparta</div>
        <a href="../index.html" class="back-btn">← Volver a Lectoescritura</a>
    </header>

    <div class="container">
        <h1>Laboratorio de Sonidos</h1>
        <div class="opciones-grid">
            <a href="./imprimibles/index.html" class="card-opcion card-print">
                <div class="icon">🖨️</div>
                <h2>Material para Imprimir</h2>
                <p>Fichas, tarjetas y juegos de mesa educativos.</p>
            </a>
            <a href="./interactivos/index.html" class="card-opcion card-game">
                <div class="icon">🎮</div>
                <h2>Juegos Interactivos</h2>
                <p>Desafíos digitales para entrenar el oído desde el tablet.</p>
            </a>
        </div>
    </div>
</body>
</html>
