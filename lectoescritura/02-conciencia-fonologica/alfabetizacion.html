<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Alfabetización - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --light: #f5fdf7; --dark: #063c24; --accent: #fbc02d; --red: #ef5350; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
        
        .game-header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; z-index: 10; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--primary); font-weight: bold; }
        
        .stats-bar { display: flex; justify-content: space-around; width: 100%; max-width: 800px; margin-top: 15px; font-weight: bold; color: var(--dark); z-index: 10; }
        
        .game-container { max-width: 850px; width: 95%; background: white; margin-top: 1rem; padding: 1.5rem; border-radius: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        
        .target-area { margin-bottom: 1.5rem; }
        .emoji-big { font-size: 6rem; margin: 0; line-height: 1; }
        
        .word-display { display: flex; justify-content: center; gap: 10px; margin: 1.5rem 0; min-height: 80px; }
        .letter-slot { width: 65px; height: 80px; border-bottom: 6px solid var(--primary); font-size: 3.5rem; font-weight: 700; color: var(--dark); display: flex; align-items: center; justify-content: center; background: var(--light); border-radius: 12px 12px 0 0; text-transform: uppercase; }
        .letter-slot.wrong { border-color: var(--red); animation: shake 0.3s; }

        .keyboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(55px, 1fr)); gap: 8px; max-width: 700px; margin: 0 auto; background: #eee; padding: 12px; border-radius: 25px; }
        .key { background: white; border: none; padding: 12px 0; border-radius: 15px; font-size: 1.6rem; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 #ccc; transition: 0.1s; color: var(--dark); }
        .key:active { transform: translateY(4px); box-shadow: none; }
        .key.del { background: var(--red); color: white; box-shadow: 0 5px 0 #b71c1c; grid-column: span 2; }

        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); border-radius: 40px; flex-direction: column; align-items: center; justify-content: center; z-index: 30; }
        .btn-next { padding: 1.2rem 3rem; border: none; border-radius: 20px; font-weight: 700; background: var(--primary); color: white; font-size: 1.4rem; cursor: pointer; box-shadow: 0 6px 0 var(--dark); text-transform: uppercase; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        #trophy-rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        .trophy { position: absolute; font-size: 3rem; animation: rain linear infinite; }
        @keyframes rain { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>
    <div id="trophy-rain"></div>
    <div class="game-header">
        <a href="index.html" class="back-link">← SALIR</a>
        <h2 style="color: var(--primary); margin: 0;">Misión Alfabetización</h2>
    </div>
    <div class="stats-bar">
        <span>Nivel: <span id="lvl-txt">1</span>/5</span>
        <span>Reto: <span id="reto-txt">1</span>/5</span>
    </div>
    <div class="game-container">
        <div id="overlay">
            <h2 id="ov-msg" style="color: var(--primary); font-size: 3rem; margin: 0;">¡EXCELENTE!</h2>
            <p id="ov-sub" style="margin: 1rem 0 2rem 0; font-size: 1.3rem; color: #444;">¡Lo has escrito perfectamente!</p>
            <button class="btn-next" onclick="proximo()">CONTINUAR</button>
        </div>
        <p style="color: #666; font-weight: bold; margin-bottom: 0.5rem;">Escribe la palabra:</p>
        <div class="target-area">
            <p id="target-emoji" class="emoji-big">☀️</p>
            <div id="word-slots" class="word-display"></div>
        </div>
        <div class="keyboard" id="keyboard"></div>
    </div>

    <script>
        const banco = {
            1: [{e:'☀️', w:'SOL'}, {e:'🍞', w:'PAN'}, {e:'🧂', w:'SAL'}, {e:'🥛', w:'COL'}, {e:'🐟', w:'PEZ'}],
            2: [{e:'🐱', w:'GATO'}, {e:'🏠', w:'CASA'}, {e:'🦆', w:'PATO'}, {e:'🐸', w:'RANA'}, {e:'🍐', w:'PERA'}],
            3: [{e:'🐶', w:'PERRO'}, {e:'🍎', w:'MANZANA'}, {e:'🍌', w:'PLATANO'}, {e:'🚗', w:'COCHE'}, {e:'🐻', w:'OSITO'}],
            4: [{e:'🚆', w:'TREN'}, {e:'🍓', w:'FRESA'}, {e:'🎈', w:'GLOBO'}, {e:'🐉', w:'DRAGON'}, {e:'🌲', w:'PINO'}],
            5: [{e:'🍦', w:'HELADO'}, {e:'🎒', w:'MOCHILA'}, {e:'🚲', w:'BICI'}, {e:'🎸', w:'GUITARRA'}, {e:'🦓', w:'CEBRA'}]
        };

        const letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
        let lvl = 1, reto = 0, escrita = "";

        function iniciar() {
            crearTeclado();
            cargar();
        }

        function crearTeclado() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            letras.split('').forEach(l => {
                const btn = document.createElement('button');
                btn.className = 'key'; btn.innerText = l;
                btn.onclick = () => pulsar(l);
                kb.appendChild(btn);
            });
            const del = document.createElement('button');
            del.className = 'key del'; del.innerText = 'BORRAR';
            del.onclick = () => borrar();
            kb.appendChild(del);
        }

        function cargar() {
            const item = banco[lvl][reto];
            document.getElementById('target-emoji').innerText = item.e;
            document.getElementById('lvl-txt').innerText = lvl;
            document.getElementById('reto-txt').innerText = reto + 1;
            escrita = "";
            dibujarHuecos();
        }

        function dibujarHuecos() {
            const container = document.getElementById('word-slots');
            container.innerHTML = '';
            const palabra = banco[lvl][reto].w;
            for(let i=0; i<palabra.length; i++) {
                const s = document.createElement('div');
                s.className = 'letter-slot';
                s.innerText = escrita[i] || "";
                container.appendChild(s);
            }
        }

        function pulsar(l) {
            const palabra = banco[lvl][reto].w;
            if(escrita.length < palabra.length) {
                if(l === palabra[escrita.length]) {
                    escrita += l;
                    dibujarHuecos();
                    if(escrita === palabra) ganar();
                } else {
                    const slots = document.querySelectorAll('.letter-slot');
                    slots[escrita.length].classList.add('wrong');
                    setTimeout(() => slots[escrita.length].classList.remove('wrong'), 300);
                }
            }
        }

        function borrar() {
            escrita = escrita.slice(0, -1);
            dibujarHuecos();
        }

        function ganar() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            if(reto === 4) fiestaTrofeos();
            document.getElementById('overlay').style.display = 'flex';
        }

        function fiestaTrofeos() {
            const container = document.getElementById('trophy-rain');
            container.innerHTML = ''; container.style.display = 'block';
            for (let i = 0; i < 20; i++) {
                const t = document.createElement('div');
                t.className = 'trophy'; t.innerText = '🏆';
                t.style.left = Math.random() * 100 + 'vw';
                t.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(t);
            }
        }

        function proximo() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('trophy-rain').style.display = 'none';
            reto++;
            if(reto >= 5) { lvl++; reto = 0; }
            if(lvl > 5) window.location.href = 'index.html';
            else cargar();
        }

        iniciar();
    </script>
</body>
</html>
