<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Lexical Pro - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root { --primary: #0e9343; --light: #f5fdf7; --dark: #063c24; --accent: #fbc02d; }
        body { font-family: 'Poppins', sans-serif; background: #e8f5e9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .game-header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--primary); font-weight: bold; }
        .stats-bar { display: flex; justify-content: space-around; width: 100%; max-width: 800px; margin-top: 10px; font-weight: bold; color: var(--dark); }
        .game-container { max-width: 800px; width: 90%; background: white; margin-top: 1.5rem; padding: 2rem; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; }
        .frase-box { background: var(--light); padding: 2rem; border-radius: 20px; border: 3px solid var(--primary); margin-bottom: 2rem; font-size: 1.8rem; font-weight: 700; color: var(--dark); min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .espacio-ladrillos { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; min-height: 60px; margin: 2rem 0; border-bottom: 4px dashed #ccc; padding-bottom: 15px; }
        .ladrillo { width: 70px; height: 35px; background: var(--primary); border-radius: 8px; border-bottom: 5px solid #063c24; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: 0 auto; }
        .btn { padding: 1.2rem; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1.1rem; text-transform: uppercase; }
        .btn-ladrillo { background: var(--accent); color: #333; box-shadow: 0 5px 0 #c49000; grid-column: span 2; font-size: 1.3rem; }
        .btn-check { background: var(--primary); color: white; box-shadow: 0 5px 0 #063c24; }
        .btn-reset { background: #ef5350; color: white; box-shadow: 0 5px 0 #b71c1c; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; border-radius: 30px; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .feedback { margin-top: 1.5rem; font-weight: bold; font-size: 1.2rem; min-height: 30px; }
    </style>
</head>
<body>

    <div class="game-header">
        <a href="index.html" class="back-link">← Salir</a>
        <h2 style="color: var(--primary); margin: 0;">Laboratorio Lexical Mezclado</h2>
    </div>

    <div class="stats-bar">
        <span>Nivel: <span id="lvl-num">1</span>/5</span>
        <span>Reto: <span id="reto-num">1</span>/5</span>
    </div>

    <div class="game-container">
        <div id="overlay">
            <h2 id="overlay-msg" style="color: var(--primary); font-size: 2.5rem;">¡NIVEL SUPERADO!</h2>
            <p id="overlay-sub">¡Has contado perfectamente todas las frases!</p>
            <button class="btn btn-check" onclick="cerrarOverlay()">SIGUIENTE NIVEL</button>
        </div>

        <p style="color: #666;">¿Cuántas palabras tiene esta frase?</p>
        <div id="display-frase" class="frase-box">Cargando misión...</div>
        <div id="contenedor-ladrillos" class="espacio-ladrillos"></div>

        <div class="controles">
            <button class="btn btn-ladrillo" onclick="añadirLadrillo()">➕ PONER BLOQUE</button>
            <button class="btn btn-reset" onclick="borrarLadrillos()">BORRAR</button>
            <button class="btn btn-check" onclick="comprobar()">COMPROBAR</button>
        </div>
        <div id="mensaje" class="feedback"></div>
    </div>

    <script>
        const bolsaDeFrases = [
            "El sol brilla", "Mi mamá cocina", "La mesa verde", "Papá lee mucho", "Veo el mar",
            "El gato bebe leche", "Mi casa es grande", "Tengo un juguete nuevo", "El perro corre rápido", "Hoy es mi cumple",
            "El elefante tiene orejas grandes", "Me gusta jugar en el jardín", "Las flores son muy bonitas", "Mi hermano estudia mucho hoy", "El coche rojo corre veloz",
            "El astronauta viaja en un cohete", "Me lavo los dientes por la mañana", "El panadero hace pan muy rico", "Tengo ganas de jugar con amigos", "La lluvia cae sobre el suelo",
            "El pájaro canta una canción muy dulce", "Mi familia va a comer una pizza", "El ratón come un trozo de queso", "El bombero apaga el fuego con agua", "La maestra enseña letras a los niños",
            "Tengo un perro que salta muy alto", "Mañana iremos a la playa con mamá", "El helado de fresa está muy rico", "Veo una estrella en el cielo azul", "El conejo salta por el campo verde",
            "Mi mochila tiene muchos lápices de colores", "El barco navega por el océano muy lejos", "Me gusta mucho comer frutas y verduras", "El león es el rey de la selva", "La luna brilla en la noche oscura",
            "Aprendo a leer palabras nuevas cada día", "El tractor trabaja en el campo del pueblo", "Mi mejor amigo se llama Pedro Luis", "La mariposa vuela entre las flores rosas", "El oso duerme en su cueva fría"
        ];

        let frasesMezcladas = [];
        let nivelActual = 1;
        let fraseActual = 0;
        let ladrillosPuestos = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function iniciarJuego() {
            frasesMezcladas = shuffle([...bolsaDeFrases]);
            cargarFrase();
        }

        function cargarFrase() {
            // Índice global basado en nivel y frase del nivel
            const indice = ((nivelActual - 1) * 5) + fraseActual;
            document.getElementById('display-frase').innerText = frasesMezcladas[indice];
            document.getElementById('lvl-num').innerText = nivelActual;
            document.getElementById('reto-num').innerText = fraseActual + 1;
            borrarLadrillos();
        }

        function añadirLadrillo() {
            if(ladrillosPuestos < 12) {
                const div = document.createElement('div');
                div.className = 'ladrillo';
                document.getElementById('contenedor-ladrillos').appendChild(div);
                ladrillosPuestos++;
            }
        }

        function borrarLadrillos() {
            document.getElementById('contenedor-ladrillos').innerHTML = '';
            document.getElementById('mensaje').innerText = '';
            ladrillosPuestos = 0;
        }

        function comprobar() {
            const indice = ((nivelActual - 1) * 5) + fraseActual;
            const frase = frasesMezcladas[indice];
            const correctas = frase.split(" ").length;
            const msg = document.getElementById('mensaje');

            if(ladrillosPuestos === correctas) {
                msg.innerHTML = '<span style="color: var(--primary)">¡Perfecto! Has contado muy bien. ✨</span>';
                setTimeout(progresar, 1200);
            } else {
                msg.innerHTML = '<span style="color: #ef5350">¡Casi! Intenta contarlas otra vez. 🧐</span>';
            }
        }

        function progresar() {
            fraseActual++;
            if(fraseActual >= 5) {
                mostrarOverlay();
            } else {
                cargarFrase();
            }
        }

        function mostrarOverlay() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';
            if(nivelActual === 5) {
                document.getElementById('overlay-msg').innerText = "¡EXPERTO LEXICAL!";
                document.getElementById('overlay-sub').innerText = "Has superado todos los niveles mezclados.";
                document.querySelector('#overlay .btn').style.display = 'none';
            }
        }

        function cerrarOverlay() {
            document.getElementById('overlay').style.display = 'none';
            nivelActual++;
            fraseActual = 0;
            cargarFrase();
        }

        iniciarJuego();
    </script>
</body>
</html>
