<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel 2: Zig-Zag - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .no-print-area { margin-bottom: 20px; text-align: center; }
        .btn-print { background: #d32f2f; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .btn-print:hover { background: #b71c1c; transform: scale(1.05); }

        .page { width: 210mm; height: 297mm; background: white; padding: 15mm; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.2); position: relative; display: flex; flex-direction: column; }
        .header { border-bottom: 3px solid #0e9343; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        .header h2 { color: #0e9343; margin: 0; font-size: 1.5rem; }
        .header-info { text-align: right; font-size: 0.9rem; color: #333; }
        .title-box { text-align: center; margin-bottom: 20px; }
        .title-box h1 { margin: 0; font-size: 1.8rem; color: #333; text-transform: uppercase; letter-spacing: 2px; }
        .instructions { background: #f5fdf7; border-left: 5px solid #0e9343; padding: 15px; margin-bottom: 30px; font-size: 0.95rem; }

        .exercise-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-around; }
        
        /* Estilo para el Zig Zag usando SVG para que sea perfecto al imprimir */
        .zigzag-container { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .zigzag-svg { flex-grow: 1; height: 60px; margin: 0 20px; }
        .icon { font-size: 2.5rem; }

        footer { border-top: 1px solid #eee; padding-top: 10px; text-align: center; font-size: 0.75rem; color: #aaa; }
        @media print { .no-print-area { display: none; } .page { box-shadow: none; margin: 0; width: 100%; height: 100%; border: none; } }
    </style>
</head>
<body>
    <div class="no-print-area"><button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR FICHA 2.1</button></div>
    <div class="page">
        <div class="header">
            <div><h2>ACADEMIA ESPARTA</h2><p style="margin: 0; font-size: 0.8rem; font-weight: bold; color: #666;">CENTRO DE REFUERZO EDUCATIVO</p></div>
            <div class="header-info">Nombre: _________________<br>Fecha: __/__/____</div>
        </div>
        <div class="title-box"><h1>Nivel 2: Líneas Zig-Zag</h1></div>
        <div class="instructions"><strong>RETO:</strong> Sigue el camino de picos sin salirte de los puntos. ¡Cuidado con las curvas cerradas!</div>
        
        <div class="exercise-area">
            <div class="zigzag-container">
                <span class="icon">🦊</span>
                <svg class="zigzag-svg" viewBox="0 0 400 60">
                    <polyline points="0,60 40,0 80,60 120,0 160,60 200,0 240,60 280,0 320,60 360,0 400,60" 
                    fill="none" stroke="#bbb" stroke-width="3" stroke-dasharray="8,8" />
                </svg>
                <span class="icon" style="opacity: 0.2;">🌲</span>
            </div>

            <div class="zigzag-container">
                <span class="icon">🦈</span>
                <svg class="zigzag-svg" viewBox="0 0 400 60">
                    <polyline points="0,30 50,0 100,60 150,0 200,60 250,0 300,60 350,0 400,30" 
                    fill="none" stroke="#bbb" stroke-width="3" stroke-dasharray="8,8" />
                </svg>
                <span class="icon" style="opacity: 0.2;">🌊</span>
            </div>

            <div class="zigzag-container">
                <span class="icon">⛰️</span>
                <svg class="zigzag-svg" viewBox="0 0 400 60">
                    <polyline points="0,60 100,0 200,60 300,0 400,60" 
                    fill="none" stroke="#bbb" stroke-width="4" stroke-dasharray="10,10" />
                </svg>
                <span class="icon" style="opacity: 0.2;">🦅</span>
            </div>
        </div>
        <footer>Academia Esparta - Torremolinos | www.academiaesparta.es</footer>
    </div>
</body>
</html>
