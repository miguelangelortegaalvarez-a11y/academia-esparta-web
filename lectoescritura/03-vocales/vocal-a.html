<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Vocal A - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --a-color: #ef5350; --primary: #0e9343; --dark: #063c24; --light: #fdf2f2; }
        body { font-family: 'Fredoka', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--a-color); position: relative; z-index: 10; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--a-color); font-weight: bold; }

        /* Contenedor de Páginas */
        .book-slider { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .page { 
            display: none; width: 90%; max-width: 800px; height: 70vh; 
            background: white; border-radius: 40px; padding: 2rem; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 4px solid #eee;
            flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        .page.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--a-color); font-size: 2.2rem; margin-bottom: 2rem; text-align: center; }

        /* Estilos de interacción */
        .letra-tap { 
            font-size: 5rem; cursor: pointer; padding: 10px 25px; border-radius: 50%; 
            margin: 15px; border: 4px solid transparent; transition: 0.2s; display: inline-block;
        }
        .letra-tap.selected { border-color: var(--a-color); background: var(--light); color: var(--a-color); }

        .dibujo-tap { font-size: 7rem; cursor: pointer; filter: grayscale(100%); transition: 0.4s; padding: 20px; }
        .dibujo-tap.active { filter: grayscale(0%); transform: scale(1.2); }

        .lectura-grande { font-size: 6rem; letter-spacing: 20px; color: var(--dark); background: #fafafa; padding: 30px 60px; border-radius: 25px; border: 2px dashed #ccc; }

        /* Navegación */
        .nav-btn { 
            position: absolute; bottom: 30px; background: var(--primary); color: white; 
            border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.5rem; 
            font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 var(--dark); z-index: 20;
        }
        .nav-btn:active { transform: translateY(4px); box-shadow: none; }
        .prev { left: 50px; background: #999; }
        .next { right: 50px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← Salir</a>
        <div style="font-weight: 700; font-size: 1.8rem; color: var(--a-color);">Cuaderno Vocal A 🍎</div>
    </header>

    <div class="book-slider">
        
        <div class="page active" id="p1">
            <h2>1. Toca todas las letras "A"</h2>
            <div style="text-align: center;">
                <span class="letra-tap" onclick="marcar(this, true)">A</span>
                <span class="letra-tap" onclick="marcar(this, false)">E</span>
                <span class="letra-tap" onclick="marcar(this, true)">A</span>
                <span class="letra-tap" onclick="marcar(this, false)">O</span>
                <span class="letra-tap" onclick="marcar(this, true)">A</span>
            </div>
        </div>

        <div class="page" id="p2">
            <h2>2. Toca todas las letras "a"</h2>
            <div style="text-align: center;">
                <span class="letra-tap" onclick="marcar(this, true)">a</span>
                <span class="letra-tap" onclick="marcar(this, false)">o</span>
                <span class="letra-tap" onclick="marcar(this, true)">a</span>
                <span class="letra-tap" onclick="marcar(this, false)">e</span>
                <span class="letra-tap" onclick="marcar(this, true)">a</span>
            </div>
        </div>

        <div class="page" id="p3">
            <h2>3. ¿Qué empieza por "a"?</h2>
            <div style="display: flex; gap: 40px;">
                <div class="dibujo-tap" onclick="pintar(this, true)">🐝</div>
                <div class="dibujo-tap" onclick="pintar(this, false)">🐱</div>
                <div class="dibujo-tap" onclick="pintar(this, true)">✈️</div>
            </div>
        </div>

        <div class="page" id="p4">
            <h2>4. ¡Leemos juntos!</h2>
            <div class="lectura-grande" id="texto-lectura">a e</div>
            <div style="margin-top: 30px;">
                <button class="nav-btn" style="position: static; background: var(--a-color);" onclick="cambiarLectura()">CAMBIAR COMBINACIÓN</button>
            </div>
        </div>

        <button class="nav-btn prev" id="btnPrev" onclick="navegar(-1)" style="display: none;">←</button>
        <button class="nav-btn next" id="btnNext" onclick="navegar(1)">SIGUIENTE →</button>

    </div>

    <script>
        let paginaActual = 1;
        const totalPaginas = 4;
        const combinaciones = ["a e", "a i", "a u", "a o", "a a"];
        let indiceLectura = 0;

        function navegar(direccion) {
            document.getElementById(`p${paginaActual}`).classList.remove('active');
            paginaActual += direccion;
            document.getElementById(`p${paginaActual}`).classList.add('active');

            // Control de botones
            document.getElementById('btnPrev').style.display = paginaActual === 1 ? 'none' : 'block';
            document.getElementById('btnNext').innerText = paginaActual === totalPaginas ? 'FINALIZAR' : 'SIGUIENTE →';
            
            if(paginaActual > totalPaginas) {
                window.location.href = 'index.html';
            }
        }

        function marcar(el, esCorrecto) {
            el.classList.toggle('selected');
            if(esCorrecto && el.classList.contains('selected')) {
                confetti({ particleCount: 20, spread: 50, origin: { y: 0.7 } });
            }
        }

        function pintar(el, esCorrecto) {
            if(esCorrecto) {
                el.classList.add('active');
                confetti({ particleCount: 50, spread: 70 });
            }
        }

        function cambiarLectura() {
            indiceLectura = (indiceLectura + 1) % combinaciones.length;
            document.getElementById('texto-lectura').innerText = combinaciones[indiceLectura];
            confetti({ particleCount: 10, colors: ['#ef5350'] });
        }
    </script>
</body>
</html>
