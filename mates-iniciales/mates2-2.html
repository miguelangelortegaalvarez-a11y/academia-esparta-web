<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mates 2.2: Cantidades - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: 'Kalam', cursive; padding: 15px 35px; -webkit-print-color-adjust: exact; }
        .btn-print { position: fixed; top: 10px; right: 10px; background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; z-index: 100; font-family: sans-serif; }
        @media print { .btn-print { display: none; } }
        .header { display: flex; justify-content: space-between; border-bottom: 1.5pt solid #2980b9; padding-bottom: 5pt; margin-bottom: 15pt; font-family: sans-serif; text-transform: uppercase; font-size: 9pt; font-weight: bold; color: #2980b9; }
        .datos-alumno { display: flex; justify-content: space-between; margin-bottom: 20pt; font-size: 12pt; }
        .campo { border-bottom: 1pt dashed #000; flex-grow: 1; margin-left: 5pt; height: 12pt; }
        .instrucciones { font-size: 14pt; background: #f0f7fb; padding: 10px; border-radius: 10px; margin-bottom: 25pt; text-align: center; border-left: 5px solid #2980b9; }
        
        .grid-visual { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .caja-visual { border: 2pt solid #eee; border-radius: 15px; padding: 15px; text-align: center; }
        .grupos-comparar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .grupo { font-size: 24pt; padding: 10px; border: 1pt dashed #ccc; border-radius: 10px; width: 45%; }
        .vs { font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>
    <button class="btn-print" onclick="window.print()">📄 IMPRIMIR</button>
    <div class="header"><span>MATEMÁTICAS INICIALES</span><span>ACADEMIA ESPARTA</span></div>
    <div class="datos-alumno"><div style="width: 45%; display: flex;">Nombre: <div class="campo"></div></div><div style="width: 25%; display: flex;">Fecha: <div class="campo"></div></div></div>
    
    <h3 style="text-align:center; text-decoration: underline;">¿Dónde hay más?</h3>
    <div class="instrucciones">Cuenta y rodea el grupo que tenga el mayor número de elementos.</div>

    <div class="grid-visual">
        <div class="caja-visual"><strong>Frutas</strong><div class="grupos-comparar"><div class="grupo">🍎🍎</div><div class="vs">o</div><div class="grupo">🍎🍎🍎</div></div></div>
        <div class="caja-visual"><strong>Juguetes</strong><div class="grupos-comparar"><div class="grupo">🚗🚗🚗🚗</div><div class="vs">o</div><div class="grupo">🚗🚗</div></div></div>
        <div class="caja-visual"><strong>Animales</strong><div class="grupos-comparar"><div class="grupo">🐶🐶</div><div class="vs">o</div><div class="grupo">🐶🐶🐶</div></div></div>
        <div class="caja-visual"><strong>Estrellas</strong><div class="grupos-comparar"><div class="grupo">⭐⭐⭐</div><div class="vs">o</div><div class="grupo">⭐⭐⭐⭐⭐</div></div></div>
        <div class="caja-visual"><strong>Ranas</strong><div class="grupos-comparar"><div class="grupo">🐸🐸🐸</div><div class="vs">o</div><div class="grupo">🐸</div></div></div>
        <div class="caja-visual"><strong>Globos</strong><div class="grupos-comparar"><div class="grupo">🎈</div><div class="vs">o</div><div class="grupo">🎈🎈🎈</div></div></div>
    </div>
</body>
</html>
