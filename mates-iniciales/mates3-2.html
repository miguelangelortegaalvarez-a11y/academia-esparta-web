<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mates 3.2: Casitas de Números - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: 'Kalam', cursive; padding: 15px 35px; -webkit-print-color-adjust: exact; }
        .btn-print { position: fixed; top: 10px; right: 10px; background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 100; font-family: sans-serif; }
        @media print { .btn-print { display: none; } }
        .grid-casas { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; justify-items: center; margin-top: 30px; }
        .casa { border: 3pt solid #2980b9; width: 200px; border-radius: 15px; overflow: hidden; }
        .tejado { background: #2980b9; color: white; font-size: 35pt; padding: 10px; text-align: center; font-weight: bold; }
        .piso { display: flex; border-bottom: 2pt solid #eee; }
        .habitacion { width: 50%; height: 45pt; display: flex; align-items: center; justify-content: center; font-size: 22pt; font-weight: bold; border-right: 1pt solid #eee; }
        .habitacion:last-child { border-right: none; }
        .vacia { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <button class="btn-print" onclick="window.print()">📄 IMPRIMIR</button>
    <h3 style="text-align:center; text-decoration: underline;">Las Casitas de Sumar</h3>
    <p style="text-align:center; font-size: 14pt;">Escribe los números que faltan para que los dos vecinos sumen el número del tejado.</p>
    
    <div class="grid-casas">
        <div class="casa">
            <div class="tejado">5</div>
            <div class="piso"><div class="habitacion">1</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">3</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">2</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">4</div><div class="habitacion vacia"></div></div>
        </div>
        <div class="casa">
            <div class="tejado">6</div>
            <div class="piso"><div class="habitacion">3</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">5</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">2</div><div class="habitacion vacia"></div></div>
            <div class="piso"><div class="habitacion">4</div><div class="habitacion vacia"></div></div>
        </div>
    </div>
</body>
</html>
