<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mates 2.3: Anterior y Posterior - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: 'Kalam', cursive; padding: 15px 35px; -webkit-print-color-adjust: exact; }
        .btn-print { position: fixed; top: 10px; right: 10px; background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; z-index: 100; font-family: sans-serif; }
        @media print { .btn-print { display: none; } }
        .header { display: flex; justify-content: space-between; border-bottom: 1.5pt solid #2980b9; padding-bottom: 5pt; margin-bottom: 15pt; font-family: sans-serif; text-transform: uppercase; font-size: 9pt; font-weight: bold; color: #2980b9; }
        .datos-alumno { display: flex; justify-content: space-between; margin-bottom: 20pt; font-size: 12pt; }
        .campo { border-bottom: 1pt dashed #000; flex-grow: 1; margin-left: 5pt; height: 12pt; }
        
        .grid-vecinos { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .trio-numeros { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .caja-num { width: 45pt; height: 45pt; border: 2pt solid #2980b9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22pt; font-weight: bold; }
        .centro { background-color: #f0f7fb; border-color: #ccc; }
    </style>
</head>
<body>
    <button class="btn-print" onclick="window.print()">📄 IMPRIMIR</button>
    <div class="header"><span>MATEMÁTICAS INICIALES</span><span>ACADEMIA ESPARTA</span></div>
    <div class="datos-alumno"><div style="width: 45%; display: flex;">Nombre: <div class="campo"></div></div><div style="width: 25%; display: flex;">Fecha: <div class="campo"></div></div></div>
    
    <h3 style="text-align:center; text-decoration: underline;">Anterior y Posterior</h3>
    <p style="text-align:center; font-size: 14pt;">Escribe el número que va antes y el que va después en cada caso.</p>

    <div class="grid-vecinos">
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">4</div><div class="cajita" style="width: 45pt; height: 45pt; border: 2pt solid #2980b9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22pt; font-weight: bold;"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">7</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">2</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">9</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">5</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">8</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">3</div><div class="caja-num"></div></div>
        <div class="trio-numeros"><div class="caja-num"></div><div class="caja-num centro">6</div><div class="caja-num"></div></div>
    </div>
</body>
</html>
