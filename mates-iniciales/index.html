<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mates Iniciales - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --primary: #2980b9; 
            --light: #f4f7f6; 
            --dark: #2c3e50;
            --accent: #34495e;
        }
        body { font-family: 'Poppins', sans-serif; background-color: #ffffff; color: var(--dark); margin: 0; padding: 40px 20px; text-align: center; }
        h1 { color: var(--primary); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }
        .subtitulo { color: #7f8c8d; margin-bottom: 30px; font-size: 1.1rem; }
        
        .grid-mates { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1000px; margin: 40px auto; }

        .card {
            background: white; width: 240px; border-radius: 12px; padding: 30px 20px;
            text-align: center; border: 2px solid #ecf0f1;
            transition: all 0.3s ease; text-decoration: none; color: var(--dark);
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 20px rgba(0,0,0,0.05); 
            border-color: var(--primary); 
        }

        .card .icono { font-size: 3.5rem; margin-bottom: 15px; }
        .card h4 { margin: 0; color: var(--primary); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .card p { margin: 10px 0; font-weight: bold; font-size: 1.1rem; }

        .tag { 
            font-size: 0.75rem; 
            color: var(--accent); 
            border: 1px solid var(--accent);
            padding: 4px 15px; 
            border-radius: 20px; 
            margin-top: 15px; 
            font-weight: 600; 
            text-transform: uppercase; 
        }
        
        .btn-volver { margin-top: 60px; display: inline-block; text-decoration: none; color: #95a5a6; font-weight: bold; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; transition: 0.3s; }
        .btn-volver:hover { color: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>

    <h1>Matemáticas Iniciales</h1>
    <p class="subtitulo">Academia Esparta · Bloque de razonamiento</p>

    <div class="grid-mates">
        
        <a href="mates1-1.html" class="card">
            <div class="icono">🔢</div>
            <h4>Bloque 1</h4>
            <p>Conteo y Números</p>
            <span class="tag">Nivel Uno</span>
        </a>

        <a href="mates2-1.html" class="card">
            <div class="icono">⚖️</div>
            <h4>Bloque 2</h4>
            <p>Comparación y Lógica</p>
            <span class="tag">Nivel Dos</span>
        </a>

        <a href="mates3-1.html" class="card">
            <div class="icono">🧩</div>
            <h4>Bloque 3</h4>
            <p>Resolución de Problemas</p>
            <span class="tag">Nivel Tres</span>
        </a>

    </div>

    <a href="../index.html" class="btn-volver">← Volver al Menú Principal</a>

</body>
</html>
