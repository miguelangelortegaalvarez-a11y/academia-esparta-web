<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mates 2.1: Mayor y Menor - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: 'Kalam', cursive; padding: 15px 35px; line-height: 1.3; -webkit-print-color-adjust: exact; }
        .btn-print { position: fixed; top: 10px; right: 10px; background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 100; font-family: sans-serif; }
        @media print { .btn-print { display: none; } body { padding: 0; margin: 0; } }
        
        .header { display: flex; justify-content: space-between; border-bottom: 1.5pt solid #2980b9; padding-bottom: 5pt; margin-bottom: 15pt; font-family: sans-serif; text-transform: uppercase; font-size: 9pt; font-weight: bold; color: #2980b9; }
        .datos-alumno { display: flex; justify-content: space-between; margin-bottom: 20pt; font-size: 12pt; }
        .campo { border-bottom: 1pt dashed #000; flex-grow: 1; margin-left: 5pt; height: 12pt; }

        .titulo-ficha { text-align: center; margin-bottom: 15pt; }
        .titulo-ficha h3 { font-size: 22pt; text-decoration: underline; margin: 0; }
        .instrucciones { font-size: 14pt; background: #f0f7fb; padding: 10px; border-radius: 10px; margin-bottom: 25pt; text-align: center; border-left: 5px solid #2980b9; }

        .grid-comparar { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .fila-comparar { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px; border: 1.5pt solid #eee; border-radius: 12px; font-size: 32pt; font-weight: bold; }
        .circulo-simbolo { width: 45pt; height: 45pt; border: 2pt solid #2980b9; border-radius: 50%; background: #fff; }

        .watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 90pt; color: rgba(41, 128, 185, 0.03); z-index: -1; pointer-events: none; text-transform: uppercase; }
        .frase-final { margin-top: 25pt; text-align: center; font-size: 14pt; font-style: italic; }
    </style>
</head>
<body>
    <div class="watermark">ESPARTA</div>
    <button class="btn-print" onclick="window.print()">📄 IMPRIMIR</button>
    <div class="header"><span>MATEMÁTICAS INICIALES</span><span>ACADEMIA ESPARTA</span></div>
    
    <div class="datos-alumno">
        <div style="width: 45%; display: flex;">Nombre: <div class="campo"></div></div>
        <div style="width: 25%; display: flex;">Fecha: <div class="campo"></div></div>
    </div>

    <div class="titulo-ficha"><h3>Mayor, Menor o Igual</h3></div>
    <div class="instrucciones">Escribe el símbolo correcto ( <strong>></strong> , <strong><</strong> o <strong>=</strong> ) dentro del círculo azul.</div>

    <div class="grid-comparar">
        <div class="fila-comparar">9 <div class="circulo-simbolo"></div> 4</div>
        <div class="fila-comparar">2 <div class="circulo-simbolo"></div> 7</div>
        <div class="fila-comparar">5 <div class="circulo-simbolo"></div> 5</div>
        <div class="fila-comparar">8 <div class="circulo-simbolo"></div> 3</div>
        <div class="fila-comparar">1 <div class="circulo-simbolo"></div> 6</div>
        <div class="fila-comparar">10 <div class="circulo-simbolo"></div> 10</div>
        <div class="fila-comparar">4 <div class="circulo-simbolo"></div> 9</div>
        <div class="fila-comparar">7 <div class="circulo-simbolo"></div> 2</div>
    </div>

    <div class="frase-final">¡Recuerda que el cocodrilo siempre se come al más grande! 🐊</div>
</body>
</html>
