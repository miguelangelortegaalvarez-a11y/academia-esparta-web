<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lengua Castellana | Academia Esparta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-p1HgFeAX1FD9CpVLoFBlGFeAJJMqviHOk/VmTXn3ChnW+ZhFQuGcx68S2N6C8THRLugVZ0JfR0e7xuVghg7Hww=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.PNG" />

  <!-- React 18 + ReactDOM via CDN (production, no Babel needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0e9343; --primary-dark: #09834c; --primary-darker: #063c24;
      --light: #f0fdf4; --dark: #111827; --gray: #4b5563; --white: #fff;
      --radius: 14px; --ease: all 0.22s ease;
    }
    body { font-family: 'Poppins', sans-serif; color: var(--dark); background: var(--light); }
    a { text-decoration: none; }

    /* ── Header ── */
    .site-header { background: rgba(255,255,255,.93); backdrop-filter: blur(8px); padding: .85rem 2rem;
      position: fixed; width: 100%; top: 0; left: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 16px rgba(0,0,0,.07); }
    .site-logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); letter-spacing: -.5px; }
    .site-back { display: inline-flex; align-items: center; gap: .5rem;
      color: var(--gray); font-size: .88rem; font-weight: 600; transition: color .2s; }
    .site-back:hover { color: var(--primary); }

    /* ── Hero ── */
    .page-hero { background: linear-gradient(140deg, var(--primary-darker) 0%, var(--primary) 100%);
      padding: 7.5rem 2rem 4.5rem; text-align: center; position: relative; overflow: hidden; }
    .page-hero::before { content: ''; position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: rgba(255,255,255,.05); top: -120px; right: -80px; }
    .page-hero::after { content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,.04); bottom: -50px; left: -40px; }
    .hero-inner { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; }
    .hero-label { display: inline-block; background: rgba(255,255,255,.15); color: rgba(255,255,255,.9);
      font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      padding: .3rem 1rem; border-radius: 999px; margin-bottom: 1.2rem;
      border: 1px solid rgba(255,255,255,.25); }
    .hero-h1 { font-size: clamp(1.7rem,4vw,2.6rem); font-weight: 800; color: #fff; line-height: 1.15; margin-bottom: .8rem; }
    .hero-p  { color: rgba(255,255,255,.72); font-size: .98rem; line-height: 1.65; }
    .hero-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 1.5rem; }
    .hero-tag { background: rgba(255,255,255,.12); color: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.22);
      font-size: .72rem; font-weight: 600; padding: .25rem .75rem; border-radius: 999px; }

    /* ── App wrapper ── */
    .app-wrap { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }

    /* ── Loading spinner ── */
    .loading { text-align: center; padding: 4rem 2rem; color: #9ca3af; }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb;
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Navigator ── */
    .nav-topbar { display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.4rem; gap: .75rem; flex-wrap: wrap; min-height: 36px; }
    .breadcrumb { display: flex; align-items: center; gap: .35rem; font-size: .8rem; flex-wrap: wrap; }
    .bc-link { color: var(--primary-dark); font-weight: 600; cursor: pointer; border: none;
      background: none; font-family: 'Poppins', sans-serif; font-size: .8rem; padding: 0; }
    .bc-link:hover { text-decoration: underline; }
    .bc-sep  { color: #d1d5db; }
    .bc-curr { color: var(--dark); font-weight: 700; font-size: .8rem; }
    .nav-actions { display: flex; gap: .45rem; }
    .btn-nav { display: inline-flex; align-items: center; gap: .4rem; background: #fff;
      border: 1.5px solid #e5e7eb; color: var(--gray); font-size: .8rem; font-weight: 600;
      padding: .4rem .9rem; border-radius: 999px; cursor: pointer; transition: var(--ease);
      font-family: 'Poppins', sans-serif; }
    .btn-nav:hover { border-color: var(--primary); color: var(--primary); }
    .btn-home { background: var(--light); border-color: rgba(14,147,67,.2); color: var(--primary-dark); }
    .btn-home:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Intro block ── */
    .intro-block { background: #fff; border-radius: var(--radius); padding: 1.4rem 1.6rem;
      margin-bottom: 1.5rem; border: 1.5px solid rgba(14,147,67,.1); }
    .intro-title { font-size: 1.1rem; font-weight: 800; color: var(--dark); margin-bottom: .25rem; }
    .intro-sub   { font-size: .82rem; color: var(--gray); line-height: 1.55; }

    /* ── Curso grid ── */
    .curso-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: .9rem; }
    .curso-card { background: #fff; border-radius: var(--radius); padding: 1.4rem 1rem 1.15rem;
      text-align: center; cursor: pointer; border: 2px solid #e5e7eb; transition: var(--ease);
      position: relative; overflow: hidden; user-select: none; }
    .curso-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.1); }
    .curso-num  { font-size: 2.4rem; font-weight: 800; line-height: 1; display: block; }
    .curso-name { font-size: .76rem; color: var(--gray); font-weight: 500; margin: .3rem 0 .5rem; }
    .curso-ciclo { font-size: .66rem; font-weight: 700; padding: .14rem .5rem;
      border-radius: 999px; display: inline-block; }
    .curso-badge { position: absolute; top: .45rem; right: .45rem; font-size: .58rem; font-weight: 700;
      background: #fef2f2; color: #dc2626; padding: .13rem .38rem; border-radius: 999px; border: 1px solid #fecaca; }

    /* ── Block grid ── */
    .bloque-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: .85rem; }
    .bloque-card { background: #fff; border-radius: var(--radius); padding: 1.4rem 1.2rem;
      cursor: pointer; border: 2px solid #e5e7eb; transition: var(--ease);
      display: flex; align-items: center; gap: .9rem; user-select: none; }
    .bloque-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.1); }
    .bloque-emoji { font-size: 1.9rem; flex-shrink: 0; }
    .bloque-info  { flex: 1; min-width: 0; }
    .bloque-name  { font-size: .92rem; font-weight: 700; line-height: 1.25; }
    .bloque-count { font-size: .73rem; color: var(--gray); margin-top: .18rem; }
    .bloque-pill  { font-size: .63rem; font-weight: 700; padding: .12rem .45rem;
      border-radius: 999px; margin-top: .3rem; display: inline-block; }
    .bloque-arr   { color: #d1d5db; font-size: .85rem; flex-shrink: 0; transition: var(--ease); }
    .bloque-card:hover .bloque-arr { transform: translateX(3px); }

    /* ── Sub-block list ── */
    .sb-header { background: #fff; border-radius: var(--radius); padding: 1.2rem 1.4rem;
      margin-bottom: 1rem; display: flex; align-items: center; gap: .9rem;
      border-left-style: solid; border-left-width: 4px; border: 1.5px solid #e5e7eb; }
    .sb-header-left { display: flex; align-items: center; gap: .9rem; }
    .sb-emoji { font-size: 1.8rem; }
    .sb-title { font-size: 1rem; font-weight: 800; }
    .sb-sub   { font-size: .76rem; color: var(--gray); margin-top: .12rem; }
    .sb-list  { display: flex; flex-direction: column; gap: .55rem; }
    .sb-item  { background: #fff; border-radius: 10px; padding: .9rem 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; border: 1.5px solid #e5e7eb; transition: var(--ease); user-select: none; }
    .sb-item:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateX(3px); }
    .sb-item-left { display: flex; align-items: center; gap: .7rem; }
    .sb-num  { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: .65rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .sb-name { font-size: .86rem; font-weight: 600; }
    .sb-arr  { color: #d1d5db; font-size: .8rem; transition: var(--ease); }
    .sb-item:hover .sb-arr { color: var(--primary); }

    /* ── Resource view ── */
    .rec-header { background: #fff; border-radius: var(--radius); padding: 1.2rem 1.4rem;
      margin-bottom: 1.2rem; border: 1.5px solid #e5e7eb; border-left-style: solid; border-left-width: 4px; }
    .rec-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .3rem; }
    .rec-name  { font-size: 1.05rem; font-weight: 800; color: var(--dark); }
    .rec-coming { text-align: center; padding: 3.5rem 2rem; background: #fff;
      border-radius: var(--radius); border: 2px dashed #e5e7eb; }
    .rec-icon  { font-size: 3rem; display: block; margin-bottom: 1rem; filter: grayscale(.2); }
    .rec-title { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin-bottom: .5rem; }
    .rec-desc  { font-size: .86rem; color: var(--gray); line-height: 1.65;
      max-width: 340px; margin: 0 auto 1.5rem; }
    .btn-contact { display: inline-flex; align-items: center; gap: .5rem; background: var(--primary);
      color: #fff; font-weight: 700; font-size: .86rem; padding: .7rem 1.5rem; border-radius: 999px;
      transition: var(--ease); font-family: 'Poppins', sans-serif; border: none; cursor: pointer; }
    .btn-contact:hover { background: var(--primary-darker); transform: translateY(-2px); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .curso-grid { grid-template-columns: repeat(2,1fr); }
      .bloque-grid { grid-template-columns: 1fr; }
      .app-wrap { padding: 2rem 1rem 5rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-logo">Academia Esparta</a>
    <a href="materiales.html" class="site-back">
      <i class="fa-solid fa-arrow-left"></i> Materiales
    </a>
  </header>

  <div class="page-hero">
    <div class="hero-inner">
      <span class="hero-label">📚 Lengua Castellana</span>
      <h1 class="hero-h1">Recursos por curso y bloque</h1>
      <p class="hero-p">Navega por el currículo LOMLOE de Andalucía. Selecciona el curso y encuentra los recursos para cada tema.</p>
      <div class="hero-tags">
        <span class="hero-tag">1º – 6º Primaria</span>
        <span class="hero-tag">LOMLOE · Andalucía</span>
        <span class="hero-tag">Ciclos C1 · C2 · C3</span>
      </div>
    </div>
  </div>

  <div class="app-wrap">
    <div id="lengua-app">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p style="font-size:.85rem">Cargando…</p>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // CURRICULUM DATA — LOMLOE · Andalucía · Lengua Castellana
    // 1º-6º Primaria. Edita este objeto para añadir recursos.
    // Estructura de recurso: { tipo, titulo, enlace, dificultad, duracion }
    // ═══════════════════════════════════════════════════════════
    const CURRICULUM = {
      "1": {
        nombre: "1º Primaria", ciclo: "C1",
        bloques: {
          A: {
            nombre: "Lenguas y hablantes", color: "#1e40af", icono: "🌍",
            subBloques: ["Diversidad lingüística", "Lengua materna"],
            recursos: []
          },
          B_oral: {
            nombre: "Comunicación oral", color: "#16a34a", icono: "🎤",
            subBloques: ["Escucha activa", "Turnos de palabra", "Descripción oral simple", "Narración de vivencias"],
            recursos: []
          },
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Conciencia fonológica", "Decodificación", "Lectura silábica", "Lectura de palabra", "Lectura de frase", "Comprensión literal"],
            recursos: []
          },
          B_escrita: {
            nombre: "Escritura", color: "#16a34a", icono: "✏️",
            subBloques: ["Grafomotricidad", "Mayúsculas y minúsculas", "Ortografía natural", "Frases simples"],
            recursos: []
          },
          C: {
            nombre: "Literatura", color: "#ea580c", icono: "📖",
            subBloques: ["Cuentos tradicionales", "Adivinanzas", "Retahílas", "Poemas breves"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Sílaba", "Palabra", "Concordancia básica", "Vocabulario por campos semánticos"],
            recursos: []
          }
        }
      },
      "2": {
        nombre: "2º Primaria", ciclo: "C1",
        bloques: {
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Lectura fluida", "Inferencias simples", "Idea principal", "Secuencia temporal", "Comprensión de instrucciones", "Vocabulario en contexto"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Nombre, Adjetivo, Verbo intuitivo", "Singular y Plural", "Masculino y Femenino", "Sinónimos", "Antónimos", "Signos de puntuación"],
            recursos: []
          }
        }
      },
      "3": {
        nombre: "3º Primaria", ciclo: "C2",
        bloques: {
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Tipos textuales", "Idea principal y secundarias", "Inferencias", "Vocabulario en contexto", "Velocidad lectora", "Lectura entonada"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Sustantivo", "Adjetivo", "Verbo", "Determinantes", "Familia de palabras", "Polisemia", "Ortografía"],
            recursos: []
          }
        }
      },
      "4": {
        nombre: "4º Primaria", ciclo: "C2",
        bloques: {
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Textos expositivos", "Inferencias complejas", "Resumen escrito", "Esquemas y mapas conceptuales", "Lectura crítica inicial", "Velocidad lectora con comprensión"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Sujeto y predicado", "Pronombres", "Adverbios", "Preposiciones", "Conjugación regular", "Prefijos y sufijos", "Acentuación", "Ortografía"],
            recursos: []
          }
        }
      },
      "5": {
        nombre: "5º Primaria", ciclo: "C3",
        bloques: {
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Textos argumentativos", "Textos periodísticos", "Inferencias avanzadas", "Hecho vs opinión", "Lectura crítica", "Búsqueda de información fiable", "Comprensión digital"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Análisis morfológico", "Verbos irregulares", "Oración simple", "Campos semánticos", "Connotación y denotación", "Acentuación completa", "Tildes diacríticas", "Puntuación avanzada"],
            recursos: []
          }
        }
      },
      "6": {
        nombre: "6º Primaria", ciclo: "C3",
        bloques: {
          LECTURA: {
            nombre: "Lectura y comprensión", color: "#dc2626", icono: "👓",
            subBloques: ["Todos los tipos textuales", "Lectura crítica plena", "Inferencias complejas", "Análisis de fuentes", "Alfabetización mediática", "Verificación de información", "Tránsito a ESO"],
            recursos: []
          },
          D: {
            nombre: "Gramática y ortografía", color: "#7c3aed", icono: "🔤",
            subBloques: ["Análisis morfosintáctico", "Oración simple completa", "Tipos de oración", "Voz activa y pasiva", "Léxico", "Cohesión textual", "Reglas ortográficas completas"],
            recursos: []
          }
        }
      }
    };

    // Cicle visual config
    const CICLO = {
      C1: { label: "Ciclo 1 · 1º-2º", color: "#1d4ed8", bg: "#eff6ff", border: "#bfdbfe" },
      C2: { label: "Ciclo 2 · 3º-4º", color: "#059669", bg: "#ecfdf5", border: "#a7f3d0" },
      C3: { label: "Ciclo 3 · 5º-6º", color: "#7c3aed", bg: "#faf5ff", border: "#ddd6fe" }
    };

    // ═══════════════════════════════════════════════════════════
    // REACT COMPONENT — Plain React.createElement (no JSX/Babel)
    // ═══════════════════════════════════════════════════════════
    const { useState } = React;
    const h = React.createElement;

    // ── Breadcrumb ──
    function Breadcrumb({ curso, bloqueKey, subBloque, onHome, onCurso, onBloque }) {
      const items = [];
      items.push(h('button', { key:'home', className:'bc-link', onClick: onHome }, 'Inicio'));
      if (curso) {
        items.push(h('span', { key:'s1', className:'bc-sep' }, ' › '));
        if (bloqueKey) {
          items.push(h('button', { key:'curso', className:'bc-link', onClick: onCurso }, CURRICULUM[curso].nombre));
        } else {
          items.push(h('span', { key:'curso', className:'bc-curr' }, CURRICULUM[curso].nombre));
        }
      }
      if (bloqueKey) {
        const b = CURRICULUM[curso].bloques[bloqueKey];
        items.push(h('span', { key:'s2', className:'bc-sep' }, ' › '));
        if (subBloque) {
          items.push(h('button', { key:'bloque', className:'bc-link', onClick: onBloque }, b.nombre));
        } else {
          items.push(h('span', { key:'bloque', className:'bc-curr' }, b.nombre));
        }
      }
      if (subBloque) {
        items.push(h('span', { key:'s3', className:'bc-sep' }, ' › '));
        items.push(h('span', { key:'sub', className:'bc-curr' }, subBloque));
      }
      return h('div', { className:'breadcrumb' }, ...items);
    }

    // ── View 1: Course selector ──
    function CursoView({ onSelect }) {
      return h('div', null,
        h('div', { className:'intro-block' },
          h('div', { className:'intro-title' }, '📚 Lengua Castellana · Selecciona el curso'),
          h('div', { className:'intro-sub' },
            '1º Primaria incluye todos los bloques LOMLOE. En 2º–6º se trabajan los dos ejes principales: Lectura y comprensión + Gramática y ortografía.')
        ),
        h('div', { className:'curso-grid' },
          ...Object.entries(CURRICULUM).map(([key, c]) => {
            const cc = CICLO[c.ciclo];
            return h('div', {
              key,
              className: 'curso-card',
              style: { borderColor: cc.border },
              onClick: () => onSelect(key),
              onMouseEnter: e => { e.currentTarget.style.borderColor = cc.color; },
              onMouseLeave: e => { e.currentTarget.style.borderColor = cc.border; }
            },
              key === '1' && h('span', { className:'curso-badge' }, '✦ Todos los bloques'),
              h('span', { className:'curso-num', style:{ color: cc.color } }, key + 'º'),
              h('div', { className:'curso-name' }, c.nombre),
              h('span', { className:'curso-ciclo', style:{ background: cc.bg, color: cc.color } }, cc.label)
            );
          })
        )
      );
    }

    // ── View 2: Block selector ──
    function BloqueView({ curso, onSelect }) {
      const c = CURRICULUM[curso];
      const multiBloque = Object.keys(c.bloques).length > 2;
      return h('div', null,
        h('div', { className:'intro-block' },
          h('div', { className:'intro-title' },
            c.nombre + ' · ' + CICLO[c.ciclo].label
          ),
          h('div', { className:'intro-sub' },
            multiBloque
              ? 'Todos los bloques del currículo LOMLOE. Selecciona el que quieres trabajar.'
              : 'Dos ejes principales para este ciclo. Selecciona el bloque.')
        ),
        h('div', { className:'bloque-grid' },
          ...Object.entries(c.bloques).map(([key, b]) => {
            const isPriority = key === 'LECTURA' || key === 'D';
            return h('div', {
              key,
              className: 'bloque-card',
              style: { borderColor: isPriority ? b.color : '#e5e7eb' },
              onClick: () => onSelect(key),
              onMouseEnter: e => {
                e.currentTarget.style.borderColor = b.color;
                e.currentTarget.style.background = b.color + '10';
              },
              onMouseLeave: e => {
                e.currentTarget.style.borderColor = isPriority ? b.color : '#e5e7eb';
                e.currentTarget.style.background = '#fff';
              }
            },
              h('div', { className:'bloque-emoji' }, b.icono),
              h('div', { className:'bloque-info' },
                h('div', { className:'bloque-name', style:{ color: b.color } }, b.nombre),
                h('div', { className:'bloque-count' }, b.subBloques.length + ' temas'),
                isPriority && !multiBloque && h('span', { className:'bloque-pill',
                  style:{ background: b.color + '18', color: b.color } },
                  key === 'LECTURA' ? '★ Eje principal' : '★ Eje secundario')
              ),
              h('span', { className:'bloque-arr' }, '›')
            );
          })
        )
      );
    }

    // ── View 3: Sub-block list ──
    function SubBloqueView({ curso, bloqueKey, onSelect }) {
      const b = CURRICULUM[curso].bloques[bloqueKey];
      return h('div', null,
        h('div', { className:'sb-header', style:{ borderLeftColor: b.color } },
          h('div', { className:'sb-header-left' },
            h('span', { className:'sb-emoji' }, b.icono),
            h('div', null,
              h('div', { className:'sb-title', style:{ color: b.color } }, b.nombre),
              h('div', { className:'sb-sub' }, b.subBloques.length + ' temas · Selecciona para ver los recursos')
            )
          )
        ),
        h('div', { className:'sb-list' },
          ...b.subBloques.map((sb, i) =>
            h('div', {
              key: i, className:'sb-item',
              onClick: () => onSelect(sb),
              onMouseEnter: e => e.currentTarget.style.borderColor = b.color,
              onMouseLeave: e => e.currentTarget.style.borderColor = '#e5e7eb'
            },
              h('div', { className:'sb-item-left' },
                h('span', { className:'sb-num', style:{ background: b.color } }, i + 1),
                h('span', { className:'sb-name' }, sb)
              ),
              h('span', { className:'sb-arr' }, '›')
            )
          )
        )
      );
    }

    // ── View 4: Resource detail (coming soon) ──
    function RecursoView({ curso, bloqueKey, subBloque }) {
      const b = CURRICULUM[curso].bloques[bloqueKey];
      return h('div', null,
        h('div', { className:'rec-header', style:{ borderLeftColor: b.color } },
          h('div', { className:'rec-label', style:{ color: b.color } }, b.icono + '  ' + b.nombre),
          h('div', { className:'rec-name' }, subBloque)
        ),
        h('div', { className:'rec-coming' },
          h('span', { className:'rec-icon' }, '📂'),
          h('div', { className:'rec-title' }, 'Recursos en preparación'),
          h('p', { className:'rec-desc' },
            'Estamos creando fichas, ejercicios y actividades para ',
            h('strong', null, subBloque),
            '. ¡Muy pronto disponibles!'
          ),
          h('a', { href:'index.html#contact', className:'btn-contact' },
            h('i', { className:'fa-solid fa-comment' }), ' Solicitar recursos'
          )
        )
      );
    }

    // ── Main navigator ──
    function LenguaNavigator() {
      const [curso,     setCurso]     = useState(null);
      const [bloqueKey, setBloqueKey] = useState(null);
      const [subBloque, setSubBloque] = useState(null);

      const goHome   = () => { setCurso(null); setBloqueKey(null); setSubBloque(null); };
      const goCurso  = () => { setBloqueKey(null); setSubBloque(null); };
      const goBloque = () => setSubBloque(null);
      const goBack   = () => {
        if (subBloque)  goBloque();
        else if (bloqueKey) goCurso();
        else goHome();
      };

      const showNav = curso !== null;

      return h('div', null,
        // Top bar
        h('div', { className:'nav-topbar' },
          h(Breadcrumb, { curso, bloqueKey, subBloque, onHome: goHome, onCurso: goCurso, onBloque: goBloque }),
          showNav && h('div', { className:'nav-actions' },
            h('button', { className:'btn-nav', onClick: goBack }, '← Atrás'),
            h('button', { className:'btn-nav btn-home', onClick: goHome }, '🏠')
          )
        ),
        // Views
        !curso     && h(CursoView,     { onSelect: c  => { setCurso(c);     setBloqueKey(null); setSubBloque(null); } }),
        curso && !bloqueKey && h(BloqueView, { curso, onSelect: k  => setBloqueKey(k) }),
        bloqueKey && !subBloque && h(SubBloqueView, { curso, bloqueKey, onSelect: sb => setSubBloque(sb) }),
        subBloque  && h(RecursoView,   { curso, bloqueKey, subBloque })
      );
    }

    // Mount
    ReactDOM.createRoot(document.getElementById('lengua-app'))
      .render(h(LenguaNavigator));
  </script>
</body>
</html>
