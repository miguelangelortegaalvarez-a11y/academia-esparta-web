<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Espartano: Erick al Olimpo</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root { --esparta-verde: #0e9343; --esparta-oro: #f1c40f; --esparta-rojo: #e74c3c; }
        body { font-family: 'Kalam', cursive; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        
        .header { background: var(--esparta-verde); color: white; width: 100%; text-align: center; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-family: 'Bangers', cursive; letter-spacing: 2px; }
        .progress-container { width: 80%; background: #ddd; height: 25px; border-radius: 15px; margin: 20px 0; overflow: hidden; border: 3px solid #333; position: relative; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); transition: width 0.5s ease; }

        .game-container { background: white; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 6px solid var(--esparta-verde); position: relative; margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Contenedor principal de la operación para centrado total */
        .operation-wrapper { display: flex; flex-direction: column; align-items: flex-end; position: relative; padding-left: 50px; }

        .operation { font-size: 70px; font-weight: bold; gap: 5px; color: #2c3e50; text-align: right; }
        
        input { font-family: 'Kalam', cursive; font-size: 50px; text-align: center; border: 3px solid #ccc; border-radius: 12px; width: 75px; height: 75px; outline: none; transition: all 0.2s; background: #fafafa; }
        input:focus { border-color: var(--esparta-oro); background: #fffde7; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }
        input.correct { background: #c8e6c9 !important; border-color: var(--esparta-verde) !important; color: #1b5e20; transform: scale(1.05); }
        input.wrong { background: #ffcdd2 !important; border-color: var(--esparta-rojo) !important; animation: shake 0.3s; }

        /* Contenedor de llevada ajustado para alineación */
        .llevada-container { height: 70px; margin-bottom: 10px; display: flex; justify-content: flex-end; width: 100%; padding-right: 15px; }
        #llevada { width: 55px; height: 55px; font-size: 35px; border: 3px dashed var(--esparta-rojo); visibility: hidden; color: var(--esparta-rojo); }
        
        .linea { width: 120%; border-bottom: 6px solid #333; margin: 10px -10%; border-radius: 3px; }
        .result-row { display: flex; gap: 12px; justify-content: flex-end; width: 100%; }
        
        /* Signo X reubicado */
        .signo { position: absolute; left: 0px; top: 50%; transform: translateY(-50%); color: var(--esparta-rojo); font-family: 'Bangers'; font-size: 60px; }

        .num-row { position: relative; display: flex; justify-content: flex-end; width: 100%; }
        #num-abajo { padding-right: 10px; }

        .status-msg { margin-top: 25px; height: 40px; font-weight: bold; font-size: 28px; color: var(--esparta-verde); text-shadow: 1px 1px 0px white; text-align: center; }
        .puntos { font-family: 'Bangers'; font-size: 35px; color: #333; margin-top: 15px; display: flex; align-items: center; gap: 10px; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="header"><h1>GUERRERO ERICK: EL ASCENSO AL OLIMPO</h1></div>
    
    <div class="puntos">ESCUDOS DE ERICK: <span id="score">0</span> 🛡️</div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="game-container">
        <div class="operation-wrapper">
            <div class="llevada-container">
                <input type="number" id="llevada" placeholder="?" title="Erick, ¿cuántas te llevas?">
            </div>
            
            <div class="operation">
                <div class="num-row" id="num-arriba">--</div>
                <div class="num-row">
                    <span class="signo">x</span>
                    <span id="num-abajo">-</span>
                </div>
                <div class="linea"></div>
                <div class="result-row">
                    <input type="number" id="res-centena" class="res-in">
                    <input type="number" id="res-decena" class="res-in">
                    <input type="number" id="res-unidad" class="res-in">
                </div>
            </div>
        </div>
    </div>

    <div class="status-msg" id="msg">¡Demuestra tu fuerza, Erick!</div>

    <script>
        let n1, n2, llevadaReal, uReal, dReal, cReal;
        let score = 0;
        let goal = 10;

        const inputs = {
            llevada: document.getElementById('llevada'),
            u: document.getElementById('res-unidad'),
            d: document.getElementById('res-decena'),
            c: document.getElementById('res-centena')
        };

        const frasesAnimo = [
            "¡Impresionante, Erick!",
            "¡Eres un rayo, Erick!",
            "¡Casi lo tienes, guerrero!",
            "¡Por Esparta, Erick!",
            "¡Nadie te detiene!",
            "¡Esa mente es de oro!"
        ];

        function nuevaOperacion() {
            // Generar 2 cifras x 1 cifra
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = Math.floor(Math.random() * 8) + 2;
            
            document.getElementById('num-arriba').innerText = n1;
            document.getElementById('num-abajo').innerText = n2;

            // Calcular partes
            let uni_arriba = n1 % 10;
            let mult_u = uni_arriba * n2;
            uReal = mult_u % 10;
            llevadaReal = Math.floor(mult_u / 10);
            
            let final_total = n1 * n2;
            cReal = Math.floor(final_total / 100);
            dReal = Math.floor((final_total % 100) / 10);

            // Resetear UI
            Object.values(inputs).forEach(i => {
                i.value = '';
                i.className = '';
                i.disabled = true;
                i.style.visibility = 'visible'; // Asegurar que sean visibles
            });
            
            // Ocultar input de centenas si el resultado es < 100
            if (cReal === 0) {
                inputs.c.style.visibility = 'hidden';
            }

            inputs.llevada.style.visibility = 'hidden';
            inputs.u.disabled = false;
            inputs.u.focus();
            document.getElementById('msg').innerText = "¡A por ella, Erick!";
        }

        // Lógica de validación paso a paso
        inputs.u.oninput = function() {
            if(this.value == uReal) {
                this.classList.add('correct');
                this.disabled = true;
                if(llevadaReal > 0) {
                    inputs.llevada.style.visibility = 'visible';
                    inputs.llevada.disabled = false;
                    inputs.llevada.focus();
                    document.getElementById('msg').innerText = "¡Bien! Erick, ¿cuánto te llevas?";
                } else {
                    inputs.d.disabled = false;
                    inputs.d.focus();
                    document.getElementById('msg').innerText = "¡Llevada 0! Sigue así.";
                }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong');
                setTimeout(() => this.classList.remove('wrong'), 300);
                this.value = '';
            }
        };

        inputs.llevada.oninput = function() {
            if(this.value == llevadaReal) {
                this.classList.add('correct');
                this.disabled = true;
                inputs.d.disabled = false;
                inputs.d.focus();
                document.getElementById('msg').innerText = "¡Eso es! Ahora las decenas...";
            } else if(this.value.length >= 1) {
                this.classList.add('wrong');
                this.value = '';
            }
        };

        inputs.d.oninput = function() {
            if(this.value == dReal) {
                this.classList.add('correct');
                this.disabled = true;
                if(cReal > 0) {
                    inputs.c.disabled = false;
                    inputs.c.focus();
                } else {
                    ganar();
                }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong');
                this.value = '';
            }
        };

        inputs.c.oninput = function() {
            if(this.value == cReal) {
                this.classList.add('correct');
                this.disabled = true;
                ganar();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong');
                this.value = '';
            }
        };

        function ganar() {
            score++;
            document.getElementById('score').innerText = score;
            let frase = frasesAnimo[Math.floor(Math.random() * frasesAnimo.length)];
            document.getElementById('msg').innerText = frase;
            
            let prog = (score / goal) * 100;
            document.getElementById('progress-bar').style.width = prog + "%";
            
            if(score >= goal) {
                document.getElementById('msg').innerText = "¡ERICK, HAS CONQUISTADO EL OLIMPO!";
                // Aquí podrías añadir una animación de confeti si quisieras
                setTimeout(() => { score = 0; document.getElementById('progress-bar').style.width = "0%"; nuevaOperacion(); }, 4000);
            } else {
                setTimeout(nuevaOperacion, 1500);
            }
        }

        nuevaOperacion();
    </script>
</body>
</html>
