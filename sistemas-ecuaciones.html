<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Maestra · Lectoescritura 1º</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --esparta-green: #0e9343; 
            --gray-light: #fdfdfd;
            --border: #e2e8f0;
        }
        
        body { font-family: 'Short Stack', cursive; background-color: #fff; margin: 0; padding: 0; color: #1a1a1a; }

        .page { 
            width: 210mm; min-height: 297mm; margin: 0 auto; 
            padding: 15mm; box-sizing: border-box; background: white;
        }

        .header { text-align: center; border-bottom: 2px solid var(--esparta-green); margin-bottom: 25px; padding-bottom: 10px; }
        .header h1 { font-family: 'Kalam', cursive; color: var(--esparta-green); margin: 0; font-size: 38px; }
        .header p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }

        .section { margin-bottom: 30px; page-break-inside: avoid; }
        .section-title { 
            font-family: 'Kalam', cursive; font-size: 22px; 
            color: var(--esparta-green); border-bottom: 2px solid #f1f5f9;
            display: block; margin-bottom: 15px;
        }

        /* 1. BLOQUE SÍLABAS (LECTURA + COPIA) */
        .silabas-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            text-align: center; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
        }
        .silaba-box { padding: 12px; border: 0.5px solid var(--border); }
        .silaba-read { font-size: 32px; color: var(--esparta-green); font-weight: bold; background: #f8fafc; }
        .silaba-write { height: 55px; background: #fff; }

        /* 2. BLOQUE UNIR Y ESCRIBIR (NUEVO) */
        .matching-list { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .matching-list td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .word-to-read { font-size: 26px; font-weight: bold; width: 30%; }
        .icon-box { font-size: 35px; text-align: center; width: 15%; }
        
        .pauta-lineas { 
            height: 40px; border-bottom: 1.5px solid #64748b; 
            width: 100%; position: relative; 
        }
        .pauta-lineas::before {
            content: ""; position: absolute; top: 50%; left: 0; right: 0;
            border-top: 1px dashed #cbd5e1;
        }

        @media print {
            body { background: white; }
            .page { width: 100%; margin: 0; padding: 10mm; }
        }
    </style>
</head>
<body>

    <div class="page">
        <header class="header">
            <h1>Academia Esparta</h1>
            <p>Ficha de Trabajo · Nivel Inicial</p>
        </header>

        <section class="section">
            <span class="section-title">1. Leo las sílabas y las escribo debajo</span>
            <div class="silabas-grid">
                <div class="silaba-box silaba-read">ma</div>
                <div class="silaba-box silaba-read">me</div>
                <div class="silaba-box silaba-read">mi</div>
                <div class="silaba-box silaba-read">mo</div>
                <div class="silaba-box silaba-read">mu</div>
                
                <div class="silaba-box silaba-write"></div>
                <div class="silaba-box silaba-write"></div>
                <div class="silaba-box silaba-write"></div>
                <div class="silaba-box silaba-write"></div>
                <div class="silaba-box silaba-write"></div>
            </div>
        </section>

        <section class="section">
            <span class="section-title">2. Lee, une con el dibujo y escribe</span>
            <table class="matching-list">
                <tbody>
                    <tr>
                        <td class="word-to-read">la mula</td>
                        <td class="icon-box">🫏</td>
                        <td style="width: 50%;"><div class="pauta-lineas"></div></td>
                    </tr>
                    <tr>
                        <td class="word-to-read">el tomate</td>
                        <td class="icon-box">🍅</td>
                        <td><div class="pauta-lineas"></div></td>
                    </tr>
                    <tr>
                        <td class="word-to-read">la mesa</td>
                        <td class="icon-box">🪑</td>
                        <td><div class="pauta-lineas"></div></td>
                    </tr>
                    <tr>
                        <td class="word-to-read">la miel</td>
                        <td class="icon-box">🍯</td>
                        <td><div class="pauta-lineas"></div></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
