<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador de Fracciones · Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root { --primary: #0e9343; --danger: #d32f2f; --accent: #2980b9; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        
        .container { background: white; width: 100%; max-width: 700px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid var(--primary); }
        
        .header { text-align: center; border-bottom: 2px dashed var(--primary); margin-bottom: 25px; padding-bottom: 10px; }
        .header h1 { font-family: 'Kalam', cursive; color: var(--primary); margin: 0; font-size: 32px; }

        .setup-box { background: #f9f9f9; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .fraction-input { display: inline-block; vertical-align: middle; text-align: center; margin: 0 10px; }
        input { padding: 8px; font-size: 18px; width: 70px; text-align: center; border: 2px solid #ddd; border-radius: 8px; display: block; margin: 5px auto; }
        .divider { border-top: 2px solid #333; width: 80px; margin: 5px auto; }

        .interactive-area { min-height: 300px; padding: 25px; background: #fffcf0; border-radius: 15px; border: 1px solid #e6db55; display: none; }
        
        .explanation { font-family: 'Kalam', cursive; font-size: 22px; color: #444; margin-bottom: 20px; line-height: 1.4; border-left: 4px solid var(--primary); padding-left: 15px; }
        .math-display { font-size: 28px; text-align: center; margin: 25px 0; padding: 20px; background: white; border-radius: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); overflow-x: auto; }

        .btn-group { text-align: center; margin-top: 20px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); background: #063c24; }
        .btn-next { background: var(--accent); }

        .step-indicator { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        .highlight { color: var(--danger); font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Entrenador Espartano</h1>
        <p>Suma de Fracciones con \(x\)</p>
    </div>

    <div class="setup-box" id="setup">
        <p>Configura la operación: \(\frac{A}{B} + \frac{C}{D}\)</p>
        <div style="display: flex; justify-content: center; align-items: center;">
            <div class="fraction-input">
                <input type="text" id="num1" placeholder="x">
                <div class="divider"></div>
                <input type="number" id="den1" placeholder="4">
            </div>
            <span style="font-size: 30px;">+</span>
            <div class="fraction-input">
                <input type="text" id="num2" placeholder="2x">
                <div class="divider"></div>
                <input type="number" id="den2" placeholder="6">
            </div>
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="startStepByStep()">Iniciar Paso a Paso</button>
    </div>

    <div class="interactive-area" id="trainingArea">
        <span class="step-indicator" id="stepCounter"></span>
        <div class="explanation" id="guideText"></div>
        <div class="math-display" id="mathOutput"></div>
        
        <div class="btn-group">
            <button class="btn btn-next" id="nextBtn" onclick="processNext()">Siguiente Paso</button>
            <button class="btn" id="resetBtn" style="display:none; background: #666;" onclick="reset()">Probar otro</button>
        </div>
    </div>
</div>

<script>
    let step = 0;
    let n1, d1, n2, d2, commonDen;

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function lcm(a, b) { return (a * b) / gcd(a, b); }

    function startStepByStep() {
        n1 = document.getElementById('num1').value || 'x';
        d1 = parseInt(document.getElementById('den1').value) || 4;
        n2 = document.getElementById('num2').value || '2x';
        d2 = parseInt(document.getElementById('den2').value) || 6;
        
        commonDen = lcm(d1, d2);
        
        document.getElementById('setup').style.display = 'none';
        document.getElementById('trainingArea').style.display = 'block';
        step = 1;
        updateUI();
    }

    function updateUI() {
        const guide = document.getElementById('guideText');
        const math = document.getElementById('mathOutput');
        const counter = document.getElementById('stepCounter');
        
        counter.innerHTML = `Paso ${step} de 4`;

        switch(step) {
            case 1:
                guide.innerHTML = `Calculamos el <span class='highlight'>m.c.m.</span> de los denominadores (${d1} y ${d2}) para tener un suelo igual.`;
                math.innerHTML = `\\[ \\text{m.c.m.}(${d1}, ${d2}) = ${commonDen} \\]`;
                break;
            case 2:
                let mult1 = commonDen / d1;
                let mult2 = commonDen / d2;
                guide.innerHTML = `¡Ajustamos los de arriba! Dividimos ${commonDen} entre el de abajo y multiplicamos por el de arriba. <br> 
                                   <small>(${commonDen}÷${d1}=${mult1}) y (${commonDen}÷${d2}=${mult2})</small>`;
                math.innerHTML = `\\[ \\frac{${mult1} \\cdot (${n1})}{${commonDen}} + \frac{${mult2} \\cdot (${n2})}{${commonDen}} \\]`;
                break;
            case 3:
                guide.innerHTML = `Ahora que el suelo es el mismo, <span class='highlight'>juntamos todo</span> en una sola fracción.`;
                math.innerHTML = `\\[ \\frac{${commonDen/d1} \\cdot (${n1}) + ${commonDen/d2} \\cdot (${n2})}{${commonDen}} \\]`;
                break;
            case 4:
                guide.innerHTML = `Operamos el numerador final. ¡Victoria espartana!`;
                // Intento simple de simplificación visual
                let finalNum = `${commonDen/d1}${n1} + ${commonDen/d2}${n2}`;
                math.innerHTML = `\\[ \\frac{${finalNum}}{${commonDen}} \\]`;
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('resetBtn').style.display = 'inline-block';
                break;
        }
        MathJax.typeset();
    }

    function processNext() {
        step++;
        updateUI();
    }

    function reset() {
        document.getElementById('setup').style.display = 'block';
        document.getElementById('trainingArea').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
