<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto de Matemáticas - Academia Esparta</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #f0f4f8; padding: 20px; text-align: center; }
        .header { margin-bottom: 40px; }
        .header h1 { color: #1a2a6c; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: #b21f1f; font-weight: bold; font-size: 1.2rem; font-style: italic; }
        
        .grid-sumas { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 40px; 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .suma-box { 
            font-size: 2rem; 
            text-align: right; 
            width: 150px; 
            margin: auto; 
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        .linea { border-bottom: 3px solid #333; margin-bottom: 10px; }
        .operador { float: left; padding-left: 10px; }
        
        input[type="number"] {
            width: 100%;
            font-size: 1.8rem;
            text-align: right;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            background-color: #fffde7;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .btn-verificar {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #1a2a6c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-verificar:hover { background-color: #b21f1f; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Academia Esparta</h1>
        <p>Lara, seguro que no eres capaz de hacerlas todas bien.</p>
    </div>

    <div class="grid-sumas">
        <div id="contenedor-sumas" style="display: contents;"></div>
    </div>

    <button class="btn-verificar" onclick="verificar()">¿Habrás acertado, Lara? Ver resultados</button>

    <script>
        const ejercicios = [
            [458, 367], [279, 546], [885, 137],
            [694, 228], [537, 475], [362, 589],
            [156, 785], [429, 393], [748, 165],
            [513, 298], [674, 147], [386, 456]
        ];

        const contenedor = document.getElementById('contenedor-sumas');

        ejercicios.forEach((num, index) => {
            contenedor.innerHTML += `
                <div class="suma-box">
                    <div>${num[0]}</div>
                    <div><span class="operador">+</span>${num[1]}</div>
                    <div class="linea"></div>
                    <input type="number" id="res-${index}" placeholder="?">
                </div>
            `;
        });

        function verificar() {
            let aciertos = 0;
            ejercicios.forEach((num, index) => {
                const input = document.getElementById(`res-${index}`);
                const resultadoCorrecto = num[0] + num[1];
                if (parseInt(input.value) === resultadoCorrecto) {
                    input.style.backgroundColor = "#c8e6c9";
                    aciertos++;
                } else {
                    input.style.backgroundColor = "#ffcdd2";
                }
            });
            
            if(aciertos === 12) {
                alert("¡Increíble Lara! Las has hecho todas bien. ¡Eres una campeona!");
            } else {
                alert("Has acertado " + aciertos + " de 12. ¡Sigue intentándolo, Lara!");
            }
        }
    </script>

</body>
</html>
