<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelo Cultural - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --erik-color: #0e9343; /* Verde Esparta */
            --papa-color: #0277bd; /* Azul */
            --bg: #f4f7f6;
        }

        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--erik-color); box-sizing: border-box; }
        
        .scoreboard { display: flex; gap: 20px; margin: 20px; width: 90%; max-width: 600px; }
        .score-card { flex: 1; background: white; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-bottom: 5px solid #ccc; }
        .score-card.active-erik { border-color: var(--erik-color); transform: scale(1.05); }
        .score-card.active-papa { border-color: var(--papa-color); transform: scale(1.05); }
        .score-val { font-size: 2rem; display: block; font-weight: 700; }

        .game-container { width: 90%; max-width: 600px; background: white; border-radius: 25px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }

        .turn-badge { padding: 5px 20px; border-radius: 50px; color: white; font-weight: bold; text-transform: uppercase; margin-bottom: 1rem; display: inline-block; }
        .bg-erik { background: var(--erik-color); }
        .bg-papa { background: var(--papa-color); }

        .question-text { font-size: 1.5rem; margin: 1.5rem 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }

        .options-grid { display: grid; gap: 10px; }
        .btn-opt { background: #f8f9fa; border: 2px solid #eee; padding: 15px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-family: 'Fredoka'; transition: 0.2s; }
        .btn-opt:hover { background: #eee; }

        #feedback { margin-top: 1rem; font-weight: bold; font-size: 1.2rem; min-height: 2rem; }
        .btn-next { margin-top: 1.5rem; background: #333; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; display: none; font-family: 'Fredoka'; }
    </style>
</head>
<body>

    <header><h1 style="margin:0; color:#333;">⚔️ DUELO DE TITANES ⚔️</h1></header>

    <div class="scoreboard">
        <div id="card-erik" class="score-card active-erik">
            <span class="score-label">ERIK</span>
            <span id="score-erik" class="score-val">0</span>
        </div>
        <div id="card-papa" class="score-card">
            <span class="score-label">PAPÁ</span>
            <span id="score-papa" class="score-val">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="turn-display" class="turn-badge bg-erik">Turno de Erik</div>
        <div id="question" class="question-text">---</div>
        <div id="options" class="options-grid"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn-next" onclick="nextQuestion()">SIGUIENTE PREGUNTA →</button>
    </div>

    <script>
        const duelo = [
            { t: "erik", q: "¿Cuál es el planeta rojo?", o: ["Marte", "Júpiter", "Venus"], c: "Marte" },
            { t: "papa", q: "¿En qué año cayó el Muro de Berlín?", o: ["1985", "1989", "1991"], c: "1989" },
            { t: "erik", q: "¿Cuántos huesos tiene el cuerpo humano aproximadamente?", o: ["100", "206", "500"], c: "206" },
            { t: "papa", q: "¿Quién pintó 'La persistencia de la memoria'?", o: ["Picasso", "Dalí", "Miró"], c: "Dalí" },
            { t: "erik", q: "¿Cómo se llama el triángulo que tiene 3 lados iguales?", o: ["Isósceles", "Escaleno", "Equilátero"], c: "Equilátero" },
            { t: "papa", q: "¿Cuál es el elemento más abundante en la atmósfera terrestre?", o: ["Oxígeno", "Nitrógeno", "Hidrógeno"], c: "Nitrógeno" },
            { t: "erik", q: "¿En qué continente está el río Nilo?", o: ["Asia", "América", "África"], c: "África" },
            { t: "papa", q: "¿Cuál es el país más grande del mundo por extensión?", o: ["China", "Rusia", "Canadá"], c: "Rusia" },
            { t: "erik", q: "¿Qué animal es el más rápido del mundo en tierra?", o: ["León", "Guepardo", "Caballo"], c: "Guepardo" },
            { t: "papa", q: "¿Quién escribió 'Cien años de soledad'?", o: ["Vargas Llosa", "García Márquez", "Cervantes"], c: "García Márquez" }
        ];

        let currentIdx = 0;
        let pointsErik = 0;
        let pointsPapa = 0;

        function loadQuestion() {
            const data = duelo[currentIdx];
            const turnBadge = document.getElementById('turn-display');
            const cardErik = document.getElementById('card-erik');
            const cardPapa = document.getElementById('card-papa');

            document.getElementById('question').innerText = data.q;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = "none";

            if (data.t === "erik") {
                turnBadge.innerText = "Turno de Erik";
                turnBadge.className = "turn-badge bg-erik";
                cardErik.className = "score-card active-erik";
                cardPapa.className = "score-card";
            } else {
                turnBadge.innerText = "Turno de Papá";
                turnBadge.className = "turn-badge bg-papa";
                cardPapa.className = "score-card active-papa";
                cardErik.className = "score-card";
            }

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            data.o.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "btn-opt";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt === data.c);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const data = duelo[currentIdx];
            const feedback = document.getElementById('feedback');
            const btns = document.querySelectorAll('.btn-opt');
            
            btns.forEach(b => b.style.pointerEvents = "none");

            if (isCorrect) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                feedback.innerText = data.t === "erik" ? "¡Grande Erik! ¡Eres un genio!" : "¡Bien hecho, Papá! Aún te acuerdas...";
                feedback.style.color = "var(--erik-color)";
                if (data.t === "erik") pointsErik++; else pointsPapa++;
                updateScore();
            } else {
                feedback.innerText = data.t === "erik" ? "¡Casi, Erik! ¡A la próxima la rompes!" : "¡Ay Papá! Te estás oxidando...";
                feedback.style.color = "#ef5350";
                btn.style.background = "#ffebee";
            }
            document.getElementById('next-btn').style.display = "block";
        }

        function updateScore() {
            document.getElementById('score-erik').innerText = pointsErik;
            document.getElementById('score-papa').innerText = pointsPapa;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < duelo.length) {
                loadQuestion();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            const container = document.querySelector('.game-container');
            let winner = pointsErik > pointsPapa ? "¡ERIK ES EL CAMPEÓN!" : pointsPapa > pointsErik ? "¡PAPÁ HA GANADO!" : "¡EMPATE TÉCNICO!";
            container.innerHTML = `<h2>${winner}</h2><p>Marcador final: Erik ${pointsErik} - Papá ${pointsPapa}</p><button class="btn-next" style="display:block; margin: 20px auto;" onclick="location.reload()">REPETIR DUELO</button>`;
        }

        loadQuestion();
    </script>
</body>
</html>
