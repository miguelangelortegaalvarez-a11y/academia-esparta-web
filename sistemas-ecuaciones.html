<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik: El Camino del Guerrero - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --esparta-verde: #0e9343; --esparta-oro: #f1c40f; --esparta-rojo: #ff3333; --fondo-oscuro: #24292e; }
        
        body { font-family: 'Kalam', cursive; background: var(--fondo-oscuro); color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        /* CABECERA CON ACADEMIA ESPARTA */
        .header { background: var(--esparta-verde); width: 100%; text-align: center; padding: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: 'Bangers', cursive; position: relative; }
        .header h1 { margin: 0; font-size: 2.2em; letter-spacing: 2px; }
        .header .sub-brand { font-size: 0.5em; display: block; color: var(--esparta-oro); letter-spacing: 5px; margin-top: 5px; }

        .progress-container { width: 90%; max-width: 800px; background: #333; height: 20px; border-radius: 15px; margin: 20px 0; overflow: hidden; border: 2px solid var(--esparta-oro); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f1c40f, #ff4500); transition: width 0.5s ease; }

        .marcador { font-family:'Bangers'; font-size: 32px; margin-bottom: 10px; }

        /* ESCENARIO AJUSTADO: Erik más a la izquierda */
        .main-stage { display: flex; width: 98%; max-width: 1400px; justify-content: space-between; align-items: center; gap: 20px; margin-top: 10px; }

        @media (max-width: 850px) {
            .main-stage { flex-direction: column; }
            .character-col { width: 200px !important; }
            .game-container { width: 340px !important; }
        }

        /* MUÑECO MÁS GRANDE */
        .character-col { flex: 0 0 500px; display: flex; flex-direction: column; align-items: center; }
        .character-img { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); }
        .img-super { filter: drop-shadow(0 0 40px #ffea00); animation: pulse-super 0.8s infinite alternate; }
        @keyframes pulse-super { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* CONTENEDOR OPERACIÓN */
        .game-container { background: #fff; padding: 30px; border-radius: 25px; border: 8px solid var(--esparta-verde); color: #222; width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        
        .multiplication-table { font-size: 90px; font-weight: bold; line-height: 1; color: #2c3e50; width: 100%; border-collapse: collapse; table-layout: fixed; }
        .multiplication-table td { text-align: center; width: 100px; height: 100px; }
        .signo { color: #e74c3c; font-family: 'Bangers'; font-size: 80px; }
        .linea { border-bottom: 8px solid #333; margin: 15px 0; border-radius: 10px; }

        /* CAJAS DE RESPUESTA */
        .result-row { display: flex; justify-content: space-between; padding-top: 10px; width: 100%; }
        input { font-family: 'Kalam', cursive; font-size: 60px; text-align: center; border: 4px solid #ccc; border-radius: 15px; width: 100px; height: 110px; outline: none; background: #fff; color: #222; box-shadow: inset 0 5px 10px rgba(0,0,0,0.1); }
        input.correct { background: #c8e6c9 !important; border-color: var(--esparta-verde) !important; color: #1b5e20; }
        input.wrong { background: #ffcdd2 !important; border-color: var(--esparta-rojo) !important; animation: shake 0.3s; }

        #llevada { width: 70px; height: 70px; font-size: 40px; border: 4px dashed #e74c3c; visibility: hidden; margin: 0 auto 15px auto; color: #e74c3c; display: block; border-radius: 10px; }

        .status-msg { margin-top: 30px; font-weight: bold; font-size: 36px; text-align: center; font-family: 'Bangers'; min-height: 50px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .msg-acierto { color: var(--esparta-oro); }
        .msg-fallo { color: var(--esparta-rojo); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>ERIK: EL CAMINO DEL GUERRERO</h1>
        <span class="sub-brand">ACADEMIA ESPARTA</span>
    </div>

    <div class="marcador">ESCUDOS: <span id="score" style="color:var(--esparta-oro)">0</span></div>
    
    <div class="progress-container"><div id="progress-bar"></div></div>

    <div class="main-stage">
        <div class="character-col">
            <img src="camino-matematico/assets/warrior/warrior-idle.png.PNG" alt="Erik" class="character-img" id="hero-img">
            <div style="font-family:'Bangers'; color:var(--esparta-oro); font-size:32px; margin-top:15px;" id="hero-status">GUERRERO BASE</div>
        </div>

        <div class="game-container">
            <input type="number" id="llevada" placeholder="?">
            <table class="multiplication-table">
                <tr><td></td><td id="d-arriba">--</td><td id="u-arriba">-</td></tr>
                <tr><td class="signo">X</td><td></td><td id="num-abajo">-</td></tr>
            </table>
            <div class="linea"></div>
            <div class="result-row">
                <input type="number" id="res-centena">
                <input type="number" id="res-decena">
                <input type="number" id="res-unidad">
            </div>
        </div>
    </div>

    <div class="status-msg msg-acierto" id="msg">¡DEMUESTRA TU PODER, ERIK!</div>

    <script>
        let n1, n2, llevadaReal, uReal, dReal, cReal;
        let score = 0;
        const goal = 10;
        const imagenes = {
            base: 'camino-matematico/assets/warrior/warrior-idle.png.PNG',
            sad: 'camino-matematico/assets/warrior/warrior-sad.png.PNG',
            super: 'camino-matematico/assets/warrior/warrior-power.png.PNG'
        };
        const frasesFallo = [
            "¡Erik, eres un manta!", "¡Erik, eres más malo que el Barça!",
            "¡Menudo paquete, Erik!", "¡Espabila, Guerrero!"
        ];

        const inputs = {
            llevada: document.getElementById('llevada'),
            u: document.getElementById('res-unidad'),
            d: document.getElementById('res-decena'),
            c: document.getElementById('res-centena')
        };

        function nuevaOperacion() {
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = Math.floor(Math.random() * 8) + 2;
            document.getElementById('d-arriba').innerText = Math.floor(n1 / 10);
            document.getElementById('u-arriba').innerText = n1 % 10;
            document.getElementById('num-abajo').innerText = n2;
            uReal = (n1 % 10 * n2) % 10;
            llevadaReal = Math.floor((n1 % 10 * n2) / 10);
            let total = n1 * n2;
            cReal = Math.floor(total / 100);
            dReal = Math.floor((total % 100) / 10);
            
            Object.values(inputs).forEach(i => {
                i.value = ''; i.className = ''; i.disabled = true; i.style.visibility = 'visible';
            });
            if (cReal === 0) inputs.c.style.visibility = 'hidden';
            inputs.llevada.style.visibility = 'hidden';
            inputs.u.disabled = false;
            inputs.u.focus();
        }

        function manejarError() {
            document.getElementById('hero-img').src = imagenes.sad;
            const msg = document.getElementById('msg');
            msg.innerText = frasesFallo[Math.floor(Math.random() * frasesFallo.length)];
            msg.className = "status-msg msg-fallo";
            setTimeout(() => {
                document.getElementById('hero-img').src = imagenes.base;
                msg.className = "status-msg msg-acierto";
                msg.innerText = "¡CONCÉNTRATE, ERIK!";
            }, 3000);
        }

        function manejarAciertoFinal() {
            document.getElementById('hero-img').src = imagenes.super;
            document.getElementById('hero-img').classList.add('img-super');
            document.getElementById('hero-status').innerText = "¡SUPER ERIK! 🔥";
            document.getElementById('msg').innerText = "¡IMPRESIONANTE, ERIK!";
            score++;
            document.getElementById('score').innerText = score;
            document.getElementById('progress-bar').style.width = (score / goal) * 100 + "%";
            if(score >= goal) confetti();
            setTimeout(() => {
                document.getElementById('hero-img').classList.remove('img-super');
                document.getElementById('hero-img').src = imagenes.base;
                document.getElementById('hero-status').innerText = "GUERRERO BASE";
                nuevaOperacion();
            }, 3000);
        }

        function verificarVictoria() {
            const centenaOk = (cReal === 0) || (inputs.c.value == cReal && inputs.c.classList.contains('correct'));
            const decenaOk = (inputs.d.value == dReal && inputs.d.classList.contains('correct'));
            if (centenaOk && decenaOk) manejarAciertoFinal();
        }

        inputs.u.oninput = function() {
            if(this.value == uReal) {
                this.classList.add('correct'); this.disabled = true;
                if(llevadaReal > 0) {
                    inputs.llevada.style.visibility = 'visible';
                    inputs.llevada.disabled = false; inputs.llevada.focus();
                } else {
                    if(cReal > 0) { inputs.c.disabled = false; inputs.c.focus(); }
                    else { inputs.d.disabled = false; inputs.d.focus(); }
                }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.llevada.oninput = function() {
            if(this.value == llevadaReal) {
                this.classList.add('correct'); this.disabled = true;
                if(cReal > 0) { inputs.c.disabled = false; inputs.c.focus(); }
                else { inputs.d.disabled = false; inputs.d.focus(); }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.c.oninput = function() {
            if(this.value == cReal) {
                this.classList.add('correct'); this.disabled = true;
                inputs.d.disabled = false; inputs.d.focus();
                verificarVictoria();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.d.oninput = function() {
            if(this.value == dReal) {
                this.classList.add('correct'); this.disabled = true;
                verificarVictoria();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        nuevaOperacion();
    </script>
</body>
</html>
