<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Esparta: Reto de Matemáticas 2º Primaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #2E7D32;
            --secondary: #FF9800; /* Naranja para resaltar dinero */
            --bg: #fdfdfd;
            --wrong: #f44336;
            --guia: #e3f2fd;
            --guia-text: #1976d2;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .academia-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }

        .academia-header h1 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .academia-header p {
            color: #555;
            font-weight: 600;
            margin: 5px 0;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .problema-box {
            background-color: var(--guia);
            color: var(--guia-text);
            padding: 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 2px solid #bbdefb;
            line-height: 1.6;
        }

        .price-tag {
            display: inline-block;
            background: var(--secondary);
            color: white;
            padding: 2px 10px;
            border-radius: 8px;
            font-weight: 700;
        }

        /* DISEÑO DE LA RESTA VERTICAL */
        .resta-vertical {
            font-family: 'Roboto Mono', monospace;
            font-size: 3rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: fit-content;
            margin: 20px auto;
            position: relative;
            padding-right: 20px;
        }

        .linea-resta {
            border-top: 5px solid #333;
            width: 140%;
            margin-top: 5px;
            position: relative;
        }

        .signo-menos {
            position: absolute;
            left: -50px;
            top: 50px;
            color: var(--wrong);
        }

        .llevada-input {
            width: 1.2ch;
            font-size: 1.2rem;
            border: 2px solid #ffcdd2;
            border-radius: 50%;
            text-align: center;
            position: absolute;
            background: #fff;
            color: var(--wrong);
            outline: none;
        }

        /* Posiciones de las llevadas */
        #llevada-uni { top: -20px; right: 10px; }
        #llevada-dec { top: -20px; right: 55px; }

        .math-input {
            font-family: 'Roboto Mono', monospace;
            font-size: 2.8rem;
            width: 1.2ch;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin: 5px;
            outline: none;
            transition: 0.3s;
        }

        .math-input.correct {
            border-color: var(--primary);
            background-color: #e8f5e9;
            color: var(--primary-dark);
        }

        .math-input.wrong {
            border-color: var(--wrong);
            background-color: #ffebee;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-next {
            display: none;
            margin: 20px auto 0;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .label-moneda {
            font-size: 1.5rem;
            color: #888;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="academia-header">
        <h1>ACADEMIA ESPARTA</h1>
        <p>Reto: El Supermercado de Alba (2º Primaria)</p>
    </div>

    <div class="container">
        <div id="problema" class="problema-box">
            Alba tiene <span class="price-tag">85 €</span> para comprar un regalo. 
            Si el regalo cuesta <span class="price-tag">47 €</span>, 
            ¿cuántos euros le sobran?
        </div>

        <div class="resta-vertical">
            <input type="text" id="llevada-uni" class="llevada-input" maxlength="1" placeholder="º">
            
            <div style="letter-spacing: 15px;">
                85<span class="label-moneda">€</span>
            </div>
            <div style="letter-spacing: 15px;">
                <span class="signo-menos">−</span>
                47<span class="label-moneda">€</span>
            </div>
            <div class="linea-resta"></div>
            
            <div style="display: flex; justify-content: flex-end;">
                <input type="text" id="res-dec" class="math-input" maxlength="1" autocomplete="off">
                <input type="text" id="res-uni" class="math-input" maxlength="1" autocomplete="off">
                <span class="label-moneda" style="line-height: 80px;">€</span>
            </div>
        </div>

        <button id="next-btn" class="btn-next" onclick="nextLevel()">¡Siguiente Problema! →</button>
    </div>

    <script>
        const levels = [
            {
                text: 'Alba tiene <span class="price-tag">85 €</span>. Compra un libro que cuesta <span class="price-tag">47 €</span>. ¿Cuánto dinero le queda?',
                num1: '85',
                num2: '47',
                ansUni: '8',
                ansDec: '3',
                llevada: '1'
            },
            {
                text: 'Alba va con <span class="price-tag">92 €</span>. Compra una mochila de <span class="price-tag">54 €</span>. ¿Cuánto le sobra?',
                num1: '92',
                num2: '54',
                ansUni: '8',
                ansDec: '3',
                llevada: '1'
            }
        ];

        let currentLevel = 0;

        function check() {
            const u = document.getElementById('res-uni');
            const d = document.getElementById('res-dec');
            const l = document.getElementById('llevada-uni');
            const level = levels[currentLevel];

            // Verificamos paso a paso como en la escuela
            if (u.value === level.ansUni && d.value === level.ansDec) {
                u.classList.add('correct');
                d.classList.add('correct');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('next-btn').style.display = 'block';
            } else {
                if (u.value !== '' && u.value !== level.ansUni) u.classList.add('wrong');
                if (d.value !== '' && d.value !== level.ansDec) d.classList.add('wrong');
                setTimeout(() => {
                    u.classList.remove('wrong');
                    d.classList.remove('wrong');
                }, 500);
            }
        }

        document.getElementById('res-uni').addEventListener('keyup', (e) => {
            if(e.key === 'Enter') document.getElementById('res-dec').focus();
        });

        document.getElementById('res-dec').addEventListener('keyup', (e) => {
            if(e.key === 'Enter') check();
        });

        function nextLevel() {
            alert("¡Perfecto! Has distinguido muy bien los euros y has resuelto la resta con llevada. ¡Sigue así!");
            location.reload(); // Para este ejemplo recargamos, pero aquí podrías cambiar los datos dinámicamente.
        }
    </script>
</body>
</html>
