<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectura Inicial · Academia Esparta</title>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0e9343;
      --danger: #d32f2f;
      --border: #b9dec4;
      --font-profesor: 'Kalam', cursive;
      --font-ninos: 'Short Stack', cursive;
    }

    body { 
      margin: 0; padding: 0; background: #fff; 
      font-family: var(--font-ninos); color: #333; 
    }

    .page {
      width: 210mm; min-height: 297mm; margin: 0 auto;
      padding: 15mm; box-sizing: border-box;
    }

    .header-esparta { text-align: center; margin-bottom: 20px; }
    .academy-tag { font-size: 10px; color: #aaa; letter-spacing: 3px; }
    
    .main-title { 
        font-family: var(--font-profesor); 
        font-size: 45px; color: var(--danger); margin: 5px 0;
    }

    .info-nino { 
        display: flex; gap: 20px; margin-bottom: 30px; 
        font-family: var(--font-profesor); font-size: 22px;
    }
    .linea { flex: 1; border-bottom: 2px dashed #ccc; height: 25px; }

    .bloque {
      border: 3px solid var(--border); border-radius: 20px;
      padding: 20px; margin-bottom: 20px; page-break-inside: avoid;
    }

    .titulo-bloque {
      font-family: var(--font-profesor);
      color: var(--primary); font-size: 26px; font-weight: 700; 
      margin-bottom: 15px; display: block;
    }

    /* LECTURA MUY GRANDE */
    .lectura-facil { 
        font-size: 34px; line-height: 1.8; text-align: center; 
        background: #fdfdfd; padding: 10px;
    }

    /* UNIR DIBUJOS (Simulado con emojis para n8n) */
    .unir-container { display: flex; justify-content: space-between; padding: 10px 40px; }
    .columna { display: flex; flex-direction: column; gap: 30px; font-size: 30px; }

    .pregunta-corta { font-size: 24px; margin-bottom: 20px; }
    .hueco-escribir { border-bottom: 2px solid #eee; height: 40px; width: 100%; display: block; }

    .cuadro-dibujo { 
        width: 100%; height: 200px; border: 3px dashed #ddd; 
        border-radius: 20px; background: #fafafa; margin-top: 10px;
    }

    @media print {
      .page { margin: 0; }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="header-esparta">
      <div class="academy-tag">ACADEMIA ESPARTA</div>
      <h1 class="main-title">Leo y Dibujo</h1>
    </header>

    <div class="info-nino">
      <span>Mi nombre:</span> <div class="linea"></div>
    </div>

    <section class="bloque">
      <span class="titulo-bloque">1. Lee despacio</span>
      <div class="lectura-facil">
        La osa <b>Susi</b> sale a la loma. <br>
        Susi toma la <b>miel</b>. <br>
        La miel es <b>rica</b>.
      </div>
    </section>

    <section class="bloque">
      <span class="titulo-bloque">2. Une con una línea</span>
      <div class="unir-container">
        <div class="columna">
          <span>🍯</span>
          <span>🐻</span>
        </div>
        <div class="columna">
          <span>Osa</span>
          <span>Miel</span>
        </div>
      </div>
    </section>

    <section class="bloque">
      <span class="titulo-bloque">3. ¿Es verdad?</span>
      <div style="font-size: 24px; display: flex; justify-content: space-between; align-items: center;">
        <span>¿Susi es una osa?</span>
        <div style="display:flex; gap:15px;">SÍ [ ] NO [ ]</div>
      </div>
    </section>

    <section class="bloque">
      <span class="titulo-bloque">4. Haz un dibujo bonito</span>
      <p style="font-size: 20px; margin: 0;">Dibuja a la osa Susi comiendo miel:</p>
      <div class="cuadro-dibujo"></div>
    </section>
  </div>

</body>
</html>
