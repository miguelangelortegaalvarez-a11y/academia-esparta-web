<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letra B - Lectura Inicial</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --esparta-green: #0e9343; 
            --soft-gray: #f9f9f9;
            --border-color: #d1e7dd;
        }
        
        body { 
            font-family: 'Short Stack', cursive; 
            background-color: #fff; 
            margin: 0; padding: 0; 
            color: #333;
        }

        .btn-imprimir {
            display: block;
            width: fit-content;
            margin: 20px auto;
            background-color: var(--esparta-green);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Short Stack', cursive;
        }

        .page { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0 auto; 
            padding: 20mm; 
            box-sizing: border-box;
            background: white;
            border: 1px solid #eee;
        }

        .header { 
            text-align: center; 
            border-bottom: 2px solid var(--esparta-green); 
            margin-bottom: 30px; 
            padding-bottom: 10px;
        }
        .header h1 { 
            font-family: 'Kalam', cursive; 
            color: var(--esparta-green); 
            margin: 0; 
            font-size: 40px;
        }

        .student-data { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            font-family: 'Kalam', cursive; 
            font-size: 20px;
        }
        .field { flex: 1; border-bottom: 1px dashed #999; height: 30px; }

        .section { margin-bottom: 35px; page-break-inside: avoid; }
        .section-title { 
            font-family: 'Kalam', cursive; 
            font-size: 24px; 
            color: var(--esparta-green); 
            border-bottom: 2px solid var(--border-color);
            display: block;
            margin-bottom: 20px;
        }

        /* 1. Sílabas y Copia */
        .silabas-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            text-align: center; 
            margin-top: 10px;
            border: 2px solid #eee;
            border-radius: 15px;
            overflow: hidden;
        }
        .silaba-item { padding: 15px; border: 1px solid #eee; }
        .silaba-top { font-size: 35px; color: var(--esparta-green); font-weight: bold; background: var(--soft-gray); }
        .silaba-bottom { height: 70px; background: #fff; }

        /* 2. Tabla de Palabras y Dibujo */
        .tabla-lectura { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .tabla-lectura th { 
            font-family: 'Kalam', cursive; 
            background: var(--soft-gray); 
            padding: 10px; 
            border: 1px solid #eee;
            color: var(--esparta-green);
        }
        .tabla-lectura td { 
            border: 1px solid #eee; 
            padding: 20px; 
            vertical-align: middle; 
        }

        .col-palabra { font-size: 28px; text-align: center; font-weight: bold; width: 25%; }
        
        .pauta-caligrafia { 
            height: 45px; 
            border-bottom: 1px solid #ccc; 
            position: relative; 
            width: 100%;
        }
        .pauta-caligrafia::before {
            content: "";
            position: absolute;
            top: 50%; left: 0; right: 0;
            border-top: 1px dashed #e0e0e0;
        }

        .cuadro-dibujo { 
            width: 80px; height: 80px; 
            border: 2px dashed #ccc; 
            border-radius: 10px; 
            margin: auto; 
        }

        @media print {
            body { background: white; padding: 0; }
            .btn-imprimir { display: none; }
            .page { width: 100%; margin: 0; border: none; padding: 15mm; }
        }
    </style>
</head>
<body>

    <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir Ficha Letra B</button>

    <div class="page">
        <header class="header">
            <h1>ACADEMIA ESPARTA</h1>
            <p>Aprendo la letra B b</p>
        </header>

        <div class="student-data">
            <span>Nombre:</span> <div class="field"></div>
            <span>Fecha:</span> <div class="field" style="max-width: 150px;"></div>
        </div>

        <section class="section">
            <span class="section-title">1. Leo las sílabas y las escribo debajo</span>
            <div class="silabas-grid">
                <div class="silaba-item silaba-top">ba</div>
                <div class="silaba-item silaba-top">be</div>
                <div class="silaba-item silaba-top">bi</div>
                <div class="silaba-item silaba-top">bo</div>
                <div class="silaba-item silaba-top">bu</div>
                
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
            </div>
        </section>

        <section class="section">
            <span class="section-title">2. Leo, escribo y dibujo</span>
            <table class="tabla-lectura">
                <thead>
                    <tr>
                        <th>Palabra</th>
                        <th>Copia con cuidado</th>
                        <th>Dibujo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-palabra">bota</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">bebé</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">bata</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">lobo</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div style="text-align: center; font-family: 'Kalam', cursive; color: #888; margin-top: 20px;">
            ¡Muy bien! Sigue practicando para leer cada día mejor.
        </div>
    </div>

</body>
</html>
