<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Erik: El Guerrero Móvil - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --esparta-verde: #0e9343; --esparta-oro: #f1c40f; --esparta-rojo: #ff3333; }
        
        body { font-family: 'Kalam', cursive; background: #1a1a1a; color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; touch-action: manipulation; }
        
        .header { background: var(--esparta-verde); width: 100%; text-align: center; padding: 10px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: 'Bangers', cursive; font-size: 14px; }
        .progress-container { width: 90%; background: #333; height: 15px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 2px solid var(--esparta-oro); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f1c40f, #ff4500); transition: width 0.5s ease; }

        .marcador { font-family:'Bangers'; font-size: 24px; margin-bottom: 5px; }

        /* ESCENARIO ADAPTATIVO */
        .main-stage { display: flex; width: 95%; max-width: 1100px; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }

        .character-col { flex: 0 0 300px; display: flex; flex-direction: column; align-items: center; }
        .character-img { width: 250px; height: auto; transition: 0.3s; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        
        @media (max-width: 600px) {
            .character-col { flex: 0 0 100%; order: 1; }
            .character-img { width: 180px; }
            .game-container { order: 2; transform: scale(0.9); }
            .status-msg { order: 3; font-size: 28px !important; }
        }

        .img-super { filter: drop-shadow(0 0 30px #ffea00); animation: pulse-super 0.8s infinite alternate; }
        @keyframes pulse-super { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* CUADRO OPERACIÓN */
        .game-container { background: #fff; padding: 20px; border-radius: 20px; border: 5px solid var(--esparta-verde); color: #222; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .multiplication-table { font-size: 60px; font-weight: bold; width: 100%; border-collapse: collapse; }
        .multiplication-table td { text-align: center; width: 70px; height: 70px; }
        .signo { color: #e74c3c; font-family: 'Bangers'; font-size: 60px; }
        .linea { border-bottom: 6px solid #333; margin: 10px 0; }

        .result-row { display: flex; gap: 10px; justify-content: center; }
        
        /* INPUTS OPTIMIZADOS PARA MÓVIL */
        input { font-family: 'Kalam', cursive; font-size: 40px; text-align: center; border: 3px solid #ccc; border-radius: 10px; width: 70px; height: 70px; outline: none; background: #fff; color: #222; -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        input.correct { background: #c8e6c9 !important; border-color: var(--esparta-verde) !important; color: #1b5e20; }
        input.wrong { background: #ffcdd2 !important; border-color: var(--esparta-rojo) !important; animation: shake 0.3s; }

        #llevada { width: 50px; height: 50px; font-size: 28px; border: 3px dashed #e74c3c; visibility: hidden; margin: 0 auto 10px auto; color: #e74c3c; display: block; }

        .status-msg { margin-top: 20px; font-weight: bold; font-size: 32px; text-align: center; font-family: 'Bangers'; min-height: 45px; }
        .msg-acierto { color: var(--esparta-oro); }
        .msg-fallo { color: var(--esparta-rojo); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body>

    <div class="header"><h1>GUERRERO ERIK: CAMINO AL OLIMPO</h1></div>
    
    <div class="marcador">ESCUDOS: <span id="score" style="color:var(--esparta-oro)">0</span></div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="main-stage">
        <div class="character-col">
            <img src="camino-matematico/assets/warrior/warrior-idle.png.PNG" alt="Erik" class="character-img" id="hero-img">
            <div style="font-family:'Bangers'; color:var(--esparta-oro); font-size:24px; margin-top:10px;">ESTADO: <span id="hero-status">Guerrero</span></div>
        </div>

        <div class="game-container">
            <input type="tel" id="llevada" placeholder="?" pattern="[0-9]*">
            <table class="multiplication-table">
                <tr>
                    <td></td>
                    <td id="d-arriba">--</td>
                    <td id="u-arriba">-</td>
                </tr>
                <tr>
                    <td class="signo">X</td>
                    <td></td>
                    <td id="num-abajo">-</td>
                </tr>
            </table>
            <div class="linea"></div>
            <div class="result-row">
                <input type="tel" id="res-centena" pattern="[0-9]*">
                <input type="tel" id="res-decena" pattern="[0-9]*">
                <input type="tel" id="res-unidad" pattern="[0-9]*">
            </div>
        </div>
    </div>

    <div class="status-msg msg-acierto" id="msg">¡DEMUESTRA TU FUERZA, ERIK!</div>

    <script>
        let n1, n2, llevadaReal, uReal, dReal, cReal;
        let score = 0;
        const goal = 10;

        const imagenes = {
            base: 'camino-matematico/assets/warrior/warrior-idle.png.PNG',
            sad: 'camino-matematico/assets/warrior/warrior-sad.png.PNG',
            super: 'camino-matematico/assets/warrior/warrior-power.png.PNG'
        };

        const frasesFallo = [
            "¡Erik, eres un manta!",
            "¡Erik, eres más malo que el Barça!",
            "¡Menudo paquete eres, Erik!",
            "¡Erik, espabila!",
            "¡Vaya churro, Erik!"
        ];

        const inputs = {
            llevada: document.getElementById('llevada'),
            u: document.getElementById('res-unidad'),
            d: document.getElementById('res-decena'),
            c: document.getElementById('res-centena')
        };

        const heroImg = document.getElementById('hero-img');
        const heroStatus = document.getElementById('hero-status');
        const mainMsg = document.getElementById('msg');

        function nuevaOperacion() {
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = Math.floor(Math.random() * 8) + 2;
            
            document.getElementById('d-arriba').innerText = Math.floor(n1 / 10);
            document.getElementById('u-arriba').innerText = n1 % 10;
            document.getElementById('num-abajo').innerText = n2;

            uReal = (n1 % 10 * n2) % 10;
            llevadaReal = Math.floor((n1 % 10 * n2) / 10);
            let total = n1 * n2;
            cReal = Math.floor(total / 100);
            dReal = Math.floor((total % 100) / 10);

            Object.values(inputs).forEach(i => {
                i.value = ''; i.className = ''; i.disabled = true; i.style.visibility = 'visible';
            });
            
            if (cReal === 0) inputs.c.style.visibility = 'hidden';
            inputs.llevada.style.visibility = 'hidden';
            inputs.u.disabled = false;
            inputs.u.focus();
        }

        function volverNormal() {
            heroImg.src = imagenes.base;
            heroImg.classList.remove('img-super');
            heroStatus.innerText = "Guerrero";
            mainMsg.className = "status-msg msg-acierto";
            mainMsg.innerText = "¡DALE CAÑA, ERIK!";
        }

        function manejarError() {
            heroImg.src = imagenes.sad;
            heroStatus.innerText = "¡ESTADO: MANTA!";
            mainMsg.innerText = frasesFallo[Math.floor(Math.random() * frasesFallo.length)];
            mainMsg.className = "status-msg msg-fallo";
            setTimeout(volverNormal, 3000);
        }

        function manejarAciertoFinal() {
            heroImg.src = imagenes.super;
            heroImg.classList.add('img-super');
            heroStatus.innerText = "¡SUPER ERIK! 🔥";
            mainMsg.innerText = "¡ERIK IMPRESIONANTE!";
            mainMsg.className = "status-msg msg-acierto";
            
            score++;
            document.getElementById('score').innerText = score;
            document.getElementById('progress-bar').style.width = (score / goal) * 100 + "%";

            if(score >= goal) {
                confetti({ particleCount: 100, spread: 60, origin: { y: 0.8 } });
                setTimeout(() => { score = 0; document.getElementById('progress-bar').style.width = "0%"; }, 4000);
            }

            setTimeout(() => {
                volverNormal();
                nuevaOperacion();
            }, 3000);
        }

        inputs.u.oninput = function() {
            if(this.value == uReal) {
                this.classList.add('correct'); this.disabled = true;
                if(llevadaReal > 0) {
                    inputs.llevada.style.visibility = 'visible';
                    inputs.llevada.disabled = false; inputs.llevada.focus();
                } else {
                    inputs.d.disabled = false;
                    if(cReal > 0) inputs.c.disabled = false;
                }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.llevada.oninput = function() {
            if(this.value == llevadaReal) {
                this.classList.add('correct'); this.disabled = true;
                inputs.d.disabled = false;
                if(cReal > 0) inputs.c.disabled = false;
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.d.oninput = function() {
            if(this.value == dReal) {
                this.classList.add('correct'); this.disabled = true;
                if(cReal === 0 || (inputs.c.value == cReal && inputs.c.classList.contains('correct'))) manejarAciertoFinal();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        inputs.c.oninput = function() {
            if(this.value == cReal) {
                this.classList.add('correct'); this.disabled = true;
                if(inputs.d.value == dReal && inputs.d.classList.contains('correct')) manejarAciertoFinal();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        nuevaOperacion();
    </script>
</body>
</html>
