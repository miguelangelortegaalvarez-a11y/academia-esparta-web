<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprende las Letras · Academia Esparta</title>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0e9343;
      --danger: #d32f2f;
      --border: #b9dec4;
      --font-profesor: 'Kalam', cursive;
      --font-ninos: 'Short Stack', cursive;
    }

    body { margin: 0; padding: 0; background: #fff; font-family: var(--font-ninos); color: #333; }
    .page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 15mm; box-sizing: border-box; }
    
    .header-letra { 
        text-align: center; margin-bottom: 20px; border: 4px dashed var(--primary);
        border-radius: 20px; padding: 10px;
    }
    .letra-protagonista { 
        font-family: var(--font-profesor); font-size: 80px; 
        color: var(--danger); line-height: 1; margin: 0;
    }
    
    .main-title { font-family: var(--font-profesor); font-size: 30px; color: var(--primary); margin: 5px 0; }
    .linea-nombre { display: flex; gap: 10px; margin-bottom: 30px; font-family: var(--font-profesor); font-size: 22px; }
    .hueco { flex: 1; border-bottom: 2px solid #ccc; }

    .bloque { border: 3px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .titulo-bloque { font-family: var(--font-profesor); color: var(--primary); font-size: 24px; margin-bottom: 15px; display: block; }

    /* LECTURA CON LETRA RESALTADA */
    .lectura-silabica { font-size: 36px; line-height: 1.8; text-align: center; }
    .resaltar { color: var(--danger); font-weight: bold; text-decoration: underline; }

    .grid-silabas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; text-align: center; margin-top: 10px; }
    .silaba-box { border: 2px solid #eee; border-radius: 10px; padding: 10px; font-size: 30px; background: #fafafa; }

    .box-dibujo { width: 100%; height: 180px; border: 3px dashed #ddd; border-radius: 20px; margin-top: 10px; }

    @media print { .page { margin: 0; } .btn-print { display: none; } }
  </style>
</head>
<body>

  <div class="page">
    <header class="header-letra">
      <div class="letra-protagonista">M m</div>
      <h1 class="main-title">La letra de Mamá</h1>
    </header>

    <div class="linea-nombre">
      <span>Mi nombre:</span> <div class="hueco"></div>
    </div>

    <section class="bloque">
      <span class="titulo-bloque">1. Lee las sílabas</span>
      <div class="grid-silabas">
        <div class="silaba-box">ma</div>
        <div class="silaba-box">me</div>
        <div class="silaba-box">mi</div>
        <div class="silaba-box">mo</div>
        <div class="silaba-box">mu</div>
      </div>
    </section>

    <section class="bloque">
      <span class="titulo-bloque">2. Leo mis primeras palabras</span>
      <div class="lectura-silabica">
        <span class="resaltar">M</span>i <span class="resaltar">m</span>a<span class="resaltar">m</span>á <span class="resaltar">m</span>e a<span class="resaltar">m</span>a. <br>
        A<span class="resaltar">m</span>o a <span class="resaltar">m</span>i <span class="resaltar">m</span>a<span class="resaltar">m</span>á. <br>
        <span class="resaltar">M</span>i<span class="resaltar">m</span>í <span class="resaltar">m</span>e <span class="resaltar">m</span>i<span class="resaltar">m</span>a.
      </div>
    </section>

    <section class="bloque">
      <span class="titulo-bloque">3. Escribe y dibuja</span>
      <div style="display: flex; justify-content: space-around; align-items: center; font-size: 24px;">
        <div style="text-align: center;">
            <span>Miel</span>
            <div style="width:100px; height:100px; border:1px solid #ccc; margin-top:5px;"></div>
        </div>
        <div style="text-align: center;">
            <span>Mesa</span>
            <div style="width:100px; height:100px; border:1px solid #ccc; margin-top:5px;"></div>
        </div>
        <div style="text-align: center;">
            <span>Mano</span>
            <div style="width:100px; height:100px; border:1px solid #ccc; margin-top:5px;"></div>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
