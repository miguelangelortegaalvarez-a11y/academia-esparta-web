<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Matemático - Academia Esparta</title>
    <style>
        /* Fondo totalmente blanco */
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 40px 20px; 
            text-align: center; 
            color: #000000;
        }

        /* Cabecera simple sin colores */
        .header { margin-bottom: 50px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .header p { font-size: 1.2rem; font-weight: bold; font-style: italic; margin-top: 0; }
        
        /* Rejilla de sumas */
        .grid-sumas { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 50px 20px; 
            max-width: 800px; 
            margin: auto; 
            padding: 0;
        }

        /* Estilo clásico de la operación vertical */
        .suma-box { 
            font-size: 2.2rem; 
            text-align: right; 
            width: 140px; 
            margin: auto; 
            letter-spacing: 2px;
        }

        .operando { padding-right: 5px; }
        
        /* Línea de suma simple */
        .linea { border-bottom: 3px solid #000000; margin-top: 5px; margin-bottom: 10px; }
        
        .signo { float: left; padding-left: 5px; }
        
        /* Línea simple para escribir (sin cuadrado) */
        .resultado-linea {
            width: 100%;
            height: 40px;
            border: none;
            border-bottom: 2px solid #000000; /* Solo línea inferior */
            background: transparent;
            font-family: inherit;
            font-size: 2.2rem;
            text-align: right;
            outline: none; /* Quita el borde azul al pulsar */
            padding: 0;
            color: #000000;
        }

        /* Elimina las flechas en inputs de número */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Botón invisible o muy discreto para verificar (opcional si lo quieres quitar) */
        .btn-check {
            margin-top: 60px;
            background: none;
            border: 1px solid #000;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }
        .btn-check:hover { background-color: #f0f0f0; }

    </style>
</head>
<body>

    <div class="header">
        <h1>Academia Esparta</h1>
        <p>Lara, seguro que no eres capaz de hacerlas todas bien.</p>
    </div>

    <div class="grid-sumas">
        <script>
            const ejercicios = [
                [458, 367], [279, 546], [885, 137],
                [694, 228], [537, 475], [362, 589],
                [156, 785], [429, 393], [748, 165],
                [513, 298], [674, 147], [386, 456]
            ];

            ejercicios.forEach((num, index) => {
                document.write(`
                    <div class="suma-box">
                        <div class="operando">${num[0]}</div>
                        <div class="operando"><span class="signo">+</span>${num[1]}</div>
                        <div class="linea"></div>
                        <input type="number" class="resultado-linea" id="res-${index}">
                    </div>
                `);
            });
        </script>
    </div>

    <button class="btn-check" onclick="verificar()">Verificar resultados</button>

    <script>
        function verificar() {
            let aciertos = 0;
            let completado = true;
            ejercicios.forEach((num, index) => {
                const input = document.getElementById(`res-${index}`);
                const valor = input.value;
                if(valor === "") completado = false;
                
                const resultadoCorrecto = num[0] + num[1];
                
                // Mantiene el minimalismo: solo cambia el color de la línea si falla o acierta
                if (parseInt(valor) === resultadoCorrecto) {
                    input.style.borderBottomColor = "#2ecc71"; // Verde discreto en la línea
                    aciertos++;
                } else if (valor !== "") {
                    input.style.borderBottomColor = "#e74c3c"; // Rojo discreto en la línea
                } else {
                    input.style.borderBottomColor = "#000000"; // Negro si está vacío
                }
            });
            
            if(!completado) {
                alert("Lara, te faltan sumas por terminar.");
                return;
            }

            if(aciertos === 12) {
                alert("¡Increíble Lara! Las 12 perfectas. ¡Eres una campeona!");
            } else {
                alert("Has acertado " + aciertos + " de 12. ¡Revisa las que tienen la línea roja!");
            }
        }
    </script>

</body>
</html>
