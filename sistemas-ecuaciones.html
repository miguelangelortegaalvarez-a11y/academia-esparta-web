<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador de Identidades Notables · Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root { --primary: #0e9343; --danger: #d32f2f; --accent: #2980b9; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f1; display: flex; justify-content: center; padding: 20px; }
        
        .container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid var(--primary); }
        
        .header { text-align: center; border-bottom: 2px dashed var(--primary); margin-bottom: 25px; padding-bottom: 10px; }
        .header h1 { font-family: 'Kalam', cursive; color: var(--primary); margin: 0; font-size: 32px; }

        .setup-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        input { padding: 10px; font-size: 18px; width: 60px; text-align: center; border: 2px solid #ddd; border-radius: 8px; }
        
        .interactive-area { min-height: 200px; padding: 20px; background: #fffcf0; border-radius: 15px; border: 1px solid #e6db55; margin-top: 20px; display: none; }
        
        .explanation { font-family: 'Kalam', cursive; font-size: 20px; color: #444; margin-bottom: 15px; line-height: 1.4; }
        .math-display { font-size: 24px; text-align: center; margin: 20px 0; padding: 10px; background: white; border-radius: 10px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { transform: scale(1.05); background: #063c24; }
        .btn-next { background: var(--accent); }

        .highlight { color: var(--danger); font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Entrenador Espartano</h1>
        <p>Identidades Notables: \((a + b)^2\)</p>
    </div>

    <div class="setup-box" id="setup">
        <p>Introduce los valores para \((a + b)^2\)</p>
        <div style="font-size: 22px;">
            ( <input type="text" id="valA" placeholder="x"> + <input type="text" id="valB" placeholder="3"> )²
        </div>
        <button class="btn" onclick="startTraining()">¡Empezar Entrenamiento!</button>
    </div>

    <div class="interactive-area" id="trainingArea">
        <div class="explanation" id="guideText"></div>
        <div class="math-display" id="mathOutput"></div>
        <button class="btn btn-next" id="nextBtn" onclick="nextStep()">Siguiente Paso</button>
        <button class="btn" id="resetBtn" style="display:none; background: #666;" onclick="reset()">Reiniciar</button>
    </div>
</div>

<script>
    let step = 0;
    let a, b;

    function startTraining() {
        a = document.getElementById('valA').value || 'x';
        b = document.getElementById('valB').value || '3';
        document.getElementById('setup').style.display = 'none';
        document.getElementById('trainingArea').style.display = 'block';
        showStep();
    }

    function showStep() {
        const guide = document.getElementById('guideText');
        const math = document.getElementById('mathOutput');
        
        switch(step) {
            case 0:
                guide.innerHTML = "Paso 1: <span class='highlight'>El primero al cuadrado.</span> <br> Cogemos la \(a\) y la elevamos a 2.";
                math.innerHTML = `\\[ (${a})^2 \\]`;
                break;
            case 1:
                guide.innerHTML = "Paso 2: <span class='highlight'>El doble del primero por el segundo.</span> <br> Multiplicamos 2 por \(a\) y por \(b\).";
                math.innerHTML = `\\[ (${a})^2 + 2 \\cdot (${a}) \\cdot (${b}) \\]`;
                break;
            case 2:
                guide.innerHTML = "Paso 3: <span class='highlight'>El segundo al cuadrado.</span> <br> Sumamos la \(b\) elevada a 2.";
                math.innerHTML = `\\[ (${a})^2 + 2 \\cdot (${a}) \\cdot (${b}) + (${b})^2 \\]`;
                break;
            case 3:
                guide.innerHTML = "¡Y aquí tienes el resultado listo para simplificar!";
                math.innerHTML = `\\[ ${a}^2 + ${isNaN(a) && !isNaN(b) ? 2*b : '2\\cdot '+a+'\\cdot '+b} + ${!isNaN(b) ? b*b : b+'^2'} \\]`;
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('resetBtn').style.display = 'inline-block';
                break;
        }
        MathJax.typeset();
    }

    function nextStep() {
        step++;
        showStep();
    }

    function reset() {
        step = 0;
        document.getElementById('setup').style.display = 'block';
        document.getElementById('trainingArea').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
