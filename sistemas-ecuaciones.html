<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador de Identidades Notables · Candela García</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root { --primary: #0e9343; --danger: #d32f2f; --accent: #2980b9; --bg: #fdfdfd; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f1; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .card { background: white; width: 100%; max-width: 800px; padding: 40px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); position: relative; }
        
        .student-name { position: absolute; top: 15px; right: 30px; font-family: 'Kalam', cursive; color: var(--accent); font-size: 1.2rem; }
        
        .header { text-align: center; border-bottom: 2px dashed var(--primary); margin-bottom: 30px; padding-bottom: 10px; }
        .header h1 { font-family: 'Kalam', cursive; color: var(--primary); margin: 0; font-size: 35px; }

        .selector-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .type-btn { padding: 10px 20px; border: 2px solid var(--primary); border-radius: 15px; background: white; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .type-btn.active { background: var(--primary); color: white; }

        .training-zone { background: #fffcf0; padding: 25px; border-radius: 20px; border: 1px solid #e6db55; min-height: 400px; }
        
        .explanation { font-family: 'Kalam', cursive; font-size: 22px; color: #444; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; }
        .formula-display { font-size: 32px; text-align: center; margin: 30px 0; padding: 20px; background: white; border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }

        .controls { text-align: center; margin-top: 30px; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 35px; border-radius: 50px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(14, 147, 67, 0.3); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        .input-group { text-align: center; margin-bottom: 20px; font-size: 24px; }
        .math-input { width: 80px; padding: 10px; font-size: 20px; text-align: center; border: 2px solid #ddd; border-radius: 10px; font-family: 'Poppins', sans-serif; }
        
        .step-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; background: #eee; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="student-name">Alumna: Candela García</div>
    
    <div class="header">
        <h1>Entrenador de Álgebra</h1>
        <p>Domina las Identidades Notables paso a paso</p>
    </div>

    <div class="selector-box">
        <button class="type-btn active" id="btnSuma" onclick="changeType('suma')">Suma al Cuadrado</button>
        <button class="type-btn" id="btnResta" onclick="changeType('resta')">Resta al Cuadrado</button>
        <button class="type-btn" id="btnDiferencia" onclick="changeType('dif')">Suma por Diferencia</button>
    </div>

    <div class="input-group" id="inputSection">
        <span id="labelParentesis">(</span>
        <input type="text" id="valA" class="math-input" placeholder="a" value="x">
        <span id="labelSigno"> + </span>
        <input type="text" id="valB" class="math-input" placeholder="b" value="3">
        <span id="labelCierre">)²</span>
        <br>
        <button class="btn" style="margin-top: 20px;" onclick="iniciar()">Iniciar Explicación</button>
    </div>

    <div class="training-zone" id="trainingArea" style="display: none;">
        <span class="step-pill" id="pillStep">PASO 1</span>
        <div class="explanation" id="guideText"></div>
        <div class="formula-display" id="mathDisplay"></div>
        
        <div class="controls">
            <button class="btn" id="btnNext" onclick="siguiente()">Siguiente Paso →</button>
            <button class="btn" id="btnReset" onclick="reiniciar()" style="display: none; background: #666;">Probar otra</button>
        </div>
    </div>
</div>

<script>
    let currentStep = 1;
    let type = 'suma';
    let a, b;

    function changeType(newType) {
        type = newType;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        if(newType === 'suma') {
            document.getElementById('btnSuma').classList.add('active');
            document.getElementById('labelSigno').innerText = ' + ';
            document.getElementById('labelCierre').innerText = ')²';
        } else if(newType === 'resta') {
            document.getElementById('btnResta').classList.add('active');
            document.getElementById('labelSigno').innerText = ' - ';
            document.getElementById('labelCierre').innerText = ')²';
        } else {
            document.getElementById('btnDiferencia').classList.add('active');
            document.getElementById('labelSigno').innerText = ' + ';
            document.getElementById('labelCierre').innerText = ') · (a - b)';
        }
        reiniciar();
    }

    function iniciar() {
        a = document.getElementById('valA').value || 'a';
        b = document.getElementById('valB').value || 'b';
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('trainingArea').style.display = 'block';
        currentStep = 1;
        mostrarPaso();
    }

    function mostrarPaso() {
        const guide = document.getElementById('guideText');
        const math = document.getElementById('mathDisplay');
        const pill = document.getElementById('pillStep');
        
        pill.innerText = `PASO ${currentStep}`;

        if (type === 'suma' || type === 'resta') {
            const signo = type === 'suma' ? '+' : '-';
            switch(currentStep) {
                case 1:
                    guide.innerHTML = "Primero, calculamos el <span style='color:var(--danger)'>cuadrado del primero</span>. <br>Recuerda Candela: Todo lo que sea 'a' se eleva a 2.";
                    math.innerHTML = `\\[ (${a})^2 \\]`;
                    break;
                case 2:
                    guide.innerHTML = `Ahora añadimos el <span style='color:var(--danger)'>doble del primero por el segundo</span>. <br>Multiplicamos 2 por "${a}" y por "${b}".`;
                    math.innerHTML = `\\[ (${a})^2 ${signo} 2 \\cdot (${a}) \\cdot (${b}) \\]`;
                    break;
                case 3:
                    guide.innerHTML = "Por último, sumamos el <span style='color:var(--danger)'>cuadrado del segundo</span>. <br>Elevamos la 'b' a 2.";
                    math.innerHTML = `\\[ (${a})^2 ${signo} 2 \\cdot (${a}) \\cdot (${b}) + (${b})^2 \\]`;
                    document.getElementById('btnNext').innerText = "Ver resultado final";
                    break;
                case 4:
                    guide.innerHTML = "¡Resultado estructurado! Ahora solo faltaría simplificar los números.";
                    math.innerHTML = `\\[ ${a}^2 ${signo} 2${a}${b} + ${b}^2 \\]`;
                    document.getElementById('btnNext').style.display = 'none';
                    document.getElementById('btnReset').style.display = 'inline-block';
                    break;
            }
        } else {
            // Suma por diferencia
            switch(currentStep) {
                case 1:
                    guide.innerHTML = "En la suma por diferencia, el resultado es el <span style='color:var(--danger)'>cuadrado del primero</span>...";
                    math.innerHTML = `\\[ (${a})^2 \\]`;
                    break;
                case 2:
                    guide.innerHTML = "... <span style='color:var(--danger)'>MENOS el cuadrado del segundo</span>. <br>Es la identidad más rápida de Candela.";
                    math.innerHTML = `\\[ (${a})^2 - (${b})^2 \\]`;
                    document.getElementById('btnNext').innerText = "Ver resultado final";
                    break;
                case 3:
                    guide.innerHTML = "¡Listo! Siempre queda una resta de cuadrados.";
                    math.innerHTML = `\\[ ${a}^2 - ${b}^2 \\]`;
                    document.getElementById('btnNext').style.display = 'none';
                    document.getElementById('btnReset').style.display = 'inline-block';
                    break;
            }
        }
        MathJax.typeset();
    }

    function siguiente() {
        currentStep++;
        mostrarPaso();
    }

    function reiniciar() {
        document.getElementById('inputSection').style.display = 'block';
        document.getElementById('trainingArea').style.display = 'none';
        document.getElementById('btnNext').style.display = 'inline-block';
        document.getElementById('btnNext').innerText = "Siguiente Paso →";
        document.getElementById('btnReset').style.display = 'none';
    }
</script>

</body>
</html>
