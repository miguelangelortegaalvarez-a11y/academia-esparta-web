<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Maestra · Lectura y Escritura Inicial</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --esparta-green: #0e9343; 
            --soft-gray: #f9f9f9;
            --border-color: #d1e7dd;
            --blue: #2980b9;
        }
        
        body { font-family: 'Short Stack', cursive; background-color: #fff; margin: 0; padding: 0; color: #333; }

        .page { 
            width: 210mm; min-height: 297mm; margin: 0 auto; padding: 20mm; 
            box-sizing: border-box; background: white; position: relative;
        }

        .header { text-align: center; border-bottom: 2px solid var(--esparta-green); margin-bottom: 25px; padding-bottom: 10px; }
        .header h1 { font-family: 'Kalam', cursive; color: var(--esparta-green); margin: 0; font-size: 40px; }
        .header p { margin: 5px 0 0; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; }

        .student-data { display: flex; gap: 20px; margin-bottom: 25px; font-family: 'Kalam', cursive; font-size: 20px; }
        .field { flex: 1; border-bottom: 1px dashed #999; height: 30px; }

        .section { margin-bottom: 30px; page-break-inside: avoid; }
        .section-title { 
            font-family: 'Kalam', cursive; font-size: 24px; color: var(--esparta-green); 
            border-bottom: 2px solid var(--border-color); display: block; margin-bottom: 15px;
        }

        /* 1. Sílabas */
        .silabas-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; 
            border: 1px solid #eee; border-radius: 15px; overflow: hidden;
        }
        .silaba-item { padding: 12px; border: 1px solid #eee; }
        .silaba-top { font-size: 35px; color: var(--esparta-green); font-weight: bold; background: var(--soft-gray); }
        .silaba-bottom { height: 50px; background: #fff; }

        /* 2. Tabla Principal */
        .tabla-lectura { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .tabla-lectura th { font-family: 'Kalam', cursive; background: var(--soft-gray); padding: 8px; border: 1px solid #eee; color: var(--esparta-green); }
        .tabla-lectura td { border: 1px solid #eee; padding: 15px; vertical-align: middle; }
        .col-palabra { font-size: 26px; text-align: center; font-weight: bold; width: 25%; }
        
        /* 3. Nueva Actividad: Busca y Escribe */
        .actividad-3-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .item-busqueda { display: flex; align-items: center; gap: 15px; border: 1px solid #f0f0f0; padding: 10px; border-radius: 12px; }
        .emoji { font-size: 40px; }

        .pauta-caligrafia { height: 40px; border-bottom: 1px solid #ccc; position: relative; width: 100%; }
        .pauta-caligrafia::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed #e0e0e0; }

        .cuadro-dibujo { width: 70px; height: 70px; border: 2px dashed #ccc; border-radius: 10px; margin: auto; }

        @media print { body { background: white; } .page { width: 100%; margin: 0; padding: 10mm; } }
    </style>
</head>
<body>

    <div class="page">
        <header class="header">
            <h1>Academia Esparta</h1>
            <p>Aprendo a leer y escribir</p>
        </header>

        <div class="student-data">
            <span>Nombre:</span> <div class="field"></div>
            <span>Fecha:</span> <div class="field" style="max-width: 150px;"></div>
        </div>

        <section class="section">
            <span class="section-title">1. Leo las sílabas y las escribo debajo</span>
            <div class="silabas-grid">
                <div class="silaba-item silaba-top">ma</div>
                <div class="silaba-item silaba-top">me</div>
                <div class="silaba-item silaba-top">mi</div>
                <div class="silaba-item silaba-top">mo</div>
                <div class="silaba-item silaba-top">mu</div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
            </div>
        </section>

        <section class="section">
            <span class="section-title">2. Leo, escribo y dibujo</span>
            <table class="tabla-lectura">
                <thead><tr><th>Leo</th><th>Escribo</th><th>Dibujo</th></tr></thead>
                <tbody>
                    <tr><td class="col-palabra">mamá</td><td><div class="pauta-caligrafia"></div></td><td><div class="cuadro-dibujo"></div></td></tr>
                    <tr><td class="col-palabra">mimo</td><td><div class="pauta-caligrafia"></div></td><td><div class="cuadro-dibujo"></div></td></tr>
                    <tr><td class="col-palabra">miel</td><td><div class="pauta-caligrafia"></div></td><td><div class="cuadro-dibujo"></div></td></tr>
                </tbody>
            </table>
        </section>

        <section class="section">
            <span class="section-title">3. Escribe el nombre de estos dibujos</span>
            <div class="actividad-3-grid">
                <div class="item-busqueda">
                    <span class="emoji">🍎</span>
                    <div class="pauta-caligrafia"></div>
                </div>
                <div class="item-busqueda">
                    <span class="emoji">🖐️</span>
                    <div class="pauta-caligrafia"></div>
                </div>
                <div class="item-busqueda">
                    <span class="emoji">🏠</span>
                    <div class="pauta-caligrafia"></div>
                </div>
                <div class="item-busqueda">
                    <span class="emoji">🦋</span>
                    <div class="pauta-caligrafia"></div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
