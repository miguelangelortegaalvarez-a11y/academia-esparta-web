<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik: El Camino del Guerrero - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --esparta-verde: #0e9343; --esparta-oro: #f1c40f; --esparta-rojo: #e74c3c; }
        
        body { font-family: 'Kalam', cursive; background: #1a1a1a; color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        .header { background: var(--esparta-verde); width: 100%; text-align: center; padding: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: 'Bangers', cursive; letter-spacing: 2px; }
        .progress-container { width: 90%; max-width: 1000px; background: #333; height: 25px; border-radius: 15px; margin: 20px 0; overflow: hidden; border: 3px solid var(--esparta-oro); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f1c40f, #ff4500); transition: width 0.5s ease; }

        .marcador { font-family:'Bangers'; font-size: 30px; margin-top: 10px; text-align: center; }

        .main-stage { display: flex; width: 95%; max-width: 1300px; justify-content: center; align-items: center; gap: 50px; margin-top: 20px; }

        .character-col { flex: 0 0 500px; display: flex; flex-direction: column; align-items: center; }
        .character-img { width: 100%; height: auto; transition: 0.3s; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
        .img-super { filter: drop-shadow(0 0 40px #ffea00); animation: pulse-super 0.8s infinite alternate; }
        @keyframes pulse-super { from { transform: scale(1); } to { transform: scale(1.05); } }

        .game-container { background: #fff; padding: 35px; border-radius: 25px; border: 6px solid var(--esparta-verde); color: #222; width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .multiplication-table { font-size: 80px; font-weight: bold; line-height: 1.1; color: #2c3e50; width: 100%; border-collapse: collapse; }
        .multiplication-table td { text-align: center; width: 90px; height: 90px; }
        .signo { color: var(--esparta-rojo); font-family: 'Bangers'; font-size: 75px; }
        .linea { border-bottom: 8px solid #333; margin: 15px 0; }

        .result-row { display: flex; gap: 15px; justify-content: center; padding-top: 10px; }
        input { font-family: 'Kalam', cursive; font-size: 55px; text-align: center; border: 4px solid #ccc; border-radius: 12px; width: 90px; height: 90px; outline: none; background: #fff; color: #222; }
        input.correct { background: #c8e6c9 !important; border-color: var(--esparta-verde) !important; color: #1b5e20; }
        input.wrong { background: #ffcdd2 !important; border-color: var(--esparta-rojo) !important; animation: shake 0.3s; }

        #llevada { width: 65px; height: 65px; font-size: 35px; border: 4px dashed var(--esparta-rojo); visibility: hidden; margin: 0 auto 10px auto; color: var(--esparta-rojo); display: block; }

        .status-msg { margin-top: 25px; font-weight: bold; font-size: 32px; color: var(--esparta-oro); text-align: center; font-family: 'Bangers'; }
        
        #barca-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(165, 0, 68, 0.98); color: #edbb00; font-family: 'Bangers'; font-size: 50px; padding: 40px; border-radius: 20px; border: 10px solid #004d98; z-index: 1000; text-align: center; display: none; width: 80%; pointer-events: none; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <div id="barca-msg">¡ERES MÁS MALO QUE EL BARCELONA! ⚽📉</div>

    <div class="header"><h1>GUERRERO ERIK: EL CAMINO DEL GUERRERO</h1></div>
    
    <div class="marcador">ESCUDOS: <span id="score" style="color:var(--esparta-oro)">0</span></div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="main-stage">
        <div class="character-col">
            <img src="camino-matematico/assets/warrior/warrior-idle.png.PNG" alt="Erik" class="character-img" id="hero-img">
            <div style="font-family:'Bangers'; color:var(--esparta-oro); font-size:35px; margin-top:20px;">ESTADO: <span id="hero-status">Base</span></div>
        </div>

        <div class="game-container">
            <input type="number" id="llevada" placeholder="?">
            <table class="multiplication-table">
                <tr>
                    <td></td>
                    <td id="d-arriba">4</td>
                    <td id="u-arriba">7</td>
                </tr>
                <tr>
                    <td class="signo">x</td>
                    <td></td>
                    <td id="num-abajo">6</td>
                </tr>
            </table>
            <div class="linea"></div>
            <div class="result-row">
                <input type="number" id="res-centena">
                <input type="number" id="res-decena">
                <input type="number" id="res-unidad">
            </div>
        </div>
    </div>

    <div class="status-msg" id="msg">¡DEMUESTRA TU FUERZA, ERIK!</div>

    <script>
        let n1, n2, llevadaReal, uReal, dReal, cReal;
        let score = 0;
        const goal = 10;

        const imagenes = {
            base: 'camino-matematico/assets/warrior/warrior-idle.png.PNG',
            sad: 'camino-matematico/assets/warrior/warrior-sad.png.PNG',
            super: 'camino-matematico/assets/warrior/warrior-power.png.PNG'
        };

        const inputs = {
            llevada: document.getElementById('llevada'),
            u: document.getElementById('res-unidad'),
            d: document.getElementById('res-decena'),
            c: document.getElementById('res-centena')
        };

        const heroImg = document.getElementById('hero-img');
        const heroStatus = document.getElementById('hero-status');

        function nuevaOperacion() {
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = Math.floor(Math.random() * 8) + 2;
            
            document.getElementById('d-arriba').innerText = Math.floor(n1 / 10);
            document.getElementById('u-arriba').innerText = n1 % 10;
            document.getElementById('num-abajo').innerText = n2;

            uReal = (n1 % 10 * n2) % 10;
            llevadaReal = Math.floor((n1 % 10 * n2) / 10);
            let total = n1 * n2;
            cReal = Math.floor(total / 100);
            dReal = Math.floor((total % 100) / 10);

            Object.values(inputs).forEach(i => {
                i.value = ''; i.className = ''; i.disabled = true; i.style.visibility = 'visible';
            });
            
            if (cReal === 0) inputs.c.style.visibility = 'hidden';
            inputs.llevada.style.visibility = 'hidden';
            inputs.u.disabled = false;
            inputs.u.focus();
        }

        function volverNormal() {
            heroImg.src = imagenes.base;
            heroImg.classList.remove('img-super');
            heroStatus.innerText = "Guerrero";
        }

        function manejarError() {
            heroImg.src = imagenes.sad;
            heroImg.classList.remove('img-super');
            heroStatus.innerText = "¡MÁS MALO QUE EL BARÇA! 📉";
            document.getElementById('barca-msg').style.display = 'block';
            setTimeout(() => {
                document.getElementById('barca-msg').style.display = 'none';
                volverNormal();
            }, 3000);
        }

        function verificarVictoria() {
            // Si la centena es visible, debe estar correcta. Si no, solo decena.
            const centenaOk = (cReal === 0) || (inputs.c.value == cReal && inputs.c.classList.contains('correct'));
            const decenaOk = (inputs.d.value == dReal && inputs.d.classList.contains('correct'));

            if (centenaOk && decenaOk) {
                manejarAciertoFinal();
            }
        }

        function manejarAciertoFinal() {
            heroImg.src = imagenes.super;
            heroImg.classList.add('img-super');
            heroStatus.innerText = "SUPER ER! 🔥";
            document.getElementById('msg').innerText = "¡IMPRESIONANTE, ERIK!";
            score++;
            document.getElementById('score').innerText = score;
            document.getElementById('progress-bar').style.width = (score / goal) * 100 + "%";

            if(score >= goal) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                setTimeout(() => { score = 0; document.getElementById('progress-bar').style.width = "0%"; }, 4000);
            }

            setTimeout(() => {
                volverNormal();
                nuevaOperacion();
            }, 3000);
        }

        // UNIDADES
        inputs.u.oninput = function() {
            if(this.value == uReal) {
                this.classList.add('correct'); this.disabled = true;
                if(llevadaReal > 0) {
                    inputs.llevada.style.visibility = 'visible';
                    inputs.llevada.disabled = false; inputs.llevada.focus();
                } else {
                    // Si no hay llevada, activamos Decenas y Centenas (si existe)
                    inputs.d.disabled = false;
                    if(cReal > 0) inputs.c.disabled = false;
                    document.getElementById('msg').innerText = "¡Erik, elige: decenas o centenas!";
                }
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        // LLEVADA
        inputs.llevada.oninput = function() {
            if(this.value == llevadaReal) {
                this.classList.add('correct'); this.disabled = true;
                // Al acertar llevada, activamos Decenas y Centenas (si existe)
                inputs.d.disabled = false;
                if(cReal > 0) inputs.c.disabled = false;
                document.getElementById('msg').innerText = "¡Muy bien! Elige el orden ahora.";
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        // DECENAS
        inputs.d.oninput = function() {
            if(this.value == dReal) {
                this.classList.add('correct'); this.disabled = true;
                verificarVictoria();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        // CENTENAS
        inputs.c.oninput = function() {
            if(this.value == cReal) {
                this.classList.add('correct'); this.disabled = true;
                verificarVictoria();
            } else if(this.value.length >= 1) {
                this.classList.add('wrong'); manejarError();
                setTimeout(() => { this.value = ''; this.classList.remove('wrong'); }, 300);
            }
        };

        nuevaOperacion();
    </script>
</body>
</html>
