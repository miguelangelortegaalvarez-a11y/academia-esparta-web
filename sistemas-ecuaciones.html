<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Maestra · Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --esparta-green: #0e9343; 
            --soft-gray: #f9f9f9;
            --border-color: #d1e7dd;
        }
        
        body { 
            font-family: 'Short Stack', cursive; 
            background-color: #ffffff; 
            margin: 0; padding: 0; 
            color: #333;
        }

        .page { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0 auto; 
            padding: 20mm; 
            box-sizing: border-box;
            background: white;
        }

        /* Encabezado Limpio */
        .header { 
            text-align: center; 
            border-bottom: 2px solid var(--esparta-green); 
            margin-bottom: 30px; 
            padding-bottom: 10px;
        }
        .header h1 { 
            font-family: 'Kalam', cursive; 
            color: var(--esparta-green); 
            margin: 0; 
            font-size: 45px;
        }
        .header p { margin: 5px 0 0; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; }

        .student-data { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            font-family: 'Kalam', cursive; 
            font-size: 22px;
        }
        .field { flex: 1; border-bottom: 1px dashed #999; height: 30px; }

        .section { margin-bottom: 35px; page-break-inside: avoid; }
        .section-title { 
            font-family: 'Kalam', cursive; 
            font-size: 26px; 
            color: var(--esparta-green); 
            border-bottom: 2px solid var(--border-color);
            display: block;
            margin-bottom: 20px;
        }

        /* Bloque de Sílabas: Lectura y Escritura */
        .silabas-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            text-align: center; 
            margin-top: 10px;
            border: 2px solid #eee;
            border-radius: 15px;
            overflow: hidden;
        }
        .silaba-item { padding: 15px; border: 1px solid #eee; }
        .silaba-top { font-size: 40px; color: var(--esparta-green); font-weight: bold; background: var(--soft-gray); }
        .silaba-bottom { height: 75px; background: #fff; }

        /* Tabla de Caligrafía y Vocabulario */
        .tabla-lectura { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .tabla-lectura th { 
            font-family: 'Kalam', cursive; 
            background: var(--soft-gray); 
            padding: 12px; 
            border: 1px solid #eee;
            color: var(--esparta-green);
            font-size: 20px;
        }
        .tabla-lectura td { 
            border: 1px solid #eee; 
            padding: 15px; 
            vertical-align: middle; 
        }

        .col-palabra { font-size: 32px; text-align: center; font-weight: bold; width: 25%; color: #000; }
        
        /* Pauta de Escritura con línea guía */
        .pauta-caligrafia { 
            height: 50px; 
            border-bottom: 2px solid #bbb; 
            position: relative; 
            width: 90%;
            margin: 0 auto;
        }
        .pauta-caligrafia::before {
            content: "";
            position: absolute;
            top: 50%; left: 0; right: 0;
            border-top: 1px dashed #d0d0d0;
        }

        .cuadro-dibujo { 
            width: 90px; height: 90px; 
            border: 2px dashed #ccc; 
            border-radius: 12px; 
            margin: auto; 
            background-color: #fdfdfd;
        }

        @media print {
            body { background: white; }
            .page { width: 100%; margin: 0; padding: 10mm; }
        }
    </style>
</head>
<body>

    <div class="page">
        <header class="header">
            <h1>Academia Esparta</h1>
            <p>Método de Lectoescritura Inicial</p>
        </header>

        <div class="student-data">
            <span>Nombre:</span> <div class="field"></div>
            <span>Fecha:</span> <div class="field" style="max-width: 180px;"></div>
        </div>

        <section class="section">
            <span class="section-title">1. Leo las sílabas y las escribo debajo</span>
            <div class="silabas-grid">
                <div class="silaba-item silaba-top">ma</div>
                <div class="silaba-item silaba-top">me</div>
                <div class="silaba-item silaba-top">mi</div>
                <div class="silaba-item silaba-top">mo</div>
                <div class="silaba-item silaba-top">mu</div>
                
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
                <div class="silaba-item silaba-bottom"></div>
            </div>
        </section>

        <section class="section">
            <span class="section-title">2. Leo, escribo y dibujo mis palabras</span>
            <table class="tabla-lectura">
                <thead>
                    <tr>
                        <th>Escucha y lee</th>
                        <th>Copia con cuidado</th>
                        <th>Haz el dibujo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-palabra">mamá</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">miel</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">mesa</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                    <tr>
                        <td class="col-palabra">mimo</td>
                        <td><div class="pauta-caligrafia"></div></td>
                        <td><div class="cuadro-dibujo"></div></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
