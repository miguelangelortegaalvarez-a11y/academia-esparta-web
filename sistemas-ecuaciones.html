<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refuerzo Letra D - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --esparta-green: #0e9343; 
            --soft-gray: #f9f9f9;
            --font-profe: 'Kalam', cursive;
            --font-ninos: 'Short Stack', cursive;
        }
        
        body { font-family: var(--font-ninos); background-color: #fff; margin: 0; padding: 0; }

        .btn-imprimir {
            display: block; width: fit-content; margin: 20px auto;
            background-color: var(--esparta-green); color: white;
            border: none; padding: 12px 25px; border-radius: 30px;
            font-weight: 700; cursor: pointer;
        }

        .page { 
            width: 210mm; min-height: 297mm; margin: 0 auto; 
            padding: 15mm; box-sizing: border-box; background: white;
            border: 1px solid #eee;
        }

        .header { text-align: center; border-bottom: 2px solid var(--esparta-green); margin-bottom: 20px; }
        .header h1 { font-family: var(--font-profe); color: var(--esparta-green); margin: 0; font-size: 45px; }

        .section { margin-bottom: 30px; page-break-inside: avoid; }
        .section-title { 
            font-family: var(--font-profe); font-size: 28px; 
            color: var(--esparta-green); border-bottom: 2px solid #eee;
            display: block; margin-bottom: 15px;
        }

        /* Ejercicio 1: Encontrar la D */
        .sopa-letras { 
            display: flex; justify-content: space-around; font-size: 50px; 
            font-weight: bold; background: #fffceb; padding: 20px; border-radius: 20px;
            border: 2px dashed #ffc107;
        }
        .sopa-letras span { padding: 0 10px; }

        /* Ejercicio 2: Sílabas Gigantes */
        .silabas-grandes { display: flex; justify-content: space-around; font-size: 60px; color: var(--esparta-green); font-weight: bold; }

        /* Ejercicio 3: Unir Emojis */
        .unir-facil { display: flex; justify-content: space-around; font-size: 40px; margin-top: 10px; }
        .col { display: flex; flex-direction: column; gap: 20px; }

        /* Ejercicio 4: Copia de palabras cortas */
        .pauta-simple { 
            height: 60px; border-bottom: 2px solid #ccc; position: relative; width: 100%; margin-top: 10px;
        }
        .pauta-simple::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed #ddd; }
        .palabra-guia { font-size: 40px; margin-bottom: 5px; }

        @media print {
            .btn-imprimir { display: none; }
            .page { width: 100%; margin: 0; border: none; }
        }
    </style>
</head>
<body>

    <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir Refuerzo Letra D</button>

    <div class="page">
        <header class="header">
            <h1>ACADEMIA ESPARTA</h1>
            <p style="font-family: var(--font-profe); font-size: 24px;">¡Hoy aprendo la letra D!</p>
        </header>

        <section class="section">
            <span class="section-title">1. Rodea con un círculo todas las letras "d"</span>
            <div class="sopa-letras">
                <span>d</span> <span>b</span> <span>p</span> <span>d</span> <span>q</span> <span>d</span> <span>b</span> <span>d</span> <span>p</span> <span>d</span>
            </div>
        </section>

        <section class="section">
            <span class="section-title">2. Di estas sílabas muy fuerte</span>
            <div class="silabas-grandes">
                <span>da</span> <span>de</span> <span>di</span> <span>do</span> <span>du</span>
            </div>
        </section>

        <section class="section">
            <span class="section-title">3. Une con una línea</span>
            <div class="unir-facil">
                <div class="col">
                    <span>Dado</span>
                    <span>Dedo</span>
                    <span>Dos</span>
                </div>
                <div class="col">
                    <span>2️⃣</span>
                    <span>🎲</span>
                    <span>☝️</span>
                </div>
            </div>
        </section>

        <section class="section">
            <span class="section-title">4. Escribe estas palabras tú sola</span>
            
            <div style="margin-bottom: 40px;">
                <div class="palabra-guia">da - do</div>
                <div class="pauta-simple"></div>
            </div>

            <div style="margin-bottom: 40px;">
                <div class="palabra-guia">de - do</div>
                <div class="pauta-simple"></div>
            </div>

            <div style="margin-bottom: 40px;">
                <div class="palabra-guia">da - ma</div>
                <div class="pauta-simple"></div>
            </div>
        </section>

    </div>

</body>
</html>
