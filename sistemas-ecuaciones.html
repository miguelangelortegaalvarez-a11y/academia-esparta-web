<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Selva: Darío al Rescate</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jungle: #2d6a4f;
            --sky: #ade8f4;
            --accent: #ffb703;
            --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--sky);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background: var(--white);
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 8px solid var(--jungle);
            text-align: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--jungle);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px var(--accent);
        }

        p { font-weight: bold; color: #555; }

        .match-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            position: relative;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        .item {
            padding: 15px;
            background: #f0f0f0;
            border: 3px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.3s;
            user-select: none;
        }

        .item.selected {
            background: var(--accent);
            border-color: var(--jungle);
            transform: scale(1.1);
        }

        .item.correct {
            background: #95d5b2;
            border-color: var(--jungle);
            cursor: default;
        }

        .item-emoji { font-size: 2rem; display: block; }

        #message {
            margin-top: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            height: 30px;
            color: var(--jungle);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            top: -10px;
            z-index: 10;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>¡AVENTURA TROPICAL!</h1>
        <p>Darío, une la palabra con su dibujo:</p>

        <div class="match-area">
            <div class="column" id="words">
                <div class="item" data-match="gorilla">GORILLA</div>
                <div class="item" data-match="wave">WAVE</div>
                <div class="item" data-match="lolly">ICE LOLLY</div>
                <div class="item" data-match="sandals">SANDALS</div>
                <div class="item" data-match="insect">INSECT</div>
            </div>

            <div class="column" id="emojis">
                <div class="item" data-match="lolly"><span class="item-emoji"> ice 🍦</span></div>
                <div class="item" data-match="gorilla"><span class="item-emoji">🦍 gorilla</span></div>
                <div class="item" data-match="insect"><span class="item-emoji">🐞 insect</span></div>
                <div class="item" data-match="wave"><span class="item-emoji">🌊 wave</span></div>
                <div class="item" data-match="sandals"><span class="item-emoji">🩴 sandals</span></div>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        let selectedWord = null;
        let correctCount = 0;

        const items = document.querySelectorAll('.item');
        const message = document.getElementById('message');

        items.forEach(item => {
            item.addEventListener('click', () => {
                if (item.classList.contains('correct')) return;

                // Si clicamos en una palabra
                if (item.parentElement.id === 'words') {
                    document.querySelectorAll('#words .item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedWord = item;
                } 
                // Si clicamos en un dibujo
                else if (selectedWord) {
                    if (item.dataset.match === selectedWord.dataset.match) {
                        item.classList.add('correct');
                        selectedWord.classList.add('correct');
                        selectedWord.classList.remove('selected');
                        selectedWord = null;
                        correctCount++;
                        message.innerText = "¡BIEN HECHO! ⭐";
                        
                        if (correctCount === 5) {
                            message.innerText = "¡ERES UN CAMPEÓN, DARÍO! 🏆";
                            celebrate();
                        }
                    } else {
                        message.innerText = "¡CASI! Inténtalo otra vez 🙊";
                        selectedWord.classList.remove('selected');
                        selectedWord = null;
                    }
                }
            });
        });

        function celebrate() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#ffb703', '#2d6a4f', '#0077b6'][Math.floor(Math.random() * 3)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
