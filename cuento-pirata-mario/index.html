<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07121f" />
  <title>Cuento Pirata Mario · Juego 4 años</title>

  <!-- Cache-bust -->
  <link rel="stylesheet" href="./style.css?v=9999" />
  <script defer src="./script.js?v=9999"></script>
</head>

<body>

<noscript>
  <div style="padding:16px;background:#222;color:#fff;font-family:system-ui">
    Este juego necesita JavaScript para funcionar.
  </div>
</noscript>

<div id="app" class="app" aria-label="Juego educativo pirata (4 años)">

  <!-- Fondo dinámico -->
  <div id="sceneBg" class="scene-bg" role="img" aria-label="Fondo del juego"></div>
  <div class="scene-shade" aria-hidden="true"></div>

  <!-- HUD -->
  <header class="hud">
    <div class="hud-left">
      <div id="instruction" class="instruction" aria-live="polite"></div>
    </div>
    <div class="hud-right">
      <button id="btnMusic" class="btn btn-secondary" type="button" hidden>
        Activar música
      </button>
    </div>
  </header>

  <!-- Feedback -->
  <div id="toast" class="toast" hidden></div>
  <div id="bigCheck" class="big-check" hidden>✓</div>

  <!-- Audio -->
  <audio id="bgm" preload="auto" loop playsinline></audio>

  <!-- =========================
       CONTENEDOR DE PANTALLAS
       ========================= -->
  <main id="screens" class="screens">

    <!-- PANTALLA 1 -->
    <section id="screen-1" class="screen is-active" aria-label="Bienvenida">
      <div class="panel panel-center">
        <h1 class="title">VAMOS A JUGAR 🏴‍☠️</h1>
        <p class="subtitle">Completa las actividades para llegar al tesoro.</p>
        <button id="btnStart" class="btn btn-primary btn-big">COMENZAR</button>
      </div>
    </section>

    <!-- PANTALLA 2 -->
    <section id="screen-2" class="screen" aria-label="Letras iniciales">
      <div class="panel panel-wide">
        <h2 class="h2">Actividad 1</h2>
        <div id="lettersGrid"></div>
        <div class="footer-actions">
          <button id="btnNext2" class="btn btn-primary btn-big" disabled>CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 3 -->
    <section id="screen-3" class="screen" aria-label="Buscar llaves">
      <div class="panel panel-full">
        <div class="keys-area">
          <div id="keysLayer" class="keys-layer"></div>
          <div id="chestDrop" class="chest-drop">
            <img id="chestImg" src="./assets/objects/COFRE_CERRADO.PNG" alt="Cofre" />
          </div>
        </div>
        <div class="footer-actions">
          <button id="btnNext3" class="btn btn-primary btn-big" disabled>CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 4 -->
    <section id="screen-4" class="screen" aria-label="Clasificación">
      <div class="panel panel-full">
        <h2 class="h2">Actividad 3</h2>
        <div class="classify-area">
          <div class="dropzones">
            <div id="dropPirates" class="dropzone">PIRATAS</div>
            <div id="dropExplorers" class="dropzone">EXPLORADORES</div>
          </div>
          <div id="objectsTray" class="objects-tray"></div>
        </div>
        <div class="footer-actions">
          <button id="btnNext4" class="btn btn-primary btn-big">CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- INTERLUDE -->
    <section id="screen-interlude" class="screen" aria-label="Motivación">
      <div class="panel panel-center">
        <h2 class="title">¡GENIAL!</h2>
        <p class="subtitle">Has colocado todo correctamente.</p>
        <button id="btnInterludeNext" class="btn btn-primary btn-big">CONTINUAR</button>
      </div>
    </section>

    <!-- PANTALLA 5 -->
    <section id="screen-5" class="screen" aria-label="Memoria">
      <div class="panel panel-full">
        <h2 class="h2">Actividad 4</h2>
        <div id="memoryPreview"></div>
        <div id="memoryBank"></div>
        <div class="footer-actions">
          <button id="btnNext5" class="btn btn-primary btn-big" disabled>CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 6 -->
    <section id="screen-6" class="screen" aria-label="Monedas">
      <div class="panel panel-full">
        <h2 class="h2">Actividad 5</h2>
        <div id="coinsBank"></div>
        <div class="footer-actions">
          <button id="btnNext6" class="btn btn-primary btn-big" disabled>CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 7 -->
    <section id="screen-7" class="screen" aria-label="Sílabas">
      <div class="panel panel-wide">
        <h2 class="h2">Actividad 6</h2>
        <div id="syllablesArea"></div>
        <div class="footer-actions">
          <button id="btnNext7" class="btn btn-primary btn-big" disabled>CONTINUAR</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 8 -->
    <section id="screen-8" class="screen" aria-label="Final">
      <div class="panel panel-center">
        <h2 class="title title-final">
          EL MAYOR TESORO ES HABER RECORRIDO EL CAMINO JUNTOS
        </h2>
        <button id="btnRestart" class="btn btn-primary btn-big">
          VOLVER A JUGAR
        </button>
      </div>
    </section>

  </main>

</div>
</body>
</html>
