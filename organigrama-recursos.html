<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organigrama de Recursos | Academia Esparta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p:  #0e9343;
      --pd: #09834c;
      --pdd:#063c24;
      --light:#f0fdf4;
      --dark:#111827;
      --gray:#6b7280;
      --r:12px;
    }
    body { font-family:'Poppins',sans-serif; background:#f3f4f6; color:var(--dark); }

    /* ── Header ── */
    .hdr {
      background: linear-gradient(135deg, var(--pdd) 0%, var(--p) 100%);
      padding: 1.8rem 2.5rem 1.5rem;
    }
    .hdr-inner { max-width:1300px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
    .hdr-logo { font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.65); margin-bottom:.3rem; }
    .hdr-title { font-size:1.5rem; font-weight:800; color:#fff; }
    .hdr-sub { font-size:.82rem; color:rgba(255,255,255,.7); margin-top:.25rem; }
    .hdr-badge {
      background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
      color:rgba(255,255,255,.85); font-size:.7rem; font-weight:700;
      padding:.3rem .8rem; border-radius:999px; letter-spacing:.05em;
      text-transform:uppercase; white-space:nowrap;
    }

    /* ── Stats strip ── */
    .stats {
      background:#fff; border-bottom:1px solid #e5e7eb;
      padding:.65rem 2.5rem;
    }
    .stats-inner { max-width:1300px; margin:0 auto; display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
    .si { display:flex; align-items:center; gap:.4rem; font-size:.78rem; }
    .si-l { color:var(--gray); }
    .si-v { font-weight:700; }
    .sdiv { width:1px; height:16px; background:#e5e7eb; }
    #st-pend  { color:#9ca3af; font-weight:600; }
    #st-listo { color:#b45309; font-weight:700; }
    #st-pub   { color:var(--pd); font-weight:700; }

    /* ── Controls ── */
    .ctrl {
      background:#fff; border-bottom:1px solid #e5e7eb;
      padding:.55rem 2.5rem;
    }
    .ctrl-inner { max-width:1300px; margin:0 auto; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .btn-c {
      font-family:'Poppins',sans-serif; font-size:.73rem; font-weight:600;
      padding:.3rem .8rem; border-radius:999px; border:1.5px solid #e5e7eb;
      background:#fff; cursor:pointer; color:var(--gray); transition:all .15s;
    }
    .btn-c:hover { border-color:var(--p); color:var(--p); }
    .csep { flex:1; }
    .legend { display:flex; gap:.8rem; align-items:center; font-size:.7rem; color:var(--gray); }
    .ldot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:.2rem; vertical-align:middle; }

    /* ── Grid ── */
    .grid {
      max-width:1300px; margin:0 auto;
      padding:1.8rem 2.5rem 5rem;
      display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; align-items:start;
    }

    /* ── Subject panel ── */
    .sp-head {
      padding:1rem 1.3rem; border-radius:var(--r) var(--r) 0 0;
      display:flex; align-items:center; gap:.8rem;
    }
    .sp-icon { font-size:1.7rem; }
    .sp-name { font-size:1rem; font-weight:800; color:#fff; }
    .sp-meta { font-size:.7rem; color:rgba(255,255,255,.72); margin-top:.15rem; }
    .sp-cnt {
      margin-left:auto; background:rgba(255,255,255,.18); color:#fff;
      font-size:.65rem; font-weight:700; padding:.18rem .55rem; border-radius:999px;
    }
    .sp.lengua     .sp-head { background:linear-gradient(135deg, var(--pdd), #065f46); }
    .sp.matematicas .sp-head { background:linear-gradient(135deg, #065f46, var(--p)); }

    /* ── Course accordion ── */
    .ca { border:1px solid #e5e7eb; border-top:none; background:#fff; overflow:hidden; }
    .ca:last-child { border-radius:0 0 var(--r) var(--r); }
    .ca-toggle {
      width:100%; background:none; border:none; font-family:'Poppins',sans-serif;
      cursor:pointer; padding:.7rem 1rem; display:flex; align-items:center; gap:.6rem;
      border-top:1px solid #f3f4f6; text-align:left; transition:background .15s;
    }
    .ca-toggle:hover { background:#f9fafb; }
    .ca-num { font-size:1.3rem; font-weight:800; min-width:28px; line-height:1; }
    .ca-info { flex:1; }
    .ca-nombre { font-size:.82rem; font-weight:700; color:var(--dark); }
    .ca-row { font-size:.66rem; color:var(--gray); margin-top:.08rem; }
    .ca-chev { font-size:.65rem; color:#9ca3af; transition:transform .2s; }
    .ca.open .ca-chev { transform:rotate(90deg); }
    .ca-body { display:none; padding:.5rem .8rem .8rem; background:#fafafa; border-top:1px solid #f3f4f6; }
    .ca.open .ca-body { display:block; }

    /* ── Block row ── */
    .br { border-radius:8px; margin-bottom:.4rem; overflow:hidden; border:1px solid rgba(0,0,0,.06); }
    .br-head { display:flex; align-items:center; gap:.45rem; padding:.4rem .7rem; }
    .br-ico  { font-size:.95rem; flex-shrink:0; }
    .br-name { font-size:.75rem; font-weight:700; flex:1; }
    .br-pill {
      font-size:.56rem; font-weight:700; padding:.1rem .38rem;
      border-radius:999px; white-space:nowrap;
    }
    .br-cnt {
      font-size:.58rem; font-weight:600; padding:.1rem .38rem;
      border-radius:999px; background:#f3f4f6; color:#9ca3af; white-space:nowrap; margin-left:auto;
    }

    /* ── Sub-block chips ── */
    .sbc { padding:.3rem .7rem .55rem 1.8rem; display:flex; flex-wrap:wrap; gap:.3rem; background:rgba(255,255,255,.5); }
    .chip {
      font-size:.65rem; font-weight:500; padding:.2rem .6rem;
      border-radius:999px; border:1.5px solid; cursor:pointer;
      transition:all .15s; user-select:none; white-space:nowrap;
    }
    .chip.pendiente { background:#f9fafb; border-color:#e5e7eb; color:#9ca3af; }
    .chip.pendiente:hover { border-color:#d1d5db; color:#6b7280; }
    .chip.listo     { background:#fffbeb; border-color:#f59e0b; color:#b45309; }
    .chip.publicado { background:#f0fdf4; border-color:var(--p); color:var(--pd); font-weight:700; }

    @media (max-width:900px) {
      .grid { grid-template-columns:1fr; padding:1.2rem 1rem 4rem; }
      .stats, .ctrl { padding-left:1rem; padding-right:1rem; }
      .hdr { padding:1.4rem 1rem 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="hdr">
    <div class="hdr-inner">
      <div>
        <div class="hdr-logo">Academia Esparta</div>
        <div class="hdr-title">🗂️ Organigrama de Recursos</div>
        <div class="hdr-sub">Planificación interna · LOMLOE · Andalucía · Primaria</div>
      </div>
      <div class="hdr-badge">⚠ Uso interno · No publicar</div>
    </div>
  </div>

  <div class="stats">
    <div class="stats-inner">
      <div class="si"><span class="si-l">Asignaturas</span><span class="si-v">2</span></div>
      <div class="sdiv"></div>
      <div class="si"><span class="si-l">Bloques</span><span class="si-v" id="st-bl">—</span></div>
      <div class="sdiv"></div>
      <div class="si"><span class="si-l">Temas totales</span><span class="si-v" id="st-tot">—</span></div>
      <div class="sdiv"></div>
      <div class="si"><span id="st-pend">— pendientes</span></div>
      <div class="si"><span id="st-listo">— listos</span></div>
      <div class="si"><span id="st-pub">— publicados</span></div>
    </div>
  </div>

  <div class="ctrl">
    <div class="ctrl-inner">
      <button class="btn-c" onclick="expandAll()">Expandir todo</button>
      <button class="btn-c" onclick="collapseAll()">Contraer todo</button>
      <button class="btn-c" onclick="resetAll()" style="margin-left:.4rem">Reiniciar estados</button>
      <div class="csep"></div>
      <div class="legend">
        <span>Estado del tema:</span>
        <span><span class="ldot" style="background:#e5e7eb"></span>Pendiente</span>
        <span><span class="ldot" style="background:#f59e0b"></span>Listo</span>
        <span><span class="ldot" style="background:#0e9343"></span>Publicado</span>
        <span style="color:#aaa">· Clic en tema para cambiar</span>
      </div>
    </div>
  </div>

  <div class="grid" id="organigrama"></div>

  <script>
    // ─── CICLOS ───────────────────────────────────────────────────────────────
    const CICLO = {
      C1: { label:'Ciclo 1 · 1º-2º', color:'#1d4ed8' },
      C2: { label:'Ciclo 2 · 3º-4º', color:'#059669' },
      C3: { label:'Ciclo 3 · 5º-6º', color:'#7c3aed' }
    };

    // ─── DATOS ───────────────────────────────────────────────────────────────
    const ASIG = {

      lengua: {
        nombre:'Lengua Castellana', icono:'📚',
        curriculum: {
          '1': { nombre:'1º Primaria', ciclo:'C1', bloques: {
            A:        { nombre:'Lenguas y hablantes',    color:'#1e40af', icono:'🌍', subBloques:['Diversidad lingüística','Lengua materna'] },
            B_oral:   { nombre:'Comunicación oral',      color:'#16a34a', icono:'🎤', subBloques:['Escucha activa','Turnos de palabra','Descripción oral simple','Narración de vivencias'] },
            LECTURA:  { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Conciencia fonológica','Decodificación','Lectura silábica','Lectura de palabra','Lectura de frase','Comprensión literal'] },
            B_escrita:{ nombre:'Escritura',              color:'#0891b2', icono:'✏️',  subBloques:['Grafomotricidad','Mayúsculas y minúsculas','Ortografía natural','Frases simples'] },
            C:        { nombre:'Literatura',             color:'#ea580c', icono:'📖', subBloques:['Cuentos tradicionales','Adivinanzas','Retahílas','Poemas breves'] },
            D:        { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Sílaba','Palabra','Concordancia básica','Vocabulario por campos semánticos'] }
          }},
          '2': { nombre:'2º Primaria', ciclo:'C1', bloques: {
            LECTURA: { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Lectura fluida','Inferencias simples','Idea principal','Secuencia temporal','Comprensión de instrucciones','Vocabulario en contexto'] },
            D:       { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Nombre, Adjetivo, Verbo intuitivo','Singular y Plural','Masculino y Femenino','Sinónimos','Antónimos','Signos de puntuación'] }
          }},
          '3': { nombre:'3º Primaria', ciclo:'C2', bloques: {
            LECTURA: { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Tipos textuales','Idea principal y secundarias','Inferencias','Vocabulario en contexto','Velocidad lectora','Lectura entonada'] },
            D:       { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Sustantivo','Adjetivo','Verbo','Determinantes','Familia de palabras','Polisemia','Ortografía'] }
          }},
          '4': { nombre:'4º Primaria', ciclo:'C2', bloques: {
            LECTURA: { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Textos expositivos','Inferencias complejas','Resumen escrito','Esquemas y mapas conceptuales','Lectura crítica inicial','Velocidad lectora con comprensión'] },
            D:       { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Sujeto y predicado','Pronombres','Adverbios','Preposiciones','Conjugación regular','Prefijos y sufijos','Acentuación','Ortografía'] }
          }},
          '5': { nombre:'5º Primaria', ciclo:'C3', bloques: {
            LECTURA: { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Textos argumentativos','Textos periodísticos','Inferencias avanzadas','Hecho vs opinión','Lectura crítica','Búsqueda de información fiable','Comprensión digital'] },
            D:       { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Análisis morfológico','Verbos irregulares','Oración simple','Campos semánticos','Connotación y denotación','Acentuación completa','Tildes diacríticas','Puntuación avanzada'] }
          }},
          '6': { nombre:'6º Primaria', ciclo:'C3', bloques: {
            LECTURA: { nombre:'Lectura y comprensión',  color:'#dc2626', icono:'👓', subBloques:['Todos los tipos textuales','Lectura crítica plena','Inferencias complejas','Análisis de fuentes','Alfabetización mediática','Verificación de información','Tránsito a ESO'] },
            D:       { nombre:'Gramática y ortografía', color:'#7c3aed', icono:'🔤', subBloques:['Análisis morfosintáctico','Oración simple completa','Tipos de oración','Voz activa y pasiva','Léxico','Cohesión textual','Reglas ortográficas completas'] }
          }}
        }
      },

      matematicas: {
        nombre:'Matemáticas', icono:'🔢',
        curriculum: {
          '1': { nombre:'1º Primaria', ciclo:'C1', bloques: {
            A:        { nombre:'Números y operaciones',    color:'#ec4899', icono:'🔢', subBloques:['Números del 0 al 10','Descomposición de números','Suma sin llevada','Resta sin llevada','Números ordinales'] },
            B:        { nombre:'Magnitudes y medidas',     color:'#f59e0b', icono:'📏', subBloques:['Longitud','Tiempo','Monedas','Capacidad'] },
            PROBLEMAS:{ nombre:'Resolución de problemas',  color:'#0ea5e9', icono:'🎯', subBloques:['Problemas con suma','Problemas con resta','Problemas con lenguaje natural simple','Estrategias de cálculo mental'] },
            C:        { nombre:'Geometría',                color:'#8b5cf6', icono:'🔺', subBloques:['Formas planas','Formas 3D','Posiciones en el espacio'] },
            D:        { nombre:'Estadística y probabilidad',color:'#06b6d4',icono:'📊', subBloques:['Recuento de datos','Tablas','Gráficos de barras'] }
          }},
          '2': { nombre:'2º Primaria', ciclo:'C1', bloques: {
            PROBLEMAS:{ nombre:'Resolución de problemas', color:'#0ea5e9', icono:'🎯', subBloques:['Problemas de suma con llevada','Problemas de resta sin llevada','Problemas con dos operaciones','Estrategias de cálculo mental','Representación gráfica de problemas'] },
            A:        { nombre:'Números y operaciones',   color:'#ec4899', icono:'🔢', subBloques:['Números del 0 al 100','Descomposición en decenas y unidades','Suma con llevada','Resta sin llevada','Multiplicación como suma repetida','Números pares e impares'] }
          }},
          '3': { nombre:'3º Primaria', ciclo:'C2', bloques: {
            PROBLEMAS:{ nombre:'Resolución de problemas', color:'#0ea5e9', icono:'🎯', subBloques:['Problemas de suma y resta combinadas','Problemas de multiplicación','Problemas de división','Estrategias de cálculo mental avanzado','Estimación de resultados'] },
            A:        { nombre:'Números y operaciones',   color:'#ec4899', icono:'🔢', subBloques:['Números del 0 al 1000','Descomposición centenas, decenas, unidades','Suma y resta hasta 999','Multiplicación (tablas 2-10)','División exacta','Números romanos'] }
          }},
          '4': { nombre:'4º Primaria', ciclo:'C2', bloques: {
            PROBLEMAS:{ nombre:'Resolución de problemas', color:'#0ea5e9', icono:'🎯', subBloques:['Problemas de varias operaciones','Problemas con números decimales','Problemas de medida','Estrategias de estimación','Problemas de razonamiento lógico'] },
            A:        { nombre:'Números y operaciones',   color:'#ec4899', icono:'🔢', subBloques:['Números del 0 al 10000','Números decimales','Suma, resta, multiplicación','División por números de 1 dígito','Fracciones básicas','Relación fracción-decimal'] }
          }},
          '5': { nombre:'5º Primaria', ciclo:'C3', bloques: {
            PROBLEMAS:{ nombre:'Resolución de problemas', color:'#0ea5e9', icono:'🎯', subBloques:['Problemas de múltiples operaciones','Problemas con fracciones','Problemas de proporcionalidad','Problemas de porcentajes','Problemas de geometría aplicada'] },
            A:        { nombre:'Números y operaciones',   color:'#ec4899', icono:'🔢', subBloques:['Números del 0 al 100000','Decimales hasta milésimas','Suma, resta, multiplicación, división','Fracciones equivalentes y operaciones','Porcentajes básicos','Potencias de 10'] }
          }},
          '6': { nombre:'6º Primaria', ciclo:'C3', bloques: {
            PROBLEMAS:{ nombre:'Resolución de problemas', color:'#0ea5e9', icono:'🎯', subBloques:['Problemas de todas las operaciones','Proporcionalidad directa','Porcentaje avanzado','Combinatoria básica','Lógica y razonamiento'] },
            A:        { nombre:'Números y operaciones',   color:'#ec4899', icono:'🔢', subBloques:['Números hasta 1000000','Decimales (operaciones completas)','Fracciones (todas las operaciones)','Porcentajes aplicados','Razones y proporciones','Notación científica'] }
          }}
        }
      }
    };

    // ─── ESTADO ──────────────────────────────────────────────────────────────
    const KEY = 'ae-org-v1-';
    const STATES = ['pendiente','listo','publicado'];

    function getState(id) { return localStorage.getItem(KEY + id) || 'pendiente'; }
    function setState(id, s) { localStorage.setItem(KEY + id, s); }

    function cycleChip(chip, id) {
      const cur = STATES.indexOf(chip.dataset.state || 'pendiente');
      const next = STATES[(cur + 1) % 3];
      chip.className = 'chip ' + next;
      chip.dataset.state = next;
      setState(id, next);
      updateStats();
    }

    // ─── STATS ───────────────────────────────────────────────────────────────
    function updateStats() {
      const chips = document.querySelectorAll('.chip');
      let pend = 0, listo = 0, pub = 0;
      chips.forEach(c => {
        const s = c.dataset.state || 'pendiente';
        if (s === 'listo') listo++;
        else if (s === 'publicado') pub++;
        else pend++;
      });
      document.getElementById('st-pend').textContent  = pend  + ' pendientes';
      document.getElementById('st-listo').textContent = listo + ' listos';
      document.getElementById('st-pub').textContent   = pub   + ' publicados';
    }

    // ─── CONTROLS ────────────────────────────────────────────────────────────
    function expandAll()  { document.querySelectorAll('.ca').forEach(s => s.classList.add('open')); }
    function collapseAll(){ document.querySelectorAll('.ca').forEach(s => s.classList.remove('open')); }
    function resetAll() {
      if (!confirm('¿Reiniciar todos los estados a Pendiente?')) return;
      Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k));
      document.querySelectorAll('.chip').forEach(c => {
        c.className = 'chip pendiente';
        c.dataset.state = 'pendiente';
      });
      updateStats();
    }

    // ─── BUILD ───────────────────────────────────────────────────────────────
    function build() {
      const wrap = document.getElementById('organigrama');
      let totalBl = 0, totalTm = 0;

      Object.entries(ASIG).forEach(([asigKey, asig]) => {
        let asigBl = 0, asigTm = 0;
        Object.values(asig.curriculum).forEach(c => {
          const bl = Object.values(c.bloques);
          asigBl += bl.length;
          bl.forEach(b => asigTm += b.subBloques.length);
        });
        totalBl += asigBl; totalTm += asigTm;

        // ── Subject panel ──
        const panel = document.createElement('div');
        panel.className = 'sp ' + asigKey;

        // Subject header
        const sh = document.createElement('div');
        sh.className = 'sp-head';
        sh.innerHTML =
          '<span class="sp-icon">' + asig.icono + '</span>' +
          '<div>' +
            '<div class="sp-name">' + asig.nombre + '</div>' +
            '<div class="sp-meta">' + asigBl + ' bloques · ' + asigTm + ' temas</div>' +
          '</div>' +
          '<span class="sp-cnt">' + asigBl + ' bloq.</span>';
        panel.appendChild(sh);

        // ── Course accordions ──
        Object.entries(asig.curriculum).forEach(([cKey, curso]) => {
          const cc = CICLO[curso.ciclo];
          const blArr = Object.entries(curso.bloques);
          const tmCount = blArr.reduce((s, [, b]) => s + b.subBloques.length, 0);
          const isTwo = blArr.length === 2;

          const sec = document.createElement('div');
          sec.className = 'ca';

          const tog = document.createElement('button');
          tog.className = 'ca-toggle';
          tog.innerHTML =
            '<span class="ca-num" style="color:' + cc.color + '">' + cKey + 'º</span>' +
            '<div class="ca-info">' +
              '<div class="ca-nombre">' + curso.nombre + '</div>' +
              '<div class="ca-row">' + cc.label + ' &nbsp;·&nbsp; ' + blArr.length + ' bloque' + (blArr.length > 1 ? 's' : '') + ' &nbsp;·&nbsp; ' + tmCount + ' temas</div>' +
            '</div>' +
            '<span class="ca-chev">›</span>';
          tog.onclick = () => sec.classList.toggle('open');

          const body = document.createElement('div');
          body.className = 'ca-body';

          blArr.forEach(([bKey, b], bi) => {
            const pill = isTwo ? (bi === 0 ? '★ Eje principal' : '★ Eje secundario') : null;

            const br = document.createElement('div');
            br.className = 'br';
            br.style.borderColor = b.color + '50';

            const bh = document.createElement('div');
            bh.className = 'br-head';
            bh.style.background = b.color + '14';
            bh.innerHTML =
              '<span class="br-ico">' + b.icono + '</span>' +
              '<span class="br-name" style="color:' + b.color + '">' + b.nombre + '</span>' +
              (pill ? '<span class="br-pill" style="background:' + b.color + '1a;color:' + b.color + '">' + pill + '</span>' : '') +
              '<span class="br-cnt">' + b.subBloques.length + ' temas</span>';

            const chips = document.createElement('div');
            chips.className = 'sbc';

            b.subBloques.forEach((sb, si) => {
              const id = asigKey + '-' + cKey + '-' + bKey + '-' + si;
              const st = getState(id);
              const chip = document.createElement('span');
              chip.className = 'chip ' + st;
              chip.dataset.state = st;
              chip.textContent = sb;
              chip.title = 'Clic: Pendiente → Listo → Publicado';
              chip.onclick = function() { cycleChip(this, id); };
              chips.appendChild(chip);
            });

            br.appendChild(bh);
            br.appendChild(chips);
            body.appendChild(br);
          });

          sec.appendChild(tog);
          sec.appendChild(body);
          panel.appendChild(sec);
        });

        wrap.appendChild(panel);
      });

      document.getElementById('st-bl').textContent  = totalBl;
      document.getElementById('st-tot').textContent = totalTm;
      updateStats();
    }

    build();

    // Expandir 1º de cada asignatura por defecto
    document.querySelectorAll('.ca:first-of-type').forEach(s => s.classList.add('open'));
  </script>
</body>
</html>
