<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mates 3.3: Series de Pensamiento - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: 'Kalam', cursive; padding: 15px 35px; -webkit-print-color-adjust: exact; }
        .btn-print { position: fixed; top: 10px; right: 10px; background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; z-index: 100; font-family: sans-serif; }
        @media print { .btn-print { display: none; } }
        .serie { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 35px; }
        .bloque { width: 50pt; height: 50pt; border: 2pt solid #eee; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 25pt; }
        .incognita { border: 2pt dashed #2980b9; background: #fcfcfc; }
    </style>
</head>
<body>
    <button class="btn-print" onclick="window.print()">📄 IMPRIMIR</button>
    <h3 style="text-align:center; text-decoration: underline;">Series de Inteligencia</h3>
    <p style="text-align:center; font-size: 14pt;">Dibuja o escribe lo que toca a continuación en cada serie.</p>

    <div class="serie">
        <div class="bloque">🍎</div><div class="bloque">🍐</div><div class="bloque">🍎</div><div class="bloque">🍐</div><div class="bloque incognita"></div>
    </div>

    <div class="serie">
        <div class="bloque">2</div><div class="bloque">4</div><div class="bloque">6</div><div class="bloque">8</div><div class="bloque incognita"></div>
    </div>

    <div class="serie">
        <div class="bloque">🔼</div><div class="bloque">⏺️</div><div class="bloque">🔼</div><div class="bloque">⏺️</div><div class="bloque incognita"></div>
    </div>

    <div class="serie">
        <div class="bloque">1</div><div class="bloque">2</div><div class="bloque">1</div><div class="bloque">2</div><div class="bloque incognita"></div>
    </div>
</body>
</html>
