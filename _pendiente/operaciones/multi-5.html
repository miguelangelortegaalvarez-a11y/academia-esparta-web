<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multiplicaciones 3x2 - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; background: #f4f4f4; font-family: 'Kalam', cursive; -webkit-print-color-adjust: exact; }
        
        .page {
            width: 210mm; min-height: 297mm; padding: 15mm; margin: 10mm auto;
            background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative; page-break-after: always; box-sizing: border-box;
        }

        @media print {
            body { background: white; }
            .page { margin: 0; box-shadow: none; width: 100%; }
            .btn-print { display: none; }
        }

        .header { display: flex; justify-content: space-between; border-bottom: 2pt solid #0e9343; padding-bottom: 5pt; margin-bottom: 15pt; font-family: sans-serif; text-transform: uppercase; font-size: 8pt; font-weight: bold; color: #0e9343; }
        .datos { display: flex; justify-content: space-between; margin-bottom: 20pt; font-size: 11pt; }
        .campo { border-bottom: 1pt dashed #ccc; flex-grow: 1; margin-left: 5pt; height: 14pt; }
        .titulo-ficha { text-align: center; color: #063c24; margin-bottom: 25pt; border: 2pt solid #0e9343; display: inline-block; padding: 5pt 15mm; position: relative; left: 50%; transform: translateX(-50%); border-radius: 10px; }

        .btn-print { position: fixed; top: 20px; right: 20px; background: #0e9343; color: white; border: none; padding: 15px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        /* REJILLA ACTUALIZADA: 4 columnas para eliminar los espacios vacíos laterales */
        .grid-ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 60pt 10pt; padding-top: 10pt; }

        .op-v { display: flex; flex-direction: column; align-items: flex-end; font-size: 26pt; font-weight: bold; position: relative; width: 95pt; margin: auto; }
        .op-v .linea { width: 100%; border-bottom: 2.5pt solid black; margin: 3pt 0; }
        .op-v .signo { position: absolute; left: 0pt; bottom: 32pt; font-size: 20pt; }
        .numero { letter-spacing: 5pt; padding-right: 2pt; }

        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 80pt; color: rgba(14, 147, 67, 0.03); z-index: 0; pointer-events: none; font-family: sans-serif; }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR PACK 3x2 (4 FOLIOS)</button>

    <script>
        function generarNum(cifras) {
            let n = "";
            for(let i=0; i<cifras; i++) {
                n += (Math.floor(Math.random() * 9) + 1).toString();
            }
            return n;
        }

        function crearFicha(folio, titulo) {
            document.write(`
                <div class="page">
                    <div class="watermark">ESPARTA</div>
                    <div class="header"><span>FICHA ${folio} - MULTIPLICACIÓN</span><span>ACADEMIA ESPARTA</span></div>
                    <div class="datos"><div style="width: 60%; display: flex;">Alumno: <div class="campo"></div></div><div style="width: 30%; display: flex;">Fecha: <div class="campo"></div></div></div>
                    <div class="titulo-ficha"><h3>${titulo}</h3></div>
                    <div class="grid-ops">
            `);
            
            // 16 operaciones por página (4x4)
            for(let i=0; i<16; i++) {
                let n1 = generarNum(3);
                let n2 = generarNum(2);
                
                document.write(`
                    <div class="op-v">
                        <span class="numero">${n1}</span>
                        <span class="signo">x</span>
                        <span class="numero">${n2}</span>
                        <div class="linea"></div>
                    </div>
                `);
            }
            
            document.write(`</div></div>`);
        }

        for(let i=1; i<=4; i++){
            let numFolio = i.toString().padStart(2, '0');
            crearFicha(numFolio, "MULTIPLICACIONES 3x2");
        }
    </script>

</body>
</html>
