<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juegos Interactivos – Academia Esparta</title>
  <meta name="description" content="Juegos educativos interactivos de Academia Esparta. Próximamente." />
  <link rel="canonical" href="https://academiaesparta.es/juegos.html" />
  <meta name="robots" content="noindex,follow" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.PNG" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #064e3b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .site-header {
      background: rgba(6,78,59,.85);
      backdrop-filter: blur(12px);
      padding: .85rem 2rem;
      position: fixed;
      width: 100%; top: 0; left: 0; z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(74,222,128,.12);
    }
    .site-logo {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: 1.3rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: -.02em;
    }
    .site-back {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      color: rgba(236,253,245,.65);
      font-size: .85rem;
      font-weight: 500;
      text-decoration: none;
      transition: color .2s;
    }
    .site-back:hover { color: #4ade80; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8rem 2rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Aurora decorativa */
    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .a1 { width: 500px; height: 500px; background: rgba(74,222,128,.12); top: -100px; left: -100px; animation: drift 28s ease-in-out infinite alternate; }
    .a2 { width: 400px; height: 400px; background: rgba(16,185,129,.09); bottom: 0; right: -80px; animation: drift 22s ease-in-out infinite alternate-reverse; }
    @keyframes drift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(40px,30px) scale(1.08)} }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      border: 1px solid rgba(74,222,128,.22);
      background: rgba(74,222,128,.07);
      border-radius: 9999px;
      padding: .35rem 1rem;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      color: rgba(167,243,208,.85);
      text-transform: uppercase;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }
    .pulse {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      letter-spacing: -.03em;
      line-height: 1.1;
      color: #fff;
      margin-bottom: 1.25rem;
      position: relative;
      z-index: 1;
    }
    h1 em {
      font-style: italic;
      color: #4ade80;
    }

    p {
      font-size: clamp(.95rem, 2vw, 1.1rem);
      color: rgba(236,253,245,.65);
      line-height: 1.7;
      max-width: 520px;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: #fff;
      color: #064e3b;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .95rem;
      padding: .9rem 2.2rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      position: relative;
      z-index: 1;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(74,222,128,.25); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: .8rem;
      color: rgba(236,253,245,.35);
      border-top: 1px solid rgba(74,222,128,.08);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">Academia Esparta</a>
    <a href="/" class="site-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al inicio
    </a>
  </header>

  <main>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>

    <div class="eyebrow">
      <span class="pulse"></span>
      EN PREPARACIÓN
    </div>

    <h1>Juegos<br><em>muy pronto</em></h1>

    <p>
      Estamos preparando una colección de juegos educativos interactivos
      para practicar lectura, matemáticas e inglés de forma diferente.
    </p>

    <a href="/materiales.html" class="cta">
      Ver fichas imprimibles
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </main>

  <footer>© 2026 Academia Esparta · Torremolinos</footer>

</body>
</html>
