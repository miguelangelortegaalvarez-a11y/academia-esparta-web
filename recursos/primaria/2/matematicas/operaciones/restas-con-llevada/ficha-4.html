<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restas con llevada · 2º Primaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Beginner:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Edu SA Beginner', cursive; background: #fff; color: #000; padding: 2rem 1.5rem 1rem; max-width: 780px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: .5rem; }
    .back-btn { color: #333; font-size: .8rem; text-decoration: none; border: 1px solid #ccc; padding: .3rem .8rem; border-radius: 999px; font-family: sans-serif; }
    .print-btn { background: #222; color: #fff; font-size: .8rem; border: none; padding: .3rem .8rem; border-radius: 999px; cursor: pointer; font-family: sans-serif; }
    .header { margin-bottom: 5px; text-align: center; }
    .academia-nombre { font-family: 'Edu SA Beginner', cursive; font-size: 22px; font-weight: 700; color: #000; display: block; margin-bottom: 1px; }
    .ficha-ref { font-family: sans-serif; font-size: 9.5px; color: #555; display: block; margin-bottom: 4px; }
    .datos-alumno { display: flex; gap: 30px; margin-bottom: 3px; text-align: left; }
    .dato { display: flex; align-items: center; gap: 6px; font-size: 12px; flex: 1; }
    .dato label { white-space: nowrap; font-weight: 600; }
    .dato .linea { flex: 1; border-bottom: 1px solid #000; height: 13px; }
    .separador { border: none; border-top: 1.5px solid #000; margin-bottom: 7px; }
    .tipo-badge { display: inline-flex; align-items: center; gap: 6px; border: 2px solid #000; border-radius: 999px; padding: 2px 13px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }

    .ej-enunciado { font-size: 14px; font-weight: 700; margin-bottom: 14px; line-height: 1.3; }
    .ej-enunciado .num { font-family: sans-serif; font-weight: 800; margin-right: 4px; }

    /* Rejilla 4 columnas × 4 filas = 16 restas */
    .sumas-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 46px; justify-items: center; margin-top: 6px; }

    .op { font-family: sans-serif; font-weight: 700; }
    .op .fila { display: grid; grid-template-columns: 22px 26px 26px; align-items: center; font-size: 25px; }
    .op .fila span { text-align: center; }
    .op .signo { font-weight: 800; font-size: 22px; }
    .op .circ-fila { display: grid; grid-template-columns: 22px 26px 26px; margin-bottom: 4px; }
    .op .circulo { grid-column: 2; width: 24px; height: 24px; border: 1.5px solid #000; border-radius: 50%; justify-self: center; }
    .op .barra { grid-column: 2 / 4; border-top: 2.5px solid #000; height: 34px; }

    .footer { margin-top: 14px; padding-top: 4px; border-top: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
    .footer-marca { font-family: sans-serif; font-size: 9.5px; color: #666; }
    .footer-msg { font-size: 12px; font-weight: 700; }

    @media print {
      .topbar { display: none !important; }
      body { padding: 0 !important; max-width: 15cm !important; margin: 2cm auto 1.5cm !important; filter: grayscale(100%); }
      * { color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @page { size: A4 portrait; margin: 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="../../../../../../materiales.html">← Volver</a>
    <button class="print-btn" onclick="window.print()">🖨 Imprimir</button>
  </div>

  <div class="header">
    <span class="academia-nombre">Academia Esparta</span>
    <span class="ficha-ref">Matemáticas · 2º Primaria · Restas con llevada</span>
    <div class="datos-alumno">
      <div class="dato"><label>Nombre:</label><div class="linea"></div></div>
      <div class="dato"><label>Fecha:</label><div class="linea"></div></div>
    </div>
  </div>
  <hr class="separador" />

  <div class="tipo-badge">➖ Restas con llevada</div>

  <div class="ej-enunciado"><span class="num">1.</span> Resuelve estas restas.</div>

  <div class="sumas-grid">
    <div class="op"><div class="fila"><span></span><span>5</span><span>3</span></div><div class="fila"><span class="signo">−</span><span>4</span><span>6</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>6</span><span>2</span></div><div class="fila"><span class="signo">−</span><span>3</span><span>7</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>7</span><span>1</span></div><div class="fila"><span class="signo">−</span><span>2</span><span>8</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>8</span><span>0</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>9</span></div><div class="fila"><span></span><div class="barra"></div></div></div>

    <div class="op"><div class="fila"><span></span><span>8</span><span>4</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>5</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>5</span><span>3</span></div><div class="fila"><span class="signo">−</span><span>4</span><span>7</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>6</span><span>2</span></div><div class="fila"><span class="signo">−</span><span>3</span><span>8</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>7</span><span>1</span></div><div class="fila"><span class="signo">−</span><span>2</span><span>9</span></div><div class="fila"><span></span><div class="barra"></div></div></div>

    <div class="op"><div class="fila"><span></span><span>8</span><span>0</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>1</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>8</span><span>4</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>6</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>5</span><span>4</span></div><div class="fila"><span class="signo">−</span><span>4</span><span>7</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>6</span><span>3</span></div><div class="fila"><span class="signo">−</span><span>3</span><span>8</span></div><div class="fila"><span></span><div class="barra"></div></div></div>

    <div class="op"><div class="fila"><span></span><span>7</span><span>2</span></div><div class="fila"><span class="signo">−</span><span>2</span><span>9</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>8</span><span>0</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>2</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>8</span><span>5</span></div><div class="fila"><span class="signo">−</span><span>1</span><span>6</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
    <div class="op"><div class="fila"><span></span><span>5</span><span>4</span></div><div class="fila"><span class="signo">−</span><span>4</span><span>8</span></div><div class="fila"><span></span><div class="barra"></div></div></div>
  </div>

  <div class="footer">
    <span class="footer-marca">Academia Esparta · Torremolinos</span>
    <span class="footer-msg">⭐ ¡Muy bien!</span>
  </div>
</body>
</html>
