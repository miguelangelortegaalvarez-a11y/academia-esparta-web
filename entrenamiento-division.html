<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento de Divisiones (2 Cifras) - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --primary-dark: #063c24; --bg: #f5fdf7; --wrong: #f16565; --blue: #1976d2; --highlight: #f16565; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .btn-volver { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 8px 20px; border-radius: 20px; cursor: pointer; text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: 0.3s; }
        .btn-volver:hover { background: var(--primary); color: white; }

        .game-container { background: white; width: 100%; max-width: 650px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; position: relative; }

        .info-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 15px; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }

        .guide-box { background-color: #e3f2fd; border: 2px solid var(--blue); color: var(--blue); padding: 15px; border-radius: 15px; margin-bottom: 25px; width: 90%; text-align: center; font-weight: 600; min-height: 50px; display: flex; align-items: center; justify-content: center; }

        .division-area { font-family: 'Roboto Mono', monospace; font-size: 3.5rem; margin-bottom: 20px; }
        .divisor-box { border-left: 4px solid #333; border-bottom: 4px solid #333; min-width: 80px; padding-left: 15px; }
        
        .math-input { font-family: 'Roboto Mono', monospace; font-size: 2.5rem; padding: 5px; text-align: center; border: 2px solid #ccc; border-radius: 10px; background: transparent; width: 1.5ch; outline: none; transition: 0.3s; }
        .math-input.correct { border-color: var(--primary); color: var(--primary) !important; font-weight: 700; background-color: #e8f5e9; }
        .math-input.wrong { border-color: var(--wrong); background-color: #ffebee; animation: shake 0.3s; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        #final-msg { display: none; text-align: center; padding: 20px; border: 3px solid var(--primary); border-radius: 15px; background: #e8f5e9; width: 90%; margin-top: 20px; }

        /* PREMIUM OVERRIDE */
        body { background: #064e3b !important; color: #ecfdf5 !important; font-family: 'Poppins', sans-serif !important; }
        .reveal { opacity: 1 !important; transform: none !important; }
        .header, .site-header { background: rgba(6,78,59,0.4) !important; backdrop-filter: blur(12px) !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; box-shadow: none !important; }
        .logo, .site-logo { font-family: 'Fraunces', serif !important; font-weight: 500 !important; color: #ffffff !important; }
        .back-link, .header-back, .site-back, .back-btn { color: rgba(236,253,245,0.8) !important; }
        .back-link:hover, .header-back:hover, .site-back:hover, .back-btn:hover { color: #4ade80 !important; }
        h1, h2, h3 { font-family: 'Fraunces', 'Cormorant Garamond', serif !important; font-weight: 400 !important; color: #ffffff !important; letter-spacing: -0.015em !important; line-height: 1.15 !important; }
        p, li { color: rgba(236,253,245,0.78) !important; font-family: 'Poppins', sans-serif !important; }
        a:not(.btn):not(.btn-cta):not(.btn-primary):not(.next-btn) { color: #4ade80 !important; }
        .hero, .page-hero { background: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(16,185,129,0.18), transparent 65%), radial-gradient(ellipse 50% 40% at 75% 70%, rgba(74,222,128,0.12), transparent 65%), #064e3b !important; }
        .card, .item, .section-box, .content-block, .activity-card, .test-card, .question-card { background: rgba(6,78,59,0.55) !important; border: 1px solid rgba(74,222,128,0.18) !important; color: #ecfdf5 !important; backdrop-filter: blur(8px); }
        .btn, .btn-primary, .btn-cta, .cta-btn, .next-btn, .primary-btn, button.primary { background: #ffffff !important; color: #064e3b !important; font-family: 'Poppins', sans-serif !important; font-weight: 600 !important; border-radius: 9999px !important; border: none !important; box-shadow: 0 10px 26px -8px rgba(74,222,128,0.4) !important; }
        .btn:hover, .btn-primary:hover, .btn-cta:hover, .next-btn:hover, .primary-btn:hover { transform: translateY(-2px); background: #ecfdf5 !important; }
        input, textarea, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(74,222,128,0.22) !important; color: #ecfdf5 !important; font-family: 'Poppins', sans-serif !important; }
        input::placeholder, textarea::placeholder { color: rgba(236,253,245,0.4) !important; }
    </style>
</head>
<body>

    <a href="entrenamiento-esparta.html" class="btn-volver">← Volver a Niveles</a>

    <div class="game-container">
        <div id="badge-nivel" class="info-badge">Entrenamiento Espartano</div>
        <div id="guide-text" class="guide-box">¡Prepárate!</div>

        <div class="division-area">
            <table>
                <tr>
                    <td id="dividend-display" style="padding-right: 20px;"></td>
                    <td class="divisor-box" id="divisor-display"></td>
                </tr>
                <tr>
                    <td style="text-align: right; padding-top: 10px;">
                        <input type="text" id="r-final" class="math-input" style="display:none;">
                    </td>
                    <td style="padding-top: 10px;">
                        <input type="text" id="q-final" class="math-input" style="display:none;">
                    </td>
                </tr>
            </table>
        </div>

        <div id="final-msg">
            <h2 style="color: var(--primary); margin: 0;">¡EXCELENTE TRABAJO! 🏆</h2>
            <p id="summary-text"></p>
            <button class="btn-volver" onclick="location.reload()" style="margin-top:10px;">Otra división →</button>
        </div>
    </div>

    <script>
        let config = {};
        let steps = [];
        let currentStep = 0;

        function init() {
            // Generamos dividendo de 2 cifras (10-99)
            const dividendo = Math.floor(Math.random() * 90) + 10;
            // Divisor de 1 cifra (2-9)
            const divisor = Math.floor(Math.random() * 8) + 2;
            
            const cociente = Math.floor(dividendo / divisor);
            const resto = dividendo % divisor;

            config = { dividendo, divisor, cociente, resto };

            document.getElementById('dividend-display').innerText = dividendo;
            document.getElementById('divisor-display').innerText = divisor;

            steps = [
                { 
                    id: 'q-final', 
                    val: cociente.toString(), 
                    msg: `¿Cuántas veces cabe ${divisor} en ${dividendo}? (Cociente)` 
                },
                { 
                    id: 'r-final', 
                    val: resto.toString(), 
                    msg: `¡Bien! Ahora, ¿cuánto sobra? (Resto)`, 
                    final: true 
                }
            ];
            
            showStep();
        }

        function showStep() {
            const step = steps[currentStep];
            const el = document.getElementById(step.id);
            document.getElementById('guide-text').innerText = step.msg;
            el.style.display = 'inline-block';
            el.focus();

            el.onkeyup = () => {
                if(el.value === step.val) {
                    el.classList.add('correct');
                    el.disabled = true;
                    if(step.final) {
                        finish();
                    } else {
                        currentStep++;
                        showStep();
                    }
                } else if(el.value.length >= step.val.length) {
                    el.classList.add('wrong');
                    setTimeout(() => { 
                        el.classList.remove('wrong'); 
                        el.value = ''; 
                    }, 500);
                }
            };
        }

        function finish() {
            document.getElementById('guide-text').style.display = 'none';
            document.getElementById('final-msg').style.display = 'block';
            document.getElementById('summary-text').innerText = 
                `${config.dividendo} ÷ ${config.divisor} = ${config.cociente} (Resto: ${config.resto})`;
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        init();
    </script>
</body>
</html>
