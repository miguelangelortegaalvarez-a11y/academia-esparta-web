<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento División Paso a Paso: Alba del Cid</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #4CAF50; --bg: #f0f4f8; --text: #333; --wrong: #f44336; --guia: #e3f2fd; --guia-text: #1976d2; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .academia-header { text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--primary); padding-bottom: 10px; width: 100%; max-width: 600px; }
        .academia-header h1 { color: var(--primary); margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .game-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; position: relative; }

        .guide-box { background-color: var(--guia); border: 2px solid var(--guia-text); color: var(--guia-text); padding: 15px; border-radius: 15px; margin-bottom: 30px; width: 90%; text-align: center; position: relative; font-weight: 600; font-size: 1.1rem; line-height: 1.4; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .guide-box::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 15px solid var(--guia-text); }

        .division-wrapper { position: relative; font-family: 'Roboto Mono', monospace; font-size: 3.5rem; color: #333; margin-bottom: 20px; margin-top: 10px; }
        .arco-superior { position: absolute; top: -10px; left: -5px; width: 2.2ch; height: 15px; border: 5px solid var(--wrong); border-bottom: none; border-radius: 20px 20px 0 0; z-index: 10; transition: opacity 0.5s; }

        .division-table { border-collapse: collapse; table-layout: fixed; }
        .division-table td { padding: 5px; text-align: center; vertical-align: middle; position: relative; }
        
        .dividend { font-size: 3.8rem; letter-spacing: 2px; text-align: left; padding-right: 20px; }
        .divisor-box { border-left: 5px solid #333; border-bottom: 5px solid #333; min-width: 80px; }
        .quotient-area { color: var(--primary); font-size: 3.5rem; padding-top: 10px; }

        .math-input { font-family: 'Roboto Mono', monospace; font-size: 2.8rem; padding: 2px; text-align: center; border: 3px solid #ccc; border-radius: 8px; transition: 0.3s; background: transparent; color: #333; outline: none; }
        .math-input.correct { border-color: var(--primary); color: #2e7d32 !important; font-weight: 700; background-color: #e8f5e9; }
        .math-input.wrong { border-color: var(--wrong); background-color: #ffebee; animation: shake 0.3s; }

        /* Espaciado de los inputs */
        #input-42 { width: 2.5ch; display: none; position: absolute; left: 0px; top: 10px; }
        #input-resto-3 { width: 1.2ch; display: none; position: absolute; left: 1.1ch; top: 15px; }
        #input-baja-6 { width: 1.2ch; display: none; position: absolute; left: 2.2ch; top: 15px; }
        #input-resto-final { width: 1.2ch; display: none; position: absolute; left: 2.2ch; top: 25px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        #final-msg { display: none; text-align: center; margin-top: 20px; padding: 20px; border: 2px solid var(--primary); border-radius: 15px; background-color: #e8f5e9; width: 100%; }
    </style>
</head>
<body>

    <div class="academia-header">
        <h1>ACADEMIA ESPARTA</h1>
        <p style="color:#666; font-weight:600;">Preparación examen Alba</p>
    </div>

    <div class="game-container">
        <div id="guide-text" class="guide-box">
            Venga, Alba, piensa... ¿Por cuánto multiplico 6 para que me dé 45 o se acerque sin pasarse?<br>(Mira el arquito rojo 😉)
        </div>

        <div class="division-wrapper">
            <div id="arco" class="arco-superior"></div>
            <table class="division-table">
                <tr>
                    <td class="dividend">456</td>
                    <td class="divisor-box">6</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="input-42" class="math-input" maxlength="2" autocomplete="off">
                    </td>
                    <td class="quotient-area">
                        <input type="text" id="cociente-1" class="math-input" maxlength="1" autocomplete="off" style="width:1.2ch;">
                        <input type="text" id="cociente-2" class="math-input" maxlength="1" autocomplete="off" style="display:none; width:1.2ch;">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="input-resto-3" class="math-input" maxlength="1" autocomplete="off">
                        <input type="text" id="input-baja-6" class="math-input" maxlength="1" autocomplete="off">
                        <input type="text" id="input-resto-final" class="math-input" maxlength="1" autocomplete="off">
                    </td>
                    <td></td>
                </tr>
            </table>
        </div>

        <div id="final-msg">
            <div style="font-size: 1.8rem; font-weight: 700; color: var(--primary);">¡EXCELENTE TRABAJO, ALBA! 🏆</div>
            <p>Has terminado la división perfectamente. ¡Eres una experta!</p>
            <button style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:700;" onclick="location.reload()">Repetir</button>
        </div>
    </div>

    <script>
        // Secuencia estricta de instrucciones
        const steps = [
            { 
                id: 'cociente-1', 
                val: '7', 
                nextMsg: '¡Muy bien! Ahora, ¿cuánto es 6 x 7? Escribe el resultado debajo del 45.' 
            },
            { 
                id: 'input-42', 
                val: '42', 
                nextMsg: '¡Exacto! Ahora toca restar: ¿cuánto es la resta de 45 - 42? Ponlo abajo.' 
            },
            { 
                id: 'input-resto-3', 
                val: '3', 
                nextMsg: '¡Eso es! Ahora baja la siguiente cifra (el 6) para seguir con la división.' 
            },
            { 
                id: 'input-baja-6', 
                val: '6', 
                nextMsg: '¡Perfecto! Ya tenemos 36. ¿Por cuánto multiplico 6 para que me dé 36?' 
            },
            { 
                id: 'cociente-2', 
                val: '6', 
                nextMsg: '¡Genial! Y para terminar... ¿cuánto sobra de 36 a 36? Pon el resto final.' 
            },
            { 
                id: 'input-resto-final', 
                val: '0', 
                final: true 
            }
        ];

        let currentStepIndex = 0;

        function runStep(index) {
            const step = steps[index];
            const input = document.getElementById(step.id);
            
            input.style.display = 'inline-block';
            input.focus();

            // Quitamos el arco solo cuando Alba baja el 6
            if (step.id === 'input-baja-6') {
                document.getElementById('arco').style.opacity = '0';
            }

            input.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    if (input.value === step.val) {
                        // ACIERTO
                        input.classList.add('correct');
                        input.disabled = true;

                        if (step.final) {
                            document.getElementById('guide-text').style.display = 'none';
                            document.getElementById('final-msg').style.display = 'block';
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        } else {
                            // PASAMOS AL SIGUIENTE: Actualizamos mensaje y activamos siguiente input
                            currentStepIndex++;
                            document.getElementById('guide-text').innerHTML = step.nextMsg;
                            runStep(currentStepIndex);
                        }
                    } else {
                        // ERROR
                        input.classList.add('wrong');
                        setTimeout(() => input.classList.remove('wrong'), 500);
                    }
                }
            };
        }

        // Iniciar el juego
        runStep(0);
    </script>
</body>
</html>
