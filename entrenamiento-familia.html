<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Esparta: Generador Dinámico</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #4CAF50; --primary-dark: #2E7D32; --bg: #f0f4f8; --text: #333; --wrong: #f44336; --guia: #e3f2fd; --guia-text: #1976d2; --highlight: #f44336; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .academia-header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid var(--primary); padding-bottom: 15px; width: 100%; max-width: 600px; }
        .academia-header h1 { color: var(--primary-dark); margin: 0; font-size: 2.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
        .academia-header p { color: #666; font-weight: 600; margin: 5px 0 0; font-size: 1.1rem; }

        .game-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; position: relative; }

        .guide-box { background-color: var(--guia); border: 2px solid var(--guia-text); color: var(--guia-text); padding: 15px; border-radius: 15px; margin-bottom: 30px; width: 90%; text-align: center; position: relative; font-weight: 600; font-size: 1rem; line-height: 1.4; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .guide-box::after { content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 12px solid var(--guia-text); }

        .division-wrapper { position: relative; font-family: 'Roboto Mono', monospace; font-size: 2.8rem; color: #333; margin-bottom: 20px; }
        .division-table { border-collapse: collapse; table-layout: fixed; }
        .division-table td { padding: 5px; text-align: center; vertical-align: middle; position: relative; height: 60px; }
        
        .dividend { font-size: 3rem; letter-spacing: 2px; text-align: left; padding-right: 20px; }
        .dividend span { transition: color 0.3s ease; border-top: 4px solid transparent; padding-top: 3px; }
        .active-num { color: var(--highlight); border-top-color: var(--highlight) !important; }

        .divisor-box { border-left: 4px solid #333; border-bottom: 4px solid #333; min-width: 70px; }
        .quotient-area { color: var(--primary); font-size: 2.8rem; padding-top: 10px; }

        .math-input { font-family: 'Roboto Mono', monospace; font-size: 2.2rem; padding: 3px; text-align: center; border: 2px solid #ccc; border-radius: 8px; transition: 0.3s; background: transparent; color: #333; outline: none; }
        .math-input.correct { border-color: var(--primary); color: #2e7d32 !important; font-weight: 700; background-color: #e8f5e9; }
        .math-input.wrong { border-color: var(--wrong); background-color: #ffebee; animation: shake 0.3s; }

        .signo-menos { position: absolute; left: -25px; top: 10px; color: var(--highlight); font-size: 2.5rem; display: none; }
        .raya-resta { border-top: 3px solid #333; width: 100%; position: absolute; bottom: 0; left: 0; display: none; }

        #input-sub-4 { width: 1.2ch; display: none; position: absolute; left: 0.3ch; top: 10px; }
        #input-resto-1 { width: 1.2ch; display: none; position: absolute; left: 0.3ch; top: 10px; }
        #input-baja-8 { width: 1.2ch; display: none; position: absolute; left: 2.1ch; top: 10px; } 
        #input-sub-16 { width: 2.8ch; display: none; position: absolute; left: 0.3ch; top: 15px; letter-spacing: 4px; } 
        #input-resto-final { width: 1.2ch; display: none; position: absolute; left: 2.1ch; top: 25px; } 

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        #final-msg { display: none; text-align: center; margin-top: 20px; padding: 20px; border: 2px solid var(--primary); border-radius: 15px; background-color: #e8f5e9; width: 100%; }
        .btn-siguiente { position: absolute; bottom: 20px; right: 20px; background-color: var(--guia-text); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-family: 'Poppins'; font-weight: 600; cursor: pointer; transition: 0.3s; }

        /* PREMIUM OVERRIDE */
        body { background: #064e3b !important; color: #ecfdf5 !important; font-family: 'Poppins', sans-serif !important; }
        .reveal { opacity: 1 !important; transform: none !important; }
        .header, .site-header { background: rgba(6,78,59,0.4) !important; backdrop-filter: blur(12px) !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; box-shadow: none !important; }
        .logo, .site-logo { font-family: 'Fraunces', serif !important; font-weight: 500 !important; color: #ffffff !important; }
        .back-link, .header-back, .site-back, .back-btn { color: rgba(236,253,245,0.8) !important; }
        .back-link:hover, .header-back:hover, .site-back:hover, .back-btn:hover { color: #4ade80 !important; }
        h1, h2, h3 { font-family: 'Fraunces', 'Cormorant Garamond', serif !important; font-weight: 400 !important; color: #ffffff !important; letter-spacing: -0.015em !important; line-height: 1.15 !important; }
        p, li { color: rgba(236,253,245,0.78) !important; font-family: 'Poppins', sans-serif !important; }
        a:not(.btn):not(.btn-cta):not(.btn-primary):not(.next-btn):not(.btn-siguiente) { color: #4ade80 !important; }
        .hero, .page-hero { background: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(16,185,129,0.18), transparent 65%), radial-gradient(ellipse 50% 40% at 75% 70%, rgba(74,222,128,0.12), transparent 65%), #064e3b !important; }
        .card, .item, .section-box, .content-block, .activity-card, .test-card, .question-card { background: rgba(6,78,59,0.55) !important; border: 1px solid rgba(74,222,128,0.18) !important; color: #ecfdf5 !important; backdrop-filter: blur(8px); }
        .btn, .btn-primary, .btn-cta, .cta-btn, .next-btn, .primary-btn, .btn-siguiente, button.primary { background: #ffffff !important; color: #064e3b !important; font-family: 'Poppins', sans-serif !important; font-weight: 600 !important; border-radius: 9999px !important; border: none !important; box-shadow: 0 10px 26px -8px rgba(74,222,128,0.4) !important; }
        .btn:hover, .btn-primary:hover, .btn-cta:hover, .next-btn:hover, .primary-btn:hover, .btn-siguiente:hover { transform: translateY(-2px); background: #ecfdf5 !important; }
        input, textarea, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(74,222,128,0.22) !important; color: #ecfdf5 !important; font-family: 'Poppins', sans-serif !important; }
        input::placeholder, textarea::placeholder { color: rgba(236,253,245,0.4) !important; }
    </style>
</head>
<body>

    <div class="academia-header">
        <h1>ACADEMIA ESPARTA</h1>
        <p>Entrenamiento Infinito de Divisiones</p>
    </div>

    <div class="game-container">
        <div id="guide-text" class="guide-box">Generando nueva división...</div>

        <div class="division-wrapper">
            <table class="division-table">
                <tr>
                    <td class="dividend">
                        <span id="num-5"></span><span id="num-8"></span>
                    </td>
                    <td id="divisor-val" class="divisor-box"></td>
                </tr>
                <tr>
                    <td>
                        <span id="menos-1" class="signo-menos">−</span>
                        <input type="text" id="input-sub-4" class="math-input" maxlength="1" autocomplete="off">
                        <div id="raya-1" class="raya-resta"></div>
                    </td>
                    <td class="quotient-area">
                        <input type="text" id="cociente-1" class="math-input" maxlength="1" autocomplete="off" style="width:1.2ch;">
                        <input type="text" id="cociente-2" class="math-input" maxlength="1" autocomplete="off" style="display:none; width:1.2ch;">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div style="position: absolute; left: 0.3ch; top: 10px; display: flex; gap: 18px;">
                            <input type="text" id="input-resto-1" class="math-input" maxlength="1" autocomplete="off" style="width:1.2ch; display:none;">
                            <input type="text" id="input-baja-8" class="math-input" maxlength="1" autocomplete="off" style="width:1.2ch; display:none;">
                        </div>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        <span id="menos-2" class="signo-menos">−</span>
                        <input type="text" id="input-sub-16" class="math-input" maxlength="2" autocomplete="off">
                        <div id="raya-2" class="raya-resta"></div>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="input-resto-final" class="math-input" maxlength="2" autocomplete="off" style="width: 1.2ch;">
                    </td>
                    <td></td>
                </tr>
            </table>
        </div>

        <div id="final-msg">
            <div id="final-title" style="font-size: 1.8rem; font-weight: 700; color: var(--primary);"></div>
            <p id="final-text"></p>
            <button style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:700;" onclick="nuevaDivision()">¡Otra más! →</button>
        </div>

        <button class="btn-siguiente" onclick="nuevaDivision()">Siguiente →</button>
    </div>

    <script>
        let currentStepIndex = 0;
        let steps = [];

        function nuevaDivision() {
            // Limpiar UI
            document.querySelectorAll('.math-input').forEach(i => {
                i.value = '';
                i.style.display = 'none';
                i.disabled = false;
                i.classList.remove('correct', 'wrong');
            });
            document.querySelectorAll('.signo-menos, .raya-resta').forEach(e => e.style.display = 'none');
            document.getElementById('final-msg').style.display = 'none';
            document.getElementById('guide-text').style.display = 'flex';
            document.getElementById('num-5').classList.remove('active-num');
            document.getElementById('num-8').classList.remove('active-num');

            // Lógica Aleatoria
            const divisor = Math.floor(Math.random() * 8) + 2; // 2 al 9
            const d1 = Math.floor(Math.random() * 8) + 1; // 1 al 9
            const d2 = Math.floor(Math.random() * 10); // 0 al 9

            // Asegurar que d1 sea mayor o igual al divisor para que la lógica de 2 pasos funcione
            if (d1 < divisor) return nuevaDivision();

            document.getElementById('num-5').innerText = d1;
            document.getElementById('num-8').innerText = d2;
            document.getElementById('divisor-val').innerText = divisor;
            document.getElementById('num-5').classList.add('active-num');

            // Cálculos
            const q1 = Math.floor(d1 / divisor);
            const sub1 = q1 * divisor;
            const res1 = d1 - sub1;
            const bajarNum = d2;
            const formado = parseInt(`${res1}${d2}`);
            const q2 = Math.floor(formado / divisor);
            const sub2 = q2 * divisor;
            const resFinal = formado - sub2;

            steps = [
                { id: 'cociente-1', val: q1.toString(), nextMsg: `¡Bien! Ahora, ¿cuánto es ${divisor} x ${q1}? Ponlo debajo del ${d1}.` },
                { id: 'input-sub-4', val: sub1.toString(), nextMsg: `Eso es. Restamos: ${d1} menos ${sub1}... ¿cuánto sobra?` },
                { id: 'input-resto-1', val: res1.toString(), nextMsg: `¡Correcto! Ahora bajamos el ${d2} para acompañar al ${res1}.` },
                { id: 'input-baja-8', val: d2.toString(), nextMsg: `¡Mira, se ha formado el ${formado}! ¿Qué número x ${divisor} se acerca a ${formado}?` },
                { id: 'cociente-2', val: q2.toString(), nextMsg: `¡Súper! Multiplica ${divisor} x ${q2} y ponlo debajo.` },
                { id: 'input-sub-16', val: sub2.toString(), nextMsg: `¡Último paso! Restamos de ${sub2} hasta ${formado}... ¿cuánto queda?` },
                { id: 'input-resto-final', val: resFinal.toString(), final: true, res: `${q1}${q2}`, resto: resFinal }
            ];

            currentStepIndex = 0;
            document.getElementById('guide-text').innerHTML = `¡Hola Alba! Empezamos por el ${d1}. ¿Por cuánto multiplico ${divisor} para acercarme sin pasarme?`;
            runStep(0);
        }

        function runStep(index) {
            const step = steps[index];
            const input = document.getElementById(step.id);
            input.style.display = 'inline-block';
            input.focus();

            if (step.id === 'input-baja-8') {
                document.getElementById('num-5').classList.remove('active-num');
                document.getElementById('num-8').classList.add('active-num');
            }
            if (step.id === 'cociente-2') {
                document.getElementById('num-8').classList.remove('active-num');
            }

            input.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    if (input.value === step.val) {
                        input.classList.add('correct');
                        input.disabled = true;

                        if(step.id === 'input-sub-4') {
                            document.getElementById('menos-1').style.display = 'block';
                            document.getElementById('raya-1').style.display = 'block';
                        }
                        if(step.id === 'input-sub-16') {
                            document.getElementById('menos-2').style.display = 'block';
                            document.getElementById('raya-2').style.display = 'block';
                        }

                        if (step.final) {
                            document.getElementById('guide-text').style.display = 'none';
                            document.getElementById('final-msg').style.display = 'block';
                            document.getElementById('final-title').innerText = "¡ERES UNA MÁQUINA, ALBA! 🏆";
                            document.getElementById('final-text').innerText = `Has resuelto la división perfectamente. El cociente es ${step.res} y el resto es ${step.resto}.`;
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        } else {
                            currentStepIndex++;
                            document.getElementById('guide-text').innerHTML = step.nextMsg;
                            runStep(currentStepIndex);
                        }
                    } else {
                        input.classList.add('wrong');
                        setTimeout(() => input.classList.remove('wrong'), 500);
                    }
                }
            };
        }

        nuevaDivision();
    </script>
</body>
</html>
