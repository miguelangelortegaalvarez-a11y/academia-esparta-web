<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios Química - Academia Esparta</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
        .page { width: 210mm; min-height: 297mm; padding: 20mm; margin: 10mm auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Encabezado */
        .header { border-bottom: 2px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .info-alumno { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-weight: bold; }
        .info-alumno div { border-bottom: 1px solid #ccc; padding: 5px; }

        /* Contenido */
        h2 { background: var(--primary); color: white; padding: 5px 15px; font-size: 18px; border-radius: 4px; margin-top: 25px; }
        .grid-ejercicios { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item { border: 1px solid #eee; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; }
        .item span { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .linea-respuesta { border-bottom: 1px dotted #000; margin-top: 10px; height: 20px; }

        /* Estilos para Impresión */
        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; width: 100%; }
            .no-print { display: none; }
            h2 { background: #eee !important; color: black !important; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="no-print" style="text-align: center; padding: 20px;">
    <button onclick="window.print()" style="padding: 15px 30px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
        🖨️ Imprimir Ficha para Alumnos
    </button>
</div>

<div class="page">
    <div class="header">
        <h1>ACADEMIA ESPARTA</h1>
        <div style="text-align: right;"><strong>Ficha de Química:</strong> Hidróxidos y Sales</div>
    </div>

    <div class="info-alumno">
        <div>Nombre: _________________________________</div>
        <div>Curso: _________________</div>
    </div>

    <h2>Sección 1: Hidróxidos (20 ejercicios)</h2>
    <div class="grid-ejercicios" id="hidroxidos"></div>

    <h2>Sección 2: Sales Binarias (20 ejercicios)</h2>
    <div class="grid-ejercicios" id="sales"></div>
</div>

<script>
    const datosHidroxidos = [
        "NaOH", "Hidróxido de potasio", "Ca(OH)2", "Hidróxido de aluminio", "Fe(OH)3", 
        "Hidróxido de hierro (II)", "Cu(OH)2", "Hidróxido de litio", "Mg(OH)2", "Hidróxido de plata",
        "Pb(OH)4", "Hidróxido de oro (III)", "Zn(OH)2", "Hidróxido de bario", "Ni(OH)2",
        "Hidróxido de cobalto (III)", "Sn(OH)2", "Hidróxido de cromo (III)", "KOH", "Hidróxido de amonio"
    ];

    const datosSales = [
        "NaCl", "Cloruro de potasio", "MgCl2", "Sulfuro de hierro (II)", "KBr", 
        "Ioduro de plata", "FeCl3", "Fluoruro de calcio", "CuS", "Bromuro de aluminio",
        "PbI2", "Nitruro de magnesio", "LiF", "Sulfuro de sodio", "AgCl",
        "Cloruro de cobre (II)", "ZnS", "Ioduro de potasio", "AlCl3", "Bromuro de hierro (III)"
    ];

    function generar(lista, idContenedor) {
        const cont = document.getElementById(idContenedor);
        lista.forEach((item, i) => {
            cont.innerHTML += `
                <div class="item">
                    <span>Ejercicio ${i + 1}:</span>
                    <strong>${item}</strong>
                    <div class="linea-respuesta"></div>
                </div>
            `;
        });
    }

    generar(datosHidroxidos, "hidroxidos");
    generar(datosSales, "sales");
</script>

</body>
</html>
