<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batería de 30 Divisiones: Alba del Cid</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #4CAF50; --bg: #f0f4f8; --text: #333; --wrong: #f44336; --guia: #e3f2fd; --guia-text: #1976d2; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .academia-header { text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--primary); padding-bottom: 10px; width: 100%; max-width: 700px; }
        .academia-header h1 { color: var(--primary); margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .game-container { background: white; width: 100%; max-width: 700px; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; position: relative; }

        .guide-box { background-color: var(--guia); border: 2px solid var(--guia-text); color: var(--guia-text); padding: 15px; border-radius: 15px; margin-bottom: 40px; width: 90%; text-align: center; position: relative; font-weight: 600; font-size: 1.2rem; line-height: 1.4; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .guide-box::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 15px solid var(--guia-text); }

        .division-wrapper { position: relative; font-family: 'Roboto Mono', monospace; font-size: 4rem; color: #333; margin-bottom: 40px; }
        .arco-superior { position: absolute; top: -15px; left: 20px; width: 2.2ch; height: 18px; border: 6px solid var(--wrong); border-bottom: none; border-radius: 20px 20px 0 0; z-index: 10; transition: opacity 0.5s; }

        .division-table { border-collapse: collapse; table-layout: fixed; width: 450px; }
        .division-table td { padding: 15px; text-align: center; vertical-align: middle; position: relative; height: 80px; }
        
        .dividend { font-size: 4.5rem; letter-spacing: 5px; text-align: left; padding-right: 30px; }
        .divisor-box { border-left: 6px solid #333; border-bottom: 6px solid #333; min-width: 100px; }
        .quotient-area { color: var(--primary); font-size: 4rem; padding-top: 20px; }

        .math-input { font-family: 'Roboto Mono', monospace; font-size: 3rem; padding: 5px; text-align: center; border: 3px solid #ccc; border-radius: 10px; transition: 0.3s; background: transparent; color: #333; outline: none; }
        .math-input.correct { border-color: var(--primary); color: #2e7d32 !important; font-weight: 700; background-color: #e8f5e9; }
        .math-input.wrong { border-color: var(--wrong); background-color: #ffebee; animation: shake 0.3s; }

        #input-42 { width: 2.5ch; display: none; position: absolute; left: 15px; top: 15px; }
        #input-mult-2 { width: 2.5ch; display: none; position: absolute; left: 1.2ch; top: 15px; }
        
        .row-36 { letter-spacing: 0px; display: inline-flex; gap: 5px; position: absolute; left: 1.1ch; top: 15px; }
        .row-36 input { position: static; display: none; }

        #input-resto-final { width: 1.5ch; display: none; position: absolute; left: 2.6ch; top: 25px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        #final-msg { display: none; text-align: center; margin-top: 20px; padding: 25px; border: 3px solid var(--primary); border-radius: 20px; background-color: #e8f5e9; width: 100%; }
        .counter { margin-bottom: 10px; font-weight: 700; color: #666; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="academia-header">
        <h1>ACADEMIA ESPARTA</h1>
        <p style="color:#666; font-weight:600;">Preparación examen Alba</p>
    </div>

    <div class="counter" id="division-counter">División 1 de 30</div>

    <div class="game-container">
        <div id="guide-text" class="guide-box">Cargando desafío...</div>

        <div class="division-wrapper">
            <div id="arco" class="arco-superior"></div>
            <table class="division-table">
                <tr>
                    <td id="val-dividend" class="dividend">---</td>
                    <td id="val-divisor" class="divisor-box">-</td>
                </tr>
                <tr>
                    <td><input type="text" id="input-mult-1" class="math-input" maxlength="2" autocomplete="off"></td>
                    <td class="quotient-area">
                        <input type="text" id="cociente-1" class="math-input" maxlength="1" autocomplete="off" style="width:1.5ch; display:none;">
                        <input type="text" id="cociente-2" class="math-input" maxlength="1" autocomplete="off" style="display:none; width:1.5ch;">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="row-36" id="row-36" style="display:none;">
                            <input type="text" id="input-resto-1" class="math-input" style="width:1.2ch;" maxlength="1" autocomplete="off">
                            <input type="text" id="input-baja-6" class="math-input" style="width:1.2ch;" maxlength="1" autocomplete="off">
                        </div>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td><input type="text" id="input-mult-2" class="math-input" maxlength="2" autocomplete="off"></td>
                    <td></td>
                </tr>
                <tr>
                    <td><input type="text" id="input-resto-final" class="math-input" maxlength="2" autocomplete="off"></td>
                    <td></td>
                </tr>
            </table>
        </div>

        <div id="final-msg">
            <div id="final-title" style="font-size: 2rem; font-weight: 700; color: var(--primary);">¡EXCELENTE TRABAJO! 🏆</div>
            <p id="final-p">Has terminado esta división perfectamente.</p>
            <button id="btn-next" style="background:var(--primary); color:white; border:none; padding:15px 30px; border-radius:30px; cursor:pointer; font-weight:700;" onclick="nextDivision()">Siguiente división</button>
        </div>
    </div>

    <script>
        // DATOS DE LAS 30 DIVISIONES [Dividendo, Divisor]
        const bateria = [
            [456, 6], [549, 8], [258, 3], [745, 5], [148, 2], [639, 9], [324, 4], [856, 8], [917, 7], [525, 5],
            [489, 7], [352, 4], [678, 9], [895, 8], [127, 3], [946, 5], [431, 6], [289, 4], [754, 8], [365, 7],
            [542, 9], [211, 2], [888, 7], [643, 5], [199, 3], [444, 6], [777, 8], [999, 9], [555, 4], [222, 5]
        ];

        let currentDivIdx = 0;
        let currentSteps = [];
        let currentStepIdx = 0;

        function loadDivision(idx) {
            const [D, d] = bateria[idx];
            document.getElementById('division-counter').innerText = `División ${idx + 1} de 30`;
            document.getElementById('val-dividend').innerText = D;
            document.getElementById('val-divisor').innerText = d;
            
            // Cálculos lógicos para los pasos
            const d1 = parseInt(D.toString().substring(0, 2));
            const cBaja = D.toString().substring(2, 3);
            const q1 = Math.floor(d1 / d);
            const m1 = q1 * d;
            const r1 = d1 - m1;
            const d2 = parseInt(r1.toString() + cBaja);
            const q2 = Math.floor(d2 / d);
            const m2 = q2 * d;
            const rf = d2 - m2;

            currentSteps = [
                { id: 'cociente-1', val: q1.toString(), msg: `Venga, Alba... ¿Por cuánto multiplico ${d} para acercarme a ${d1}?` },
                { id: 'input-mult-1', val: m1.toString(), msg: `¡Genial! Ahora, ¿cuánto es ${d} x ${q1}? Ponlo debajo del ${d1}.` },
                { id: 'input-resto-1', val: r1.toString(), msg: `¡Eso es! Ahora resta: ¿cuánto es ${d1} - ${m1}? Ponlo abajo.` },
                { id: 'input-baja-6', val: cBaja, msg: `¡Muy bien! Ahora recuerda bajar la siguiente cifra (el ${cBaja}) para seguir.` },
                { id: 'cociente-2', val: q2.toString(), msg: `¡Perfecto! Ya tenemos ${d2}. ¿Por cuánto multiplico ${d} para acercarme?` },
                { id: 'input-mult-2', val: m2.toString(), msg: `¡Muy bien! ¿Cuánto es ${d} x ${q2}? Ponlo abajo para restar.` },
                { id: 'input-resto-final', val: rf.toString(), final: true, msg: `¡Y para terminar! ¿Cuánto sobra de la resta de ${d2} - ${m2}?` }
            ];

            // Reset visual
            document.getElementById('final-msg').style.display = 'none';
            document.getElementById('arco').style.opacity = '1';
            const inputs = document.querySelectorAll('.math-input');
            inputs.forEach(i => { i.value = ''; i.disabled = false; i.style.display = 'none'; i.classList.remove('correct', 'wrong'); });
            document.getElementById('row-36').style.display = 'none';
            
            currentStepIdx = 0;
            runStep(0);
        }

        function runStep(idx) {
            const step = currentSteps[idx];
            const input = document.getElementById(step.id);
            
            if(step.id === 'input-resto-1' || step.id === 'input-baja-6') {
                document.getElementById('row-36').style.display = 'inline-flex';
            }
            
            document.getElementById('guide-text').innerHTML = step.msg;
            input.style.display = 'inline-block';
            input.focus();

            if (step.id === 'input-baja-6') {
                document.getElementById('arco').style.opacity = '0';
            }

            input.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    if (input.value === step.val) {
                        input.classList.add('correct');
                        input.disabled = true;
                        if (step.final) {
                            showEnd();
                        } else {
                            currentStepIdx++;
                            runStep(currentStepIdx);
                        }
                    } else {
                        input.classList.add('wrong');
                        setTimeout(() => input.classList.remove('wrong'), 500);
                    }
                }
            };
        }

        function showEnd() {
            document.getElementById('guide-text').style.display = 'none';
            document.getElementById('final-msg').style.display = 'block';
            if (currentDivIdx === bateria.length - 1) {
                document.getElementById('final-title').innerText = "¡ERES UNA GUERRERA DE LOS NÚMEROS! 👑";
                document.getElementById('final-p').innerText = "Has completado las 30 divisiones. ¡Eres increíble!";
                document.getElementById('btn-next').innerText = "Volver a empezar";
            }
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function nextDivision() {
            currentDivIdx++;
            if (currentDivIdx >= bateria.length) currentDivIdx = 0;
            loadDivision(currentDivIdx);
            document.getElementById('guide-text').style.display = 'flex';
        }

        // Iniciar
        loadDivision(0);
    </script>
</body>
</html>
