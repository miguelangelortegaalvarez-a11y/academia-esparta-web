<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Espartano: El Tiro a Canasta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --esparta-verde: #0e9343; --esparta-oro: #f1c40f; }
        body { font-family: 'Kalam', cursive; background: #f4f9f4; padding: 20px; color: #333; }
        .contenedor { max-width: 800px; background: white; margin: auto; padding: 25px; border-radius: 15px; border: 2px solid var(--esparta-verde); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h1 { font-family: 'Bangers'; color: var(--esparta-verde); text-align: center; font-size: 35px; }
        .paso { background: #e8f5e9; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--esparta-oro); }
        .resultado { font-weight: bold; font-size: 20px; text-align: center; padding: 15px; border: 2px dashed red; color: #b71c1c; }
        canvas { background: #fff; margin: 20px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>🏀 Análisis de Trayectoria Parabólica</h1>
    
    <div class="paso">
        <strong>1. Datos del problema:</strong><br>
        Lanzador: (0, 2) | Vértice (Altura máx): (2, 3) | Canasta: (5.5, 2)
    </div>

    <canvas id="graficaTiro"></canvas>

    <div class="paso">
        <strong>2. Ecuación obtenida:</strong><br>
        Usando la forma $y = a(x-h)^2 + k$, llegamos a: <br>
        <span style="color:blue; font-size:1.2em">y = -0.25(x - 2)² + 3</span>
    </div>

    <div class="resultado" id="conclusion">
        Cargando conclusión...
    </div>
</div>

<script>
    const ctx = document.getElementById('graficaTiro').getContext('2d');
    const puntosTrayectoria = [];
    
    // Generar puntos de la parábola
    for (let x = 0; x <= 6; x += 0.1) {
        let y = -0.25 * Math.pow(x - 2, 2) + 3;
        if (y >= 0) puntosTrayectoria.push({x: x.toFixed(2), y: y.toFixed(2)});
    }

    new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: 'Trayectoria del balón',
                data: puntosTrayectoria,
                borderColor: '#0e9343',
                backgroundColor: 'rgba(14, 147, 67, 0.1)',
                fill: true,
                tension: 0.4
            }, {
                label: 'Lanzador (2m)',
                data: [{x: 0, y: 2}],
                pointBackgroundColor: 'blue',
                pointRadius: 8
            }, {
                label: 'Canasta (2m)',
                data: [{x: 5.5, y: 2}],
                pointBackgroundColor: 'red',
                pointRadius: 8,
                pointStyle: 'rectRot'
            }]
        },
        options: {
            scales: {
                x: { type: 'linear', position: 'bottom', title: {display: true, text: 'Distancia (m)'}, min: 0, max: 6 },
                y: { title: {display: true, text: 'Altura (m)'}, min: 0, max: 4 }
            }
        }
    });

    // Calcular altura en la canasta para la conclusión
    const xCanasta = 5.5;
    const yEnCanasta = -0.25 * Math.pow(xCanasta - 2, 2) + 3;
    
    document.getElementById('conclusion').innerHTML = 
        `❌ CONCLUSIÓN: A los 5.5m de distancia, la altura del balón es de ${yEnCanasta.toFixed(2)}m. <br> 
        ¡El tiro se queda muy corto y no entra en la canasta!`;
</script>

</body>
</html>
