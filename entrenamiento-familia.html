<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Esparta: Generador de Divisiones</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #4CAF50; --primary-dark: #2E7D32; --bg: #f0f4f8; --text: #333; --wrong: #f44336; --guia: #e3f2fd; --guia-text: #1976d2; --highlight: #f44336; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .academia-header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid var(--primary); padding-bottom: 15px; width: 100%; max-width: 600px; }
        .academia-header h1 { color: var(--primary-dark); margin: 0; font-size: 2.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }

        .game-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; position: relative; }

        .guide-box { background-color: var(--guia); border: 2px solid var(--guia-text); color: var(--guia-text); padding: 15px; border-radius: 15px; margin-bottom: 30px; width: 90%; text-align: center; position: relative; font-weight: 600; min-height: 60px; display: flex; align-items: center; justify-content: center; }

        .division-wrapper { position: relative; font-family: 'Roboto Mono', monospace; font-size: 2.8rem; color: #333; margin-bottom: 20px; }
        .division-table td { padding: 5px; text-align: center; vertical-align: middle; position: relative; height: 65px; }
        
        .dividend { font-size: 3.2rem; letter-spacing: 5px; text-align: left; padding-right: 20px; }
        .active-num { color: var(--highlight); border-top: 4px solid var(--highlight); padding-top: 2px; }

        .divisor-box { border-left: 4px solid #333; border-bottom: 4px solid #333; min-width: 80px; }
        .math-input { font-family: 'Roboto Mono', monospace; font-size: 2.2rem; padding: 3px; text-align: center; border: 2px solid #ccc; border-radius: 8px; background: transparent; width: 1.2ch; outline: none; }
        .math-input.correct { border-color: var(--primary); color: #2e7d32 !important; font-weight: 700; background-color: #e8f5e9; }
        .math-input.wrong { border-color: var(--wrong); background-color: #ffebee; animation: shake 0.3s; }

        .signo-menos { position: absolute; left: -30px; top: 10px; color: var(--highlight); font-size: 2.5rem; display: none; }
        .raya-resta { border-top: 3px solid #333; width: 100%; position: absolute; bottom: 0; left: 0; display: none; }

        #final-msg { display: none; text-align: center; margin-top: 20px; padding: 20px; border: 2px solid var(--primary); border-radius: 15px; background-color: #e8f5e9; width: 100%; }
        .btn-reset { background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: 700; margin-top: 15px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <div class="academia-header">
        <h1>ACADEMIA ESPARTA</h1>
        <p>Entrenamiento Infinito de Divisiones</p>
    </div>

    <div class="game-container">
        <div id="guide-text" class="guide-box">Cargando desafío...</div>

        <div class="division-wrapper">
            <table class="division-table">
                <tr>
                    <td class="dividend">
                        <span id="d1">5</span><span id="d2">8</span>
                    </td>
                    <td id="divisor" class="divisor-box">4</td>
                </tr>
                <tr>
                    <td>
                        <span id="menos-1" class="signo-menos">−</span>
                        <input type="text" id="sub-1" class="math-input" style="display:none;">
                        <div id="raya-1" class="raya-resta"></div>
                    </td>
                    <td>
                        <input type="text" id="q-1" class="math-input" style="display:none;">
                        <input type="text" id="q-2" class="math-input" style="display:none;">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div style="position: absolute; left: 0.3ch; top: 10px; display: flex; gap: 15px;">
                            <input type="text" id="r-1" class="math-input" style="display:none;">
                            <input type="text" id="baja-2" class="math-input" style="display:none;">
                        </div>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        <span id="menos-2" class="signo-menos">−</span>
                        <input type="text" id="sub-2" class="math-input" style="display:none; width:2.2ch;">
                        <div id="raya-2" class="raya-resta"></div>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td><input type="text" id="r-final" class="math-input" style="display:none;"></td>
                    <td></td>
                </tr>
            </table>
        </div>

        <div id="final-msg">
            <div style="font-size: 1.8rem; font-weight: 700; color: var(--primary);">¡MISIÓN CUMPLIDA! 🏆</div>
            <p id="result-summary"></p>
            <button class="btn-reset" onclick="initGame()">Siguiente División →</button>
        </div>
    </div>

    <script>
        let config = {};
        let currentStep = 0;
        let steps = [];

        function initGame() {
            // 1. Generar números aleatorios
            const divisor = Math.floor(Math.random() * 8) + 2; // 2 al 9
            const d1 = Math.floor(Math.random() * 8) + 1; // 1 al 9
            const d2 = Math.floor(Math.random() * 10); // 0 al 9
            const dividendo = parseInt(`${d1}${d2}`);

            // Asegurar que el primer número es divisible o mayor
