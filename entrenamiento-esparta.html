<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio de Operaciones - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --bg: #f5fdf7; --dark: #063c24; --accent: #1976d2; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        
        .btn-volver { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 8px 20px; border-radius: 20px; cursor: pointer; text-decoration: none; font-weight: 600; transition: 0.3s; margin-bottom: 20px; }
        .btn-volver:hover { background: var(--primary); color: white; }

        .menu-principal { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; max-width: 1000px; width: 100%; }
        
        .card-menu { background: white; width: 280px; padding: 2rem; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; cursor: pointer; transition: 0.3s; }
        .card-menu:hover { transform: translateY(-10px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .card-menu h3 { color: var(--primary); margin-bottom: 10px; }
        
        /* Estilos para la rejilla de niveles */
        .grid-niveles { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1200px; padding: 20px; }
        .card-nivel { background: white; padding: 1.5rem; border-radius: 15px; border: 1px solid #ddd; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-nivel h4 { color: var(--primary); margin: 0 0 10px 0; font-size: 1.2rem; }
        .card-nivel p { font-size: 0.85rem; color: #666; margin-bottom: 15px; }
        
        .btn-metodo { padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; border: 2px solid var(--primary); background: white; color: var(--primary); font-size: 0.8rem; margin: 0 5px; }
        .btn-metodo:hover { background: var(--primary); color: white; }
        .btn-sin { border-color: var(--accent); color: var(--accent); }
        .btn-sin:hover { background: var(--accent); color: white; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="nav-btns">
        <a href="index.html" id="btn-web" class="btn-volver">← Volver a la Web</a>
        <button id="btn-menu" class="btn-volver hidden" onclick="mostrarMenuInicial()">← Volver al Gimnasio</button>
    </div>

    <div class="header">
        <h1 id="titulo-dinamico">Gimnasio de Operaciones</h1>
    </div>

    <div id="contenedor-menu" class="menu-principal">
        <div class="card-menu" onclick="window.location.href='#' /* Próximamente sumas */">
            <h2 style="font-size: 3rem; margin: 0;">+</h2>
            <h3>Sumas</h3>
            <p>Entrena sumas con llevadas.</p>
        </div>
        <div class="card-menu" onclick="window.location.href='#' /* Próximamente restas */">
            <h2 style="font-size: 3rem; margin: 0;">-</h2>
            <h3>Restas</h3>
            <p>Practica restas pidiendo prestado.</p>
        </div>
        <div class="card-menu" onclick="cargarNivelesDivision()">
            <h2 style="font-size: 3rem; margin: 0;">÷</h2>
            <h3>Divisiones</h3>
            <p>12 niveles con y sin resta.</p>
        </div>
    </div>

    <div id="contenedor-niveles" class="grid-niveles hidden"></div>

    <script>
        function cargarNivelesDivision() {
            document.getElementById('contenedor-menu').classList.add('hidden');
            document.getElementById('btn-web').classList.add('hidden');
            document.getElementById('btn-menu').classList.remove('hidden');
            document.getElementById('titulo-dinamico').innerText = "Entrenamiento de Divisiones";
            
            const grid = document.getElementById('contenedor-niveles');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            // Generamos los 12 niveles
            for (let i = 1; i <= 12; i++) {
                let desc = "";
                let cifras = 1;
                if(i <= 4) { desc = "Divisor de 1 cifra"; cifras = 1; }
                else if(i <= 8) { desc = "Divisor de 2 cifras"; cifras = 2; }
                else { desc = "Divisor de 3 cifras"; cifras = 3; }

                const card = document.createElement('div');
                card.className = 'card-nivel';
                card.innerHTML = `
                    <h4>Nivel ${i}</h4>
                    <p>${desc}</p>
                    <div style="display: flex; justify-content: center;">
                        <button class="btn-metodo" onclick="irADivision(${i}, ${cifras}, 'con')">CON RESTA</button>
                        <button class="btn-metodo btn-sin" onclick="irADivision(${i}, ${cifras}, 'sin')">SIN RESTA</button>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function mostrarMenuInicial() {
            document.getElementById('contenedor-niveles').classList.add('hidden');
            document.getElementById('contenedor-menu').classList.remove('hidden');
            document.getElementById('btn-web').classList.remove('hidden');
            document.getElementById('btn-menu').classList.add('hidden');
            document.getElementById('titulo-dinamico').innerText = "Gimnasio de Operaciones";
        }

        function irADivision(nivel, cifras, metodo) {
            // Esta es la URL que enviará los datos al archivo del juego
            window.location.href = `entrenamiento-division.html?nivel=${nivel}&cifras=${cifras}&metodo=${metodo}`;
        }
    </script>
</body>
</html>
