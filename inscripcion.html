<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscripción | Academia Esparta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0e9343;
      --light: #f5fdf7;
      --dark: #063c24;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    header {
      background: var(--white);
      padding: 1rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .back-link {
      text-decoration: none;
      color: var(--dark);
      font-weight: 500;
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
    }

    .hero h1 {
      color: var(--primary);
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .hero p {
      max-width: 800px;
      margin: 0 auto;
      font-size: 1.05rem;
    }

    .form-wrapper {
      max-width: 1100px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
    }

    .form-card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 1rem;
    }

    .form-card iframe {
      width: 100%;
      min-height: 5900px;
      border: none;
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 1.8rem;
      }

      .form-card iframe {
        min-height: 5900px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">Academia Esparta</a>
      <a href="index.html" class="back-link">← Volver a la web</a>
    </div>
  </header>

  <section class="hero">
    <h1>Inscripción Academia Esparta</h1>
    <p>
      Completa el siguiente formulario para solicitar la inscripción en Academia Esparta.
      Cuando lo recibamos, revisaremos los datos y nos pondremos en contacto contigo lo antes posible.
    </p>
  </section>

  <section class="form-wrapper">
    <div class="form-card">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeUdqXX7Agaz24OVEQ5veok2J10vjELu8MrdmL10Jy9jUxtKA/viewform?embedded=true" width="640" height="5899" frameborder="0" marginheight="0" marginwidth="0">Cargando…</iframe>
    </div>
  </section>

</body>
</html>
