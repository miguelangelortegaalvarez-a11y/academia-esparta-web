<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <title>Parchís Espartano - Academia Esparta</title>
    <style>
        :root { --amarillo: #ffeb3b; --azul: #2196f3; --rojo: #f44336; --verde: #4caf50; --esparta: #333; }
        body { font-family: 'Open Sans', sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; margin: 0; touch-action: none; }
        
        .header { text-align: center; color: var(--verde); padding: 15px; }
        .header h1 { font-family: 'Montserrat'; margin: 0; text-transform: uppercase; }

        /* EL TABLERO */
        #contenedor-tablero {
            position: relative;
            width: 600px; height: 600px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Parcheesi_Board.svg/1024px-Parcheesi_Board.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border-radius: 10px;
            background-color: white;
        }

        /* LAS FICHAS */
        .ficha {
            width: 25px; height: 25px;
            border-radius: 50%;
            position: absolute;
            cursor: move;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .f-roja { background: var(--rojo); }
        .f-azul { background: var(--azul); }
        .f-amarilla { background: var(--amarillo); }
        .f-verde { background: var(--verde); }

        /* DADO */
        .controles { margin-top: 20px; display: flex; align-items: center; gap: 20px; background: white; padding: 15px 30px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #dado { font-size: 3rem; font-family: 'Montserrat'; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; background: var(--esparta); color: white; border-radius: 12px; }
        .btn-lanzar { padding: 15px 25px; background: var(--verde); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Montserrat'; text-transform: uppercase; }
        
        .instrucciones { margin-top: 15px; font-size: 0.9rem; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¡Gran Torneo de Parchís Familiar!</p>
</div>

<div id="contenedor-tablero">
    <div class="ficha f-roja" style="top: 50px; left: 50px;"></div>
    <div class="ficha f-roja" style="top: 50px; left: 85px;"></div>
    <div class="ficha f-roja" style="top: 85px; left: 50px;"></div>
    <div class="ficha f-roja" style="top: 85px; left: 85px;"></div>

    <div class="ficha f-azul" style="top: 50px; left: 485px;"></div>
    <div class="ficha f-azul" style="top: 50px; left: 520px;"></div>
    <div class="ficha f-azul" style="top: 85px; left: 485px;"></div>
    <div class="ficha f-azul" style="top: 85px; left: 520px;"></div>

    <div class="ficha f-amarilla" style="top: 485px; left: 50px;"></div>
    <div class="ficha f-amarilla" style="top: 485px; left: 85px;"></div>
    <div class="ficha f-amarilla" style="top: 520px; left: 50px;"></div>
    <div class="ficha f-amarilla" style="top: 520px; left: 85px;"></div>

    <div class="ficha f-verde" style="top: 485px; left: 485px;"></div>
    <div class="ficha f-verde" style="top: 485px; left: 520px;"></div>
    <div class="ficha f-verde" style="top: 520px; left: 485px;"></div>
    <div class="ficha f-verde" style="top: 520px; left: 520px;"></div>
</div>

<div class="controles">
    <button class="btn-lanzar" onclick="lanzarDado()">Lanzar Dado 🎲</button>
    <div id="dado">?</div>
</div>

<p class="instrucciones">Arrastra las fichas con el dedo o el ratón por el tablero.</p>

<script>
    // Lógica del Dado
    function lanzarDado() {
        const dadoElemento = document.getElementById('dado');
        let iteraciones = 0;
        const intervalo = setInterval(() => {
            dadoElemento.innerText = Math.floor(Math.random() * 6) + 1;
            iteraciones++;
            if (iteraciones > 10) {
                clearInterval(intervalo);
                const resultado = Math.floor(Math.random() * 6) + 1;
                dadoElemento.innerText = resultado;
                // Si sale un 6, mensaje de suerte
                if(resultado === 6) console.log("¡Espartano, vuelve a tirar!");
            }
        }, 50);
    }

    // Lógica para Arrastrar Fichas (Drag & Drop)
    const fichas = document.querySelectorAll('.ficha');
    let fichaActiva = null;

    fichas.forEach(ficha => {
        ficha.addEventListener('mousedown', iniciarArrastre);
        ficha.addEventListener('touchstart', iniciarArrastre, {passive: false});
    });

    function iniciarArrastre(e) {
        e.preventDefault();
        fichaActiva = this;
        document.addEventListener('mousemove', arrastrar);
        document.addEventListener('mouseup', detenerArrastre);
        document.addEventListener('touchmove', arrastrar, {passive: false});
        document.addEventListener('touchend', detenerArrastre);
    }

    function arrastrar(e) {
        if (!fichaActiva) return;
        
        let x, y;
        if (e.type === 'touchmove') {
            x = e.touches[0].clientX;
            y = e.touches[0].clientY;
        } else {
            x = e.clientX;
            y = e.clientY;
        }

        const rect = document.getElementById('contenedor-tablero').getBoundingClientRect();
        
        // Mantener la ficha dentro del tablero
        let posX = x - rect.left - 12;
        let posY = y - rect.top - 12;

        fichaActiva.style.left = posX + 'px';
        fichaActiva.style.top = posY + 'px';
    }

    function detenerArrastre() {
        fichaActiva = null;
        document.removeEventListener('mousemove', arrastrar);
        document.removeEventListener('mouseup', detenerArrastre);
        document.removeEventListener('touchmove', arrastrar);
        document.removeEventListener('touchend', detenerArrastre);
    }
</script>

</body>
</html>
