<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Entrenamiento Erik - Academia Esparta</title>
    <style>
        :root { --verde: #4CAF50; --azul: #2196f3; --rojo: #e74c3c; --gris: #f4f7f6; --blanco: #ffffff; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding-bottom: 50px; }
        .header { background: var(--blanco); color: var(--verde); text-align: center; padding: 20px; border-bottom: 5px solid var(--verde); }
        .header h1 { font-family: 'Montserrat'; font-size: 2.2rem; margin: 0; text-transform: uppercase; }
        .container { max-width: 750px; margin: 20px auto; background: var(--blanco); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-family: 'Montserrat'; }
        .vidas-count { background: var(--rojo); padding: 5px 10px; border-radius: 8px; font-weight: bold; }
        .progreso-bg { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progreso-fill { height: 100%; background: var(--verde); width: 0%; transition: 0.5s; }
        .pregunta { font-size: 1.5rem; font-weight: 700; color: #333; margin-bottom: 25px; min-height: 60px; }
        .opciones { display: grid; gap: 12px; }
        .opcion { padding: 18px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; text-align: left; font-weight: 600; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #f0f7ff; transform: translateX(5px); }
        .correcto { background-color: var(--verde) !important; color: white; border-color: #388E3C !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }
        .feedback-area { margin-top: 25px; text-align: center; font-weight: 800; font-size: 1.3rem; min-height: 2em; font-family: 'Montserrat'; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-10px);} 40%, 80% {transform: translateX(10px);} }
        .pantalla-final { display: none; text-align: center; padding: 20px; }
        .btn-accion { margin-top: 25px; padding: 15px 35px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: white; transition: 0.3s; text-transform: uppercase; }
    </style>
</head>
<body>

<header class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¡Hola Erik! Demuestra que eres un Guerrero Escolar</p>
</header>

<div class="container">
    <div class="status-bar">
        <div style="background: var(--azul); padding: 5px 10px; border-radius: 8px;">NIVEL <span id="num-nivel">1</span></div>
        <div style="color: #4CAF50;">✅ <span id="aciertos">0</span></div>
        <div class="vidas-count">🛡️ VIDAS: <span id="vidas">3</span></div>
        <div>🎯 <span id="p-actual">1</span>/10</div>
    </div>
    
    <div class="progreso-bg"><div class="progreso-fill" id="barra"></div></div>
    
    <div id="juego">
        <div class="pregunta" id="txt-pregunta">Cargando...</div>
        <div class="opciones" id="opciones-box"></div>
        <div id="feedback" class="feedback-area"></div>
    </div>

    <div class="pantalla-final" id="final">
        <h2 id="fin-titulo" style="font-size: 2rem;"></h2>
        <p id="fin-nota" style="font-size: 3rem; font-weight: 900; margin: 10px 0; color: var(--azul);"></p>
        <p id="fin-mensaje" style="font-style: italic; font-size: 1.4rem; margin: 20px 0; font-weight: 600;"></p>
        <button class="btn-accion" id="btn-next" style="background: var(--verde); display:none;" onclick="subirNivel()">SIGUIENTE NIVEL 🚀</button>
        <button class="btn-accion" id="btn-retry" style="background: var(--rojo); display:none;" onclick="reiniciarNivel()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nivel = 1;
    let pIndex = 0;
    let pts = 0;
    let err = 0;
    let preguntasNivelActual = [];

    const FRASE_BARCA = "¡Erik, eres más malo que el Barcelona en Champions! 😂";
    const FRASE_MBAPPE = "¡BRUTAL ERIK! ¡Eres mejor que Mbappé en el Real Madrid! 👑";

    const banco = {
        1: [
            { p: "Erik, ¿cuántos días tiene una semana?", o: ["5 días", "7 días", "10 días", "30 días"], c: 1 },
            { p: "¿Cuál es el color de las nubes cuando hay tormenta?", o: ["Blanco", "Azul", "Gris oscuro", "Amarillo"], c: 2 },
            { p: "¿Cuánto es 10 + 5?", o: ["12", "15", "20", "51"], c: 1 },
            { p: "¿Qué animal tiene el cuello muy largo para comer hojas?", o: ["Elefante", "Jirafa", "Cebra", "León"], c: 1 },
            { p: "¿Cuántos meses tiene un año entero?", o: ["10", "12", "14", "24"], c: 1 },
            { p: "¿Cuál de estos es un medio de transporte por aire?", o: ["Barco", "Coche", "Avión", "Tren"], c: 2 },
            { p: "¿Cómo se llama el lugar donde viven los peces?", o: ["Bosque", "Desierto", "Océano", "Montaña"], c: 2 },
            { p: "¿Cuántas patas tiene una hormiga?", o: ["4", "6", "8", "2"], c: 1 },
            { p: "¿Qué fruta es amarilla y les gusta a los monos?", o: ["Manzana", "Pera", "Plátano", "Sandía"], c: 2 },
            { p: "¿Cuál es el primer número de dos cifras?", o: ["1", "9", "10", "11"], c: 2 }
        ],
        2: [
            { p: "Nivel 2: ¿Cuánto es 20 + 20?", o: ["30", "40", "50", "60"], c: 1 },
            { p: "¿Qué planeta es la Tierra?", o: ["El Planeta Rojo", "El Planeta Azul", "El Planeta de Hielo", "El Sol"], c: 1 },
            { p: "¿Cómo se llama la cría de la gallina?", o: ["Ternero", "Pollito", "Potro", "Cachorro"], c: 1 },
            { p: "¿Qué sentido usamos para tocar un peluche?", o: ["Vista", "Oído", "Gusto", "Tacto"], c: 3 },
            { p: "¿Cuántos cm tiene medio metro?", o: ["10", "50", "100", "500"], c: 1 },
            { p: "¿En qué país estamos, Erik?", o: ["Francia", "Italia", "España", "Alemania"], c: 2 },
            { p: "¿Qué número viene después del 19?", o: ["18", "20", "21", "30"], c: 1 },
            { p: "¿Cuál es el animal más pesado del mundo?", o: ["Elefante", "Rinoceronte", "Ballena Azul", "Oso"], c: 2 },
            { p: "¿Cuántas estaciones tiene el año?", o: ["2", "4", "6", "12"], c: 1 },
            { p: "¿Qué usamos para escribir en la pizarra?", o: ["Lápiz", "Tiza", "Pincel", "Dedo"], c: 1 }
        ],
        3: [
            { p: "Nivel 3: ¿Cuánto es 100 - 50?", o: ["25", "40", "50", "60"], c: 2 },
            { p: "¿Qué gas necesitamos para respirar?", o: ["Humo", "Viento", "Oxígeno", "Helio"], c: 2 },
            { p: "¿Cómo se llama el médico que cura a los animales?", o: ["Dentista", "Veterinario", "Enfermero", "Policía"], c: 1 },
            { p: "¿Cuál es la capital de España?", o: ["Barcelona", "Madrid", "Valencia", "Sevilla"], c: 1 },
            { p: "¿Cuántos minutos tiene una hora?", o: ["30", "50", "60", "100"], c: 2 },
            { p: "¿Qué polígono tiene 4 lados iguales?", o: ["Triángulo", "Círculo", "Cuadrado", "Rombo"], c: 2 },
            { p: "¿Cómo se llama el satélite de la Tierra?", o: ["Marte", "Sol", "Luna", "Saturno"], c: 2 },
            { p: "¿Qué metal atrae el imán?", o: ["Madera", "Plástico", "Hierro", "Oro"], c: 2 },
            { p: "¿Quién pintó cuadros muy famosos como Picasso?", o: ["Un deportista", "Un pintor", "Un cantante", "Un chef"], c: 1 },
            { p: "¿Cuánto es 5 x 2?", o: ["7", "10", "15", "20"], c: 1 }
        ],
        4: [
            { p: "Nivel 4: ¿Qué continente tiene pirámides en Egipto?", o: ["Europa", "Asia", "África", "América"], c: 2 },
            { p: "¿Cómo se llama el proceso de las plantas?", o: ["Fotosíntesis", "Cocinar", "Beber", "Dormir"], c: 0 },
            { p: "¿Cuántos segundos tiene un minuto?", o: ["30", "60", "100", "24"], c: 1 },
            { p: "¿Cuál es el planeta más grande?", o: ["Marte", "Júpiter", "Tierra", "Venus"], c: 1 },
            { p: "¿Qué animal es un mamífero volador?", o: ["Águila", "Murciélago", "Mariposa", "Loro"], c: 1 },
            { p: "¿Quién es el autor de El Quijote?", o: ["Cervantes", "Lope de Vega", "Góngora", "Erik"], c: 0 },
            { p: "¿Cuál es el río más largo del mundo?", o: ["Amazonas", "Ebro", "Tajo", "Sena"], c: 0 },
            { p: "¿Cuántos años hay en un siglo?", o: ["10", "50", "100", "1000"], c: 2 },
            { p: "¿Qué hueso es el más largo?", o: ["Fémur", "Radio", "Cráneo", "Tibia"], c: 0 },
            { p: "¿Cuál es el metal más preciado?", o: ["Plata", "Cobre", "Oro", "Hierro"], c: 2 }
        ],
        5: [
            { p: "Nivel 5: ¿Cuánto es 125 + 125?", o: ["200", "250", "300", "500"], c: 1 },
            { p: "¿Cuál es la capital de Francia?", o: ["Londres", "Berlín", "París", "Roma"], c: 2 },
            { p: "¿En qué año llegó Colón a América?", o: ["1492", "1500", "1789", "1990"], c: 0 },
            { p: "¿Qué órgano bombea la sangre?", o: ["Cerebro", "Estómago", "Corazón", "Hígado"], c: 2 },
            { p: "¿Cómo se llama el triángulo de 3 lados distintos?", o: ["Isósceles", "Equilátero", "Escaleno", "Recto"], c: 2 },
            { p: "¿Qué gas expulsamos al respirar?", o: ["Oxígeno", "Nitrógeno", "CO2", "Helio"], c: 2 },
            { p: "¿Qué ciudad tiene la Torre Eiffel?", o: ["Madrid", "París", "Nueva York", "Tokio"], c: 1 },
            { p: "¿Cuántos lados tiene un hexágono?", o: ["5", "6", "7", "8"], c: 1 },
            { p: "¿Quién es el mejor alumno?", o: ["Cualquiera", "Erik", "Nadie", "El vecino"], c: 1 },
            { p: "¿Aprobamos este nivel?", o: ["No", "Tal vez", "SÍ, SOY EL MEJOR", "Mañana"], c: 2 }
        ]
    };

    function mezclar(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function refrescar() {
        document.getElementById("num-nivel").innerText = nivel;
        document.getElementById("aciertos").innerText = pts;
        document.getElementById("vidas").innerText = Math.max(0, 3 - err);
        document.getElementById("p-actual").innerText = pIndex + 1;
        document.getElementById("barra").style.width = (pIndex * 10) + "%";
    }

    function cargar() {
        refrescar();
        document.getElementById("feedback").innerText = "";
        document.getElementById("feedback").classList.remove("shake");
        if (err > 3) { finalizar(true); return; }

        const q = preguntasNivelActual[pIndex];
        document.getElementById("txt-pregunta").innerText = q.p;
        const box = document.getElementById("opciones-box");
        box.innerHTML = "";
        
        let opts = q.o.map((t, i) => ({ t, esC: i === q.c }));
        mezclar(opts);

        opts.forEach(o => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = o.t;
            b.onclick = () => validar(o.esC, b);
            box.appendChild(b);
        });
    }

    function validar(esC, btn) {
        document.querySelectorAll(".opcion").forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (esC) {
            btn.classList.add("correcto");
            pts++;
            fb.innerText = "¡GOLAZO! 🔥";
            fb.style.color = "var(--verde)";
        } else {
            btn.classList.add("incorrecto");
            err++;
            fb.innerText = FRASE_BARCA;
            fb.classList.add("shake");
            fb.style.color = "var(--rojo)";
        }

        setTimeout(() => {
            pIndex++;
            if (pIndex < 10 && err <= 3) cargar();
            else finalizar(err > 3 || pts < 7);
        }, 1800);
    }

    function finalizar(perdio) {
        document.getElementById("juego").style.display = "none";
        document.getElementById("final").style.display = "block";
        document.getElementById("fin-nota").innerText = pts + " / 10";

        if (perdio) {
            document.getElementById("fin-titulo").innerText = "DERROTA...";
            document.getElementById("fin-mensaje").innerText = FRASE_BARCA;
            document.getElementById("btn-retry").style.display = "inline-block";
            document.getElementById("btn-next").style.display = "none";
        } else {
            document.getElementById("fin-titulo").innerText = "¡VICTORIA!";
            document.getElementById("fin-mensaje").innerText = FRASE_MBAPPE;
            document.getElementById("btn-retry").style.display = "none";
            if(nivel < 5) document.getElementById("btn-next").style.display = "inline-block";
            else document.getElementById("fin-titulo").innerText = "¡ERES EL REY DE ESPARTA! 🏆";
        }
    }

    function reiniciarNivel() {
        pIndex = 0; pts = 0; err = 0;
        preguntasNivelActual = mezclar([...banco[nivel]]);
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    function subirNivel() {
        nivel++;
        reiniciarNivel();
    }

    // Inicializar primer nivel
    reiniciarNivel();
</script>

</body>
</html>
