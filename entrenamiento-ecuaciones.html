<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Entrenamiento Erik - Academia Esparta</title>
    <style>
        :root { --verde: #4CAF50; --azul: #2196f3; --rojo: #e74c3c; --gris: #f4f7f6; --blanco: #ffffff; --dorado: #ffc107; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding-bottom: 50px; }
        .header { background: var(--blanco); color: var(--verde); text-align: center; padding: 20px; border-bottom: 5px solid var(--verde); }
        .header h1 { font-family: 'Montserrat'; font-size: 2.2rem; margin: 0; text-transform: uppercase; }
        
        .container { max-width: 700px; margin: 20px auto; background: var(--blanco); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* MARCADOR */
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-family: 'Montserrat'; }
        .vidas-count { background: var(--rojo); padding: 5px 10px; border-radius: 8px; font-weight: bold; }
        .nivel-badge { background: var(--azul); padding: 5px 10px; border-radius: 8px; }

        .progreso-bg { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progreso-fill { height: 100%; background: var(--verde); width: 0%; transition: 0.5s; }

        .pregunta { font-size: 1.4rem; font-weight: 700; color: #333; margin-bottom: 20px; }
        .opciones { display: grid; gap: 12px; }
        .opcion { padding: 18px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; text-align: left; font-weight: 600; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #f0f7ff; }
        
        .correcto { background-color: var(--verde) !important; color: white; border-color: #388E3C !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }

        .feedback-area { margin-top: 20px; text-align: center; font-weight: 800; font-size: 1.2rem; min-height: 2em; }
        .shake { animation: shake 0.5s; color: var(--rojo); }

        .pantalla-final { display: none; text-align: center; padding: 20px; }
        .btn-accion { margin-top: 25px; padding: 15px 35px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: white; transition: 0.3s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-10px);} 40%, 80% {transform: translateX(10px);} }
    </style>
</head>
<body>

<header class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¡El Desafío de los 5 Niveles de Erik!</p>
</header>

<div class="container">
    <div class="status-bar">
        <div class="nivel-badge">NIVEL <span id="num-nivel">1</span></div>
        <div style="color: #4CAF50;">✅ <span id="aciertos">0</span></div>
        <div class="vidas-count">🛡️ VIDAS: <span id="vidas">3</span></div>
        <div>🎯 <span id="p-actual">1</span>/10</div>
    </div>
    
    <div class="progreso-bg"><div class="progreso-fill" id="barra"></div></div>
    
    <div id="juego">
        <div class="pregunta" id="txt-pregunta">Cargando...</div>
        <div class="opciones" id="opciones-box"></div>
        <div id="feedback" class="feedback-area"></div>
    </div>

    <div class="pantalla-final" id="final">
        <h2 id="fin-titulo"></h2>
        <p id="fin-nota" style="font-size: 2rem; font-weight: bold;"></p>
        <p id="fin-mensaje" style="font-style: italic; font-size: 1.2rem; margin: 20px 0;"></p>
        <button class="btn-accion" id="btn-next" style="background: var(--verde); display:none;" onclick="subirNivel()">SIGUIENTE NIVEL 🚀</button>
        <button class="btn-accion" id="btn-retry" style="background: var(--rojo); display:none;" onclick="reiniciar()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nivel = 1;
    let pIndex = 0;
    let pts = 0;
    let err = 0;
    const FRASE_BARCA = "¡Eres más malo que el Barcelona en Champions! 😂";
    const FRASE_MBAPPE = "¡Erik, eres mejor que Mbappé en el Real Madrid! 👑";

    const banco = {
        1: [
            { p: "Erik, ¿cuántos colores tiene el arcoíris?", o: ["5", "7", "10", "3"], c: 1 },
            { p: "¿Cuál es el animal que hace 'miau'?", o: ["Perro", "Gato", "Pez", "Vaca"], c: 1 },
            { p: "¿Cuánto es 5 + 5?", o: ["8", "10", "12", "55"], c: 1 },
            { p: "¿De qué color es el tronco de un árbol?", o: ["Azul", "Marrón", "Rosa", "Blanco"], c: 1 },
            { p: "¿Por dónde sale el sol?", o: ["Por el Este", "Por el Oeste", "Por la ventana", "No sale"], c: 0 },
            { p: "¿Cuántas patas tiene un perro?", o: ["2", "4", "5", "1"], c: 1 },
            { p: "¿Qué usamos para oler?", o: ["Ojos", "Boca", "Nariz", "Orejas"], c: 2 },
            { p: "¿Qué día viene después del lunes?", o: ["Martes", "Miércoles", "Domingo", "Viernes"], c: 0 },
            { p: "¿Cuál es la fruta que es roja y tiene semillas fuera?", o: ["Pera", "Manzana", "Fresa", "Uva"], c: 2 },
            { p: "¿Cuántos meses tiene un año?", o: ["10", "12", "7", "24"], c: 1 }
        ],
        2: [
            { p: "Nivel 2: ¿Cuánto es 10 + 20?", o: ["10", "30", "40", "100"], c: 1 },
            { p: "¿Cómo se llama un polígono de 3 lados?", o: ["Cuadrado", "Círculo", "Triángulo", "Rombo"], c: 2 },
            { p: "¿En qué país vivimos?", o: ["Francia", "España", "Italia", "Portugal"], c: 1 },
            { p: "¿Cuál es el planeta rojo?", o: ["Tierra", "Marte", "Júpiter", "Saturno"], c: 1 },
            { p: "¿Qué animal vive en el desierto y tiene joroba?", o: ["Elefante", "Camello", "León", "Serpiente"], c: 1 },
            { p: "¿Qué gas necesitamos para respirar?", o: ["Oxígeno", "Helio", "Humo", "Viento"], c: 0 },
            { p: "¿Cuánto es 15 - 5?", o: ["5", "10", "15", "20"], c: 1 },
            { p: "¿Cómo se llama la cría del caballo?", o: ["Pollito", "Potro", "Ternero", "Cachorro"], c: 1 },
            { p: "¿Qué sentido usamos para oír música?", o: ["Vista", "Gusto", "Oído", "Tacto"], c: 2 },
            { p: "¿Cuántas horas tiene un día entero?", o: ["12", "24", "48", "60"], c: 1 }
        ],
        3: [
            { p: "Nivel 3: ¿Cuánto es 50 + 50?", o: ["80", "90", "100", "200"], c: 2 },
            { p: "¿Qué parte de la planta está bajo tierra?", o: ["Flor", "Tallo", "Raíz", "Hoja"], c: 2 },
            { p: "¿Cómo se llama el médico de los animales?", o: ["Dentista", "Veterinario", "Enfermero", "Piloto"], c: 1 },
            { p: "¿Cuál es el río más largo del mundo?", o: ["Ebro", "Amazonas", "Tajo", "Río Seco"], c: 1 },
            { p: "¿Cuántos minutos tiene media hora?", o: ["15", "30", "45", "60"], c: 1 },
            { p: "¿Quién escribió El Quijote?", o: ["Cervantes", "Picasso", "Mbappé", "Lope de Vega"], c: 0 },
            { p: "¿Qué metal atrae un imán?", o: ["Oro", "Madera", "Hierro", "Plástico"], c: 2 },
            { p: "¿Cuál es el planeta más grande?", o: ["Tierra", "Marte", "Júpiter", "Plutón"], c: 2 },
            { p: "¿Cómo se llama el triángulo con 3 lados iguales?", o: ["Isósceles", "Escaleno", "Equilátero", "Recto"], c: 2 },
            { p: "¿Qué idioma se habla en Brasil?", o: ["Español", "Portugués", "Francés", "Inglés"], c: 1 }
        ],
        4: [
            { p: "Nivel 4: ¿Cuánto es el doble de 25?", o: ["40", "50", "60", "100"], c: 1 },
            { p: "¿En qué continente está China?", o: ["Europa", "América", "Asia", "África"], c: 2 },
            { p: "¿Cómo se llama el satélite de la Tierra?", o: ["Sol", "Luna", "Estrella", "Marte"], c: 1 },
            { p: "¿Qué animal es el más rápido del mundo?", o: ["León", "Guepardo", "Caballo", "Tortuga"], c: 1 },
            { p: "¿Cuántos cm tiene un metro?", o: ["10", "50", "100", "1000"], c: 2 },
            { p: "¿Cómo se llama el proceso de las plantas con el sol?", o: ["Comer", "Dormir", "Fotosíntesis", "Caminar"], c: 2 },
            { p: "¿Qué hueso es el más largo del cuerpo?", o: ["Fémur", "Cráneo", "Costilla", "Radio"], c: 0 },
            { p: "¿Cuál es el océano más grande?", o: ["Atlántico", "Pacífico", "Índico", "Ártico"], c: 1 },
            { p: "¿Cuántas patas tiene una araña?", o: ["4", "6", "8", "10"], c: 2 },
            { p: "¿Qué gas expulsamos al respirar?", o: ["Oxígeno", "Dióxido de Carbono", "Helio", "Argón"], c: 1 }
        ],
        5: [
            { p: "Nivel 5 FINAL: ¿Cuánto es 100 - 25?", o: ["50", "75", "85", "65"], c: 1 },
            { p: "¿Quién pintó la Mona Lisa?", o: ["Dalí", "Picasso", "Da Vinci", "Velázquez"], c: 2 },
            { p: "¿Cuál es la montaña más alta del mundo?", o: ["Everest", "Teide", "Pirineos", "Alpes"], c: 0 },
            { p: "¿Qué animal es un mamífero volador?", o: ["Pájaro", "Murciélago", "Mariposa", "Mosca"], c: 1 },
            { p: "¿En qué año se descubrió América?", o: ["1492", "1500", "1990", "1200"], c: 0 },
            { p: "¿Qué órgano bombea la sangre?", o: ["Cerebro", "Pulmón", "Corazón", "Hígado"], c: 2 },
            { p: "¿Cuál es el tercer planeta del sistema solar?", o: ["Mercurio", "Venus", "Tierra", "Marte"], c: 2 },
            { p: "¿Cómo se llama la capital de Francia?", o: ["Madrid", "Londres", "París", "Roma"], c: 2 },
            { p: "¿Qué instrumento mide la temperatura?", o: ["Reloj", "Termómetro", "Brújula", "Regla"], c: 1 },
            { p: "Erik... ¿Quién es el mejor?", o: ["Mbappé", "Yo mismo", "Nadie", "El Barcelona"], c: 1 }
        ]
    };

    function refrescar() {
        document.getElementById("num-nivel").innerText = nivel;
        document.getElementById("aciertos").innerText = pts;
        document.getElementById("vidas").innerText = (3 - err < 0) ? 0 : (3 - err);
        document.getElementById("p-actual").innerText = pIndex + 1;
        document.getElementById("barra").style.width = (pIndex * 10) + "%";
    }

    function cargar() {
        refrescar();
        document.getElementById("feedback").innerText = "";
        document.getElementById("feedback").className = "feedback-area";

        if (err > 3) { final(true); return; }

        const q = banco[nivel][pIndex];
        document.getElementById("txt-pregunta").innerText = q.p;
        const box = document.getElementById("opciones-box");
        box.innerHTML = "";
        
        q.o.forEach((opt, i) => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = opt;
            b.onclick = () => validar(i, q.c);
            box.appendChild(b);
        });
    }

    function validar(idx, correcta) {
        const btns = document.querySelectorAll(".opcion");
        btns.forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (idx === correcta) {
            btns[idx].classList.add("correcto");
            pts++;
            fb.innerText = "¡GOLAZO ERIK! ⚽";
            fb.style.color = "var(--verde)";
        } else {
            btns[idx].classList.add("incorrecto");
            btns[correcta].classList.add("correcto");
            err++;
            fb.innerText = FRASE_BARCA;
            fb.classList.add("shake");
        }

        setTimeout(() => {
            pIndex++;
            if (pIndex < 10 && err <= 3) cargar();
            else final(err > 3 || pts < 7);
        }, 1800);
    }

    function final(perdio) {
        document.getElementById("juego").style.display = "none";
        const f = document.getElementById("final");
        f.style.display = "block";

        if (perdio) {
            document.getElementById("fin-titulo").innerText = "¡DERROTA!";
            document.getElementById("fin-nota").innerText = pts + " / 10";
            document.getElementById("fin-mensaje").innerText = FRASE_BARCA;
            document.getElementById("btn-retry").style.display = "inline-block";
            document.getElementById("btn-next").style.display = "none";
        } else {
            document.getElementById("fin-titulo").innerText = "¡NIVEL CONQUISTADO!";
            document.getElementById("fin-nota").innerText = pts + " / 10";
            document.getElementById("fin-mensaje").innerText = FRASE_MBAPPE;
            document.getElementById("btn-next").style.display = "inline-block";
            document.getElementById("btn-retry").style.display = "none";
            if(nivel == 5) {
                 document.getElementById("fin-titulo").innerText = "¡ERES EL REY DE ESPARTA!";
                 document.getElementById("btn-next").style.display = "none";
            }
        }
    }

    function reiniciar() {
        pIndex = 0; pts = 0; err = 0;
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    function subirNivel() {
        nivel++; pIndex = 0; pts = 0; err = 0;
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    cargar();
</script>

</body>
</html>
