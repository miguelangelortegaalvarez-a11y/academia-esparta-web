<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
    <title>English Pro - Academia Esparta</title>
    <style>
        :root { --verde: #2e7d32; --oro: #f1c40f; --rojo: #e74c3c; --azul: #2196f3; --gris: #f1f8f1; }
        body { font-family: 'Open Sans', sans-serif; background: var(--gris); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .header { position: absolute; top: 20px; text-align: center; width: 100%; }
        .header h1 { font-family: 'Montserrat'; color: #1a1a1a; margin: 0; text-transform: uppercase; font-size: 1.8rem; }
        .header p { color: var(--verde); font-weight: 800; margin: 0; }

        .game-box { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 90%; max-width: 550px; text-align: center; border: 8px solid #eee; position: relative; }
        
        .btn-listen { width: 90px; height: 90px; border-radius: 50%; border: none; background: var(--azul); color: white; font-size: 2.5rem; cursor: pointer; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3); }

        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .option-card { background: #fff; border: 4px solid #eee; border-radius: 20px; padding: 15px; cursor: pointer; font-size: 4rem; transition: 0.4s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
        
        .card-name { font-size: 1rem; margin-top: 10px; color: #555; display: none; text-transform: uppercase; font-family: 'Montserrat'; }

        /* ESTADOS */
        .correct { background: var(--verde) !important; border-color: #1b5e20 !important; color: white !important; }
        .secondary { background: #e3f2fd !important; border-color: var(--azul) !important; transform: scale(0.95); }
        .wrong { background: var(--rojo) !important; border-color: #b71c1c !important; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }

        /* LLUVIA EMOJIS */
        .emoji-rain { position: fixed; top: -50px; font-size: 2rem; animation: fall 3s linear forwards; z-index: 1000; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        #progreso { font-family: 'Montserrat'; font-size: 1.2rem; margin-bottom: 10px; color: var(--negro); }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>WELL DONE, MARIO!</p>
</div>

<div id="progreso">Pregunta 1 de 10</div>

<div class="game-box" id="main-box">
    <button class="btn-listen" id="main-mic" onclick="speakWord(quiz[currentTask].word)">🔊</button>
    <div style="margin-bottom: 20px; font-weight: 800; color: #666;">TOUCH THE CORRECT ONE</div>
    
    <div class="options-grid" id="options-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    const quiz = [
        { word: "Apple", o: [{e:"🍎",n:"Apple"}, {e:"🍌",n:"Banana"}, {e:"🍇",n:"Grapes"}], c: 0 },
        { word: "Dog", o: [{e:"🐱",n:"Cat"}, {e:"🐶",n:"Dog"}, {e:"🦁",n:"Lion"}], c: 1 },
        { word: "One", o: [{e:"2️⃣",n:"Two"}, {e:"3️⃣",n:"Three"}, {e:"1️⃣",n:"One"}], c: 2 },
        { word: "Sun", o: [{e:"☀️",n:"Sun"}, {e:"☁️",n:"Cloud"}, {e:"🌙",n:"Moon"}], c: 0 },
        { word: "Blue", o: [{e:"🟥",n:"Red"}, {e:"🟦",n:"Blue"}, {e:"🟩",n:"Green"}], c: 1 },
        { word: "Car", o: [{e:"🚗",n:"Car"}, {e:"🚲",n:"Bike"}, {e:"✈️",n:"Plane"}], c: 0 },
        { word: "House", o: [{e:"🌳",n:"Tree"}, {e:"🏠",n:"House"}, {e:"🌸",n:"Flower"}], c: 1 },
        { word: "Five", o: [{e:"4️⃣",n:"Four"}, {e:"5️⃣",n:"Five"}, {e:"6️⃣",n:"Six"}], c: 1 },
        { word: "Ball", o: [{e:"⚽",n:"Ball"}, {e:"🧸",n:"Doll"}, {e:"🎨",n:"Paint"}], c: 0 },
        { word: "Hat", o: [{e:"👟",n:"Shoe"}, {e:"👕",n:"Shirt"}, {e:"🎩",n:"Hat"}], c: 2 }
    ];

    let currentTask = 0;
    const synth = window.speechSynthesis;

    function loadTask() {
        if (currentTask >= 10) {
            celebracionFinal();
            return;
        }
        document.getElementById('progreso').innerText = `Pregunta ${currentTask + 1} de 10`;
        const task = quiz[currentTask];
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        task.o.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.id = `card-${index}`;
            card.innerHTML = `<span>${item.e}</span><span class="card-name">${item.n}</span>`;
            card.onclick = () => checkAnswer(index, card);
            container.appendChild(card);
        });
    }

    function speakWord(text, callback) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        if (callback) utterance.onend = callback;
        synth.speak(utterance);
    }

    async function checkAnswer(idx, card) {
        if (card.classList.contains('correct') || card.classList.contains('secondary')) return;

        const task = quiz[currentTask];
        if (idx === task.c) {
            // ACIERTO MARIO
            card.classList.add('correct');
            card.querySelector('.card-name').style.display = "block";
            confetti({ particleCount: 100, spread: 60 });
            
            // "Well done, Mario!"
            speakWord("Well done, Mario!", async () => {
                // Ahora enseñamos las otras dos
                const indicesRestantes = [0, 1, 2].filter(i => i !== task.c);
                
                for (let i of indicesRestantes) {
                    await new Promise(r => setTimeout(r, 1500));
                    const otherCard = document.getElementById(`card-${i}`);
                    otherCard.classList.add('secondary');
                    otherCard.querySelector('.card-name').style.display = "block";
                    speakWord(task.o[i].n);
                }

                // Siguiente pregunta tras ver todas
                setTimeout(() => {
                    currentTask++;
                    loadTask();
                }, 2000);
            });
        } else {
            // FALLO
            card.classList.add('wrong');
            document.getElementById('main-box').classList.add('shake');
            setTimeout(() => {
                document.getElementById('main-box').classList.remove('shake');
                card.classList.remove('wrong');
            }, 500);
        }
    }

    function celebracionFinal() {
        document.getElementById('main-box').innerHTML = "<h1 style='font-size:3rem'>🏆 CHAMPION!</h1><p style='font-size:1.5rem'>MARIO IS THE BEST</p>";
        const emojis = ['😊', '🎉', '🌟', '👏', '🦁', '🔥', '💎', '🚀'];
        setInterval(() => {
            const e = document.createElement('div');
            e.className = 'emoji-rain';
            e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            e.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 3000);
        }, 100);
    }

    loadTask();
</script>

</body>
</html>
