<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Fichajes - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #0e9343;
            --dark: #063c24;
            --error: #ef5350;
            --bg: #f0f2f5;
        }

        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); box-sizing: border-box; }
        .header-title { font-weight: 700; font-size: 1.5rem; color: var(--primary); text-transform: uppercase; }

        .game-container { max-width: 600px; width: 90%; margin: 2rem auto; background: white; border-radius: 25px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 2px solid #eee; }

        .nivel-badge { background: var(--dark); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; margin-bottom: 1rem; display: inline-block; }

        .player-name { font-size: 2.5rem; color: var(--dark); margin: 1rem 0; font-weight: 700; }

        .options-grid { display: grid; gap: 15px; margin-top: 2rem; }

        .btn-option { background: #f8f9fa; border: 3px solid #eee; padding: 15px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Fredoka'; color: #333; }
        .btn-option:active { transform: scale(0.95); }

        .feedback-msg { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; padding: 0 10px; line-height: 1.3; }
        .msg-success { color: var(--primary); animation: pop 0.4s ease; }
        .msg-error { color: var(--error); animation: shake 0.3s ease; }

        .next-btn { margin-top: 2rem; background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 0 var(--dark); font-family: 'Fredoka'; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">⚽ Desafío Fichajes Esparta</div>
    </header>

    <div class="game-container">
        <div id="nivel-info" class="nivel-badge">Nivel 1: Estrellas</div>
        <p style="color: #666; margin: 0;">¿En qué equipo juega...?</p>
        <div id="player-display" class="player-name">---</div>
        
        <div id="options-grid" class="options-grid"></div>

        <div id="feedback" class="feedback-msg"></div>
        <button id="next-btn" class="next-btn" onclick="proximoJugador()">SIGUIENTE FICHAJE →</button>
    </div>

    <script>
        const jugadores = [
            // NIVEL 1: Los grandes
            { nombre: "Vinícius Jr.", equipos: ["Real Madrid", "Villarreal", "Sevilla"], correcto: "Real Madrid", nivel: 1 },
            { nombre: "Lewandowski", equipos: ["Espanyol", "FC Barcelona", "Betis"], correcto: "FC Barcelona", nivel: 1 },
            { nombre: "Griezmann", equipos: ["Getafe", "Real Sociedad", "Atlético de Madrid"], correcto: "Atlético de Madrid", nivel: 1 },
            { nombre: "Gayà", equipos: ["Valencia CF", "Celta", "Alavés"], correcto: "Valencia CF", nivel: 1 },
            
            // NIVEL 2: Media tabla
            { nombre: "Iago Aspas", equipos: ["Celta de Vigo", "Girona", "Osasuna"], correcto: "Celta de Vigo", nivel: 2 },
            { nombre: "Gerard Moreno", equipos: ["Mallorca", "Villarreal CF", "Athletic"], correcto: "Villarreal CF", nivel: 2 },
            { nombre: "Brais Méndez", equipos: ["Real Sociedad", "Leganés", "Valladolid"], correcto: "Real Sociedad", nivel: 2 },
            
            // NIVEL 3: Los díficiles (Ojeador Erik)
            { nombre: "Isi Palazón", equipos: ["Rayo Vallecano", "Getafe", "Sevilla"], correcto: "Rayo Vallecano", nivel: 3 },
            { nombre: "Borja Mayoral", equipos: ["Getafe CF", "Rayo", "Las Palmas"], correcto: "Getafe CF", nivel: 3 },
            { nombre: "Kirian Rodríguez", equipos: ["UD Las Palmas", "Betis", "Celta"], correcto: "UD Las Palmas", nivel: 3 }
        ];

        const frasesExito = [
            "¡Qué golazo has metido por la escuadra, Erik!",
            "¡Erik, eres mejor que Mbappé!",
            "¡Eres el Pichichi de la Academia, Erik!",
            "¡Ni Bellingham tiene esa puntería, Erik!",
            "¡Balón de Oro para Erik!"
        ];

        const frasesFallo = [
            "Erik, aciertas menos que el Barcelona en Champions...",
            "¡Uff! Estás jugando peor que el Barça de Xavi.",
            "¡Vaya fallo! Pareces un defensa del Barcelona.",
            "Erik, estás más perdido que el Barça en Europa...",
            "¡A las nubes! Menos puntería que el Barça este año."
        ];

        let indexActual = 0;

        function cargarJugador() {
            const j = jugadores[indexActual];
            document.getElementById('nivel-info').innerText = `Nivel ${j.nivel}: ${j.nivel === 1 ? 'Estrellas' : j.nivel === 2 ? 'Conocidos' : 'Ojeador PRO'}`;
            document.getElementById('player-display').innerText = j.nombre;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = 'none';

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            j.equipos.forEach(equipo => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = equipo;
                btn.onclick = () => verificarRespuesta(btn, equipo === j.correcto);
                grid.appendChild(btn);
            });
        }

        function verificarRespuesta(btn, esCorrecto) {
            const feedback = document.getElementById('feedback');
            const botones = document.querySelectorAll('.btn-option');

            if (esCorrecto) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#0e9343', '#ffffff'] });
                feedback.innerHTML = `<span class="msg-success">${frasesExito[Math.floor(Math.random() * frasesExito.length)]}</span>`;
                btn.style.borderColor = 'var(--primary)';
                btn.style.background = '#e8f5e9';
                document.getElementById('next-btn').style.display = 'inline-block';
                botones.forEach(b => b.style.pointerEvents = 'none');
            } else {
                feedback.innerHTML = `<span class="msg-error">${frasesFallo[Math.floor(Math.random() * frasesFallo.length)]}</span>`;
                btn.style.borderColor = 'var(--error)';
                btn.style.background = '#ffebee';
                btn.style.animation = 'shake 0.3s ease';
            }
        }

        function proximoJugador() {
            indexActual++;
            if (indexActual < jugadores.length) {
                cargarJugador();
            } else {
                document.querySelector('.game-container').innerHTML = `
                    <h2 style="color:var(--primary)">🏆 ¡FINAL DEL TORNEO! 🏆</h2>
                    <p style="font-size:1.2rem"><b>Erik</b>, has demostrado que no se te escapa ni un fichaje.</p>
                    <p>Eres oficialmente el MVP de la Academia Esparta.</p>
                    <button class="next-btn" style="display:block; margin: 20px auto;" onclick="location.reload()">VOLVER A JUGAR</button>
                `;
            }
        }

        cargarJugador();
    </script>
</body>
</html>
