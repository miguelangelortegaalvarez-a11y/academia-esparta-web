<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Erik: Ojeador Pro - Academia Esparta</title>
    <style>
        :root { --verde: #4CAF50; --azul: #2196f3; --rojo: #e74c3c; --gris: #f4f7f6; --blanco: #ffffff; --negro: #333; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding-bottom: 50px; }
        .header { background: var(--blanco); color: var(--verde); text-align: center; padding: 20px; border-bottom: 5px solid var(--verde); }
        .header h1 { font-family: 'Montserrat'; margin: 0; text-transform: uppercase; font-size: 1.8rem; }
        
        .container { max-width: 600px; margin: 20px auto; background: var(--blanco); padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* MARCADOR */
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: var(--negro); color: white; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-family: 'Montserrat'; font-size: 0.8rem; }
        .vidas-box { background: var(--rojo); padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .nivel-box { background: var(--azul); padding: 4px 8px; border-radius: 6px; }

        .barra-bg { width: 100%; height: 10px; background: #eee; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .barra-fill { height: 100%; background: var(--verde); width: 0%; transition: 0.4s; }

        .pregunta-box { text-align: center; margin-bottom: 25px; }
        .pregunta-box h2 { font-family: 'Montserrat'; font-size: 1.4rem; color: #222; }

        .opciones { display: grid; gap: 10px; }
        .opcion { padding: 15px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: 0.2s; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #f0f7ff; }
        
        .correcto { background-color: var(--verde) !important; color: white; border-color: #388E3C !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }

        .feedback { margin-top: 20px; text-align: center; font-weight: 800; font-size: 1.1rem; min-height: 1.5em; font-family: 'Montserrat'; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }

        .final { display: none; text-align: center; padding: 20px; }
        .btn { margin-top: 20px; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; color: white; text-transform: uppercase; }
    </style>
</head>
<body>

<header class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¡Erik, el Ojeador de 1ª División!</p>
</header>

<div class="container">
    <div class="status-bar">
        <div class="nivel-box" id="tag-nivel">NIVEL 1</div>
        <div style="color: var(--verde);">✅ <span id="pts">0</span></div>
        <div class="vidas-box">🛡️ <span id="vidas">3</span></div>
        <div>🎯 <span id="num-p">1</span>/10</div>
    </div>
    
    <div class="barra-bg"><div class="barra-fill" id="barra"></div></div>
    
    <div id="pantalla-juego">
        <div class="pregunta-box">
            <h2 id="txt-pregunta">Cargando fichaje...</h2>
        </div>
        <div class="opciones" id="box-opciones"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="final" id="pantalla-final">
        <h2 id="tit-final"></h2>
        <p id="nota-final" style="font-size: 2.5rem; font-weight: 800; color: var(--azul);"></p>
        <p id="msg-final" style="font-style: italic; font-size: 1.2rem;"></p>
        <button class="btn" id="btn-next" style="background: var(--verde); display:none;" onclick="irSiguienteNivel()">SIGUIENTE NIVEL 🚀</button>
        <button class="btn" id="btn-retry" style="background: var(--rojo); display:none;" onclick="reiniciar()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nivelActual = 1;
    let indexP = 0;
    let aciertos = 0;
    let fallos = 0;
    let preguntasNivel = [];

    const EQUIPOS = ["Real Madrid", "FC Barcelona", "Atlético de Madrid", "Real Betis", "Valencia CF", "Athletic Club", "Real Sociedad", "Villarreal CF", "Sevilla FC", "Girona FC", "CA Osasuna", "Getafe CF", "Rayo Vallecano", "RCD Espanyol", "CD Leganés", "RCD Mallorca", "Real Valladolid", "UD Las Palmas", "Celta de Vigo", "Alavés"];

    const BANCO = [
        // NIVEL 1: FÁCIL (Madrid, Barça, Atleti, Betis, Valencia)
        { j: "Mbappé", e: "Real Madrid", n: 1 },
        { j: "Lamine Yamal", e: "FC Barcelona", n: 1 },
        { j: "Julián Alvarez", e: "Atlético de Madrid", n: 1 },
        { j: "Isco", e: "Real Betis", n: 1 },
        { j: "Hugo Duro", e: "Valencia CF", n: 1 },
        { j: "Vinícius Jr", e: "Real Madrid", n: 1 },
        { j: "Dani Olmo", e: "FC Barcelona", n: 1 },
        { j: "Griezmann", e: "Atlético de Madrid", n: 1 },
        { j: "Pepelu", e: "Valencia CF", n: 1 },
        { j: "Bellingham", e: "Real Madrid", n: 1 },

        // NIVEL 2: MEDIO
        { j: "Nico Williams", e: "Athletic Club", n: 2 },
        { j: "Take Kubo", e: "Real Sociedad", n: 2 },
        { j: "Ayoze Pérez", e: "Villarreal CF", n: 2 },
        { j: "Isaac Romero", e: "Sevilla FC", n: 2 },
        { j: "Bryan Gil", e: "Girona FC", n: 2 },
        { j: "Oyarzabal", e: "Real Sociedad", n: 2 },
        { j: "Iñaki Williams", e: "Athletic Club", n: 2 },
        { j: "Tsygankov", e: "Girona FC", n: 2 },
        { j: "Gerard Moreno", e: "Villarreal CF", n: 2 },
        { j: "Lukebakio", e: "Sevilla FC", n: 2 },

        // NIVEL 3: DIFÍCIL
        { j: "James Rodríguez", e: "Rayo Vallecano", n: 3 },
        { j: "Sébastien Haller", e: "CD Leganés", n: 3 },
        { j: "Ante Budimir", e: "CA Osasuna", n: 3 },
        { j: "Luis Milla", e: "Getafe CF", n: 3 },
        { j: "Carlos Vicente", e: "Alavés", n: 3 },
        { j: "Borja Mayoral", e: "Getafe CF", n: 3 },
        { j: "Isi Palazón", e: "Rayo Vallecano", n: 3 },
        { j: "Vedat Muriqi", e: "RCD Mallorca", n: 3 },
        { j: "Moleiro", e: "UD Las Palmas", n: 3 },
        { j: "Iago Aspas", e: "Celta de Vigo", n: 3 }
    ];

    function mezclar(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function iniciar() {
        indexP = 0; aciertos = 0; fallos = 0;
        preguntasNivel = mezclar(BANCO.filter(q => q.n === nivelActual)).slice(0, 10);
        document.getElementById("tag-nivel").innerText = "NIVEL " + nivelActual;
        document.getElementById("pantalla-juego").style.display = "block";
        document.getElementById("pantalla-final").style.display = "none";
        document.getElementById("btn-retry").style.display = "none";
        document.getElementById("btn-next").style.display = "none";
        cargarPregunta();
    }

    function cargarPregunta() {
        document.getElementById("pts").innerText = aciertos;
        document.getElementById("vidas").innerText = 3 - fallos;
        document.getElementById("num-p").innerText = indexP + 1;
        document.getElementById("barra").style.width = (indexP * 10) + "%";
        document.getElementById("feedback").innerText = "";
        document.getElementById("feedback").className = "feedback";

        const q = preguntasNivel[indexP];
        document.getElementById("txt-pregunta").innerText = "¿En qué equipo juega " + q.j + "?";
        
        const contenedor = document.getElementById("box-opciones");
        contenedor.innerHTML = "";
        
        let falsas = mezclar(EQUIPOS.filter(e => e !== q.e)).slice(0, 2);
        let todas = mezclar([{ t: q.e, c: true }, { t: falsas[0], c: false }, { t: falsas[1], c: false }]);

        todas.forEach(op => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = op.t;
            b.onclick = () => verificar(op.c, b);
            contenedor.appendChild(b);
        });
    }

    function verificar(esC, btn) {
        document.querySelectorAll(".opcion").forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (esC) {
            btn.classList.add("correcto");
            aciertos++;
            fb.innerText = "¡GOLAZO ERIK! ⚽";
            fb.style.color = "var(--verde)";
        } else {
            btn.classList.add("incorrecto");
            fallos++;
            fb.innerText = "¡ERES MÁS MALO QUE EL BARÇA EN CHAMPIONS! 😂";
            fb.classList.add("shake");
            fb.style.color = "var(--rojo)";
        }

        setTimeout(() => {
            indexP++;
            if (indexP < 10 && fallos <= 3) cargarPregunta();
            else finalizar();
        }, 1500);
    }

    function finalizar() {
        document.getElementById("pantalla-juego").style.display = "none";
        document.getElementById("pantalla-final").style.display = "block";
        document.getElementById("nota-final").innerText = aciertos + " / 10";

        if (fallos > 3 || aciertos < 7) {
            document.getElementById("tit-final").innerText = "¡EXPULSADO!";
            document.getElementById("msg-final").innerText = "¡Más malo que el Barça en Champions! Entrena más, Erik.";
            document.getElementById("btn-retry").style.display = "inline-block";
        } else {
            document.getElementById("tit-final").innerText = "¡VICTORIA!";
            document.getElementById("msg-final").innerText = "¡Erik, eres mejor que Mbappé en el Madrid!";
            if(nivelActual < 3) document.getElementById("btn-next").style.display = "inline-block";
            else document.getElementById("tit-final").innerText = "¡ERES EL PICHICHI DE ESPARTA! 🏆";
        }
    }

    function irSiguienteNivel() { nivelActual++; iniciar(); }
    function reiniciar() { iniciar(); }

    iniciar();
</script>
</body>
</html>
