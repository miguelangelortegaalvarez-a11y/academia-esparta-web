<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>

<button onclick="activarGravedad()" style="position:fixed; bottom:20px; right:20px; z-index:9999; padding:15px; background:red; color:white; border-radius:50%; font-weight:bold; border:4px solid white; cursor:pointer; box-shadow: 0 0 20px rgba(255,0,0,0.5);">☢️</button>

<script>
function activarGravedad() {
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite;

    // Crear el motor
    const engine = Engine.create();
    const world = engine.world;

    // Crear un lienzo invisible que cubre toda la pantalla
    const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth,
            height: window.innerHeight,
            wireframes: false,
            background: 'transparent'
        }
    });

    // Convertir cada botón y cada título en un objeto físico
    const elementos = document.querySelectorAll('button, h1, h2, p, .opcion');
    elementos.forEach(el => {
        const rect = el.getBoundingClientRect();
        const body = Bodies.rectangle(rect.left + rect.width/2, rect.top + rect.height/2, rect.width, rect.height, {
            render: { fillStyle: 'transparent' }
        });
        
        // Sincronizar el elemento real con el objeto físico
        Matter.Events.on(engine, 'afterUpdate', () => {
            el.style.position = 'fixed';
            el.style.left = (body.position.x - rect.width/2) + 'px';
            el.style.top = (body.position.y - rect.height/2) + 'px';
            el.style.transform = `rotate(${body.angle}rad)`;
        });
        
        Composite.add(world, body);
    });

    // Añadir suelo invisible
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight, window.innerWidth, 60, { isStatic: true });
    Composite.add(world, ground);

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);
}
</script>
