<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Academia Esparta - Super Quiz</title>
    <style>
        :root { --verde: #4CAF50; --verde-oscuro: #388E3C; --azul: #2196f3; --gris: #f4f7f6; --rojo: #e74c3c; --naranja: #ff9800; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding-bottom: 50px; }
        .header { background: white; color: var(--verde); text-align: center; padding: 20px; border-bottom: 4px solid var(--verde); }
        .container { max-width: 700px; margin: 20px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        /* BARRA DE ESTADO ACTUALIZADA */
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; background: #eee; padding: 12px; border-radius: 10px; font-weight: bold; font-family: 'Montserrat'; font-size: 0.9rem; }
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .vidas-alerta { color: var(--naranja); background: white; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--naranja); }

        .progreso-bg { width: 100%; height: 12px; background: #ddd; border-radius: 6px; margin-bottom: 25px; overflow: hidden; }
        .progreso-fill { height: 100%; background: var(--azul); width: 0%; transition: 0.4s ease; }

        .pregunta { font-size: 1.4rem; font-weight: 600; margin-bottom: 25px; color: #333; line-height: 1.4; }
        .opciones { display: grid; gap: 12px; }
        .opcion { padding: 18px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; text-align: left; font-weight: 600; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #f0f7ff; transform: translateX(5px); }
        
        .correcto { background-color: var(--verde) !important; color: white; border-color: var(--verde-oscuro) !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }

        .feedback-area { margin-top: 20px; text-align: center; font-weight: 800; font-size: 1.2rem; min-height: 2em; }
        .shake { animation: shake 0.5s; color: var(--rojo); }

        .pantalla-final { display: none; text-align: center; padding: 20px; }
        .btn-final { margin-top: 25px; padding: 18px 35px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.3rem; color: white; transition: 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<header class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¿Cuántas vidas te quedan?</p>
</header>

<div class="container">
    <div class="status-bar">
        <div class="stat-item" style="color: var(--azul);">🎯 <span id="num-pregunta">1</span>/10</div>
        <div class="stat-item" style="color: var(--verde-oscuro);">✅ <span id="aciertos">0</span></div>
        <div class="stat-item" style="color: var(--rojo);">❌ <span id="fallos">0</span></div>
        <div class="stat-item">🛡️ Vidas: <span id="vidas-restantes" class="vidas-alerta">3</span></div>
    </div>
    
    <div class="progreso-bg"><div class="progreso-fill" id="barra"></div></div>
    
    <div id="pantalla-juego">
        <div class="pregunta" id="pregunta-txt">Cargando desafío...</div>
        <div class="opciones" id="opciones-box"></div>
        <div id="feedback" class="feedback-area"></div>
    </div>

    <div class="pantalla-final" id="pantalla-final">
        <h2 id="fin-titulo"></h2>
        <p id="fin-nota" style="font-size: 1.8rem; font-weight: bold;"></p>
        <p id="fin-mensaje" style="font-style: italic; font-size: 1.2rem; margin: 20px 0;"></p>
        <button class="btn-final" id="btn-next" style="background: var(--verde); display:none;" onclick="siguienteNivel()">PRÓXIMO NIVEL 🚀</button>
        <button class="btn-final" id="btn-retry" style="background: var(--rojo); display:none;" onclick="reiniciar()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nActual = 1;
    let pIndice = 0;
    let pts = 0;
    let err = 0;
    let vidas = 3; // Fallos permitidos
    const FRASE_MALA = "¡Eres más malo que el Barcelona en Champions! 😂";

    const banco = {
        1: [
            { p: "¿Cuántos colores tiene el arcoíris?", o: ["5", "7", "10", "12"], c: 1 },
            { p: "¿De qué color es el tronco de un árbol?", o: ["Verde", "Marrón", "Azul", "Blanco"], c: 1 },
            { p: "¿Qué sale por la noche y brilla?", o: ["Sol", "Nubes", "Luna", "Rayos"], c: 2 },
            { p: "¿Cuántos minutos tiene una hora?", o: ["30", "50", "60", "100"], c: 2 },
            { p: "¿Qué parte de la planta está bajo tierra?", o: ["Flor", "Hoja", "Tallo", "Raíz"], c: 3 },
            { p: "¿Cuál es el color de las zanahorias?", o: ["Verde", "Naranja", "Azul", "Rojo"], c: 1 },
            { p: "¿Cuántas patas tiene una araña?", o: ["4", "6", "8", "10"], c: 2 },
            { p: "¿Cómo se llama el médico de los animales?", o: ["Dentista", "Veterinario", "Enfermero", "Cirujano"], c: 1 },
            { p: "¿Qué lengua hablamos nosotros?", o: ["Chino", "Español", "Inglés", "Ruso"], c: 1 },
            { p: "¿Cuánto es 5 + 5?", o: ["8", "10", "12", "15"], c: 1 }
        ]
    };

    function refrescar() {
        document.getElementById("num-pregunta").innerText = pIndice + 1;
        document.getElementById("aciertos").innerText = pts;
        document.getElementById("fallos").innerText = err;
        document.getElementById("vidas-restantes").innerText = (3 - err < 0) ? 0 : (3 - err);
        document.getElementById("barra").style.width = (pIndice * 10) + "%";
    }

    function cargar() {
        refrescar();
        const feedback = document.getElementById("feedback");
        feedback.innerText = "";
        feedback.className = "feedback-area";

        if (err > 3) { final(true); return; } 

        const q = banco[nActual][pIndice];
        document.getElementById("pregunta-txt").innerText = q.p;
        const box = document.getElementById("opciones-box");
        box.innerHTML = "";
        
        q.o.forEach((opt, i) => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = opt;
            b.onclick = () => validar(i, q.c);
            box.appendChild(b);
        });
    }

    function validar(idx, correcta) {
        const btns = document.querySelectorAll(".opcion");
        btns.forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (idx === correcta) {
            btns[idx].classList.add("correcto");
            pts++;
            fb.innerText = "¡ASÍ SE HACE! ⚔️";
            fb.style.color = "var(--verde-oscuro)";
        } else {
            btns[idx].classList.add("incorrecto");
            btns[correcta].classList.add("correcto");
            err++;
            fb.innerText = FRASE_MALA;
            fb.classList.add("shake");
        }

        setTimeout(() => {
            pIndice++;
            if (pIndice < 10 && err <= 3) cargar();
            else final(err > 3);
        }, 1600);
    }

    function final(muerto) {
        document.getElementById("pantalla-juego").style.display = "none";
        const f = document.getElementById("pantalla-final");
        f.style.display = "block";

        if (muerto || pts < 7) {
            document.getElementById("fin-titulo").innerText = "¡DERROTADO!";
            document.getElementById("fin-nota").innerText = pts + " / 10";
            document.getElementById("fin-mensaje").innerText = FRASE_MALA;
            document.getElementById("btn-retry").style.display = "inline-block";
            document.getElementById("btn-next").style.display = "none";
        } else {
            document.getElementById("fin-titulo").innerText = "¡NIVEL SUPERADO!";
            document.getElementById("fin-nota").innerText = pts + " / 10";
            document.getElementById("fin-mensaje").innerText = "¡Pura disciplina espartana!";
            document.getElementById("btn-next").style.display = "inline-block";
            document.getElementById("btn-retry").style.display = "none";
        }
    }

    function reiniciar() {
        pIndice = 0; pts = 0; err = 0;
        document.getElementById("pantalla-juego").style.display = "block";
        document.getElementById("pantalla-final").style.display = "none";
        cargar();
    }

    cargar();
</script>

</body>
</html>
