<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <title>Lector Mágico - Academia Esparta</title>
    <style>
        :root { --verde: #2e7d32; --oro: #f1c40f; --rojo: #e74c3c; --gris-fondo: #f1f8f1; }
        body { font-family: 'Open Sans', sans-serif; background: var(--gris-fondo); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .header { position: absolute; top: 20px; text-align: center; width: 100%; }
        .header h1 { font-family: 'Montserrat'; color: #1a1a1a; margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; }

        .card-container { width: 320px; height: 400px; perspective: 1000px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card.flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.12); border: 10px solid white; box-sizing: border-box; }
        
        .card-front { background: white; color: var(--verde); transition: all 0.3s; }
        .card-back { background: var(--verde); color: white; transform: rotateY(180deg); }

        .word-text { font-size: 4.5rem; font-family: 'Montserrat'; text-transform: uppercase; letter-spacing: 4px; }
        .emoji-img { font-size: 9rem; }

        /* EFECTO ERROR: ROJO Y VIBRACIÓN */
        .error-state { border-color: var(--rojo) !important; color: var(--rojo) !important; background-color: #ffebee !important; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* BOTÓN Y FEEDBACK */
        .btn-mic { margin-top: 30px; width: 90px; height: 90px; border-radius: 50%; border: none; background: var(--verde); color: white; font-size: 2.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: 0.3s; z-index: 10; }
        .btn-mic.listening { background: var(--oro); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .feedback-area { margin-top: 20px; height: 80px; text-align: center; }
        #status { font-weight: bold; font-size: 1.3rem; color: #444; }
        #sad-boy { font-size: 4rem; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>LECTURA NIVEL 1: M, P, S, T</p>
</div>

<div class="card-container">
    <div class="card" id="main-card">
        <div class="card-face card-front" id="front-face">
            <span class="word-text" id="display-word">MAMÁ</span>
        </div>
        <div class="card-face card-back">
            <span class="emoji-img" id="display-emoji">👩‍👧</span>
            <h2 style="font-family: Montserrat">¡GENIAL!</h2>
        </div>
    </div>
</div>

<button class="btn-mic" id="mic-btn" onclick="startListening()">🎤</button>

<div class="feedback-area">
    <div id="status">Toca el micro y lee</div>
    <div id="sad-boy">👦🏻💧</div> </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    const palabras = [
        { texto: "MAMÁ", emoji: "👩‍👧" },
        { texto: "PAPÁ", emoji: "👨‍👦" },
        { texto: "SAPO", emoji: "🐸" },
        { texto: "TAZA", emoji: "☕" },
        { texto: "MESA", emoji: "🪑" },
        { texto: "PATO", emoji: "🦆" }
    ];

    let currentIdx = 0;
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'es-ES';
    
    const micBtn = document.getElementById('mic-btn');
    const statusTxt = document.getElementById('status');
    const sadBoy = document.getElementById('sad-boy');
    const card = document.getElementById('main-card');
    const frontFace = document.getElementById('front-face');

    function startListening() {
        try {
            recognition.start();
            micBtn.classList.add('listening');
            statusTxt.innerText = "Escuchando...";
            sadBoy.style.display = "none";
            frontFace.classList.remove('error-state', 'shake');
        } catch(e) {}
    }

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toUpperCase().trim();
        const targetWord = palabras[currentIdx].texto;
        micBtn.classList.remove('listening');

        // Verificamos si la palabra dicha contiene la palabra objetivo
        if (transcript.includes(targetWord)) {
            statusTxt.innerText = "¡EXCELENTE!";
            statusTxt.style.color = "var(--verde)";
            card.classList.add('flipped');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            setTimeout(() => {
                currentIdx = (currentIdx + 1) % palabras.length;
                resetCard();
            }, 3000);
        } else {
            manejarFallo();
        }
    };

    function manejarFallo() {
        micBtn.classList.remove('listening');
        statusTxt.innerText = "¡Inténtalo otra vez!";
        statusTxt.style.color = "var(--rojo)";
        
        // Efecto rojo, vibración y niño triste
        frontFace.classList.add('error-state', 'shake');
        sadBoy.style.display = "block";

        setTimeout(() => frontFace.classList.remove('shake'), 500);
    }

    recognition.onerror = () => {
        micBtn.classList.remove('listening');
        manejarFallo();
    };

    function resetCard() {
        card.classList.remove('flipped');
        frontFace.classList.remove('error-state');
        sadBoy.style.display = "none";
        setTimeout(() => {
            document.getElementById('display-word').innerText = palabras[currentIdx].texto;
            document.getElementById('display-emoji').innerText = palabras[currentIdx].emoji;
            statusTxt.innerText = "Toca el micro y lee";
            statusTxt.style.color = "#444";
        }, 500);
    }
</script>

</body>
</html>
