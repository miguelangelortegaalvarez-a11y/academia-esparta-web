<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>¿En qué equipo juega? - Academia Esparta</title>
    <style>
        :root { --verde: #4CAF50; --rojo: #e74c3c; --azul: #2196f3; --negro: #1a1a1a; --oro: #f1c40f; }
        body { font-family: 'Open Sans', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: var(--negro); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-family: 'Montserrat'; }
        .vidas-count { background: var(--rojo); padding: 5px 10px; border-radius: 8px; font-weight: bold; }
        .pregunta-box { text-align: center; margin-bottom: 30px; }
        .nombre-jugador { font-size: 2.2rem; font-weight: 800; color: var(--azul); font-family: 'Montserrat'; text-transform: uppercase; display: block; margin-top: 10px; }
        .opciones { display: grid; gap: 12px; }
        .opcion { padding: 18px; border: 2px solid #ddd; border-radius: 15px; background: white; cursor: pointer; font-size: 1.2rem; font-weight: 700; transition: 0.2s; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #f0f7ff; }
        .correcto { background-color: var(--verde) !important; color: white; border-color: #388E3C !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }
        .feedback { margin-top: 20px; text-align: center; font-weight: 800; font-size: 1.2rem; font-family: 'Montserrat'; min-height: 1.5em; }
        .final-screen { display: none; text-align: center; padding: 20px; }
        .btn { margin-top: 25px; padding: 15px 35px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; color: white; text-transform: uppercase; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <div id="tag-nivel" style="background: var(--azul); padding: 5px 10px; border-radius: 8px;">NIVEL 1</div>
        <div class="vidas-count">🛡️ <span id="vidas">3</span></div>
        <div>🎯 <span id="num-p">1</span>/10</div>
    </div>
    
    <div id="juego">
        <div class="pregunta-box">
            <span>¿En qué equipo juega?</span>
            <span class="nombre-jugador" id="txt-jugador">CARGANDO...</span>
        </div>
        <div class="opciones" id="box-opciones"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="final-screen" id="final">
        <h2 id="tit-final"></h2>
        <p id="msg-final" style="font-size: 1.4rem; font-style: italic; margin: 20px 0;"></p>
        <button class="btn" id="btn-next" style="background: var(--verde); display:none;" onclick="irSiguienteNivel()">SIGUIENTE NIVEL 🚀</button>
        <button class="btn" id="btn-retry" style="background: var(--rojo); display:none;" onclick="reiniciar()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nivel = 1;
    let index = 0;
    let fallos = 0;
    let bancoActual = [];

    const PREGUNTAS = {
        1: [ // Madrid, Barça, Atleti, Valencia
            { p: "VINÍCIUS JR.", o: ["Real Madrid", "Atlético", "Sevilla"], c: 0 },
            { p: "LAMINE YAMAL", o: ["Valencia", "Barcelona", "Girona"], c: 1 },
            { p: "ANTOINE GRIEZMANN", o: ["Real Madrid", "Atlético", "Real Sociedad"], c: 1 },
            { p: "FEDE VALVERDE", o: ["Barcelona", "Betis", "Real Madrid"], c: 2 },
            { p: "PEDRI", o: ["Barcelona", "Valencia", "Athletic"], c: 0 },
            { p: "HUGO DURO", o: ["Celta", "Valencia", "Getafe"], c: 1 },
            { p: "JULIÁN ÁLVAREZ", o: ["Atlético", "Real Madrid", "Barcelona"], c: 0 },
            { p: "JUDE BELLINGHAM", o: ["Atlético", "Real Madrid", "Villarreal"], c: 1 },
            { p: "ROBERT LEWANDOWSKI", o: ["Barcelona", "Sevilla", "Valencia"], c: 0 },
            { p: "JOSÉ LUIS GAYÀ", o: ["Barcelona", "Valencia", "Atlético"], c: 1 }
        ],
        2: [ // Equipos de tabla media/alta
            { p: "IAGO ASPAS", o: ["Sevilla", "Celta de Vigo", "Betis"], c: 1 },
            { p: "ISCO ALARCÓN", o: ["Málaga", "Real Betis", "Villarreal"], c: 1 },
            { p: "TAKE KUBO", o: ["Real Sociedad", "Mallorca", "Getafe"], c: 0 },
            { p: "NICO WILLIAMS", o: ["Villarreal", "Athletic Club", "Real Sociedad"], c: 1 },
            { p: "GERARD MORENO", o: ["Espanyol", "Villarreal", "Valencia"], c: 1 },
            { p: "Mikel OYARZABAL", o: ["Alavés", "Athletic", "Real Sociedad"], c: 2 },
            { p: "STUANI", o: ["Girona", "Espanyol", "Levante"], c: 0 },
            { p: "ISAAC ROMERO", o: ["Sevilla FC", "Betis", "Cádiz"], c: 0 },
            { p: "DANI PAREJO", o: ["Getafe", "Villarreal", "Valencia"], c: 1 },
            { p: "BRAIS MÉNDEZ", o: ["Celta", "Real Sociedad", "Girona"], c: 1 }
        ],
        3: [ // Equipos más difíciles o fichajes específicos
            { p: "KIRIAN RODRÍGUEZ", o: ["Las Palmas", "Tenerife", "Rayo"], c: 0 },
            { p: "ANTE BUDIMIR", o: ["Mallorca", "Osasuna", "Valladolid"], c: 1 },
            { p: "VEDAT MURIQI", o: ["Getafe", "Mallorca", "Lazio"], c: 1 },
            { p: "BORJA MAYORAL", o: ["Leganés", "Getafe", "Roma"], c: 1 },
            { p: "LUIS MILLA", o: ["Getafe", "Granada", "Leganés"], c: 0 },
            { p: "ALBERTO MOLEIRO", o: ["Barcelona", "Girona", "Las Palmas"], c: 2 },
            { p: "ISI PALAZÓN", o: ["Rayo Vallecano", "Murcia", "Getafe"], c: 0 },
            { p: "CARLOS VICENTE", o: ["Alavés", "Racing", "Celta"], c: 0 },
            { p: "RAÚL MORO", o: ["Lazio", "Valladolid", "Espanyol"], c: 1 },
            { p: "SAMU COSTA", o: ["Almería", "Mallorca", "Valencia"], c: 1 }
        ]
    };

    function iniciar() {
        index = 0; fallos = 0;
        bancoActual = PREGUNTAS[nivel].sort(() => Math.random() - 0.5);
        document.getElementById("tag-nivel").innerText = "NIVEL " + nivel;
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    function cargar() {
        document.getElementById("vidas").innerText = 3 - fallos;
        document.getElementById("num-p").innerText = index + 1;
        document.getElementById("feedback").innerText = "";
        const q = bancoActual[index];
        document.getElementById("txt-jugador").innerText = q.p;
        const box = document.getElementById("box-opciones");
        box.innerHTML = "";
        q.o.forEach((txt, i) => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = txt;
            b.onclick = () => validar(i === q.c, b);
            box.appendChild(b);
        });
    }

    function validar(esC, btn) {
        document.querySelectorAll(".opcion").forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");
        if (esC) {
            btn.classList.add("correcto");
            fb.innerText = "¡GOLAZO! Erik, eres mejor que Mbappé ⚽";
            fb.style.color = "var(--verde)";
        } else {
            btn.classList.add("incorrecto");
            fallos++;
            fb.innerText = "¡FALLO! Eres peor que el Barça en Champions 😂";
            fb.style.color = "var(--rojo)";
            document.querySelector(".container").classList.add("shake");
            setTimeout(() => document.querySelector(".container").classList.remove("shake"), 500);
        }
        setTimeout(() => {
            index++;
            if (fallos >= 3) finalizar(true);
            else if (index >= 10) finalizar(false);
            else cargar();
        }, 1500);
    }

    function finalizar(derrota) {
        document.getElementById("juego").style.display = "none";
        document.getElementById("final").style.display = "block";
        const msg = document.getElementById("msg-final");
        if (derrota) {
            document.getElementById("tit-final").innerText = "¡ELIMINADO! ❌";
            msg.innerText = "Has fallado 3 veces. Eres peor que el Barça en Champions.";
            document.getElementById("btn-retry").style.display = "inline-block";
            document.getElementById("btn-next").style.display = "none";
        } else {
            document.getElementById("tit-final").innerText = "¡NIVEL SUPERADO! 🏆";
            msg.innerText = "¡Brutal! Erik, eres oficialmente mejor que Mbappé.";
            if (nivel < 3) document.getElementById("btn-next").style.display = "inline-block";
            else document.getElementById("tit-final").innerText = "¡CAMPEÓN DE LIGA! 👑";
        }
    }

    function irSiguienteNivel() { nivel++; iniciar(); }
    function reiniciar() { nivel = 1; iniciar(); }
    iniciar();
</script>
</body>
</html>
