<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno Vocal E - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #0e9343; /* Verde Academia Esparta */
            --dark: #063c24; 
            --accent: #fb8c00; /* Naranja para selección de unir */
            --a-color-text: #ef5350; /* Rojo para las instrucciones */
            --light-green: #e8f5e9;
            --bg: #f0f2f5;
        }
        
        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); position: relative; z-index: 10; box-sizing: border-box; }
        .back-link { position: absolute; left: 20px; top: 25px; text-decoration: none; color: var(--primary); font-weight: bold; }
        .header-title { font-weight: 700; font-size: 1.5rem; color: var(--primary); }

        .book-slider { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Formato de tarjeta blanca grande */
        .page { 
            display: none; width: 90%; max-width: 800px; height: 75vh; 
            background: white; border-radius: 30px; padding: 2rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid #eee;
            flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.4s ease;
        }
        .page.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Títulos de instrucción en ROJO */
        h2 { color: var(--a-color-text); font-size: 2.2rem; margin-bottom: 1.5rem; text-align: center; }

        /* Estilo Letras de Discriminación */
        .letra-tap { 
            font-size: 5.5rem; cursor: pointer; padding: 10px 25px; border-radius: 50%; 
            margin: 10px; border: 5px solid transparent; transition: 0.2s; display: inline-block;
            color: #333; 
        }
        .letra-tap.selected-correct { border-color: var(--primary); background: var(--light-green); color: var(--primary); pointer-events: none; }

        /* Estilo Unir (Matching) */
        .match-container { display: flex; justify-content: space-around; width: 100%; gap: 15px; }
        .match-col { display: flex; flex-direction: column; gap: 10px; }
        .match-box { 
            padding: 12px; background: #f9f9f9; border: 3px solid #eee; 
            border-radius: 15px; font-size: 1.5rem; cursor: pointer; text-align: center; min-width: 140px;
        }
        .match-box.selected { border-color: var(--accent); background: #fff3e0; }
        .match-box.correct { border-color: var(--primary); background: var(--light-green); color: var(--primary); pointer-events: none; }

        /* Botones de Navegación Verdes */
        .nav-btn { 
            position: absolute; bottom: 30px; background: var(--primary); color: white; 
            border: none; padding: 12px 35px; border-radius: 50px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 var(--dark); z-index: 20;
            text-transform: uppercase; transition: 0.3s;
        }
        .nav-btn:active { transform: translateY(4px); box-shadow: none; }
        .prev { left: 40px; background: #999; box-shadow: 0 5px 0 #666; }
        .next { right: 40px; display: none; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← VOLVER</a>
        <div class="header-title">Misión Vocal E 🐘</div>
    </header>

    <div class="book-slider">
        
        <div class="page active" id="p1" data-total="3">
            <h2>1. Busca la "E" mayúscula</h2>
            <div style="text-align: center;">
                <span class="letra-tap" onclick="checkSimple(this, true, 1)">E</span>
                <span class="letra-tap" onclick="checkSimple(this, false, 1)">F</span>
                <span class="letra-tap" onclick="checkSimple(this, true, 1)">E</span>
                <span class="letra-tap" onclick="checkSimple(this, false, 1)">L</span>
                <span class="letra-tap" onclick="checkSimple(this, true, 1)">E</span>
            </div>
        </div>

        <div class="page" id="p2" data-total="1">
            <h2>2. Relaciona el dibujo con su palabra</h2>
            <div style="font-size: 7rem; margin-bottom: 20px;">🐘</div>
            <div style="font-size: 4rem; letter-spacing: 5px; color: #333; font-weight: bold; margin-bottom: 20px;">
                <span id="word-p1">__</span><span style="color:var(--primary); animation:popIn 0.5s;">LEFANTE</span>
            </div>
            <div>
                <span class="letra-tap" onclick="checkSimple(this, true, 2)">E</span>
                <span class="letra-tap" onclick="checkSimple(this, false, 2)">A</span>
                <span class="letra-tap" onclick="checkSimple(this, false, 2)">I</span>
            </div>
        </div>

        <div class="page" id="p3" data-total="3">
            <h2>3. Une la palabra con su dibujo</h2>
            <div class="match-container">
                <div class="match-col">
                    <div class="match-box" id="w1" onclick="match('w1', 'mimo')">MIMO</div>
                    <div class="match-box" id="w2" onclick="match('w2', 'mesa')">MESA</div>
                    <div class="match-box" id="w3" onclick="match('w3', 'mono')">MONO</div>
                </div>
                <div class="match-col">
                    <div class="match-box" id="i1" onclick="match('i1', 'mesa')">🧱</div> <div class="match-box" id="i2" onclick="match('i2', 'mimo')">🤡</div>
                    <div class="match-box" id="i3" onclick="match('i3', 'mono')">🐒</div>
                </div>
            </div>
        </div>

        <div class="page" id="p4" data-total="2">
            <h2>4. Une la frase con el dibujo</h2>
            <div class="match-container">
                <div class="match-col">
                    <div class="match-box" id="f1" onclick="match('f1', 'ama')" style="font-size: 1.1rem;">MI MAMÁ ME AMA</div>
                    <div class="match-box" id="f2" onclick="match('f2', 'mimo')" style="font-size: 1.1rem;">EL MIMO HACE REÍR</div>
                </div>
                <div class="match-col">
                    <div class="match-box" id="fi1" onclick="match('fi1', 'mimo')">🤡</div>
                    <div class="match-box" id="fi2" onclick="match('fi2', 'ama')">❤️</div>
                </div>
            </div>
        </div>

        <button class="nav-btn prev" id="btnPrev" onclick="navegar(-1)" style="display: none;">ATRÁS</button>
        <button class="nav-btn next" id="btnNext" onclick="navegar(1)">SIGUIENTE</button>
    </div>

    <script>
        let paginaActual = 1, totalPaginas = 4;
        let aciertos = {1:0, 2:0, 3:0, 4:0};
        let selId = null, selVal = null;

        function navegar(dir) {
            document.getElementById(`p${paginaActual}`).classList.remove('active');
            paginaActual += dir;
            if(paginaActual > totalPaginas) { finalizarMision(); return; }
            document.getElementById(`p${paginaActual}`).classList.add('active');
            actualizarInterfaz();
        }

        function finalizarMision() {
            confetti({ particleCount: 200, spread: 100 });
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        }

        function actualizarInterfaz() {
            document.getElementById('btnPrev').style.display = paginaActual === 1 ? 'none' : 'block';
            const btnN = document.getElementById('btnNext');
            const obj = parseInt(document.getElementById(`p${paginaActual}`).dataset.total);
            btnN.style.display = aciertos[paginaActual] >= obj ? 'block' : 'none';
            btnN.innerText = paginaActual === totalPaginas ? 'FINALIZAR' : 'SIGUIENTE';
        }

        function checkSimple(el, ok, pag) {
            if(ok) {
                if(!el.classList.contains('selected-correct')) {
                    el.classList.add('selected-correct'); aciertos[pag]++;
                    confetti({ particleCount: 20, spread: 50, origin: { y: 0.7 }, colors:['#0e9343'] });
                    actualizarInterfaz();
                    // Efecto visual para la página 2
                    if (pag === 2) { document.getElementById('word-p1').innerText = ''; }
                }
            } else {
                el.style.animation = 'shake 0.3s';
                setTimeout(() => el.style.animation = '', 300);
            }
        }

        function match(id, val) {
            const el = document.getElementById(id);
            if(el.classList.contains('correct')) return;
            if(!selId) {
                selId = id; selVal = val; el.classList.add('selected');
            } else {
                const prev = document.getElementById(selId);
                if(selId[0] !== id[0] && selVal === val) {
                    el.classList.add('correct'); prev.classList.add('correct');
                    aciertos[paginaActual]++;
                    confetti({ particleCount: 40 });
                } else {
                    el.style.animation = 'shake 0.3s'; prev.style.animation = 'shake 0.3s';
                    setTimeout(() => { el.style.animation=''; prev.style.animation=''; }, 300);
                }
                prev.classList.remove('selected'); selId = null; selVal = null;
                actualizarInterfaz();
            }
        }

        actualizarInterfaz();
    </script>
</body>
</html>
