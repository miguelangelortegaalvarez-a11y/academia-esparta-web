<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Futbol Challenge - Academia Esparta</title>
    <style>
        :root { 
            --verde-esparta: #2e7d32; /* Color corporativo principal */
            --oro-esparta: #f1c40f;   /* Toque para progreso/premios */
            --rojo: #e74c3c; 
            --azul: #2196f3; 
            --negro: #1a1a1a; 
            --gris-claro: #f4f7f6;
        }

        body { 
            font-family: 'Open Sans', sans-serif; 
            background: var(--gris-claro); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* CABECERA OFICIAL ACADEMIA ESPARTA */
        .header-esparta {
            width: 100%;
            background: white;
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid var(--verde-esparta);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .header-esparta h1 {
            font-family: 'Montserrat';
            text-transform: uppercase;
            margin: 0;
            font-size: 2.2rem;
            color: var(--negro);
            letter-spacing: -1px;
        }
        .header-esparta p {
            margin: 5px 0 0;
            color: var(--verde-esparta);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .container { 
            max-width: 600px; 
            width: 100%; 
            /* AQUÍ ESTÁ EL CAMBIO DE COLOR DE FONDO */
            background-color: rgba(46, 125, 50, 0.08); /* Un toque suave del verde espartano */
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            box-sizing: border-box;
            margin-bottom: 50px;
        }

        /* BARRA DE ESTADO */
        .status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--negro); 
            color: white; 
            padding: 12px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            font-family: 'Montserrat'; 
            font-size: 0.9rem;
        }
        .vidas-count { 
            background: var(--rojo); 
            padding: 5px 12px; 
            border-radius: 8px; 
            font-weight: bold; 
        }
        .nivel-tag {
            background: var(--verde-esparta);
            padding: 5px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* ÁREA DE PREGUNTA */
        .pregunta-box { 
            text-align: center; 
            margin-bottom: 35px; 
        }
        .pregunta-box span:first-child {
            font-size: 1.1rem;
            color: #444; /* Un poco más oscuro para que se lea bien sobre el verde */
        }
        .nombre-jugador { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--verde-esparta); 
            font-family: 'Montserrat'; 
            text-transform: uppercase; 
            display: block; 
            margin-top: 10px; 
            letter-spacing: -1px;
            line-height: 1.1;
        }

        /* BOTONES DE OPCIÓN (Siguen siendo blancos para contrastar bien) */
        .opciones { 
            display: grid; 
            gap: 15px; 
        }
        .opcion { 
            padding: 20px; 
            border: 2px solid #ddd; 
            border-radius: 15px; 
            background-color: rgba(255, 255, 255, 0.9); /* Casi blanco pero con un toque transparente */
            cursor: pointer; 
            font-size: 1.3rem; 
            font-weight: 700; 
            font-family: 'Open Sans';
            transition: all 0.2s ease; 
            color: var(--negro);
        }
        .opcion:hover:not(:disabled) { 
            border-color: var(--verde-esparta); 
            background: #e8f5e9; /* Verde muy pálido */
            transform: translateY(-2px);
        }
        .correcto { 
            background-color: var(--verde-esparta) !important; 
            color: white !important; 
            border-color: #1b5e20 !important; 
        }
        .incorrecto { 
            background-color: var(--rojo) !important; 
            color: white !important; 
            border-color: #b71c1c !important; 
        }

        /* FEEDBACK Y PANTALLA FINAL */
        .feedback { 
            margin-top: 25px; 
            text-align: center; 
            font-weight: 800; 
            font-size: 1.3rem; 
            font-family: 'Montserrat'; 
            min-height: 1.6em; 
        }
        .final-screen { 
            display: none; 
            text-align: center; 
            padding: 20px; 
        }
        .final-screen h2 {
            font-family: 'Montserrat';
            font-size: 2.2rem;
            text-transform: uppercase;
        }
        
        .btn { 
            margin-top: 30px; 
            padding: 18px 40px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.2rem; 
            color: white; 
            text-transform: uppercase; 
            font-family: 'Montserrat';
            transition: 0.3s;
        }
        .btn-next { background: var(--verde-esparta); }
        .btn-next:hover { background: #1b5e20; }
        .btn-retry { background: var(--rojo); }
        .btn-retry:hover { background: #b71c1c; }

        /* ANIMACIÓN DE FALLO */
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
    </style>
</head>
<body>

<div class="header-esparta">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¿En qué equipo juega?</p>
</div>

<div class="container">
    <div class="status-bar">
        <div class="nivel-tag" id="tag-nivel">NIVEL 1</div>
        <div class="vidas-count">🛡️ <span id="vidas">3</span></div>
        <div style="font-weight: bold;">🎯 <span id="num-p">1</span>/10</div>
    </div>
    
    <div id="juego">
        <div class="pregunta-box">
            <span>Dime el equipo actual de:</span>
            <span class="nombre-jugador" id="txt-jugador">CARGANDO...</span>
        </div>
        <div class="opciones" id="box-opciones"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="final-screen" id="final">
        <h2 id="tit-final"></h2>
        <p id="msg-final" style="font-size: 1.5rem; font-style: italic; margin: 25px 0; line-height: 1.4;"></p>
        <button class="btn btn-next" id="btn-next" style="display:none;" onclick="irSiguienteNivel()">SIGUIENTE NIVEL 🚀</button>
        <button class="btn btn-retry" id="btn-retry" style="display:none;" onclick="reiniciar()">REINTENTAR 🔄</button>
    </div>
</div>

<script>
    let nivel = 1;
    let index = 0;
    let fallos = 0;
    let bancoActual = [];

    // Banco de datos actualizado Lógica: Jugador -> [Correcto, Incorrecto1, Incorrecto2]
    const PREGUNTAS = {
        1: [ // Madrid, Barça, Atleti, Valencia
            { p: "VINÍCIUS JR.", o: ["Real Madrid", "Atlético", "Sevilla"], c: 0 },
            { p: "LAMINE YAMAL", o: ["Valencia", "Barcelona", "Girona"], c: 1 },
            { p: "ANTOINE GRIEZMANN", o: ["Real Madrid", "Atlético", "Real Sociedad"], c: 1 },
            { p: "FEDE VALVERDE", o: ["Barcelona", "Betis", "Real Madrid"], c: 2 },
            { p: "PEDRI", o: ["Barcelona", "Valencia", "Athletic"], c: 0 },
            { p: "HUGO DURO", o: ["Celta", "Valencia", "Getafe"], c: 1 },
            { p: "JULIÁN ÁLVAREZ", o: ["Atlético", "Real Madrid", "Barcelona"], c: 0 },
            { p: "JUDE BELLINGHAM", o: ["Atlético", "Real Madrid", "Villarreal"], c: 1 },
            { p: "ROBERT LEWANDOWSKI", o: ["Barcelona", "Sevilla", "Valencia"], c: 0 },
            { p: "JOSÉ LUIS GAYÀ", o: ["Barcelona", "Valencia", "Atlético"], c: 1 }
        ],
        2: [ // Equipos de tabla media/alta
            { p: "IAGO ASPAS", o: ["Sevilla", "Celta de Vigo", "Betis"], c: 1 },
            { p: "ISCO ALARCÓN", o: ["Málaga", "Real Betis", "Villarreal"], c: 1 },
            { p: "TAKE KUBO", o: ["Real Sociedad", "Mallorca", "Getafe"], c: 0 },
            { p: "NICO WILLIAMS", o: ["Villarreal", "Athletic Club", "Real Sociedad"], c: 1 },
            { p: "GERARD MORENO", o: ["Espanyol", "Villarreal", "Valencia"], c: 1 },
            { p: "MIKEL OYARZABAL", o: ["Alavés", "Athletic", "Real Sociedad"], c: 2 },
            { p: "STUANI", o: ["Girona", "Espanyol", "Levante"], c: 0 },
            { p: "ISAAC ROMERO", o: ["Sevilla FC", "Betis", "Cádiz"], c: 0 },
            { p: "DANI PAREJO", o: ["Getafe", "Villarreal", "Valencia"], c: 1 },
            { p: "BRAIS MÉNDEZ", o: ["Celta", "Real Sociedad", "Girona"], c: 1 }
        ],
        3: [ // Equipos más difíciles o específicos
            { p: "KIRIAN RODRÍGUEZ", o: ["Las Palmas", "Tenerife", "Rayo"], c: 0 },
            { p: "ANTE BUDIMIR", o: ["Mallorca", "Osasuna", "Valladolid"], c: 1 },
            { p: "VEDAT MURIQI", o: ["Getafe", "Mallorca", "Lazio"], c: 1 },
            { p: "BORJA MAYORAL", o: ["Leganés", "Getafe", "Roma"], c: 1 },
            { p: "LUIS MILLA", o: ["Getafe", "Granada", "Leganés"], c: 0 },
            { p: "ALBERTO MOLEIRO", o: ["Barcelona", "Girona", "Las Palmas"], c: 2 },
            { p: "ISI PALAZÓN", o: ["Rayo Vallecano", "Murcia", "Getafe"], c: 0 },
            { p: "CARLOS VICENTE", o: ["Alavés", "Racing", "Celta"], c: 0 },
            { p: "RAÚL MORO", o: ["Lazio", "Valladolid", "Espanyol"], c: 1 },
            { p: "SAMU COSTA", o: ["Almería", "Mallorca", "Valencia"], c: 1 }
        ]
    };

    function iniciar() {
        index = 0; fallos = 0;
        bancoActual = PREGUNTAS[nivel].sort(() => Math.random() - 0.5); // Aleatorizar preguntas
        document.getElementById("tag-nivel").innerText = "NIVEL " + nivel;
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    function cargar() {
        document.getElementById("vidas").innerText = 3 - fallos;
        document.getElementById("num-p").innerText = index + 1;
        document.getElementById("feedback").innerText = "";
        
        const q = bancoActual[index];
        document.getElementById("txt-jugador").innerText = q.p;
        
        const box = document.getElementById("box-opciones");
        box.innerHTML = "";
        
        q.o.forEach((txt, i) => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = txt;
            b.onclick = () => validar(i === q.c, b);
            box.appendChild(b);
        });
    }

    function validar(esC, btn) {
        // Deshabilitar botones para evitar doble clic
        document.querySelectorAll(".opcion").forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (esC) {
            btn.classList.add("correcto");
            fb.innerText = "¡GOLAZO! Erik, eres mejor que Mbappé ⚽";
            fb.style.color = "var(--verde-esparta)";
        } else {
            btn.classList.add("incorrecto");
            fallos++;
            fb.innerText = "¡FALLO! Eres peor que el Barça en Champions 😂";
            fb.style.color = "var(--rojo)";
            document.querySelector(".container").classList.add("shake");
            setTimeout(() => document.querySelector(".container").classList.remove("shake"), 500);
        }

        setTimeout(() => {
            index++;
            if (fallos >= 3) finalizar(true);
            else if (index >= 10) finalizar(false);
            else cargar();
        }, 1500);
    }

    function finalizar(derrota) {
        document.getElementById("juego").style.display = "none";
        document.getElementById("final").style.display = "block";
        const tit = document.getElementById("tit-final");
        const msg = document.getElementById("msg-final");

        if (derrota) {
            tit.innerText = "¡ELIMINADO! ❌";
            tit.style.color = "var(--rojo)";
            msg.innerText = "Has cometido 3 fallos tácticos. Eres peor que el Barça en Champions.";
            document.getElementById("btn-retry").style.display = "inline-block";
            document.getElementById("btn-next").style.display = "none";
        } else {
            tit.innerText = "¡NIVEL SUPERADO! 🏆";
            tit.style.color = "var(--verde-esparta)";
            msg.innerText = "¡Brutal! Erik, has demostrado que eres oficialmente mejor que Mbappé.";
            if (nivel < 3) {
                document.getElementById("btn-next").style.display = "inline-block";
                document.getElementById("btn-retry").style.display = "none";
            } else {
                tit.innerText = "¡CAMPEÓN DE LIGA! 👑";
                tit.style.color = "var(--oro-esparta)";
                msg.innerText = "Erik, has completado todos los niveles. ¡Eres el Balón de Oro de la Academia Esparta!";
                document.getElementById("btn-next").style.display = "none";
            }
        }
    }

    function irSiguienteNivel() { nivel++; iniciar(); }
    function reiniciar() { nivel = 1; iniciar(); }

    // Arrancar el juego
    iniciar();
</script>

</body>
</html>
