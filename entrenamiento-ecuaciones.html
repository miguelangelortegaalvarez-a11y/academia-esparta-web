<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <title>Ajedrez Esparta: Mario vs Papá</title>
    <style>
        :root { --verde: #4CAF50; --negro: #333; --gris: #f4f7f6; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { text-align: center; color: var(--verde); margin-bottom: 20px; }
        .header h1 { font-family: 'Montserrat'; text-transform: uppercase; margin: 0; }
        
        #board { width: 400px; border: 10px solid var(--negro); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .info-panel { margin-top: 20px; text-align: center; background: white; padding: 15px 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 340px; }
        .turno-txt { font-family: 'Montserrat'; font-weight: 800; color: var(--negro); font-size: 1.2rem; }
        .btn-reset { margin-top: 15px; padding: 10px 20px; background: var(--verde); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        
        /* Estilos para resaltar movimientos */
        .highlight-white { box-shadow: inset 0 0 3px 3px rgba(76, 175, 80, 0.7); }
        .highlight-black { box-shadow: inset 0 0 3px 3px rgba(76, 175, 80, 0.7); }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>Estrategia Suprema: Duelo de Reyes</p>
</div>

<div id="board"></div>

<div class="info-panel">
    <div class="turno-txt" id="status">Turno de: BLANCAS (Mario)</div>
    <button class="btn-reset" onclick="reiniciarJuego()">Reiniciar Batalla 🔄</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
    var board = null;
    var game = new Chess();
    var $status = $('#status');

    function onDragStart (source, piece, position, orientation) {
        // No permitir mover piezas si el juego ha terminado
        if (game.game_over()) return false;

        // Solo permitir mover las piezas del jugador al que le toca
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
            return false;
        }
    }

    function onDrop (source, target) {
        // Ver si el movimiento es legal
        var move = game.move({
            from: source,
            to: target,
            promotion: 'q' // Siempre promocionar a reina por simplicidad
        });

        // Si es ilegal, devolver la pieza
        if (move === null) return 'snapback';

        actualizarEstado();
    }

    function onSnapEnd () {
        board.position(game.fen());
    }

    function actualizarEstado () {
        var status = '';
        var moveColor = (game.turn() === 'b') ? 'NEGRAS (Papá)' : 'BLANCAS (Mario)';

        if (game.in_checkmate()) {
            status = '¡JAQUE MATE! Ganador: ' + ((game.turn() === 'w') ? 'Papá' : 'Mario');
        } else if (game.in_draw()) {
            status = '¡TABLAS (Empate)!';
        } else {
            status = 'Turno de: ' + moveColor;
            if (game.in_check()) {
                status += ' - ¡ESTÁS EN JAQUE!';
            }
        }

        $status.html(status);
    }

    var config = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    
    board = Chessboard('board', config);

    function reiniciarJuego() {
        game.reset();
        board.start();
        actualizarEstado();
    }

    actualizarEstado();
</script>

</body>
</html>
