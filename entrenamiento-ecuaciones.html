<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
    <title>English Kids - Academia Esparta</title>
    <style>
        :root { --verde: #2e7d32; --oro: #f1c40f; --rojo: #e74c3c; --azul: #2196f3; --gris: #f1f8f1; }
        body { font-family: 'Open Sans', sans-serif; background: var(--gris); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .header { position: absolute; top: 20px; text-align: center; }
        .header h1 { font-family: 'Montserrat'; color: #1a1a1a; margin: 0; text-transform: uppercase; font-size: 1.8rem; }
        .header p { color: var(--verde); font-weight: 800; margin: 0; letter-spacing: 1px; }

        /* CONTENEDOR DE JUEGO */
        .game-box { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; border: 8px solid #eee; transition: 0.3s; }
        
        .btn-listen { width: 100px; height: 100px; border-radius: 50%; border: none; background: var(--azul); color: white; font-size: 3rem; cursor: pointer; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3); transition: 0.2s; }
        .btn-listen:active { transform: scale(0.9); }

        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .option-card { background: #f9f9f9; border: 4px solid #eee; border-radius: 20px; padding: 20px; cursor: pointer; font-size: 4rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; min-height: 120px; }
        
        /* ESTADOS */
        .correct { background: var(--verde) !important; border-color: #1b5e20 !important; transform: scale(1.05); }
        .wrong { background: var(--rojo) !important; border-color: #b71c1c !important; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }

        .sad-boy { font-size: 4rem; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>ENGLISH FOR KIDS</p>
</div>

<div class="game-box" id="main-box">
    <button class="btn-listen" onclick="speakWord()">🔊</button>
    <div style="margin-bottom: 20px; font-weight: 800; color: #666;">LISTEN AND TOUCH</div>
    
    <div class="options-grid" id="options-container">
        </div>
    
    <div id="sad-boy-container" class="sad-boy">👦🏻💧</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    const quiz = [
        { word: "Apple", options: ["🍎", "🍌", "🍇"], correct: 0 },
        { word: "Dog", options: ["🐱", "🐶", "🦁"], correct: 1 },
        { word: "Number One", options: ["2️⃣", "3️⃣", "1️⃣"], correct: 2 },
        { word: "Sun", options: ["☀️", "☁️", "🌙"], correct: 0 },
        { word: "Blue", options: ["🟥", "🟦", "🟩"], correct: 1 }
    ];

    let currentTask = 0;
    const synth = window.speechSynthesis;

    function loadTask() {
        const task = quiz[currentTask];
        const container = document.getElementById('options-container');
        const box = document.getElementById('main-box');
        const sadBoy = document.getElementById('sad-boy-container');
        
        container.innerHTML = '';
        box.style.borderColor = "#eee";
        sadBoy.style.display = "none";

        task.options.forEach((emoji, index) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerText = emoji;
            card.onclick = () => checkAnswer(index, card);
            container.appendChild(card);
        });
    }

    function speakWord() {
        const utterance = new SpeechSynthesisUtterance(quiz[currentTask].word);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; // Un poco más lento para que el niño lo entienda
        synth.speak(utterance);
    }

    function checkAnswer(idx, card) {
        const box = document.getElementById('main-box');
        const sadBoy = document.getElementById('sad-boy-container');

        if (idx === quiz[currentTask].correct) {
            // ACIERTO
            card.classList.add('correct');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            setTimeout(() => {
                currentTask = (currentTask + 1) % quiz.length;
                loadTask();
            }, 2500);
        } else {
            // FALLO
            card.classList.add('wrong');
            box.classList.add('shake');
            box.style.borderColor = "var(--rojo)";
            sadBoy.style.display = "block";
            
            setTimeout(() => {
                box.classList.remove('shake');
                card.classList.remove('wrong');
            }, 500);
        }
    }

    // Inicializar el primer juego
    loadTask();
</script>

</body>
</html>
