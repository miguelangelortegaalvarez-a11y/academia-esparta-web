<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <title>Duelo de Memoria - Academia Esparta</title>
    <style>
        :root { --verde: #4CAF50; --azul: #2196f3; --rojo: #e74c3c; --gris: #f4f7f6; --blanco: #ffffff; --esparta: #333; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 20px; color: var(--verde); }
        .header h1 { font-family: 'Montserrat'; text-transform: uppercase; margin: 0; }

        .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; align-items: center; }

        /* PANTALLA DE REGISTRO */
        #registro { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; text-align: center; }
        
        /* MARCADOR DE DUELO */
        #marcador { display: none; width: 100%; justify-content: space-around; margin-bottom: 20px; font-family: 'Montserrat'; }
        .jugador-score { padding: 15px; border-radius: 15px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 40%; text-align: center; border-bottom: 5px solid #ddd; transition: 0.3s; }
        .activo { border-color: var(--verde) !important; transform: scale(1.05); box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3); }
        .puntos { font-size: 2.5rem; font-weight: 800; display: block; }

        /* TABLERO */
        #tablero-container { display: none; width: 100%; }
        .tablero { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; margin-top: 10px; }

        .pieza { aspect-ratio: 1; background: var(--esparta); border-radius: 12px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.5s; border: 3px solid #fff; }
        .pieza.girada { transform: rotateY(180deg); }
        .cara { position: absolute; width: 100%; height: 100%; border-radius: 10px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; font-size: 2.5rem; }
        .detras { background: var(--esparta); color: var(--verde); font-family: 'Montserrat'; font-weight: 800; }
        .delante { background: #eee; transform: rotateY(180deg); }

        /* FINAL */
        #final { display: none; text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 90%; }
        .btn { background: var(--verde); color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2rem; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>Duelo de Memoria: ¿Quién es el más rápido?</p>
</div>

<div class="container">
    <div id="registro">
        <h2>Introduce los Nombres</h2>
        <input type="text" id="n1" placeholder="Nombre Jugador 1" value="Erik">
        <input type="text" id="n2" placeholder="Nombre Jugador 2" value="Papá">
        <br>
        <button class="btn" onclick="iniciarDuelo()">¡A LUCHAR! ⚔️</button>
    </div>

    <div id="marcador">
        <div id="card-j1" class="jugador-score">
            <span id="label-j1">JUGADOR 1</span>
            <span id="pts-j1" class="puntos">0</span>
        </div>
        <div id="card-j2" class="jugador-score">
            <span id="label-j2">JUGADOR 2</span>
            <span id="pts-j2" class="puntos">0</span>
        </div>
    </div>

    <div id="tablero-container">
        <div class="tablero" id="tablero"></div>
    </div>

    <div id="final">
        <span style="font-size: 6rem;">🏆</span>
        <h2 id="ganador-txt" style="font-family: 'Montserrat'; font-size: 2.5rem; color: var(--verde);"></h2>
        <p id="mensaje-final" style="font-size: 1.5rem; font-weight: 700;"></p>
        <button class="btn" onclick="location.reload()">REPETIR DUELO 🔄</button>
    </div>
</div>

<script>
    const animales = ['🦁', '🐘', '🐶', '🐱', '🐥'];
    let piezas = [...animales, ...animales];
    let giradas = [];
    let acertadas = 0;
    let bloqueado = false;
    
    let nombre1, nombre2;
    let pts1 = 0, pts2 = 0;
    let turno = 1; // 1 para Jugador 1, 2 para Jugador 2

    function iniciarDuelo() {
        nombre1 = document.getElementById("n1").value || "Erik";
        nombre2 = document.getElementById("n2").value || "Papá";
        
        document.getElementById("label-j1").innerText = nombre1.toUpperCase();
        document.getElementById("label-j2").innerText = nombre2.toUpperCase();
        
        document.getElementById("registro").style.display = "none";
        document.getElementById("marcador").style.display = "flex";
        document.getElementById("tablero-container").style.display = "block";
        
        actualizarTurnoVisual();
        crearTablero();
    }

    function crearTablero() {
        piezas.sort(() => Math.random() - 0.5);
        const t = document.getElementById("tablero");
        t.innerHTML = "";
        piezas.forEach((a, i) => {
            const p = document.createElement("div");
            p.className = "pieza";
            p.innerHTML = `<div class="cara detras">M</div><div class="cara delante">${a}</div>`;
            p.onclick = () => girar(p, a);
            t.appendChild(p);
        });
    }

    function girar(p, a) {
        if (bloqueado || p.classList.contains("girada")) return;
        p.classList.add("girada");
        giradas.push({p, a});

        if (giradas.length === 2) {
            bloqueado = true;
            setTimeout(comprobar, 1000);
        }
    }

    function comprobar() {
        if (giradas[0].a === giradas[1].a) {
            // ACIERTO
            if (turno === 1) { pts1++; document.getElementById("pts-j1").innerText = pts1; }
            else { pts2++; document.getElementById("pts-j2").innerText = pts2; }
            
            acertadas++;
            if (acertadas === 5) finalizar();
            else {
                // Si acierta, ¡repite turno!
                bloqueado = false;
            }
        } else {
            // FALLO - Cambia el turno
            giradas[0].p.classList.remove("girada");
            giradas[1].p.classList.remove("girada");
            turno = turno === 1 ? 2 : 1;
            actualizarTurnoVisual();
            bloqueado = false;
        }
        giradas = [];
    }

    function actualizarTurnoVisual() {
        document.getElementById("card-j1").className = turno === 1 ? "jugador-score activo" : "jugador-score";
        document.getElementById("card-j2").className = turno === 2 ? "jugador-score activo" : "jugador-score";
    }

    function finalizar() {
        document.getElementById("tablero-container").style.display = "none";
        document.getElementById("marcador").style.display = "none";
        document.getElementById("final").style.display = "block";
        
        let ganador = "";
        if (pts1 > pts2) ganador = nombre1;
        else if (pts2 > pts1) ganador = nombre2;
        else ganador = "¡EMPATE!";

        document.getElementById("ganador-txt").innerText = "¡GANADOR: " + ganador.toUpperCase() + "!";
        document.getElementById("mensaje-final").innerText = pts1 + " vs " + pts2;
        
        // LANZAR CONFETI
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#4CAF50', '#2196f3', '#ffffff'] });
    }
</script>

</body>
</html>
