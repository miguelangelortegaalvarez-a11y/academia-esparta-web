<script>
    let nivel = 1;
    let pIndex = 0;
    let pts = 0;
    let err = 0;
    let preguntasNivelActual = []; // Aquí guardaremos las preguntas mezcladas

    // Función para mezclar cualquier array (Algoritmo Fisher-Yates)
    function mezclar(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function iniciarNivel() {
        pIndex = 0; pts = 0; err = 0;
        // Mezclamos las preguntas del banco antes de empezar el nivel
        preguntasNivelActual = mezclar([...banco[nivel]]); 
        document.getElementById("juego").style.display = "block";
        document.getElementById("final").style.display = "none";
        cargar();
    }

    function cargar() {
        refrescar();
        document.getElementById("feedback").innerText = "";
        if (err > 3) { final(true); return; }

        // Cogemos la pregunta de la lista ya mezclada
        const q = preguntasNivelActual[pIndex];
        document.getElementById("txt-pregunta").innerText = q.p;
        
        const box = document.getElementById("opciones-box");
        box.innerHTML = "";
        
        // También mezclamos las opciones para que no siempre sea la "b" o la "a"
        let opcionesMezcladas = q.o.map((texto, i) => ({ texto, esCorrecta: i === q.c }));
        mezclar(opcionesMezcladas);

        opcionesMezcladas.forEach((opt) => {
            const b = document.createElement("button");
            b.className = "opcion";
            b.innerText = opt.texto;
            b.onclick = () => validar(opt.esCorrecta, b);
            box.appendChild(b);
        });
    }

    function validar(esCorrecta, boton) {
        const btns = document.querySelectorAll(".opcion");
        btns.forEach(b => b.disabled = true);
        const fb = document.getElementById("feedback");

        if (esCorrecta) {
            boton.classList.add("correcto");
            pts++;
            fb.innerText = "¡BRUTAL ERIK! ⚽";
            fb.style.color = "var(--verde)";
        } else {
            boton.classList.add("incorrecto");
            // Buscamos cuál era la correcta para marcarla en verde
            fb.innerText = "¡MÁS MALO QUE EL BARÇA EN CHAMPIONS! 😂";
            fb.classList.add("shake");
        }

        setTimeout(() => {
            pIndex++;
            if (pIndex < 10 && err <= 3) cargar();
            else final(err > 3 || pts < 7);
        }, 1800);
    }
</script>
