<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Grafomotricidad Nivel 1 - Academia Esparta</title>
    <style>
        :root { --esparta-green: #2e7d32; --oro: #fbc02d; --gris-claro: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: #f5f5f5; }

        .page { 
            width: 210mm; 
            height: 296mm; 
            margin: 20px auto; 
            background: white; 
            padding: 15mm; 
            display: flex;
            flex-direction: column;
            position: relative;
            border: 2px solid var(--esparta-green);
        }

        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .page { margin: 0; border: none; }
        }

        .btn-pdf { 
            position: fixed; top: 20px; left: 20px; 
            background: #d32f2f; color: white; border: none; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer; 
            font-family: 'Montserrat'; font-weight: bold; z-index: 1000;
        }

        header { 
            text-align: center; 
            border-bottom: 3px solid var(--esparta-green); 
            padding-bottom: 10px; 
            margin-bottom: 30px;
        }
        h1 { font-family: 'Montserrat'; color: var(--esparta-green); font-size: 1.8rem; text-transform: uppercase; }
        .subtitle { font-size: 1rem; color: #666; font-weight: bold; }

        /* Estilo de los caminos de trazo */
        .trace-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-around; }
        
        .trace-row { 
            display: flex; 
            align-items: center; 
            width: 100%; 
            height: 80px; 
            position: relative;
        }

        .icon { font-size: 2rem; width: 50px; text-align: center; }
        .target { font-size: 2rem; width: 50px; text-align: center; opacity: 0.3; }

        .line { 
            flex-grow: 1; 
            height: 40px; 
            border-bottom: 3px dotted #bbb; 
            margin: 0 15px; 
            position: relative;
        }

        /* Variaciones de líneas */
        .line-zigzag {
            background-image: linear-gradient(45deg, transparent 45%, #bbb 45%, #bbb 55%, transparent 55%),
                              linear-gradient(-45deg, transparent 45%, #bbb 45%, #bbb 55%, transparent 55%);
            background-size: 40px 40px;
            border-bottom: none;
        }

        .line-waves {
            background-image: radial-gradient(circle at 50% 100%, transparent 40%, #bbb 42%, #bbb 48%, transparent 50%);
            background-size: 60px 30px;
            border-bottom: none;
            height: 30px;
        }

        .instruction {
            background: #fff9c4;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-left: 5px solid var(--oro);
        }

        footer { 
            text-align: center; 
            font-family: 'Montserrat'; 
            font-size: 0.8rem; 
            color: #999; 
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<button class="btn-pdf no-print" onclick="window.print()">📄 DESCARGAR FICHA DE TRAZOS</button>

<div class="page">
    <header>
        <h1>Entrenamiento de Trazos</h1>
        <div class="subtitle">Misión: ¡Lleva la ayuda a tus compañeros!</div>
    </header>

    <div class="instruction">
        <strong>INSTRUCCIONES:</strong> Repasa las líneas punteadas sin levantar el lápiz del papel. Sigue la dirección de izquierda a derecha.
    </div>

    <div class="trace-container">
        <div class="trace-row">
            <div class="icon">⚔️</div>
            <div class="line"></div>
            <div class="target">🛡️</div>
        </div>

        <div class="trace-row">
            <div class="icon">🏹</div>
            <div class="line line-zigzag"></div>
            <div class="target">🎯</div>
        </div>

        <div class="trace-row">
            <div class="icon">⛵</div>
            <div class="line line-waves"></div>
            <div class="target">🏛️</div>
        </div>

        <div class="trace-row">
            <div class="icon">🐎</div>
            <div style="flex-grow: 1; display: flex; justify-content: space-between; padding: 0 20px;">
                <span style="border-bottom: 3px dotted #bbb; width: 40px;"></span>
                <span style="border-bottom: 3px dotted #bbb; width: 40px;"></span>
                <span style="border-bottom: 3px dotted #bbb; width: 40px;"></span>
                <span style="border-bottom: 3px dotted #bbb; width: 40px;"></span>
            </div>
            <div class="target">⛺</div>
        </div>

        <div class="trace-row" style="height: 120px;">
            <div class="icon">🦅</div>
            <div class="line" style="border-radius: 50% 50% 0 0 / 100% 100% 0 0; border: 3px dotted #bbb; border-bottom: none;"></div>
            <div class="target">🏔️</div>
        </div>
    </div>

    <footer>ACADEMIA ESPARTA - Material Didáctico de Iniciación</footer>
</div>

</body>
</html>
