<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Fichajes PRO - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #0e9343; --dark: #063c24; --error: #ef5350; --bg: #f0f2f5; }
        body { font-family: 'Fredoka', sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { background: white; width: 100%; padding: 1rem; text-align: center; border-bottom: 4px solid var(--primary); margin-bottom: 10px; }
        .scoreboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 95%; max-width: 700px; margin-bottom: 15px; }
        .stat-card { background: white; padding: 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-bottom: 3px solid #ddd; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--dark); }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: #888; }
        .game-container { max-width: 650px; width: 95%; background: white; border-radius: 25px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 2px solid #eee; }
        .nivel-badge { background: var(--dark); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; margin-bottom: 1rem; display: inline-block; }
        .player-name { font-size: 2.5rem; color: var(--dark); margin: 0.5rem 0; font-weight: 700; }
        .options-grid { display: grid; gap: 10px; margin-top: 1.5rem; }
        .btn-option { background: #f8f9fa; border: 3px solid #eee; padding: 14px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; font-family: 'Fredoka'; }
        .feedback-msg { margin-top: 1rem; font-size: 1.1rem; font-weight: bold; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .next-btn { margin-top: 1rem; background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 0 var(--dark); font-family: 'Fredoka'; }
    </style>
</head>
<body>

    <header><div class="header-title">⚽ LIGA ESPARTANA: ERIK EDITION</div></header>

    <div class="scoreboard">
        <div class="stat-card"><span id="stat-total" class="stat-val">1/30</span><span class="stat-label">Pregunta</span></div>
        <div class="stat-card"><span id="stat-correct" class="stat-val">0</span><span class="stat-label">Goles</span></div>
        <div class="stat-card"><span id="stat-wrong" class="stat-val">0</span><span class="stat-label">Fallos</span></div>
        <div class="stat-card" style="border-color: var(--error);"><span id="stat-lives" class="stat-val">❤️❤️❤️</span><span class="stat-label">Vidas</span></div>
    </div>

    <div class="game-container" id="main-box">
        <div id="nivel-info" class="nivel-badge">Nivel 1: Los Galácticos</div>
        <p style="color: #666; margin: 0;">¿En qué equipo juega...?</p>
        <div id="player-display" class="player-name">---</div>
        <div id="options-grid" class="options-grid"></div>
        <div id="feedback" class="feedback-msg"></div>
        <button id="next-btn" class="next-btn" onclick="proximoJugador()">SIGUIENTE FICHAJE →</button>
    </div>

    <script>
        const jugadores = [
            // NIVEL 1: FÁCIL (Madrid, Barça, Atleti, Valencia)
            { n: "Mbappé", e: ["Real Madrid", "Getafe", "Girona"], c: "Real Madrid", lv: 1 },
            { n: "Lamine Yamal", e: ["Sevilla", "FC Barcelona", "Villarreal"], c: "FC Barcelona", lv: 1 },
            { n: "Julián Alvarez", e: ["Real Madrid", "Betis", "Atlético de Madrid"], c: "Atlético de Madrid", lv: 1 },
            { n: "Pepelu", e: ["Valencia CF", "Celta", "Espanyol"], c: "Valencia CF", lv: 1 },
            { n: "Bellingham", e: ["FC Barcelona", "Real Madrid", "Atlético"], c: "Real Madrid", lv: 1 },
            { n: "Gavi", e: ["FC Barcelona", "Sevilla", "Valencia"], c: "FC Barcelona", lv: 1 },
            { n: "Griezmann", e: ["Girona", "Atlético de Madrid", "Villarreal"], c: "Atlético de Madrid", lv: 1 },
            { n: "Hugo Duro", e: ["Valencia CF", "Betis", "Valladolid"], c: "Valencia CF", lv: 1 },
            { n: "Vinícius Jr.", e: ["Real Madrid", "Espanyol", "Leganés"], c: "Real Madrid", lv: 1 },
            { n: "Pedri", e: ["Real Sociedad", "FC Barcelona", "Athletic"], c: "FC Barcelona", lv: 1 },

            // NIVEL 2: INTERMEDIO (Equipos asentados)
            { n: "Iago Aspas", e: ["Celta de Vigo", "Sevilla", "Getafe"], c: "Celta de Vigo", lv: 2 },
            { n: "Nico Williams", e: ["Villarreal", "Athletic Club", "Real Sociedad"], c: "Athletic Club", lv: 2 },
            { n: "Gerard Moreno", e: ["Villarreal CF", "Celta", "Espanyol"], c: "Villarreal CF", lv: 2 },
            { n: "Take Kubo", e: ["Betis", "Real Sociedad", "Girona"], c: "Real Sociedad", lv: 2 },
            { n: "Isco", e: ["Sevilla", "Betis", "Villarreal"], c: "Betis", lv: 2 },
            { n: "Isaac Romero", e: ["Sevilla FC", "Betis", "Celta"], c: "Sevilla FC", lv: 2 },
            { n: "Bryan Zaragoza", e: ["Osasuna", "Girona", "Valencia"], c: "Osasuna", lv: 2 },
            { n: "Oyarzabal", e: ["Athletic", "Real Sociedad", "Alavés"], c: "Real Sociedad", lv: 2 },
            { n: "Tsygankov", e: ["Girona FC", "Mallorca", "Sevilla"], c: "Girona FC", lv: 2 },
            { n: "Muriqi", e: ["Mallorca", "Alavés", "Getafe"], c: "Mallorca", lv: 2 },

            // NIVEL 3: EXPERTO (Rayo, recién ascendidos, equipos modestos)
            { n: "Isi Palazón", e: ["Rayo Vallecano", "Leganés", "Levante"], c: "Rayo Vallecano", lv: 3 },
            { n: "Borja Mayoral", e: ["Getafe CF", "Rayo", "Valladolid"], c: "Getafe CF", lv: 3 },
            { n: "James Rodríguez", e: ["Rayo Vallecano", "Villarreal", "Betis"], c: "Rayo Vallecano", lv: 3 },
            { n: "Luis Milla", e: ["Getafe CF", "Espanyol", "Leganés"], c: "Getafe CF", lv: 3 },
            { n: "Vicente Guaita", e: ["Celta", "Valencia", "Getafe"], c: "Celta", lv: 3 },
            { n: "Carlos Vicente", e: ["Alavés", "Espanyol", "Leganés"], c: "Alavés", lv: 3 },
            { n: "Puado", e: ["Espanyol", "Valladolid", "Celta"], c: "Espanyol", lv: 3 },
            { n: "Sandro", e: ["Las Palmas", "Levante", "Cádiz"], c: "Las Palmas", lv: 3 }, // Corregido: Las Palmas está en 1ª en 24/25 y 25/26
            { n: "Roger Martí", e: ["Cádiz CF", "Levante", "Valladolid"], c: "Cádiz CF", lv: 3 },
            { n: "Morales", e: ["Levante UD", "Villarreal", "Espanyol"], c: "Levante UD", lv: 3 }
        ];

        let indexActual = 0, aciertos = 0, fallos = 0, vidas = 3;

        function actualizarMarcador() {
            document.getElementById('stat-total').innerText = `${indexActual + 1}/30`;
            document.getElementById('stat-correct').innerText = aciertos;
            document.getElementById('stat-wrong').innerText = fallos;
            document.getElementById('stat-lives').innerText = "❤️".repeat(vidas) + "🖤".repeat(3-vidas);
        }

        function cargarJugador() {
            if (vidas <= 0) return;
            const j = jugadores[indexActual];
            document.getElementById('nivel-info').innerText = `Nivel ${j.lv}: ${j.lv==1?'Fácil':j.lv==2?'Intermedio':'Experto'}`;
            document.getElementById('player-display').innerText = j.n;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = 'none';
            actualizarMarcador();
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            j.e.forEach(eq => {
                const b = document.createElement('button');
                b.className = 'btn-option'; b.innerText = eq;
                b.onclick = () => {
                    if (eq === j.c) {
                        aciertos++; confetti({ particleCount: 100, spread: 70 });
                        document.getElementById('feedback').innerHTML = "<span style='color:var(--primary)'>¡Qué golazo, Erik! ¡Eres mejor que Mbappé!</span>";
                        document.getElementById('next-btn').style.display = 'inline-block';
                        Array.from(grid.children).forEach(btn => btn.style.pointerEvents = 'none');
                        b.style.background = '#e8f5e9'; b.style.borderColor = 'var(--primary)';
                    } else {
                        fallos++; vidas--; actualizarMarcador();
                        if (vidas <= 0) return gameOver();
                        document.getElementById('feedback').innerHTML = "<span style='color:var(--error)'>Erik, aciertas menos que el Barça en Champions...</span>";
                        b.style.background = '#ffebee'; b.style.borderColor = 'var(--error)'; b.disabled = true;
                    }
                };
                grid.appendChild(b);
            });
        }

        function gameOver() {
            document.getElementById('main-box').innerHTML = `<h2 style='color:var(--error)'>❌ ¡ELIMINADO! ❌</h2><p style='font-size:1.5rem'>Erik, eres más malo que el Barcelona.</p><button class='next-btn' style='display:block;margin:20px auto' onclick='location.reload()'>REINTENTAR</button>`;
        }

        function proximoJugador() {
            indexActual++;
            if (indexActual < jugadores.length) cargarJugador();
            else document.getElementById('main-box').innerHTML = `<h2 style='color:var(--primary)'>🏆 ¡CAMPEÓN DE LIGA! 🏆</h2><p>¡Erik, has completado los 3 niveles!</p><button class='next-btn' style='display:block;margin:20px auto' onclick='location.reload()'>JUGAR DE NUEVO</button>`;
        }

        cargarJugador();
    </script>
</body>
</html>
