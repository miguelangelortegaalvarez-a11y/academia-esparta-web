<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <title>Lector Mágico - Academia Esparta</title>
    <style>
        :root { --verde: #2e7d32; --oro: #f1c40f; --gris: #f1f8f1; }
        body { font-family: 'Open Sans', sans-serif; background: var(--gris); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .header { position: absolute; top: 20px; text-align: center; width: 100%; }
        .header h1 { font-family: 'Montserrat'; color: #1a1a1a; margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        /* LA TARJETA MÁGICA */
        .card-container { width: 300px; height: 400px; perspective: 1000px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card.flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 8px solid white; }
        
        .card-front { background: white; color: var(--verde); }
        .card-back { background: var(--verde); color: white; transform: rotateY(180deg); }

        .word-text { font-size: 4rem; font-family: 'Montserrat'; text-transform: uppercase; }
        .emoji-img { font-size: 8rem; }

        /* BOTÓN DE MICRO */
        .btn-mic { margin-top: 40px; width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--verde); color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        .btn-mic.listening { background: #e74c3c; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .instrucciones { margin-top: 20px; font-weight: bold; color: #555; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>¡LEE Y DESCUBRE EL DIBUJO!</p>
</div>

<div class="card-container">
    <div class="card" id="main-card">
        <div class="card-face card-front">
            <span class="word-text" id="display-word">PERRO</span>
        </div>
        <div class="card-face card-back">
            <span class="emoji-img" id="display-emoji">🐶</span>
            <h2 style="font-family: Montserrat">¡MUY BIEN!</h2>
        </div>
    </div>
</div>

<button class="btn-mic" id="mic-btn" onclick="startListening()">🎤</button>
<div class="instrucciones" id="status">Pulsa el micro y lee la palabra</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    const palabras = [
        { texto: "PERRO", emoji: "🐶" },
        { texto: "GATO", emoji: "🐱" },
        { texto: "SOL", emoji: "☀️" },
        { texto: "CASA", emoji: "🏠" },
        { texto: "LEÓN", emoji: "🦁" },
        { texto: "PIZZA", emoji: "🍕" },
        { texto: "MOTO", emoji: "🏍️" },
        { texto: "LIBRO", emoji: "📖" }
    ];

    let currentIdx = 0;
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'es-ES';
    recognition.continuous = false;
    recognition.interimResults = false;

    const micBtn = document.getElementById('mic-btn');
    const statusTxt = document.getElementById('status');
    const card = document.getElementById('main-card');

    function startListening() {
        recognition.start();
        micBtn.classList.add('listening');
        statusTxt.innerText = "Escuchando...";
    }

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toUpperCase();
        const targetWord = palabras[currentIdx].texto;
        
        micBtn.classList.remove('listening');

        if (transcript.includes(targetWord)) {
            statusTxt.innerText = "¡Excelente! Has dicho: " + transcript;
            statusTxt.style.color = "var(--verde)";
            card.classList.add('flipped');
            
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            // Pasar a la siguiente palabra tras 3 segundos
            setTimeout(() => {
                currentIdx = (currentIdx + 1) % palabras.length;
                resetCard();
            }, 3000);
        } else {
            statusTxt.innerText = "Has dicho '" + transcript + "'. ¡Inténtalo otra vez!";
            statusTxt.style.color = "#e74c3c";
        }
    };

    recognition.onerror = () => {
        micBtn.classList.remove('listening');
        statusTxt.innerText = "No te he oído bien. Prueba otra vez.";
    };

    function resetCard() {
        card.classList.remove('flipped');
        setTimeout(() => {
            document.getElementById('display-word').innerText = palabras[currentIdx].texto;
            document.getElementById('display-emoji').innerText = palabras[currentIdx].emoji;
            statusTxt.innerText = "Pulsa el micro y lee la palabra";
            statusTxt.style.color = "#555";
        }, 500);
    }
</script>

</body>
</html>
