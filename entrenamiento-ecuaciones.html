<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Academia Esparta - El Gran Quiz</title>
    <style>
        :root { --verde: #4CAF50; --verde-oscuro: #388E3C; --azul: #2196f3; --gris: #f4f7f6; --rojo: #e74c3c; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris); margin: 0; padding-bottom: 50px; }
        .header { background: white; color: var(--verde); text-align: center; padding: 30px; border-bottom: 4px solid var(--verde); }
        .container { max-width: 700px; margin: 30px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        .nivel-info { background: var(--azul); color: white; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .pregunta { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; color: #333; }
        
        .opciones { display: grid; gap: 10px; }
        .opcion { padding: 15px; border: 2px solid #ddd; border-radius: 10px; background: none; cursor: pointer; font-size: 1.1rem; transition: 0.3s; text-align: left; }
        .opcion:hover:not(:disabled) { border-color: var(--azul); background: #e3f2fd; }
        
        .correcto { background-color: var(--verde) !important; color: white; border-color: var(--verde-oscuro) !important; }
        .incorrecto { background-color: var(--rojo) !important; color: white; border-color: #b71c1c !important; }

        .feedback-instantaneo { margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 1.5em; text-align: center; }
        .frase-falla { color: var(--rojo); animation: shake 0.5s; }

        .resultado-final { display: none; text-align: center; padding: 30px; }
        .btn-accion { margin-top: 20px; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: white; display: none; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<header class="header">
    <h1>ACADEMIA ESPARTA</h1>
    <p>Desafío de Cultura General (Nivel 1 al 5)</p>
</header>

<div class="container" id="quiz-container">
    <div class="nivel-info">Nivel <span id="num-nivel">1</span></div>
    
    <div id="juego">
        <div class="pregunta" id="texto-pregunta">Cargando pregunta...</div>
        <div class="opciones" id="contenedor-opciones"></div>
        <div id="feedback" class="feedback-instantaneo"></div>
    </div>

    <div class="resultado-final" id="resultado-final">
        <h2 id="titulo-resultado"></h2>
        <p id="puntos-texto" style="font-size: 1.4rem;"></p>
        <p id="comentario-gracioso" style="font-style: italic; color: #666;"></p>
        
        <button class="btn-accion" id="btn-siguiente" style="background: var(--verde);" onclick="siguienteNivel()">¡SIGUIENTE NIVEL! 🚀</button>
        <button class="btn-accion" id="btn-repetir" style="background: var(--rojo);" onclick="reiniciarNivel()">REINTENTAR NIVEL 🔄</button>
    </div>
</div>

<script>
    let nivelActual = 1;
    let preguntaActual = 0;
    let aciertos = 0;
    const FRASE_BROMA = "¡Eres más malo que el Barcelona en Champions! 😂";

    const preguntasPorNivel = {
        1: [
            { p: "¿Cuánto es 2 + 2?", o: ["3", "4", "5", "22"], c: 1 },
            { p: "¿Cuál es el color de las nubes?", o: ["Verde", "Azul", "Blanco", "Rojo"], c: 2 },
            { p: "¿Qué animal hace 'miau'?", o: ["Perro", "Gato", "Pájaro", "Pez"], c: 1 },
            { p: "¿Cuántos meses tiene un año?", o: ["10", "12", "7", "30"], c: 1 },
            { p: "¿Qué fruta es roja y tiene semillas por fuera?", o: ["Plátano", "Manzana", "Fresa", "Uva"], c: 2 },
            { p: "¿Por dónde sale el Sol?", o: ["Norte", "Sur", "Este", "Oeste"], c: 2 },
            { p: "¿Cuántas patas tiene un perro?", o: ["2", "4", "6", "8"], c: 1 },
            { p: "¿Qué usamos para ver?", o: ["Orejas", "Nariz", "Ojos", "Boca"], c: 2 },
            { p: "¿Cuál es la capital de España?", o: ["Barcelona", "Sevilla", "Madrid", "Valencia"], c: 2 },
            { p: "¿Qué día viene después del martes?", o: ["Lunes", "Miércoles", "Jueves", "Viernes"], c: 1 }
        ],
        2: [
            { p: "¿Cuántos continentes hay?", o: ["3", "5", "6", "8"], c: 2 },
            { p: "¿Quién pintó la Mona Lisa?", o: ["Picasso", "Da Vinci", "Dalí", "Velázquez"], c: 1 },
            { p: "¿Cuál es el océano más grande?", o: ["Atlántico", "Índico", "Pacífico", "Ártico"], c: 2 },
            { p: "¿Qué instrumento tiene teclas blancas y negras?", o: ["Guitarra", "Flauta", "Piano", "Tambor"], c: 2 },
            { p: "¿Cómo se llama el triángulo de 3 lados iguales?", o: ["Isósceles", "Escaleno", "Equilátero", "Rectángulo"], c: 2 },
            { p: "¿En qué país están las Pirámides de Giza?", o: ["México", "Egipto", "China", "Italia"], c: 1 },
            { p: "¿Cuál es el hueso más largo del cuerpo?", o: ["Fémur", "Radio", "Cúbito", "Costilla"], c: 0 },
            { p: "¿Qué gas exhalamos al respirar?", o: ["Oxígeno", "Dióxido de Carbono", "Hidrógeno", "Helio"], c: 1 },
            { p: "¿Cuál es el metal más caro?", o: ["Oro", "Plata", "Platino", "Cobre"], c: 2 },
            { p: "¿Cuántos años es un siglo?", o: ["10", "50", "100", "1000"], c: 2 }
        ]
        // Añadir aquí niveles 3, 4 y 5 siguiendo la misma estructura
    };

    function cargarPregunta() {
        document.getElementById("feedback").innerText = "";
        let lista = preguntasPorNivel[nivelActual];
        if (preguntaActual < lista.length) {
            let data = lista[preguntaActual];
            document.getElementById("texto-pregunta").innerText = data.p;
            let contenedor = document.getElementById("contenedor-opciones");
            contenedor.innerHTML = "";
            data.o.forEach((op, index) => {
                let btn = document.createElement("button");
                btn.className = "opcion";
                btn.innerText = op;
                btn.onclick = () => verificar(index, data.c);
                contenedor.appendChild(btn);
            });
        } else {
            finalizarNivel();
        }
    }

    function verificar(elegido, correcto) {
        let botones = document.querySelectorAll(".opcion");
        let feedback = document.getElementById("feedback");
        botones.forEach(b => b.disabled = true);
        
        if (elegido === correcto) {
            botones[elegido].classList.add("correcto");
            aciertos++;
            feedback.innerText = "¡Correcto! ✨";
            feedback.style.color = "var(--verde-oscuro)";
        } else {
            botones[elegido].classList.add("incorrecto");
            botones[correcto].classList.add("correcto");
            feedback.innerHTML = `<span class="frase-falla">${FRASE_BROMA}</span>`;
        }
        
        setTimeout(() => {
            preguntaActual++;
            cargarPregunta();
        }, 1800);
    }

    function finalizarNivel() {
        document.getElementById("juego").style.display = "none";
        document.getElementById("resultado-final").style.display = "block";
        
        let puntos = aciertos;
        document.getElementById("puntos-texto").innerText = `Nota: ${puntos} / 10`;
        
        const btnSig = document.getElementById("btn-siguiente");
        const btnRep = document.getElementById("btn-repetir");

        if (puntos >= 7) {
            document.getElementById("titulo-resultado").innerText = "¡NIVEL SUPERADO! 🎖️";
            document.getElementById("comentario-gracioso").innerText = "Has demostrado ser un auténtico espartano.";
            btnSig.style.display = "inline-block";
            btnRep.style.display = "none";
        } else {
            document.getElementById("titulo-resultado").innerText = "SUSPENSO... ❌";
            document.getElementById("comentario-gracioso").innerText = FRASE_BROMA;
            btnSig.style.display = "none";
            btnRep.style.display = "inline-block";
        }
    }

    function siguienteNivel() {
        nivelActual++;
        reiniciarNivel();
    }

    function reiniciarNivel() {
        preguntaActual = 0;
        aciertos = 0;
        document.getElementById("num-nivel").innerText = nivelActual;
        document.getElementById("juego").style.display = "block";
        document.getElementById("resultado-final").style.display = "none";
        document.querySelectorAll(".btn-accion").forEach(b => b.style.display = "none");
        cargarPregunta();
    }

    cargarPregunta();
</script>

</body>
</html>
