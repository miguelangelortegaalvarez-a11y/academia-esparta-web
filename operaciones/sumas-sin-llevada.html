<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sumas Sin Llevadas (2 y 3 Cifras) - Academia Esparta</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; background: #f4f4f4; font-family: 'Kalam', cursive; -webkit-print-color-adjust: exact; }
        
        .page {
            width: 210mm; min-height: 297mm; padding: 15mm; margin: 10mm auto;
            background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative; page-break-after: always; box-sizing: border-box;
        }

        @media print {
            body { background: white; }
            .page { margin: 0; box-shadow: none; width: 100%; }
            .btn-print { display: none; }
        }

        .header { display: flex; justify-content: space-between; border-bottom: 2pt solid #0e9343; padding-bottom: 5pt; margin-bottom: 15pt; font-family: sans-serif; text-transform: uppercase; font-size: 8pt; font-weight: bold; color: #0e9343; }
        .datos { display: flex; justify-content: space-between; margin-bottom: 20pt; font-size: 11pt; }
        .campo { border-bottom: 1pt dashed #ccc; flex-grow: 1; margin-left: 5pt; height: 14pt; }
        .titulo-ficha { text-align: center; color: #063c24; margin-bottom: 25pt; border: 2pt solid #0e9343; display: inline-block; padding: 5pt 20mm; position: relative; left: 50%; transform: translateX(-50%); border-radius: 10px; }

        .btn-print { position: fixed; top: 20px; right: 20px; background: #0e9343; color: white; border: none; padding: 15px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .grid-ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40pt 10pt; }

        .op-v { display: flex; flex-direction: column; align-items: flex-end; font-size: 28pt; font-weight: bold; position: relative; width: 90pt; margin: auto; }
        .op-v .linea { width: 100%; border-bottom: 2.5pt solid black; margin: 4pt 0; }
        .op-v .signo { position: absolute; left: 0pt; bottom: 38pt; font-size: 22pt; }
        .numero { letter-spacing: 8pt; padding-right: 2pt; }

        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 80pt; color: rgba(14, 147, 67, 0.03); z-index: 0; pointer-events: none; font-family: sans-serif; }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR PACK (4 FOLIOS)</button>

    <script>
        // GENERADOR ELIMINANDO CEROS Y ASEGURANDO CIFRAS IDÉNTICAS ARRIBA Y ABAJO
        function generarSinLlevadaEstricto(cifras) {
            let n1 = "", n2 = "";
            for(let i=0; i<cifras; i++) {
                // Para evitar llevadas, la suma de dígitos debe ser <= 9
                // Para evitar ceros, cada dígito debe ser >= 1
                let d1 = Math.floor(Math.random() * 4) + 1; // 1, 2, 3 o 4
                let maxD2 = 9 - d1; 
                let d2 = Math.floor(Math.random() * (maxD2 - 1)) + 1; // Mínimo 1, máximo lo que falte para 9
                
                n1 += d1.toString();
                n2 += d2.toString();
            }
            return [n1, n2];
        }

        function crearFicha(folio, titulo, cifras) {
            document.write(`
                <div class="page">
                    <div class="watermark">ESPARTA</div>
                    <div class="header"><span>FICHA ${folio} - OPERACIONES</span><span>ACADEMIA ESPARTA</span></div>
                    <div class="datos"><div style="width: 60%; display: flex;">Alumno: <div class="campo"></div></div><div style="width: 30%; display: flex;">Fecha: <div class="campo"></div></div></div>
                    <div class="titulo-ficha"><h3>${titulo}</h3></div>
                    <div class="grid-ops">
            `);
            
            for(let i=0; i<20; i++) {
                let [a, b] = generarSinLlevadaEstricto(cifras);
                document.write(`
                    <div class="op-v">
                        <span class="numero">${a}</span>
                        <span class="signo">+</span>
                        <span class="numero">${b}</span>
                        <div class="linea"></div>
                    </div>
                `);
            }
            
            document.write(`</div></div>`);
        }

        // FOLIOS 1 y 2: Siempre 2 cifras exactas arriba y abajo
        crearFicha("01", "SUMAS 2 CIFRAS (ESTRICTO)", 2);
        crearFicha("02", "SUMAS 2 CIFRAS (ESTRICTO)", 2);

        // FOLIOS 3 y 4: Siempre 3 cifras exactas arriba y abajo
        crearFicha("03", "SUMAS 3 CIFRAS (ESTRICTO)", 3);
        crearFicha("04", "SUMAS 3 CIFRAS (ESTRICTO)", 3);
    </script>

</body>
</html>
