<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camino Matemático</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- HOME -->
  <section id="screen-home" class="screen is-active" aria-label="Pantalla inicial">
    <img class="screen-bg" src="./assets/ui/screens/screen-home.png.PNG" alt="Pantalla inicial" />
  
    <button id="home-next" class="img-btn" type="button" aria-label="Siguiente">
      <img src="./assets/ui/buttons/btn-next.PNG" alt="Siguiente" />
    </button>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen" aria-label="Pantalla de ejercicio">
    <img class="screen-bg" src="./assets/backgrounds/bg-dojo.PNG" alt="Dojo" />
        <!-- PROGRESO (0/10) -->
    <div class="progress-box" aria-label="Progreso">
      <div id="progress-fill" class="progress-fill"></div>
      <div id="progress-text" class="progress-text">0/10</div>
    </div>
    <!-- Pregunta (texto) -->
    <div id="question" class="question">3 + 2 = ?</div>

    <!-- Guerrero -->
    <img id="warrior" class="warrior" src="./assets/warrior/warrior-idle.png.PNG" alt="Guerrero" />

    <!-- Respuestas (solo números) -->
    <div class="answers" role="group" aria-label="Respuestas">
      <button class="answer-btn" data-index="0" type="button" aria-label="Respuesta izquierda">
        <span class="answer-text" id="answer-a-text">0</span>
      </button>

      <button class="answer-btn" data-index="1" type="button" aria-label="Respuesta derecha">
        <span class="answer-text" id="answer-b-text">0</span>
      </button>
    </div>

    <!-- Comprobar -->
    <button id="btn-check" class="img-btn" type="button" aria-label="Comprobar">
      <img src="./assets/ui/buttons/btn-check.PNG" alt="Comprobar" />
    </button>

    <!-- Feedback -->
    <img id="icon-correct" class="icon-feedback" src="./assets/ui/icons/icon-correct.PNG" alt="" style="display:none" />
<img id="icon-wrong"   class="icon-feedback" src="./assets/ui/icons/icon-wrong.PNG"   alt="" style="display:none" />
  </section>

  <!-- FINAL -->
  <section id="screen-final" class="screen" aria-label="Pantalla final">
    <img class="screen-bg" src="./assets/ui/screens/screen-final.PNG" alt="Pantalla final" />

    <img class="final-warrior" src="./assets/warrior/warrior-power.png.PNG" alt="Guerrero power" />

    <button id="final-retry" class="img-btn" type="button" aria-label="Reintentar">
      <img src="./assets/ui/buttons/btn-retry.PNG" alt="Reintentar" />
    </button>
  </section>

  <script src="./script.js"></script>
</body>
</html>
